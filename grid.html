<head>
<meta charset="UTF-8">

<title>Grid</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #111; }
  .grid {
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    padding: 8px;
  }
  a {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #1e1e1e;
    color: #eee;
    text-decoration: none;
    border-radius: 12px;
    font: 15px/1.2 system-ui, sans-serif;
    font-size: 18px;
    border: 1px solid #2a2a2a;
  }
  a:hover { background: #2a2a2a; }
  img {
    width: 30%;
    height: 30%;
    object-fit: contain;
  }
</style>
</head>
