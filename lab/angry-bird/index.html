<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Angry Birds</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0a0a0f; color: #fff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #hud {
    flex: 0 0 auto;
    display: flex; justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    color: #FFD700;
    font-size: 13px;
    letter-spacing: 2px;
    gap: 8px;
    flex-wrap: wrap;
  }
  #hud .stat {
    background: #1919A6;
    padding: 6px 12px;
    border-radius: 4px;
    display: flex; flex-direction: column;
    align-items: center;
    min-width: 68px;
    line-height: 1.1;
  }
  #hud .stat .label { font-size: 10px; opacity: 0.7; letter-spacing: 1px; }
  #hud .stat .value { font-size: 16px; font-weight: bold; color: #FFD700; }
  #hud button {
    background: #2a2a3a; color: #fff;
    border: 1px solid #444; border-radius: 4px;
    padding: 8px 12px;
    font-family: inherit; font-size: 11px;
    letter-spacing: 1px; cursor: pointer;
  }
  #hud button:active { transform: scale(0.96); }

  #stage {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    touch-action: none;
    background: #0a0a12;
  }
  #hint {
    position: absolute;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    border: 1px solid #FFD700;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    color: #FFD700;
    letter-spacing: 1px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 250ms;
    text-align: center;
    white-space: nowrap;
  }
  #hint.show { opacity: 1; }

  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.88);
    text-align: center; padding: 20px;
    z-index: 10;
    gap: 8px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0 0 8px; font-size: 28px; color: #FFD700; letter-spacing: 3px; }
  #overlay p { margin: 4px 0; font-size: 13px; color: #ccc; letter-spacing: 1px; }
  #overlay .stars { font-size: 36px; margin: 8px 0; letter-spacing: 6px; color: #FFD700; }
  #overlay button {
    margin-top: 12px; padding: 12px 26px;
    background: #FFD700; color: #000;
    border: none; border-radius: 6px;
    font-family: inherit; font-size: 15px;
    font-weight: bold; letter-spacing: 2px;
    cursor: pointer;
  }
  #overlay button:active { transform: scale(0.96); }
  #overlay button.alt {
    background: #1919A6; color: #FFD700; border: 1px solid #3B3BFF;
    margin-left: 8px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><span class="label">LEVEL</span><span class="value" id="hud-level">1</span></div>
    <div class="stat"><span class="label">BIRDS</span><span class="value" id="hud-birds">3</span></div>
    <div class="stat"><span class="label">PIGS</span><span class="value" id="hud-pigs">0</span></div>
    <div class="stat"><span class="label">SCORE</span><span class="value" id="hud-score">0</span></div>
    <button id="btn-reset">RESET</button>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hint">DRAG FROM THE SLINGSHOT</div>
    <div id="overlay" class="hidden">
      <h2 id="overlay-title">LEVEL CLEAR</h2>
      <div class="stars" id="overlay-stars">☆☆☆</div>
      <p id="overlay-msg"></p>
      <div>
        <button id="overlay-btn">NEXT LEVEL</button>
        <button id="overlay-btn2" class="alt">RETRY</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
  'use strict';

  const { Engine, World, Bodies, Body, Composite, Events, Vector } = Matter;

  // ============================================================
  // WORLD CONFIG
  // ============================================================
  const WORLD_WIDTH = 1200;
  const WORLD_HEIGHT = 600;
  const GROUND_Y = 560;

  const SLING_X = 180;
  const SLING_Y = 440;
  const MAX_PULL = 100;
  const LAUNCH_POWER = 0.35;    // tuned for slow, arc-y shots

  // ============================================================
  // DOM
  // ============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  const levelEl = document.getElementById('hud-level');
  const birdsEl = document.getElementById('hud-birds');
  const pigsEl  = document.getElementById('hud-pigs');
  const scoreEl = document.getElementById('hud-score');
  const resetBtn = document.getElementById('btn-reset');

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayStars = document.getElementById('overlay-stars');
  const overlayMsg = document.getElementById('overlay-msg');
  const overlayBtn = document.getElementById('overlay-btn');
  const overlayBtn2 = document.getElementById('overlay-btn2');
  const hintEl = document.getElementById('hint');

  // ============================================================
  // SIZING
  // ============================================================
  let SCALE = 1, CW = 0, CH = 0, OFFSET_X = 0, OFFSET_Y = 0;

  function resize() {
    const rect = stage.getBoundingClientRect();
    CW = Math.max(200, Math.floor(rect.width));
    CH = Math.max(300, Math.floor(rect.height));

    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(CW * dpr);
    canvas.height = Math.floor(CH * dpr);
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const scaleX = CW / WORLD_WIDTH;
    const scaleY = CH / WORLD_HEIGHT;
    SCALE = Math.min(scaleX, scaleY);
    OFFSET_X = (CW - WORLD_WIDTH * SCALE) / 2;
    OFFSET_Y = (CH - WORLD_HEIGHT * SCALE) / 2;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 60));

  function w2s(x, y) { return { x: x * SCALE + OFFSET_X, y: y * SCALE + OFFSET_Y }; }
  function s2w(x, y) { return { x: (x - OFFSET_X) / SCALE, y: (y - OFFSET_Y) / SCALE }; }

  // ============================================================
  // ENGINE
  // ============================================================
  const engine = Engine.create();
  engine.gravity.y = 0.4;

  // ============================================================
  // LEVELS
  // ============================================================
  const LEVELS = [
    {
      name: 'Simple Tower',
      birds: 3,
      blocks: [
        { x: 780, y: GROUND_Y - 60, w: 20, h: 120, material: 'wood' },
        { x: 900, y: GROUND_Y - 60, w: 20, h: 120, material: 'wood' },
        { x: 840, y: GROUND_Y - 130, w: 160, h: 20, material: 'wood' },
        { x: 800, y: GROUND_Y - 200, w: 20, h: 120, material: 'wood' },
        { x: 880, y: GROUND_Y - 200, w: 20, h: 120, material: 'wood' },
        { x: 840, y: GROUND_Y - 270, w: 120, h: 20, material: 'wood' }
      ],
      pigs: [
        { x: 840, y: GROUND_Y - 30, r: 22 },
        { x: 840, y: GROUND_Y - 170, r: 22 }
      ]
    },
    {
      name: 'Stone Fortress',
      birds: 4,
      blocks: [
        { x: 720, y: GROUND_Y - 80, w: 30, h: 160, material: 'stone' },
        { x: 950, y: GROUND_Y - 80, w: 30, h: 160, material: 'stone' },
        { x: 835, y: GROUND_Y - 175, w: 260, h: 30, material: 'stone' },
        { x: 780, y: GROUND_Y - 250, w: 20, h: 120, material: 'wood' },
        { x: 890, y: GROUND_Y - 250, w: 20, h: 120, material: 'wood' },
        { x: 835, y: GROUND_Y - 320, w: 140, h: 20, material: 'wood' }
      ],
      pigs: [
        { x: 835, y: GROUND_Y - 30, r: 24 },
        { x: 780, y: GROUND_Y - 215, r: 20 },
        { x: 890, y: GROUND_Y - 215, r: 20 }
      ]
    },
    {
      name: 'Pig Pyramid',
      birds: 5,
      blocks: [
        { x: 700, y: GROUND_Y - 40, w: 30, h: 80, material: 'wood' },
        { x: 800, y: GROUND_Y - 40, w: 30, h: 80, material: 'stone' },
        { x: 900, y: GROUND_Y - 40, w: 30, h: 80, material: 'stone' },
        { x: 1000, y: GROUND_Y - 40, w: 30, h: 80, material: 'wood' },
        { x: 850, y: GROUND_Y - 95, w: 360, h: 30, material: 'wood' },
        { x: 760, y: GROUND_Y - 175, w: 24, h: 130, material: 'wood' },
        { x: 940, y: GROUND_Y - 175, w: 24, h: 130, material: 'wood' },
        { x: 850, y: GROUND_Y - 250, w: 220, h: 24, material: 'stone' },
        { x: 810, y: GROUND_Y - 310, w: 20, h: 100, material: 'wood' },
        { x: 890, y: GROUND_Y - 310, w: 20, h: 100, material: 'wood' },
        { x: 850, y: GROUND_Y - 370, w: 120, h: 20, material: 'wood' }
      ],
      pigs: [
        { x: 750, y: GROUND_Y - 30, r: 20 },
        { x: 850, y: GROUND_Y - 145, r: 22 },
        { x: 950, y: GROUND_Y - 30, r: 20 },
        { x: 850, y: GROUND_Y - 290, r: 22 }
      ]
    }
  ];

  // ============================================================
  // STATE
  // ============================================================
  let currentLevelIndex = 0;
  let birdQueue = [];         // array of bird types remaining
  let currentBird = null;     // { body, type, launched }
  let activeBirds = [];       // birds in flight
  let pigs = [];              // { body, r, dead }
  let blocks = [];            // { body, material, w, h }
  let ground = null;

  let score = 0;
  let isDragging = false;
  let dragPos = { x: 0, y: 0 };
  let gameState = 'idle';     // 'idle' | 'aiming' | 'flying' | 'waiting' | 'levelclear' | 'gameover'
  let turnResolveTimer = 0;   // countdown to next turn after birds settle
  let levelEnding = false;

  // ============================================================
  // WORLD SETUP
  // ============================================================
  function clearWorld() {
    Composite.clear(engine.world, false, true);
    Engine.clear(engine);
    engine.gravity.y = 1.0;
    activeBirds = [];
    pigs = [];
    blocks = [];
    currentBird = null;
    birdQueue = [];
    turnResolveTimer = 0;
    levelEnding = false;
    isDragging = false;
  }

  function buildLevel(index) {
    clearWorld();
    currentLevelIndex = index;
    const level = LEVELS[index];
    score = 0;
    gameState = 'idle';

    // Ground
    ground = Bodies.rectangle(
      WORLD_WIDTH / 2, GROUND_Y + 60,
      WORLD_WIDTH * 2, 120,
      { isStatic: true, friction: 0.9, restitution: 0.05 }
    );
    Composite.add(engine.world, ground);

    // Invisible wall on the left so nothing flies out weirdly
    Composite.add(engine.world, Bodies.rectangle(-30, WORLD_HEIGHT / 2, 60, WORLD_HEIGHT * 2, { isStatic: true }));

    // Blocks
    for (const b of level.blocks) {
      const mat = MAT[b.material];
      const body = Bodies.rectangle(b.x, b.y, b.w, b.h, {
        friction: mat.friction,
        restitution: mat.restitution,
        density: mat.density
      });
      if (b.angle) Body.setAngle(body, b.angle);
      Composite.add(engine.world, body);
      blocks.push({ body, material: b.material, w: b.w, h: b.h });
    }

    // Pigs
    for (const p of level.pigs) {
      const body = Bodies.circle(p.x, p.y, p.r, {
        friction: 0.5,
        restitution: 0.3,
        density: 0.0008
      });
      Composite.add(engine.world, body);
      pigs.push({ body, r: p.r, dead: false });
    }

    // Bird queue
    birdQueue = Array(level.birds).fill('red');

    updateHud();
    loadNextBird();
    hideOverlay();
  }

  const MAT = {
    wood:  { density: 0.0012, friction: 0.6, restitution: 0.15 },
    stone: { density: 0.0025, friction: 0.8, restitution: 0.05 }
  };

  // ============================================================
  // BIRD LOADING
  // ============================================================
  function loadNextBird() {
    if (levelEnding) return;

    if (birdQueue.length === 0) {
      currentBird = null;
      updateHud();
      // If pigs still alive, game over
      if (pigs.some(p => !p.dead)) {
        endGame(false);
      }
      return;
    }

    const type = birdQueue.shift();
    const body = Bodies.circle(SLING_X, SLING_Y, 18, {
      friction: 0.6,
      restitution: 0.4,
      density: 0.004
    });
    Body.setStatic(body, true);
    Composite.add(engine.world, body);

    currentBird = { body, type, launched: false };
    gameState = 'idle';
    updateHud();
  }

  // ============================================================
  // INPUT
  // ============================================================
  function pointerWorld(e) {
    const rect = canvas.getBoundingClientRect();
    let cx, cy;
    if (e.touches && e.touches.length > 0) {
      cx = e.touches[0].clientX;
      cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      cx = e.changedTouches[0].clientX;
      cy = e.changedTouches[0].clientY;
    } else {
      cx = e.clientX;
      cy = e.clientY;
    }
    return s2w(cx - rect.left, cy - rect.top);
  }

  function onDown(e) {
    if (gameState !== 'idle' || !currentBird) return;
    if (e.cancelable) e.preventDefault();
    const p = pointerWorld(e);
    const dx = p.x - SLING_X;
    const dy = p.y - SLING_Y;
    if (Math.hypot(dx, dy) > 100) return;
    isDragging = true;
    dragPos = { x: p.x, y: p.y };
    gameState = 'aiming';
  }

  function onMove(e) {
    if (!isDragging) return;
    if (e.cancelable) e.preventDefault();
    dragPos = pointerWorld(e);
  }

  function onUp(e) {
    if (!isDragging) return;
    if (e.cancelable) e.preventDefault();
    isDragging = false;

    if (!currentBird || gameState !== 'aiming') {
      gameState = 'idle';
      return;
    }

    let pullX = dragPos.x - SLING_X;
    let pullY = dragPos.y - SLING_Y;
    const dist = Math.hypot(pullX, pullY);
    if (dist < 10) {
      gameState = 'idle';
      return;
    }
    if (dist > MAX_PULL) {
      const k = MAX_PULL / dist;
      pullX *= k;
      pullY *= k;
    }

    // Velocity: opposite of pull, scaled by LAUNCH_POWER
    const vx = -pullX * LAUNCH_POWER;
    const vy = -pullY * LAUNCH_POWER;

    Body.setStatic(currentBird.body, false);
    Body.setVelocity(currentBird.body, { x: vx, y: vy });
    Body.setAngularVelocity(currentBird.body, -vx * 0.01);
    currentBird.launched = true;

    // Move to active list
    activeBirds.push(currentBird);
    currentBird = null;
    gameState = 'flying';
    updateHud();
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });
  canvas.addEventListener('touchcancel', onUp, { passive: false });

  // ============================================================
  // COLLISION HANDLING
  // ============================================================
  Events.on(engine, 'collisionStart', (event) => {
    for (const pair of event.pairs) {
      checkPigHit(pair.bodyA, pair.bodyB);
      checkPigHit(pair.bodyB, pair.bodyA);
    }
  });

  function checkPigHit(bodyA, bodyB) {
    const pigEntry = pigs.find(p => p.body === bodyA && !p.dead);
    if (!pigEntry) return;

    const relV = Vector.magnitude(Vector.sub(bodyA.velocity, bodyB.velocity));
    // Kill pig if impact is strong enough
    if (relV > 2.5) {
      killPig(pigEntry);
    }
  }

  function killPig(pigEntry) {
    if (pigEntry.dead) return;
    pigEntry.dead = true;
    score += 500;
    updateHud();

    // Remove body after a brief delay so it visually "pops"
    setTimeout(() => {
      Composite.remove(engine.world, pigEntry.body);
    }, 250);

    // Win condition
    if (pigs.every(p => p.dead) && !levelEnding) {
      levelEnding = true;
      // Small delay so the player sees the last pig die
      setTimeout(() => endGame(true), 900);
    }
  }

  // ============================================================
  // END GAME (WIN OR LOSS)
  // ============================================================
  function endGame(won) {
    if (gameState === 'levelclear' || gameState === 'gameover') return;

    if (won) {
      gameState = 'levelclear';
      // Bonus for unused birds (current + queued)
      const unusedBirds = birdQueue.length + (currentBird ? 1 : 0);
      score += unusedBirds * 1000;
      updateHud();

      const stars = unusedBirds >= 2 ? 3 : unusedBirds >= 1 ? 2 : 1;
      overlayTitle.textContent = `LEVEL ${currentLevelIndex + 1} CLEAR`;
      overlayStars.textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
      overlayMsg.textContent = `Score ${score}` + (unusedBirds ? `  •  +${unusedBirds * 1000} bird bonus` : '');

      if (currentLevelIndex + 1 < LEVELS.length) {
        overlayBtn.textContent = 'NEXT LEVEL';
      } else {
        overlayBtn.textContent = 'PLAY AGAIN';
      }
      overlayBtn2.classList.remove('hidden');
      overlay.classList.remove('hidden');
    } else {
      gameState = 'gameover';
      overlayTitle.textContent = 'OUT OF BIRDS';
      overlayStars.textContent = '☆☆☆';
      overlayMsg.textContent = `Score ${score}`;
      overlayBtn.textContent = 'RETRY';
      overlayBtn2.classList.add('hidden');
      overlay.classList.remove('hidden');
    }
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  // ============================================================
  // TURN RESOLUTION (called each frame)
  // ============================================================
  function updateTurnResolution(dt) {
    // Remove birds that flew off screen
    for (let i = activeBirds.length - 1; i >= 0; i--) {
      const b = activeBirds[i];
      if (b.body.position.x < -100 ||
          b.body.position.x > WORLD_WIDTH + 200 ||
          b.body.position.y > WORLD_HEIGHT + 200) {
        Composite.remove(engine.world, b.body);
        activeBirds.splice(i, 1);
      }
    }

    if (gameState !== 'flying') return;
    if (activeBirds.length === 0) return;

    // Are all active birds essentially stopped?
    const allStopped = activeBirds.every(b => {
      const v = Vector.magnitude(b.body.velocity);
      const w = Math.abs(b.body.angularVelocity);
      return v < 0.8 && w < 0.05;
    });

    if (allStopped) {
      // Start resolve countdown once
      if (turnResolveTimer <= 0) turnResolveTimer = 0.6;
    }

    if (turnResolveTimer > 0) {
      turnResolveTimer -= dt;
      if (turnResolveTimer <= 0) {
        // Clean up the birds that landed
        for (const b of activeBirds) {
          Composite.remove(engine.world, b.body);
        }
        activeBirds = [];
        turnResolveTimer = 0;

        // Did we lose?
        if (levelEnding) return;
        if (pigs.every(p => p.dead)) {
          levelEnding = true;
          endGame(true);
          return;
        }
        // Next bird?
        if (birdQueue.length === 0) {
          endGame(false);
          return;
        }
        // Load the next bird
        loadNextBird();
        showHint('DRAG FROM THE SLINGSHOT', 2000);
      }
    }
  }

  // ============================================================
  // HUD
  // ============================================================
  function updateHud() {
    levelEl.textContent = currentLevelIndex + 1;
    birdsEl.textContent = birdQueue.length + (currentBird && !currentBird.launched ? 1 : 0);
    pigsEl.textContent = pigs.filter(p => !p.dead).length;
    scoreEl.textContent = score;
  }

  function showHint(text, duration = 2400) {
    hintEl.textContent = text;
    hintEl.classList.add('show');
    clearTimeout(showHint._t);
    if (duration > 0) {
      showHint._t = setTimeout(() => hintEl.classList.remove('show'), duration);
    }
  }

  // ============================================================
  // RENDER
  // ============================================================
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, CH);
    g.addColorStop(0, '#1a1a3e');
    g.addColorStop(0.6, '#2a1a3e');
    g.addColorStop(1, '#4a2a2a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CW, CH);

    // Distant hills
    ctx.fillStyle = 'rgba(30, 40, 60, 0.6)';
    ctx.beginPath();
    ctx.moveTo(0, CH);
    for (let i = 0; i <= 12; i++) {
      const x = (i / 12) * CW;
      const y = CH - 180 - Math.sin(i * 1.3) * 60;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(CW, CH);
    ctx.closePath();
    ctx.fill();

    // Stars
    for (let i = 0; i < 40; i++) {
      const sx = ((i * 73 + 19) % 400) / 400 * CW;
      const sy = ((i * 53 + 41) % 200) / 200 * CH * 0.5;
      ctx.fillStyle = `rgba(255,255,255,${0.15 + (i % 4) * 0.1})`;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }

    // Moon
    const mx = CW * 0.8, my = CH * 0.18;
    ctx.fillStyle = 'rgba(255, 240, 200, 0.15)';
    ctx.beginPath();
    ctx.arc(mx, my, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 240, 200, 0.9)';
    ctx.beginPath();
    ctx.arc(mx, my, 22, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGround() {
    const gy = w2s(0, GROUND_Y).y;
    const g = ctx.createLinearGradient(0, gy, 0, CH);
    g.addColorStop(0, '#4a3a1a');
    g.addColorStop(0.2, '#2a1a0a');
    g.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = g;
    ctx.fillRect(0, gy, CW, CH - gy);
    // Grass strip
    ctx.fillStyle = '#3a5a2a';
    ctx.fillRect(0, gy - 2, CW, 4);
  }

  function drawSling() {
    const baseP = w2s(SLING_X, GROUND_Y);
    const topP  = w2s(SLING_X, SLING_Y);

    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(baseP.x, baseP.y);
    ctx.lineTo(topP.x - 8, topP.y - 10);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(baseP.x, baseP.y);
    ctx.lineTo(topP.x + 8, topP.y - 10);
    ctx.stroke();

    if (currentBird && !currentBird.launched) {
      const birdPos = isDragging ? dragPos : { x: SLING_X, y: SLING_Y };
      const bp = w2s(birdPos.x, birdPos.y);
      ctx.strokeStyle = '#8a2a2a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(topP.x - 8, topP.y - 10);
      ctx.lineTo(bp.x, bp.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(topP.x + 8, topP.y - 10);
      ctx.lineTo(bp.x, bp.y);
      ctx.stroke();
    }
  }

  function drawBird(body, _type) {
    const p = w2s(body.position.x, body.position.y);
    const r = 18 * SCALE;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(body.angle);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(2, 2, r, 0, Math.PI * 2);
    ctx.fill();

    // Body
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.2, 0, 0, r);
    g.addColorStop(0, '#ff5b5b');
    g.addColorStop(1, '#b81010');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Belly
    ctx.fillStyle = '#ffe0b0';
    ctx.beginPath();
    ctx.arc(0, r * 0.35, r * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-r * 0.25, -r * 0.3, r * 0.28, 0, Math.PI * 2);
    ctx.arc(r * 0.3, -r * 0.3, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-r * 0.2, -r * 0.3, r * 0.14, 0, Math.PI * 2);
    ctx.arc(r * 0.35, -r * 0.3, r * 0.14, 0, Math.PI * 2);
    ctx.fill();

    // Angry eyebrows
    ctx.strokeStyle = '#000';
    ctx.lineWidth = Math.max(2, r * 0.14);
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, -r * 0.7);
    ctx.lineTo(-r * 0.1, -r * 0.45);
    ctx.moveTo(r * 0.55, -r * 0.7);
    ctx.lineTo(r * 0.15, -r * 0.45);
    ctx.stroke();

    // Beak
    ctx.fillStyle = '#ffb030';
    ctx.beginPath();
    ctx.moveTo(r * 0.15, r * 0.1);
    ctx.lineTo(r * 0.9, r * 0.05);
    ctx.lineTo(r * 0.15, r * 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8a5010';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  function drawPig(pigEntry) {
    const body = pigEntry.body;
    const p = w2s(body.position.x, body.position.y);
    const r = pigEntry.r * SCALE;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(body.angle);

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(2, 2, r, 0, Math.PI * 2);
    ctx.fill();

    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.2, 0, 0, r);
    g.addColorStop(0, '#7bff7b');
    g.addColorStop(1, '#2a8a2a');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a3a0a';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-r * 0.3, -r * 0.25, r * 0.25, 0, Math.PI * 2);
    ctx.arc(r * 0.3, -r * 0.25, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-r * 0.28, -r * 0.25, r * 0.11, 0, Math.PI * 2);
    ctx.arc(r * 0.32, -r * 0.25, r * 0.11, 0, Math.PI * 2);
    ctx.fill();

    // Snout
    ctx.fillStyle = '#4ac04a';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.2, r * 0.5, r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a3a0a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#0a3a0a';
    ctx.beginPath();
    ctx.arc(-r * 0.15, r * 0.2, r * 0.07, 0, Math.PI * 2);
    ctx.arc(r * 0.15, r * 0.2, r * 0.07, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBlock(blockEntry) {
    const body = blockEntry.body;
    const w = blockEntry.w * SCALE;
    const h = blockEntry.h * SCALE;
    const p = w2s(body.position.x, body.position.y);

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(body.angle);

    const mat = blockEntry.material;
    const fill = mat === 'wood' ? '#c68a4a' : '#888';
    const stroke = mat === 'wood' ? '#5a3a1a' : '#333';
    const highlight = mat === 'wood' ? 'rgba(255, 220, 160, 0.4)' : 'rgba(220, 220, 220, 0.4)';

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-w / 2 + 3, -h / 2 + 3, w, h);

    // Body
    ctx.fillStyle = fill;
    ctx.fillRect(-w / 2, -h / 2, w, h);

    // Texture hints
    if (mat === 'wood') {
      ctx.strokeStyle = 'rgba(90, 58, 26, 0.35)';
      ctx.lineWidth = 1;
      const lines = 3;
      for (let i = 1; i <= lines; i++) {
        const ly = -h / 2 + (h / (lines + 1)) * i;
        ctx.beginPath();
        ctx.moveTo(-w / 2 + 3, ly);
        ctx.lineTo(w / 2 - 3, ly);
        ctx.stroke();
      }
    } else if (mat === 'stone') {
      ctx.fillStyle = 'rgba(60, 60, 60, 0.35)';
      ctx.beginPath();
      ctx.arc(-w * 0.2, h * 0.1, w * 0.08, 0, Math.PI * 2);
      ctx.arc(w * 0.25, -h * 0.15, w * 0.06, 0, Math.PI * 2);
      ctx.fill();
    }

    // Highlight
    ctx.fillStyle = highlight;
    ctx.fillRect(-w / 2, -h / 2, w, Math.max(2, h * 0.12));

    // Border
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.strokeRect(-w / 2, -h / 2, w, h);

    ctx.restore();
  }

  function drawTrajectory() {
    if (!isDragging || !currentBird) return;

    let pullX = dragPos.x - SLING_X;
    let pullY = dragPos.y - SLING_Y;
    const dist = Math.hypot(pullX, pullY);
    if (dist < 10) return;
    if (dist > MAX_PULL) {
      const k = MAX_PULL / dist;
      pullX *= k;
      pullY *= k;
    }
    let vx = -pullX * LAUNCH_POWER;
    let vy = -pullY * LAUNCH_POWER;

    // Simulate a preview arc — Matter.js uses per-step velocity roughly in pixels/step at 60fps
    // Use small timestep to approximate
    const dt = 1 / 60;
    const gravity = engine.gravity.y * 0.00098 * 1000; // approx pixels/sec²
    // Matter works in px/step, so use simpler approximation:
    let px = SLING_X;
    let py = SLING_Y;
    const steps = 45;
    for (let i = 0; i < steps; i++) {
      // Approximate Matter's physics: velocity is px/step, gravity adds each step
      px += vx;
      py += vy;
      vy += engine.gravity.y * 1; // per-step gravity add (rough)
      if (py > GROUND_Y) break;
      if (px < 0 || px > WORLD_WIDTH) break;
      const sp = w2s(px, py);
      const alpha = 0.55 * (1 - i / steps);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, Math.max(1.5, 3.5 * SCALE), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function render() {
    drawBackground();

    for (const b of blocks) drawBlock(b);
    for (const p of pigs) if (!p.dead) drawPig(p);
    for (const b of activeBirds) drawBird(b.body, b.type);

    if (currentBird && !currentBird.launched) {
      if (isDragging) {
        const fakeBody = { position: { x: dragPos.x, y: dragPos.y }, angle: 0 };
        drawBird(fakeBody, currentBird.type);
      } else {
        drawBird(currentBird.body, currentBird.type);
      }
    }

    drawSling();
    drawGround();
    drawTrajectory();
  }

  // ============================================================
  // MAIN LOOP
  // ============================================================
  let lastTime = 0;

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;

    Engine.update(engine, dt * 1000);

    updateTurnResolution(dt);

    render();
  }

  // ============================================================
  // UI EVENTS
  // ============================================================
  resetBtn.addEventListener('click', () => {
    hideOverlay();
    buildLevel(currentLevelIndex);
  });

  overlayBtn.addEventListener('click', () => {
    if (gameState === 'gameover') {
      buildLevel(currentLevelIndex);
    } else if (gameState === 'levelclear') {
      const next = (currentLevelIndex + 1) % LEVELS.length;
      buildLevel(next);
    }
  });

  overlayBtn2.addEventListener('click', () => {
    buildLevel(currentLevelIndex);
  });

  // ============================================================
  // BOOT
  // ============================================================
  resize();
  buildLevel(0);
  showHint('DRAG FROM THE SLINGSHOT', 3000);

  requestAnimationFrame((t) => {
    lastTime = t;
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
