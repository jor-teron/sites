<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main — sites hub</title>
  <!-- Cache busting: GitHub Pages lets browsers cache files for ~10 min, so every hub
       file below carries ?v=HUB_VERSION. When you change hub.css / hub*.js / hub_apps.js /
       hub_tiles.js (or vendor/),
       bump the version: replace every "?v=20260928g" in this file with today's date
       (YYYYMMDD, add a letter for a second deploy the same day, e.g. 20260928b). -->
  <link rel="stylesheet" href="hub.css?v=20260928g" />
  <link rel="stylesheet" href="style/no-scrollbar.css?v=20260928g" />
</head>
<body>
  <header id="header">
    <div class="header-left">
      <button type="button" class="cat-btn" id="cat-btn" aria-haspopup="true" aria-expanded="false">
        <span id="cat-label">Home</span> <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="menu" id="menu" role="menu" hidden></div>
    </div>
    <!-- App bar: name / stats / buttons sent by the app in the iframe (hub-gamebar.js) -->
    <div class="header-center" id="gamebar" hidden></div>
    <div class="header-right">
      <button type="button" class="ctrl-btn" id="ctrl-btn" title="Phone controller" aria-label="Phone controller">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="8" width="20" height="10" rx="3" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="8" cy="13" r="1.4" fill="currentColor"/>
          <circle cx="16.5" cy="11.5" r="1.1" fill="currentColor"/>
          <circle cx="18.5" cy="13.5" r="1.1" fill="currentColor"/>
          <path d="M7 11.2v3.6M5.2 13h3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="ctrl-dot" aria-hidden="true"></span>
      </button>
      <span>v0.1</span>
      <span class="sep">·</span>
<!--      <span>Credit: Jor Teron</span>	-->
    </div>
  </header>

  <div id="ctrl-backdrop" hidden></div>
  <div id="ctrl-popover" role="dialog" aria-label="Phone controller pairing" hidden>
    <div class="ctrl-pop-head">
      <strong>Phone controller</strong>
      <button type="button" id="ctrl-close" aria-label="Close">×</button>
    </div>
    <div id="ctrl-qr" class="ctrl-qr" aria-hidden="true"></div>
    <div id="ctrl-code" class="ctrl-code">——</div>
    <a id="ctrl-url" class="ctrl-url" href="#" target="_blank" rel="noopener"></a>
    <div id="ctrl-status" class="ctrl-status">Idle</div>
    <div class="ctrl-actions">
      <button type="button" id="ctrl-newcode" class="ctrl-newcode" title="Make a fresh pairing code (the phone must pair again)">New code</button>
      <button type="button" id="ctrl-disconnect" class="ctrl-disconnect">Disconnect</button>
    </div>
  </div>

  <div id="frame-wrap">
    <!-- Home screen: hint + quick-access tiles (hub_tiles.js); hidden once an app opens -->
    <div id="empty">
      <div class="home">
        <div id="empty-text">Open 'Home' and pick an App</div>
        <div id="tiles" class="tiles" hidden></div>
      </div>
    </div>
    <!-- allow: apps may use camera / mic (Webcam, Caption for NEI), fullscreen, gamepad… -->
    <iframe id="app-frame" title="WebApp" scrolling="no"
      allow="camera; microphone; fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; screen-wake-lock; picture-in-picture; display-capture; accelerometer; gyroscope"></iframe>
  </div>

  <script src="vendor/peerjs.min.js?v=20260928g"></script>
  <script src="vendor/qrcode.js?v=20260928g"></script>
  <!-- App list + home tiles (plain JS data, work over http and file://) -->
  <script src="hub_apps.js?v=20260928g"></script>
  <script src="hub_tiles.js?v=20260928g"></script>
  <script src="hub.js?v=20260928g"></script>
  <script src="hub-controller.js?v=20260928g"></script>
  <script src="hub-gamebar.js?v=20260928g"></script>
</body>
</html>
