<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub</title>
  <!-- PWA: installable hub (manifest + root sw.js → hub/hub_sw.js) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0B1033" />
  <link rel="apple-touch-icon" href="shared/image/hub_icon_192.png" />
  <!-- Cache busting: GitHub Pages lets browsers cache files for ~10 min, so every hub
       file below carries ?v=HUB_VERSION. When you change hub_main.css / hub_controller.css / hub_notification.css /
       hub*.js / hub_apps.js / hub_tiles.js (or vendor/),
       bump the version: replace every "?v=20261020a" in this file with today's date
       (YYYYMMDD, add a letter for a second deploy the same day, e.g. 20260928b). -->
  <link rel="stylesheet" href="hub/hub_main.css?v=20261020a" />
  <link rel="stylesheet" href="hub/hub_controller.css?v=20261020a" />
  <link rel="stylesheet" href="hub/hub_notification.css?v=20261020a" />
  <link rel="stylesheet" href="shared/style/no-scrollbar.css?v=20261020a" />
  <link rel="stylesheet" href="shared/link/link.css?v=20261020a" />
  <link rel="stylesheet" href="hub/hub_chat.css?v=20261020a" />
  <link rel="stylesheet" href="hub/hub_flyout.css?v=20261020a" />
  <link rel="stylesheet" href="hub/wm.css?v=20261020a" />
  <link rel="stylesheet" href="hub/hub_drives.css?v=20261020a" />
  <link rel="stylesheet" href="shared/dialog/dialog.css?v=20261020a" />
  <link rel="stylesheet" href="shared/google/google.css?v=20261020a" />
  <link rel="stylesheet" href="shared/ctxmenu/ctxmenu.css?v=20261020a" />
  <link rel="stylesheet" href="hub/osk/osk.css?v=20261020a" />
</head>
<body>
  <header id="header">
    <div class="header-left">
      <button type="button" class="cat-btn" id="cat-btn" aria-haspopup="true" aria-expanded="false">
        <span id="cat-label">Home</span> <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="menu" id="menu" role="menu" hidden></div>
    </div>
    <!-- App bar: name / stats / buttons sent by the app in the iframe (hub-gamebar.js) -->
    <div class="header-center" id="gamebar" hidden></div>
    <!-- Lab label (hub.js): same look as the game name; "Lab" or the app opened from Lab. Not a button. -->
    <div class="header-center" id="lab-label" hidden><span class="gb-title"><span class="gb-name" id="lab-label-name"></span></span></div>
    <div class="header-right">
      <!-- Release 4: Pooh Chat bubble (hub_chat.js) — just before the Gamepad icon -->
      <button type="button" class="ctrl-btn chat-btn" id="chat-btn" title="Chat" aria-label="Chat" aria-haspopup="dialog" aria-expanded="false">
        <span class="chat-ico" aria-hidden="true">🐻</span><span class="chat-badge" id="chat-badge" hidden>0</span>
      </button>
      <button type="button" class="ctrl-btn" id="ctrl-btn" title="Devices" aria-label="Devices">

<svg width="34.5" height="34.5" viewBox="0 0 35 35" fill="none" aria-hidden="true">
  <rect x="3" y="11.5" width="30" height="15" rx="5" stroke="currentColor" stroke-width="3"/>
  <circle cx="24" cy="17" r="2" fill="currentColor"/>
  <circle cx="27" cy="21" r="2" fill="currentColor"/>
  <path d="M10.2 16.2v5.2M7.6 18.8h5.2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
       
        <span class="ctrl-dot" aria-hidden="true"></span>
      </button>
      <span id="hub-ver">—</span>
      <span class="sep">·</span>
<!--      <span>Credit: Jor Teron</span>	-->
    </div>
  </header>

  <div id="ctrl-backdrop" hidden></div>
  <div id="ctrl-popover" role="dialog" aria-label="Devices" hidden>
    <div class="ctrl-pop-head">
      <strong>Devices</strong>
      <button type="button" id="ctrl-close" aria-label="Close">×</button>
    </div>
    <!-- hub_link.js mounts this device's name + connected devices list -->
  </div>

  <div id="frame-wrap">
    <!-- Home screen: hint + quick-access tiles (hub_tiles.js); hidden once an app opens.
         Desktop mode: Drives (hub_drives.js) left 60%, tiles right 40% (hub_drives.css). -->
    <div id="empty">
      <div class="home">
        <section id="desk-drives" class="desk-drives" aria-label="Drives" hidden></section>
        <div id="empty-text" hidden>Open 'Home' and pick an App</div>
        <div id="tiles" class="tiles" hidden></div>
      </div>
    </div>
    <!-- allow: apps may use camera / mic (Webcam, Caption for NEI), fullscreen, gamepad… -->
    <iframe id="app-frame" title="WebApp"
      allow="camera; microphone; fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; screen-wake-lock; picture-in-picture; display-capture; accelerometer; gyroscope"></iframe>
  </div>

  <!-- One-connection release: role first (phone remote Hub joins instead of hosting) -->
  <script src="hub/hub_role.js?v=20261020a"></script>
  <script src="shared/vendor/qrcode.js?v=20261020a"></script>
  <!-- Hub config: menu label (HUB_MENU_LABEL) + category CSVs for the flyout -->
  <script src="hub/hub_config.js?v=20261020a"></script>
  <!-- Settings app choices (wallpaper, sizes, accent, theme, motion) applied live -->
  <script src="shared/wallpaper/wallpapers.js?v=20261020a"></script>
  <script src="hub/hub_wallpapers.js?v=20261020a"></script>
  <script src="hub/hub_prefs.js?v=20261020a"></script>
  <!-- Desktop mode (big screen + mouse): windows + taskbar; Phone mode = the single frame -->
  <script src="hub/wm_mode.js?v=20261020a"></script>
  <!-- Our own right-click / long-press menus (shared/ctxmenu); modules below register theirs -->
  <script src="shared/ctxmenu/ctxmenu.js?v=20261020a"></script>
  <script>window.__ctxInAppManual = true;</script>
  <script src="shared/ctxmenu/ctx_in_app.js?v=20261020a"></script>
  <script src="hub/hub_ctx.js?v=20261020a"></script>
  <script src="hub/wm_windows.js?v=20261020a"></script>
  <script src="hub/wm_taskbar.js?v=20261020a"></script>
  <!-- R10: window snapping + two workspaces (Desktop mode) -->
  <script src="hub/wm_snap.js?v=20261020a"></script>
  <script src="hub/wm_workspaces.js?v=20261020a"></script>
  <!-- Optional taskbar busy meter (off by default; Settings → Desktop) -->
  <script src="shared/perf/busy_meter.js?v=20261020a"></script>
  <script src="hub/hub_traymeter.js?v=20261020a"></script>
  <!-- App list + home tiles (plain JS data, work over http and file://) -->
  <script src="hub/hub_apps.js?v=20261020a"></script>
  <script src="hub/hub_tiles.js?v=20261020a"></script>
  <script src="hub/hub.js?v=20261020a"></script>
  <!-- Desktop mouse only: GNOME 2 style category flyout (CSV parser shared with the category pages) -->
  <script src="shared/tiles/tiles.js?v=20261020a"></script>
  <script src="shared/favorites/favorites.js?v=20261020a"></script>
  <script src="hub/hub_flyout.js?v=20261020a"></script>
  <script src="hub/hub_ctx_menus.js?v=20261020a"></script>
  <script src="hub/hub_settings.js?v=20261020a"></script>
  <script src="shared/dialog/dialog.js?v=20261020a"></script>
  <!-- Google Drive as a drive (R9a): config, QR sign-in (device flow), Drive adapter, connect panel -->
  <script src="shared/google/google_config.js?v=20261020a"></script>
  <script src="shared/google/google_auth.js?v=20261020a"></script>
  <script src="shared/google/gdrive_fs.js?v=20261020a"></script>
  <script src="shared/google/google_gis.js?v=20261020a"></script>
  <script src="shared/google/phonekey.js?v=20261020a"></script>
  <script src="shared/google/gdrive_connect.js?v=20261020a"></script>
  <script src="shared/fs/fs_drives.js?v=20261020a"></script>
  <script src="hub/hub_drives.js?v=20261020a"></script>
  <!-- Phone controller: settings, trackpad pointer, received-file cards, phone → hub files -->
  <script src="hub/hub_controller_config.js?v=20261020a"></script>
  <script src="hub/hub_notify.js?v=20261020a"></script>
  <script src="hub/hub_viewer_pdf.js?v=20261020a"></script>
  <script src="hub/hub_viewer.js?v=20261020a"></script>
  <script src="hub/hub_pointer.js?v=20261020a"></script>
  <script src="hub/hub_receive.js?v=20261020a"></script>
  <!-- SharedLink: one connection layer (PeerJS from the pinned CDN url in link_core.js) -->
  <script src="shared/link/link_core.js?v=20261020a"></script>
  <script src="shared/link/link_devices.js?v=20261020a"></script>
  <script src="shared/link/link_files.js?v=20261020a"></script>
  <script src="shared/link/link_ui.js?v=20261020a"></script>
  <script src="shared/link/link_chat.js?v=20261020a"></script>
  <script src="hub/hub-controller.js?v=20261020a"></script>
  <script src="hub/hub_link.js?v=20261020a"></script>
  <!-- Phone as a key: Google token from the phone over SharedLink (R9b) -->
  <script src="hub/hub_phonekey.js?v=20261020a"></script>
  <script src="hub/hub_linkstate.js?v=20261020a"></script>
  <script src="shared/link/link_scan.js?v=20261020a"></script>
  <script src="hub/hub_remote.js?v=20261020a"></script>
  <script src="hub/hub_chat.js?v=20261020a"></script>
  <script src="hub/hub-gamebar.js?v=20261020a"></script>
  <!-- On-screen keyboard (hub/osk/): shared board (kb_common + osk_layout + osk_board) and the panel -->
  <script src="hub/controller/kb_common.js?v=20261020a"></script>
  <script src="hub/osk/osk_layout.js?v=20261020a"></script>
  <script src="hub/osk/osk_board.js?v=20261020a"></script>
  <script src="hub/osk/osk_drag.js?v=20261020a"></script>
  <script src="hub/osk/osk.js?v=20261020a"></script>
  <!-- PWA service worker (root sw.js) + stale-shell guard / Check for update -->
  <script src="hub/hub_update.js?v=20261020a"></script>
</body>
</html>
