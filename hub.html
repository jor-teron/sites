<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main — sites hub</title>
  <style>
    :root {
      --header-h: 75px;
      --bg: #121418;
      --bar: #1a1e26;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #2a303a;
      --accent: #6ea8fe;
      --menu: #222833;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      width: 100%;
      height: var(--header-h);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      user-select: none;
    }

    .header-left { display: flex; align-items: center; min-width: 0; position: relative; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .header-right .sep { opacity: 0.45; }

    .cat-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .cat-btn:hover,
    .cat-btn[aria-expanded="true"] {
      background: rgba(255,255,255,0.06);
      border-color: var(--line);
    }
    .cat-btn .chev {
      font-size: 11px;
      opacity: 0.7;
      transition: transform 0.15s ease;
    }
    .cat-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

    .menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 260px;
      max-height: min(70vh, 480px);
      overflow: auto;
      background: var(--menu);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      padding: 6px;
      display: none;
    }
    .menu.open { display: block; }
    .menu-group {
      padding: 8px 10px 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .menu button.app {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu button.app:hover,
    .menu button.app.active {
      background: rgba(110, 168, 254, 0.16);
      color: #fff;
    }
    .menu button.app .icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex: 0 0 22px;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
    }
    .menu button.app .icon.missing {
      visibility: hidden;
    }

    #frame-wrap {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100vh - var(--header-h));
      background: #000;
    }
    #app-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      overflow: hidden;
      background: #000;
    }

    #empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }
    #empty.hidden { display: none; }
  </style>
</head>
<body>
  <header id="header">
    <div class="header-left">
      <button type="button" class="cat-btn" id="cat-btn" aria-haspopup="true" aria-expanded="false">
        <span id="cat-label">Main</span> <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="menu" id="menu" role="menu" hidden></div>
    </div>
    <div class="header-right">
      <span>Credit: Jor Teron</span>
      <span class="sep">·</span>
      <span>version 0.1</span>
    </div>
  </header>

  <div id="frame-wrap">
    <div id="empty">Open Main and pick a WebApp</div>
    <iframe id="app-frame" title="WebApp" scrolling="no"></iframe>
  </div>

  <script>
    const HEADER_DEFAULT = 'Main';
    const catBtn = document.getElementById('cat-btn');
    const menu = document.getElementById('menu');
    const frame = document.getElementById('app-frame');
    const empty = document.getElementById('empty');

    /**
     * CSV: CATEGORY,NAME,ENTRY_URL,ORDER,HIDDEN
     * ENTRY_URL = WebApp folder link (e.g. tv/ or games/browser-fps/)
     * Icon is never in CSV — derived as {ENTRY_URL}{folderName}_icon.png
     */
    const FALLBACK_APPS = [
      { category: 'Tools', name: 'MS Word Diff', entryUrl: 'MSword_diff/', order: 10, hidden: false },
      { category: 'Media', name: 'TV', entryUrl: 'tv/', order: 20, hidden: false },
      { category: 'Games', name: 'Browser FPS', entryUrl: 'games/browser-fps/', order: 30, hidden: false },
      { category: 'Tools', name: 'Nei Dict', entryUrl: 'nei-dict/', order: 40, hidden: false },
      { category: 'Desktop', name: 'Webdesk', entryUrl: 'webdesk/', order: 50, hidden: false },
      { category: 'Media', name: 'Phone', entryUrl: 'phone/', order: 60, hidden: false },
    ];

    function folderNameFromUrl(entryUrl) {
      const clean = String(entryUrl || '').replace(/\\/g, '/').replace(/\/+$/, '');
      const parts = clean.split('/').filter(Boolean);
      return parts[parts.length - 1] || '';
    }

    function normalizeEntryUrl(entryUrl) {
      let u = String(entryUrl || '').trim().replace(/\\/g, '/');
      if (!u) return '';
      if (!u.endsWith('/')) u += '/';
      return u;
    }

    function iconPathFor(entryUrl) {
      const folder = folderNameFromUrl(entryUrl);
      if (!folder) return '';
      return normalizeEntryUrl(entryUrl) + folder + '_icon.png';
    }

    function parseHidden(v) {
      const s = String(v == null ? '' : v).trim().toLowerCase();
      return s === '1' || s === 'true' || s === 'yes' || s === 'y' || s === 'hidden';
    }

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      const header = lines[0].split(',').map((h) => h.trim().toUpperCase());
      const iCat = header.indexOf('CATEGORY');
      const iName = header.indexOf('NAME');
      const iUrl = header.indexOf('ENTRY_URL');
      const iOrder = header.indexOf('ORDER');
      const iHidden = header.indexOf('HIDDEN');
      if (iCat < 0 || iName < 0 || iUrl < 0) return [];

      const apps = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',');
        const category = (cols[iCat] || '').trim();
        const name = (cols[iName] || '').trim();
        const entryUrl = normalizeEntryUrl(cols[iUrl] || '');
        if (!category || !name || !entryUrl) continue;
        const order = iOrder >= 0 ? Number(cols[iOrder]) : i;
        apps.push({
          category,
          name,
          entryUrl,
          order: Number.isFinite(order) ? order : i,
          hidden: iHidden >= 0 ? parseHidden(cols[iHidden]) : false,
        });
      }
      return apps;
    }

    function visibleSorted(apps) {
      return apps
        .filter((a) => !a.hidden)
        .sort((a, b) => (a.order - b.order) || a.name.localeCompare(b.name));
    }

    function groupByCategory(apps) {
      const order = [];
      const map = new Map();
      for (const app of apps) {
        if (!map.has(app.category)) {
          map.set(app.category, []);
          order.push(app.category);
        }
        map.get(app.category).push(app);
      }
      return { order, map };
    }

    function setOpen(open) {
      menu.classList.toggle('open', open);
      menu.hidden = !open;
      catBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function loadApp(app) {
      // Folder link — GitHub Pages serves index.html inside ENTRY_URL
      frame.src = app.entryUrl;
      empty.classList.add('hidden');
      setOpen(false);
      document.title = app.name + ' — sites hub';
      document.getElementById('cat-label').textContent = HEADER_DEFAULT;
      menu.querySelectorAll('button.app').forEach((b) => {
        b.classList.toggle('active', b.dataset.entryUrl === app.entryUrl);
      });
    }

    function renderMenu(apps) {
      menu.innerHTML = '';
      const list = visibleSorted(apps);
      const { order, map } = groupByCategory(list);
      for (const cat of order) {
        const label = document.createElement('div');
        label.className = 'menu-group';
        label.textContent = cat;
        menu.appendChild(label);
        for (const app of map.get(cat)) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'app';
          btn.setAttribute('role', 'menuitem');
          btn.dataset.entryUrl = app.entryUrl;

          const img = document.createElement('img');
          img.className = 'icon';
          img.alt = '';
          img.src = iconPathFor(app.entryUrl);
          img.addEventListener('error', () => img.classList.add('missing'));

          const span = document.createElement('span');
          span.textContent = app.name;

          btn.appendChild(img);
          btn.appendChild(span);
          btn.addEventListener('click', () => loadApp(app));
          menu.appendChild(btn);
        }
      }
    }

    catBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setOpen(!menu.classList.contains('open'));
    });
    document.addEventListener('click', () => setOpen(false));
    menu.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setOpen(false);
    });

    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (doc && doc.documentElement) {
          doc.documentElement.style.overflow = 'hidden';
          if (doc.body) doc.body.style.overflow = 'hidden';
        }
      } catch (_) { /* ignore */ }
    });

    async function boot() {
      let apps = FALLBACK_APPS;
      try {
        const res = await fetch('hub-apps.csv', { cache: 'no-store' });
        if (res.ok) {
          const parsed = parseCsv(await res.text());
          if (parsed.length) apps = parsed;
        }
      } catch (_) { /* file:// fallback */ }
      renderMenu(apps);
    }

    boot();
  </script>
</body>
</html>
