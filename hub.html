<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub</title>
  <!-- PWA: installable hub (manifest + root sw.js → hub/update/hub_sw.js) -->
  <!-- R59: the manifest link is added only on http(s); on file:// Chrome cannot load it (CORS error) -->
  <script>if (/^https?:$/.test(location.protocol)) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l); }</script>
  <meta name="theme-color" content="#0B1033" />
  <link rel="apple-touch-icon" href="shared/image/hub_icon_192.png" />
  <!-- Cache busting: GitHub Pages lets browsers cache files for ~10 min, so every hub
       file below carries ?v=HUB_VERSION. When you change hub_main.css / hub_controller.css / hub_notification.css /
       hub*.js / hub_apps.js / hub_tiles.js (or vendor/),
       bump the version with: python3 hub/tools/hub_bump.py --release NAME (README_technical section 13).
       It replaces every "?v=20261023q" in this file (and the other 6 build places) with today's IST date
       (YYYYMMDD, add a letter for a second deploy the same day, e.g. 20260928b). -->
  <link rel="stylesheet" href="hub/core/hub_main.css?v=20261023q" />
  <link rel="stylesheet" href="hub/controller/hub_controller.css?v=20261023q" />
  <link rel="stylesheet" href="hub/viewer/hub_notification.css?v=20261027h26" />
  <link rel="stylesheet" href="shared/style/no-scrollbar.css?v=20261023q" />
  <link rel="stylesheet" href="shared/link/link.css?v=20261023q" />
  <link rel="stylesheet" href="hub/link/hub_chat.css?v=20261027h27" />
  <!-- H27: Devices + Pooh Chat as full-height side panels -->
  <link rel="stylesheet" href="hub/link/hub_panels.css?v=20261027h271" />
  <link rel="stylesheet" href="hub/menu/hub_flyout.css?v=20261023q" />
  <link rel="stylesheet" href="hub/wm/wm.css?v=20261027h26" />
  <link rel="stylesheet" href="shared/dialog/dialog.css?v=20261023q" />
  <link rel="stylesheet" href="shared/ctxmenu/ctxmenu.css?v=20261023q" />
  <link rel="stylesheet" href="hub/update/hub_update.css?v=20261023q" />
</head>
<body>
  <header id="header">
    <div class="header-left">
      <button type="button" class="cat-btn" id="cat-btn" aria-haspopup="true" aria-expanded="false">
        <span id="cat-label">Home</span> <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="menu" id="menu" role="menu" hidden></div>
      <!-- R42: Phone mode Home button (back to the home tiles, like the old "Show homescreen").
           Hidden on the home screen and in Desktop mode (no Show desktop in Phone mode). hub-gamebar.js -->
      <button type="button" class="ctrl-btn home-btn" id="home-btn" title="Home" aria-label="Home" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <!-- App bar: name / stats / buttons sent by the app in the iframe (hub-gamebar.js) -->
    <div class="header-center" id="gamebar" hidden></div>
    <!-- Lab label (hub.js): same look as the game name; "Lab" or the app opened from Lab. Not a button. -->
    <div class="header-center" id="lab-label" hidden><span class="gb-title"><span class="gb-name" id="lab-label-name"></span></span></div>
    <div class="header-right">
      <!-- Release 4: Pooh Chat bubble (hub_chat.js) — just before the Gamepad icon -->
      <button type="button" class="ctrl-btn chat-btn" id="chat-btn" title="Chat" aria-label="Chat" aria-haspopup="dialog" aria-expanded="false">
        <span class="chat-ico" aria-hidden="true">🐻</span><span class="chat-badge" id="chat-badge" hidden>0</span>
      </button>
      <button type="button" class="ctrl-btn" id="ctrl-btn" title="Devices" aria-label="Devices">

<svg width="34.5" height="34.5" viewBox="0 0 35 35" fill="none" aria-hidden="true">
  <rect x="3" y="11.5" width="30" height="15" rx="5" stroke="currentColor" stroke-width="3"/>
  <circle cx="24" cy="17" r="2" fill="currentColor"/>
  <circle cx="27" cy="21" r="2" fill="currentColor"/>
  <path d="M10.2 16.2v5.2M7.6 18.8h5.2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
       
        <span class="ctrl-dot" aria-hidden="true"></span>
      </button>
      <!-- R50: "Update ready" indicator (hub_update.js): hidden until a new build waits; opens Settings > About.
           In Desktop mode .header-right sits in the taskbar tray, so it lands just before the clock. -->
      <button type="button" class="ctrl-btn upd-btn" id="upd-btn" title="Update ready" aria-label="Update ready" hidden>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="upd-dot" aria-hidden="true"></span>
      </button>
      <!-- R41: placebo version label (#hub-ver, v0.299) removed from display; version.txt + HubUpdate.version() stay.
      <span id="hub-ver">—</span>
      <span class="sep">·</span> -->
<!--      <span>Credit: Jor Teron</span>	-->
    </div>
  </header>

  <div id="ctrl-backdrop" hidden></div>
  <div id="ctrl-popover" role="dialog" aria-label="Devices" hidden>
    <div class="ctrl-pop-head">
      <strong>Devices</strong>
      <button type="button" id="ctrl-close" aria-label="Close">×</button>
    </div>
    <!-- hub_link.js mounts this device's name + connected devices list -->
  </div>

  <div id="frame-wrap">
    <!-- Home screen: hint + quick-access tiles (hub_tiles.js); hidden once an app opens.
         Desktop mode: Files pane (hub_drives.js, "Drives" until R54b) left 60%, tiles right 40% (hub_drives.css). -->
    <div id="empty">
      <div class="home">
        <section id="desk-drives" class="desk-drives" aria-label="Files" hidden></section>
        <div id="empty-text" hidden>Open 'Home' and pick an App</div>
        <div id="tiles" class="tiles" hidden></div>
      </div>
    </div>
    <!-- allow: apps may use camera / mic (Webcam, Caption for NEI), fullscreen, gamepad… -->
    <iframe id="app-frame" title="WebApp"
      allow="camera; microphone; fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; screen-wake-lock; picture-in-picture; display-capture; accelerometer; gyroscope"></iframe>
  </div>

  <!-- One-connection release: role first (phone remote Hub joins instead of hosting) -->
  <script src="hub/core/hub_role.js?v=20261023q"></script>
  <script src="shared/vendor/qrcode.js?v=20261023q"></script>
  <!-- Hub config: menu label (HUB_MENU_LABEL) + category CSVs for the flyout -->
  <script src="hub/core/hub_config.js?v=20261023q"></script>
  <script src="hub/core/hub_appindex.js?v=20261023q"></script>
  <!-- R47: generated copy of every category CSV (window.SITES_CSV) for file:// / no server; tiny, sync, before the menu -->
  <script src="hub/core/hub_catalog.js?v=20261023q"></script>
  <!-- Settings app choices (wallpaper, sizes, accent, theme, motion) applied live -->
  <script src="shared/wallpaper/wallpapers.js?v=20261023q"></script>
  <script src="hub/drives/hub_wallpapers.js?v=20261023q"></script>
  <script src="hub/core/hub_prefs.js?v=20261023q"></script>
  <!-- Desktop mode (big screen + mouse): windows + taskbar; Phone mode = the single frame -->
  <script src="hub/wm/wm_mode.js?v=20261023q"></script>
  <!-- Our own right-click / long-press menus (shared/ctxmenu); modules below register theirs -->
  <script src="shared/ctxmenu/ctxmenu.js?v=20261023q"></script>
  <script>window.__ctxInAppManual = true;</script>
  <script src="shared/ctxmenu/ctx_in_app.js?v=20261023q"></script>
  <script src="hub/menu/hub_ctx.js?v=20261023q"></script>
  <script src="hub/wm/wm_windows.js?v=20261023q"></script>
  <script src="hub/wm/wm_taskbar.js?v=20261023q"></script>
  <!-- R10: two workspaces (Desktop mode); snapping is in hub_loader.js (R16a) -->
  <script src="hub/wm/wm_workspaces.js?v=20261023q"></script>
  <!-- Optional taskbar busy meter (off by default; Settings → Desktop) -->
  <script src="shared/perf/busy_meter.js?v=20261023q"></script>
  <script src="hub/drives/hub_traymeter.js?v=20261023q"></script>
  <!-- App list + home tiles (plain JS data, work over http and file://) -->
  <script src="hub/core/hub_apps.js?v=20261023q"></script>
  <script src="hub/menu/hub_tiles.js?v=20261023q"></script>
  <script src="hub/core/hub.js?v=20261023q"></script>
  <!-- Desktop mouse only: GNOME 2 style category flyout (CSV parser shared with the category pages) -->
  <script src="shared/tiles/tiles.js?v=20261023q"></script>
  <script src="shared/favorites/favorites.js?v=20261023q"></script>
  <script src="hub/menu/hub_flyout.js?v=20261023q"></script>
  <script src="hub/menu/hub_ctx_menus.js?v=20261023q"></script>
  <script src="hub/menu/hub_settings.js?v=20261023q"></script>
  <script src="shared/dialog/dialog.js?v=20261023q"></script>
  <!-- Phone controller: settings, trackpad pointer, received-file cards, phone → hub files -->
  <script src="hub/controller/hub_controller_config.js?v=20261027h26"></script>
  <script src="hub/viewer/hub_notify.js?v=20261027h26"></script>
  <!-- H28: one key store for API keys (window.HubKeys; apps call window.top.HubKeys, Settings → API Keys) -->
  <script src="hub/core/hub_keys.js?v=20261027h281"></script>
  <!-- H30.1: Hub settings saved to the connected folder (hub/hub-profile/hub.json; window.HubProfile) -->
  <script src="hub/core/hub_profile.js?v=20261027h301"></script>
  <script src="hub/link/hub_pointer.js?v=20261023q"></script>
  <script src="hub/link/hub_receive.js?v=20261023q"></script>
  <!-- SharedLink: one connection layer (PeerJS from the pinned CDN url in link_core.js) -->
  <script src="shared/link/link_core.js?v=20261023q"></script>
  <script src="shared/link/link_devices.js?v=20261023q"></script>
  <script src="shared/link/link_files.js?v=20261023q"></script>
  <script src="shared/link/link_ui.js?v=20261023q"></script>
  <script src="shared/link/link_chat.js?v=20261023q"></script>
  <script src="hub/controller/hub_textedit.js?v=20261027h26"></script>
  <script src="hub/controller/hub-controller.js?v=20261023q"></script>
  <script src="hub/link/hub_link.js?v=20261023q"></script>
  <script src="hub/link/hub_linkstate.js?v=20261023q"></script>
  <script src="shared/link/link_scan.js?v=20261023q"></script>
  <script src="hub/link/hub_remote.js?v=20261023q"></script>
  <script src="hub/link/hub_chat.js?v=20261027h27"></script>
  <script src="hub/link/hub_panels.js?v=20261027h271"></script>
  <script src="hub/link/hub-gamebar.js?v=20261023q"></script>
  <!-- PWA service worker (root sw.js) + stale-shell guard / Check for update -->
  <script src="hub/update/hub_update.js?v=20261023q"></script>
  <!-- R16a: everything not needed for the first paint (Drive, snap, keyboard, Viewer) loads here, after idle -->
  <script src="hub/core/hub_loader.js?v=20261023q"></script>
</body>
</html>
