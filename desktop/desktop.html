  <meta charset="UTF-8" />
  <!-- H129a: the desktop shell's own page is now desktop/desktop.html (this file). hub.html (site root) and desktop/index.html are tiny
       redirects here. No files moved yet: every script / style / app path below and every root-relative path the
       Hub builds at run time (app catalog, apps/..., hub_loader.js, sw.js, manifest, CSVs, wallpapers…) still
       resolves from the SITE ROOT through this <base>, exactly as it did from hub.html. Hub code that resolves
       a path at run time uses document.baseURI (= location.href on a page without <base>, e.g. phone.html).
       Keep <base> the first element after charset, before any relative URL. (H129b/c move desktop files here.) -->
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub</title>
  <!-- PWA: installable hub (manifest + root sw.js → hub/update/hub_sw.js); both resolve from the site root via <base> (H129a),
       so the root sw.js (scope = the whole site) controls desktop/ too. -->
  <!-- R59: the manifest link is added only on http(s); on file:// Chrome cannot load it (CORS error) -->
  <!-- H129d: opening the desktop page saves Desktop as this device's mode (the root index.html mode entry reads
       sites-hub.mode and goes straight there next time). Not for a Connect QR join link (?join=CODE: often a phone
       scanning it, which keeps its own choice) and not when this page is inside a frame. -->
  <script>try { if (window === top && !/[?&]join=/.test(location.search)) localStorage.setItem('sites-hub.mode', 'desktop'); } catch (_) { /* blocked */ }</script>
  <!-- H166: ?perf=1 debug overlay. Tiny check only; hub_perf.js is not fetched unless the flag is set. -->
  <script>try { if (/(?:^|[?&])perf=1(?:&|$)/.test(location.search)) { var s = document.createElement('script'); s.src = 'hub/core/hub_perf.js?v=20261123b'; s.async = true; document.head.appendChild(s); } } catch (_) { /* blocked */ }</script>
  <script>if (/^https?:$/.test(location.protocol)) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l); }</script>

  <!-- Cache busting: GitHub Pages lets browsers cache files for ~10 min, so every hub
       file below carries ?v=HUB_VERSION. When you change hub_main.css / hub_controller.css / hub_notification.css /
       hub*.js / hub_apps.js / hub_tiles.js (or vendor/),
       bump the version with: python3 hub/tools/hub_bump.py --release NAME (README_technical section 13).
       It replaces every "?v=20261123b" in this file (and the other 7 build places, H129a) with today's IST date
       (YYYYMMDD, add a letter for a second deploy the same day, e.g. 20260928b). -->

       menu / connect / wallpaper / update batches in hub_loader.js. Old tags are kept as comments. -->

  <!-- H175: Glass / XP / lock / break CSS only when that feature is saved (same localStorage keys as hub_prefs /
       lock / break). document.write while <head> is still parsing keeps the sheet render-blocking (no flash).
       Lock-on still covers the desk before first paint (html.hub-locked + inline hide). Mid-break uses
       html.hub-break-pending until hub_break.js paints the overlay. Settings can load these on demand
       via HubLoader.ensure (no reload). -->
  <style>html.hub-locked,html.hub-break-pending{background:#080b14}html.hub-locked>body,html.hub-break-pending>body{visibility:hidden!important}</style>
  <script>
  try {
    var r = document.documentElement;
    var g = function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
    var th = g('sites-hub.theme');
    var xp = (th === 'xp' || g('sites-hub.xp') === '1');
    var glass = (th === 'glass' || g('sites-hub.glass') === '1');
    if (th !== 'dark') r.classList.add('hub-light');   // H60a: unset = Light (same as hub_prefs.apply)
    if (xp) r.classList.add('hub-xp');
    else if (glass) {
      r.classList.add('hub-glass');
      if (g('sites-hub.glassSolid') === '1') r.classList.add('hub-glass-solid');
    }
    var locked = (g('hub-lock.on') === '1' && !!g('hub-lock.pin'));
    if (locked) { r.classList.add('hub-locked'); window.__hubLockBoot = true; }
    var midBreak = (+g('hub-break.breakEnd') || 0) > Date.now();
    var breakOn = (g('sites-hub.breakOn') === '1' || midBreak);
    if (midBreak) r.classList.add('hub-break-pending');
    var eyeMode = g('sites-hub.eyeMode');
    var eyeOn = (eyeMode === 'always' || eyeMode === 'sched');
    window.__hubBootPaths = { xp: !!xp, glass: !!(!xp && glass), locked: !!locked, breakOn: !!breakOn, midBreak: !!midBreak, eyeOn: !!eyeOn };
    function sheet(href) { var q = '"'; document.write('<link rel="stylesheet" href=' + q + href + '?v=20261123b' + q + ' />'); }
    if (xp) sheet('hub/core/hub_xp.css');
    else if (glass) sheet('hub/core/hub_glass.css');
    if (breakOn) sheet('hub/core/hub_break.css');
    if (locked) sheet('hub/core/hub_lock.css');
  } catch (_) { /* blocked */ }
  </script>

  <style>html.hub-splash{background:#070d18}html.hub-splash.hub-splash-light{background:#f1f5f9}html.hub-splash>body{visibility:hidden!important}#hub-splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;display:flex;visibility:visible;background:inherit}</style>
  <script>try { if (window === top && !/[?&]join=/.test(location.search) && localStorage.getItem('sites-hub.bootSplash') !== '0') { var r = document.documentElement; r.classList.add('hub-splash'); if (localStorage.getItem('sites-hub.theme') !== 'dark') r.classList.add('hub-splash-light'); var d = document.createElement('div'); d.id = 'hub-splash'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Hub'); d.setAttribute('aria-busy', 'true'); r.appendChild(d); } } catch (_) { /* blocked */ }</script>
