# ai-mcp v3.21 configuration.
# Environment variables already set in the shell override these values.
# Lines starting with # are comments. KEY=value, optional quotes.

# Demo PIN. Change this before leaving Funnel on a public address.
PIN=password
# Or read it from a file kept outside workspace/:
# PIN_FILE=/home/ai/mcp.pin

HOST=127.0.0.1
PORT=10001
PUBLIC_URL=https://debian.tail94ffdb.ts.net/ai/mcp

# Workspace is the chroot / file-tool root. Default: ./workspace next to mcp.sh
# ROOT=/home/www/ai/workspace

# ns = namespaces + chroot (default). none = no jail (file tools still confined).
SANDBOX=ns
# 1 to give sandboxed commands network access
SANDBOX_NET=0

LOG=/home/ai/mcp.log

# Per-command limits inside the jail
TIMEOUT=60
MEMORY_MB=512
MAX_PROCS=64

# Extra bind mounts visible only to commands, not to file tools.
# Format: src:dest[:ro|rw]  (ro is the default). Repeat BIND= for several.
# BIND=/home/www/ai/projects:/projects:ro

# Comma-separated browser origins, or * 
# CORS_ORIGINS=https://your-agent.example

# Forwarded client IPs are used only when the socket peer matches this allowlist.
# Example for a local reverse proxy: TRUST_PROXY_IPS=127.0.0.1,::1
TRUST_PROXY=0
TRUST_PROXY_IPS=
