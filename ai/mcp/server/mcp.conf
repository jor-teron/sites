# ai-mcp v3.7 configuration.
# Non-sensitive settings live here. Sensitive values (PIN, etc.) go in .env.
# Environment variables already set in the shell override these values.
# Lines starting with # are comments. KEY=value, optional quotes.

# =============================================================================
# REQUIRED – START HERE
# =============================================================================

# Bind address (loopback only by default).
HOST=127.0.0.1

# TCP port the server listens on.
PORT=10001

# Multi-user catalog. Relative path is beside mcp.sh.
# Columns: uid,user,password,home,enabled,perms
USERS=users.csv

# Sandbox root (chroot / file-tool root). The AI sees this as "/".
ROOT=/home/www/mcp-sandbox

# Workspace directory inside the sandbox. The AI sees this as /workspace.
WORKSPACE=/home/www/mcp-sandbox/workspace

# Jail mode: ns = namespaces + chroot (default). none = no jail.
SANDBOX=ns

# 1 to give sandboxed commands network access, 0 to block it.
SANDBOX_NET=1

# 1 to allow sudo/setuid inside the jail (skips no_new_privs). 0 = blocked (default).
# Requires sudo to be installed in the rootfs. Use with care.
SANDBOX_SUDO=1

# JSON event log path.
LOG=/home/ai/mcp/logs/mcp.log

# Directory for pid and state files (used by mcp.sh).
STATE_DIR=/home/ai/mcp/run

# Soft path Funnel (or reverse proxy) publishes. Can be any path.
FUNNEL_PATH=/sandbox

# Public base URL (no trailing slash). Used in banners and docs.
PUBLIC_URL=https://debian.tail94ffdb.ts.net/sandbox

# =============================================================================
# OAuth 2.1 (v5.6) — pre-registered client for Gemini Connected Apps UI
# =============================================================================
# Paste these into the Gemini / Connected Apps form when it asks for
# OAuth Client ID and Client Secret. PKCE is still required; the secret is
# only for the form. Change both values before any public exposure.
# OAUTH_CLIENT_ID=ai-mcp-gemini
# OAUTH_CLIENT_SECRET=ai-mcp-gemini-secret-0000

# Optional API server (if used alongside MCP).
API_HOST=127.0.0.1
API_PORT=10002
# Base URL used by the API CLI client (api/client.py).
API_URL=http://127.0.0.1:10002
# Optional separate PIN for the API. Leave empty to use the MCP PIN from .env.
# API_PIN=
# API_PIN_FILE=/home/ai/mcp.api.pin

# =============================================================================
# Optional features (RAG)
# =============================================================================
# Set to true to enable the RAG dashboard and document store.
# Requires a storage path (created automatically on first use).
AI_RAG_ENABLED=true
AI_RAG_EMBEDDINGS_ENABLED=false
# AI_RAG_EMBEDDING_PROVIDER=
# AI_RAG_EMBEDDING_MODEL=
AI_STORAGE_PATH=/home/ai/mcp/rag.sqlite3
# Optional backup directory for the RAG database.
# AI_STORAGE_BACKUP_DIR=/home/ai/mcp/rag-backups
# SQLite busy timeout in seconds.
AI_STORAGE_TIMEOUT=5
# Where the RAG settings JSON is saved (GUI apply). Default is ~/.config/ai-mcp/rag.json
# AI_RAG_CONFIG_PATH=/home/ai/mcp/rag.json

# =============================================================================
# Optional tuning
# =============================================================================

# Per-command limits inside the jail
TIMEOUT=60
MEMORY_MB=512
MAX_PROCS=64

# Extra bind mounts visible only to commands, not to file tools.
# Format: src:dest[:ro|rw]  (ro is the default). Repeat BIND= for several.
# BIND=/home/www/ai/projects:/projects:ro

# Comma-separated browser origins, or *
# CORS_ORIGINS=https://your-agent.example

# Forwarded client IPs are used only when the socket peer matches this allowlist.
# Example for a local reverse proxy: TRUST_PROXY_IPS=127.0.0.1,::1
TRUST_PROXY=0
TRUST_PROXY_IPS=
