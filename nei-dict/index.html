<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nei-dict</title>
  <link rel="stylesheet" href="dict.css" />
</head>
<body>
  <header class="site-header">
    <h1>nei-dict</h1>
  </header>

  <main>
    <section class="search-panel">
      <div class="search-row">
        <label for="q">Search</label>
        <label class="lang-label" for="lang">Language</label>
        <select id="lang" aria-label="Language">
          <option value="1" selected>English</option>
          <option value="14">Nagamese</option>
          <option value="5">Khasi</option>
          <option value="9">Mizo</option>
          <option value="23">Nepali</option>
          <option value="10">Karbi</option>
          <option value="15">Dimasa</option>
          <option value="7">Meeteilon</option>
          <option value="13">Hmar</option>
          <option value="12">Kok-Borok</option>
          <option value="37">Singpho</option>
        </select>
      </div>
      <input id="q" type="search" placeholder="Type a word…" autocomplete="off" />
      <button type="button" id="go">Search</button>
    </section>
    <section id="status" class="status" aria-live="polite"></section>
    <section id="results" class="results"></section>
  </main>

  <footer class="site-footer">
    <nav class="footer-nav">
      <a href="index.html">Search</a>
      <a href="about.html">About</a>
    </nav>
  </footer>

  <script src="dict.js"></script>
</body>
</html>
