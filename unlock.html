<!DOCTYPE html>
<!--
  Hub phone unlock page (unlock.html, site root), H142. The Hub's lock screen (desktop/desktop.html,
  hub/core/hub_lock.js) shows a QR of this page with its one-time code after the '#': unlock.html#hublock-<16 hex>.
  Type the 4-digit PIN here; it goes straight to that computer over a PeerJS data connection
  (shared/vendor/peerjs.min.js; the free PeerJS server only introduces the two devices). Logic: hub/core/hub_unlock.js.
  Each code takes one try: after a wrong PIN, scan the new QR on the computer.
  H143: with a fingerprint method the page also offers "Unlock with fingerprint" (a passkey on this phone,
  navigator.credentials.get); unlock.html#r:hublock-<16 hex> (Settings › Screen lock › Add phone) registers one.
  Passkeys belong to this address (rp.id = its hostname), so the fingerprint works only on the github.io Hub.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Unlock Hub</title>
  <meta name="theme-color" content="#0B1033" />
  <link rel="icon" href="shared/image/hub_icon_192.png" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      background: #080b14; color: #eef2f8; font: 17px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    main { width: 100%; max-width: 360px; }
    h1 { font-size: 24px; margin: 8px 0 4px; font-weight: 600; }
    .ico { font-size: 40px; }
    p { margin: 8px 0; opacity: 0.85; }
    #pin { width: 100%; box-sizing: border-box; margin: 16px 0 12px; padding: 14px; border-radius: 14px; border: 2px solid rgba(238, 242, 248, 0.35);
      background: rgba(255, 255, 255, 0.06); color: inherit; font-size: 32px; letter-spacing: 0.5em; text-align: center; }
    #pin:focus { outline: none; border-color: #70b8ff; }
    #go { width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: #70b8ff; color: #0b0d12; font-size: 18px; font-weight: 700; cursor: pointer; }
    #go:disabled, #fp:disabled { opacity: 0.45; cursor: default; }
    #fp { width: 100%; min-height: 54px; margin: 16px 0 4px; border: 0; border-radius: 14px; background: #34d399; color: #0b0d12; font-size: 18px; font-weight: 700; cursor: pointer; }
    [hidden] { display: none !important; }
    #msg { min-height: 2.8em; font-weight: 600; }
    #msg.ok { color: #34d399; } #msg.bad { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <div class="ico" aria-hidden="true">&#128274;</div>
    <h1 id="title">Unlock Hub</h1>
    <p id="lead">Type your 4-digit Hub PIN.</p>
    <button id="fp" type="button" hidden disabled>Unlock with fingerprint</button>
    <form id="form" autocomplete="off">
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4-digit PIN" disabled />
      <button id="go" type="submit" disabled>Unlock</button>
    </form>
    <p id="msg" role="status" aria-live="polite">Connecting to the computer&hellip;</p>
  </main>
  <script src="shared/vendor/peerjs.min.js"></script>
  <script src="hub/core/hub_lock_core.js"></script>
  <script src="hub/core/hub_unlock.js"></script>
</body>
</html>
