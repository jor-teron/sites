<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #111; }
  .grid {
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    padding: 8px;
  }
  a {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #1e1e1e;
    color: #eee;
    text-decoration: none;
    border-radius: 12px;
    font: 15px/1.2 system-ui, sans-serif;
    border: 1px solid #2a2a2a;
  }
  a:hover { background: #2a2a2a; }
  .icon { font-size: 2.2rem; }
</style>
</head>
<body>
<div class="grid">
  <a href="https://www.google.com" target="_blank" rel="noopener"><span class="icon">🔍</span>Search</a>
  <a href="https://www.google.com" target="_blank" rel="noopener"><span class="icon">🗺️</span>Maps</a>
  <a href="https://www.google.com" target="_blank" rel="noopener"><span class="icon">▶️</span>YouTube</a>
  <a href="https://www.google.com" target="_blank" rel="noopener"><span class="icon">✉️</span>Gmail</a>
  <a href="https://www.google.com" target="_blank" rel="noopener"><span class="icon">📁</span>Drive</a>
  <a href="https://www.google.com" target="_blank" rel="noopener"><span class="icon">📰</span>News</a>
  <a href="https://www.google.com" target="_blank" rel="noopener"><span class="icon">🌐</span>Translate</a>
  <a href="https://www.google.com" target="_blank" rel="noopener"><span class="icon">🖼️</span>Images</a>
  <a href="https://www.google.com" target="_blank" rel="noopener"><span class="icon">📅</span>Calendar</a>
</div>
</body>
</html>
