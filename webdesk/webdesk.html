<!DOCTYPE html>
<!--
  WebDesk — desktop-style bookmark page
  Date: 2026-09-20
  Files: webdesk.html / webdesk.css / webdesk.js
  Data: desktop_icons.csv, apps.csv, wallpaper.csv, hash.txt
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDesk</title>
  <link rel="stylesheet" href="webdesk.css">
</head>
<body>
  <!-- PIN lock overlay -->
  <div id="overlay">
    <div class="login-box">
      <h2>WebDesk</h2>
      <input type="password" id="pin" placeholder="PIN" maxlength="16" autofocus>
      <label class="show-pin"><input type="checkbox" id="show-pin"> Show PIN</label>
      <p id="pin-error" hidden>Wrong PIN</p>
      <button id="unlock">Unlock</button>
    </div>
  </div>

  <!-- Desktop surface: clock, icons, dustbin -->
  <div id="desktop">
    <div id="analog-clock" aria-hidden="true">
      <div class="hand hour"></div>
      <div class="hand minute"></div>
      <div class="hand second"></div>
      <div class="cap"></div>
    </div>
    <div id="desktop-icons"></div>
    <div id="dustbin" title="Dustbin">
      <img alt="" src="https://www.google.com/s2/favicons?domain=example.com&sz=64">
      <span>Dustbin</span>
    </div>
  </div>

  <!-- Start menu: groups | apps or wallpapers -->
  <div id="start-menu" hidden>
    <div id="start-groups"></div>
    <div id="start-apps"></div>
  </div>

  <!-- Taskbar: Start, search, pins, tray -->
  <footer id="taskbar">
    <button id="start-btn" type="button">Start</button>
    <input id="search" type="search" placeholder="Search">
    <select id="search-type" title="Search type">
      <option value="web" selected>Web</option>
      <option value="images">Images</option>
      <option value="video">Video</option>
      <option value="news">News</option>
      <option value="shop">Shopping</option>
      <option value="maps">Maps</option>
      <option value="flights">Flights</option>
      <option value="finance">Finance</option>
    </select>
    <div id="taskbar-icons"></div>
    <div id="tray">
      <button id="theme-btn" type="button" title="Theme"><span class="theme-ico">☾</span> <span class="theme-lbl">Dark</span></button>
      <span class="sep">|</span>
      <span id="tray-clock"></span>
      <span id="tray-week"></span>
      <span class="sep">|</span>
      <button id="lock-btn" type="button">LOCK</button>
    </div>
  </footer>

  <script src="webdesk.js"></script>
</body>
</html>
