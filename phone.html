<!DOCTYPE html>
<!--
  Phone launcher, release PH1 — a phone-style home screen for an Android WebView (Jor's home screen).
  Real page is /phone.html (H79: moved to the site root next to hub.html); phone/index.html only redirects here
  (keeps ?query and #hash). (PH1 … PH13: "No ?v= labels"; PH14 adds ?v=PH14 to the phone files it changed.)
  H79: loads the Hub link stack so window.HubMeshLink exists and this device joins the public 00000 lobby, like hub.html.
  PH14: the separate link / mesh tags (link_core, link_devices, hub_mesh, hub_meshlink, hub_line, hub_trust) are
  replaced by ONE hub/core/hub_core.js (H127: parts boot + link + mesh, parser-blocking, same globals). Only the core
  and shared/ scripts load here, no desktop-shell file (hub.html's hub/controller, hub_remote.js, hub_panels.js, Game
  Bar). phone/phone_connect.js = the Connect sheet + #net-dot (host / join / Disconnect, re-implemented for the phone).
  Fully gesture driven: swipe left/right = home pages, swipe up = app drawer, swipe down = quick panel,
  long-press an app = menu, left-edge swipe or Back (history) = close. html/body stay TRANSPARENT so the
  Android wallpaper shows through; #wall is an optional test wallpaper (Settings or ?bg=).
  Reads the app list from hub/core/hub_appindex.js + hub_config.js (READ ONLY, generated by the Hub).
  Files (in phone/): phone.css, phone_save.js (the one save module), phone_apps.js (catalog), phone_gesture.js
  (pointer swipes / long-press / own scrolling), phone_app.js (UI). Plain JS, no libraries. README.md.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#000000">
  <!-- <title>Phone PH1</title>   (PH1 … PH13; phone_app.js sets the live title) -->
  <title>Phone PH14</title>
  <link rel="icon" href="favicon.ico">
  <!-- <link rel="stylesheet" href="phone/phone.css">   (before PH14) -->
  <link rel="stylesheet" href="phone/phone.css?v=PH14">
<link rel="stylesheet" href="shared/dialog/dialog.css"><!-- H81 -->
  <script>try{var s=JSON.parse(localStorage.getItem('phone-launcher-v1')||'{}'),m=(s.settings&&s.settings.th80&&s.settings.theme)||'system',t=localStorage.getItem('sites-hub.theme');if(m==='dark'||(m==='system'&&(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))))document.documentElement.classList.add('dark')}catch(e){document.documentElement.classList.add('dark')}try{var a=localStorage.getItem('sites-hub.accent');if(/^#[0-9a-f]{6}$/i.test(a||''))document.documentElement.style.setProperty('--acc',a)}catch(e){}</script>
</head>
<body>
<div id="wall" hidden></div>
<!-- PH14: network status dot (grey offline · blue public 00000 · green private) + other-device count; tap = Connect.
     Outside #home so the home gestures don't catch it. -->
<button id="net-dot" type="button" data-st="off" aria-label="Connect"><span class="nd-c" aria-hidden="true"></span><span class="nd-n"></span></button>

<main id="home" aria-label="Home">
  <div id="pages-vp">
    <div id="pages"></div>
  </div>
  <div id="dots" role="tablist" aria-label="Home pages"></div>
  <div id="dock-wrap">
    <div id="dock-handle" aria-hidden="true"></div>
    <nav id="dock" aria-label="Dock"></nav>
  </div>
</main>

<section id="drawer" class="layer" aria-label="Apps" aria-hidden="true">
  <div id="drawer-head">
    <div class="grab" aria-hidden="true"></div>
    <input id="search" type="search" placeholder="Search apps" autocomplete="off" spellcheck="false" aria-label="Search apps">
    <div id="tabs" role="tablist" aria-label="Categories"></div>
  </div>
  <div id="list-vp"><div id="list" role="list"></div></div>
</section>

<section id="panel" class="layer" aria-label="Quick panel" aria-hidden="true">
  <div id="panel-box">
    <div id="panel-clock"></div>
    <div id="tiles"></div>
    <h3>Notices</h3>
    <ul id="notices"></ul>
    <div class="grab" aria-hidden="true"></div>
  </div>
  <div id="panel-shade"></div>
</section>

<section id="apps" class="layer" aria-label="Open app" aria-hidden="true">
  <div id="frames"></div>
  <div id="edge" aria-hidden="true"></div>
  <div id="edge-arrow" aria-hidden="true">‹</div>
</section>

<section id="sheet" class="layer" aria-hidden="true">
  <div id="sheet-shade"></div>
  <div id="sheet-box" role="dialog" aria-modal="true"></div>
</section>

<div id="dialog" hidden><div class="box" role="alertdialog" aria-modal="true"><p id="dialog-msg"></p><div class="row" id="dialog-row"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="hub/core/hub_config.js"></script>
<script src="hub/core/hub_appindex.js"></script>
<!-- H79: Hub link stack (DOM-free), same order as hub.html; no private Mesh at startup (H73)   (H79 … PH13)
<script src="shared/link/link_core.js"></script>
<script src="shared/link/link_devices.js"></script>
<script src="shared/link/hub_mesh.js"></script>
<script src="hub/link/hub_meshlink.js"></script> -->
<!-- H81: Hub dialogs (app frames ask this page to draw UiDialog; bridge sets window.__hubDialogHost) and notices -->
<script src="shared/dialog/dialog.js"></script>
<script src="hub/core/hub_dialog_bridge.js"></script>
<script src="hub/core/hub_dnd.js"></script><!-- H82 -->
<script src="phone/phone_notify.js"></script>
<script src="hub/core/hub_attention.js"></script><!-- H82 -->
<!-- PH14: the whole Hub core (boot + link + mesh, incl. hub_line H91 and hub_trust H97) in one tag, after the dialogs
     and notices like hub.html (link part after the notifications). Every global exists for the next tag. -->
<script src="hub/core/hub_core.js"></script>
<script src="phone/phone_save.js"></script>
<script src="phone/phone_apps.js"></script>
<script src="phone/phone_gesture.js"></script>
<!-- <script src="phone/phone_app.js"></script>   (before PH14) -->
<script src="phone/phone_app.js?v=PH14"></script>
<script src="phone/phone_connect.js?v=PH14"></script><!-- PH14: Connect sheet + status dot (waits for HubCore.ready) -->
<!-- <script src="hub/link/hub_line.js"></script>   H91: Hub Line   (before PH14; now in hub_core.js part 'mesh')
<script src="hub/link/hub_trust.js"></script>   H97: HubTrust   (before PH14; now in hub_core.js part 'mesh') -->
</body>
</html>
