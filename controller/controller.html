<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07080b" />
  <title>Gamepad Controller</title>
  <link rel="icon" href="controller_icon.png" />
  <link rel="stylesheet" href="controller.css?v=1.2" />
  <script src="../vendor/peerjs.min.js"></script>
</head>
<body class="theme-dark-gloss mode-both">
  <div id="rotate-overlay" hidden>
    <div class="rotate-msg">
      <div class="rotate-icon" aria-hidden="true">⟳</div>
      <p data-text="rotate">Rotate your phone to landscape</p>
    </div>
  </div>

  <div id="pair-screen" hidden>
    <div class="pair-card">
      <div class="pair-head">
        <span class="led led-pair disconnected" id="pair-led" aria-hidden="true"></span>
        <h1 data-text="title">Gamepad</h1>
      </div>
      <p class="hint" data-text="hint">Enter the pairing code shown on the hub</p>
      <input id="code-input" type="text" maxlength="8" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" />
      <div class="pair-actions">
        <button type="button" id="connect-btn" class="gloss-btn" data-text="connectBtn">Connect</button>
        <button type="button" id="scan-btn" class="gloss-btn scan-btn" aria-label="Scan QR">
          <img class="qr-icon" alt="" data-qr-icon /><span data-text="scanBtn">Scan QR</span>
        </button>
      </div>
      <p id="pair-error" class="error" hidden></p>
      <p class="version" id="version"></p>
    </div>
  </div>

  <div id="pad" hidden>
    <button type="button" class="shoulder l" data-btn="l" aria-label="L"><span>L</span></button>
    <button type="button" class="shoulder r" data-btn="r" aria-label="R"><span>R</span></button>

    <div class="left-zone" id="left-zone">
      <div class="stick-base" id="stick-base" aria-hidden="true">
        <div class="stick-knob" id="stick-knob"></div>
      </div>
      <div class="dpad" id="dpad" aria-label="D-pad">
        <div class="dpad-arm vert" aria-hidden="true"></div>
        <div class="dpad-arm horiz" aria-hidden="true"></div>
        <span class="dir up" data-btn="up" aria-label="Up"></span>
        <span class="dir left" data-btn="left" aria-label="Left"></span>
        <span class="dir right" data-btn="right" aria-label="Right"></span>
        <span class="dir down" data-btn="down" aria-label="Down"></span>
        <span class="dpad-hub" aria-hidden="true"></span>
      </div>
    </div>

    <div class="center-cluster">
      <div class="top-row">
        <button type="button" class="led" id="led" aria-label="Connection light"></button>
        <button type="button" class="qr-btn" id="qr-btn" aria-label="Scan QR"><img class="qr-icon" alt="" data-qr-icon /></button>
      </div>
      <div class="sys-row">
        <button type="button" class="sys select" data-btn="select" aria-label="Select"><span class="glyph-select" aria-hidden="true"></span></button>
        <button type="button" class="home" data-btn="home" aria-label="Home"><span class="home-glyph">⌂</span></button>
        <button type="button" class="sys start" data-btn="start" aria-label="Start"><span class="glyph-start" aria-hidden="true"></span></button>
      </div>
      <div class="sys-labels" aria-hidden="true">
        <span data-text="select">SELECT</span><span></span><span data-text="start">START</span>
      </div>
      <div class="toggles">
        <button type="button" class="chip" id="mode-toggle"></button>
        <button type="button" class="chip" id="haptics-toggle"></button>
      </div>
      <div class="demo-tag" id="demo-tag" hidden data-text="demo">DEMO</div>
    </div>

    <div class="right-zone">
      <div class="face-diamond">
        <button type="button" class="face y" data-btn="y" aria-label="Y"><span>Y</span></button>
        <button type="button" class="face x" data-btn="x" aria-label="X"><span>X</span></button>
        <button type="button" class="face b" data-btn="b" aria-label="B"><span>B</span></button>
        <button type="button" class="face a" data-btn="a" aria-label="A"><span>A</span></button>
      </div>
    </div>
  </div>

  <!-- QR scanner overlay (camera) -->
  <div id="scan-overlay" hidden>
    <video id="scan-video" playsinline muted autoplay></video>
    <canvas id="scan-canvas" hidden></canvas>
    <div class="scan-frame" aria-hidden="true"></div>
    <div class="scan-ui">
      <p class="scan-title" data-text="scanTitle">Scan the QR code on the hub</p>
      <p class="scan-status" id="scan-status"></p>
      <div class="scan-actions">
        <button type="button" id="scan-cancel" class="gloss-btn" data-text="scanCancel">Cancel</button>
        <button type="button" id="scan-type" class="gloss-btn" data-text="scanTypeCode">Type code</button>
      </div>
    </div>
  </div>

  <script src="vendor/jsQR.js"></script>
  <script src="controller_config.js?v=1.2"></script>
  <script src="controller_logic.js?v=1.2"></script>
</body>
</html>
