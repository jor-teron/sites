<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    TV Player v1
    One-page IPTV player based on tv-v2, with in-place category playlists
    (Hub link + Kids / More / India). Edit PLAYLISTS at the top of tv-v1.js.
    Video layout follows tv-v3 (contain + centered). No Android app intents.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Player v1</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <link rel="stylesheet" href="tv-v1.css">
  <style>
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="player-area">
      <video id="video" autoplay playsinline></video>
      <div class="overlay-msg" id="overlay">Loading...</div>
    </div>
    <div class="channel-list hidden" id="channel-list"></div>
  </div>

  <script src="tv-v1.js"></script>
</body>
</html>
