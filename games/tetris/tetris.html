<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris B/W</title>
  <style>
    /* Page: arcade cabinet look, black field, white type */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    #wrap {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    canvas {
      background: #000;
      border: 2px solid #fff;
      image-rendering: pixelated;
    }
    #side {
      min-width: 140px;
      font-size: 14px;
      line-height: 1.5;
    }
    #side h1 {
      margin: 0 0 12px;
      font-size: 22px;
      letter-spacing: 2px;
    }
    #nextBox {
      border: 1px solid #fff;
      width: 96px;
      height: 96px;
      margin: 6px 0 16px;
    }
    kbd {
      border: 1px solid #fff;
      padding: 0 4px;
      font-size: 12px;
    }
    .muted { color: #aaa; font-size: 12px; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="240" height="480"></canvas>
    <div id="side">
      <h1>TETRIS</h1>
      <div>SCORE<br /><strong id="score">0</strong></div>
      <div>LINES<br /><strong id="lines">0</strong></div>
      <div>LEVEL<br /><strong id="level">1</strong></div>
      <div>NEXT</div>
      <canvas id="nextBox" width="96" height="96"></canvas>
      <div class="muted">
        <kbd>←</kbd> <kbd>→</kbd> move<br />
        <kbd>↑</kbd> / <kbd>X</kbd> rotate<br />
        <kbd>↓</kbd> soft drop<br />
        <kbd>SPACE</kbd> hard drop<br />
        <kbd>P</kbd> pause<br />
        <kbd>R</kbd> restart
      </div>
      <p id="status" class="muted"></p>
    </div>
  </div>

<script>
/* =============================================================================
 * BASIC ARCADE TETRIS — black / white theme
 * Single-file HTML5 Canvas + vanilla JS.
 * Grid: 10 columns x 20 visible rows.
 * Pieces: I O T S Z J L (classic tetrominoes).
 * Controls: arrows, X rotate, space hard drop, P pause, R restart.
 * ============================================================================= */

/* --- Board size and drawing scale --- */
/* Number of columns in the well. Classic Tetris uses 10. */
var COLS = 10;
/* Visible rows. Classic Tetris uses 20. */
var ROWS = 20;
/* Pixel size of one cell on the main canvas. 24 * 10 = 240 wide. */
var CELL = 24;

/* --- Theme colors (B/W only) --- */
/* Empty cell / page background. */
var COLOR_BG = "#000000";
/* Locked and falling blocks. */
var COLOR_BLOCK = "#ffffff";
/* Ghost piece (landing preview). */
var COLOR_GHOST = "#555555";
/* Grid lines. */
var COLOR_GRID = "#222222";

/* --- Timing --- */
/* Base fall interval in milliseconds at level 1. */
var BASE_MS = 800;
/* Soft-drop interval while holding down. */
var SOFT_MS = 50;
/* How much faster each level is (ms subtracted, floored). */
var LEVEL_STEP_MS = 70;
/* Fastest fall interval so the game stays playable. */
var MIN_MS = 80;

/* --- Piece shapes --- */
/* Each piece is a list of rotation states.
 * A state is a list of [x, y] cells relative to a pivot.
 * Coordinates are in grid units. */
var SHAPES = {
  /* I: long bar. 4 rotations around a 4-wide box. */
  I: [
    [[0, 1], [1, 1], [2, 1], [3, 1]],
    [[2, 0], [2, 1], [2, 2], [2, 3]],
    [[0, 2], [1, 2], [2, 2], [3, 2]],
    [[1, 0], [1, 1], [1, 2], [1, 3]]
  ],
  /* O: 2x2 square. Same in every rotation. */
  O: [
    [[1, 0], [2, 0], [1, 1], [2, 1]],
    [[1, 0], [2, 0], [1, 1], [2, 1]],
    [[1, 0], [2, 0], [1, 1], [2, 1]],
    [[1, 0], [2, 0], [1, 1], [2, 1]]
  ],
  /* T: three across plus one in the middle. */
  T: [
    [[1, 0], [0, 1], [1, 1], [2, 1]],
    [[1, 0], [1, 1], [2, 1], [1, 2]],
    [[0, 1], [1, 1], [2, 1], [1, 2]],
    [[1, 0], [0, 1], [1, 1], [1, 2]]
  ],
  /* S: right snake. Mirror of Z. */
  S: [
    [[1, 0], [2, 0], [0, 1], [1, 1]],
    [[1, 0], [1, 1], [2, 1], [2, 2]],
    [[1, 1], [2, 1], [0, 2], [1, 2]],
    [[0, 0], [0, 1], [1, 1], [1, 2]]
  ],
  /* Z: left snake. Mirror of S. */
  Z: [
    [[0, 0], [1, 0], [1, 1], [2, 1]],
    [[2, 0], [1, 1], [2, 1], [1, 2]],
    [[0, 1], [1, 1], [1, 2], [2, 2]],
    [[1, 0], [0, 1], [1, 1], [0, 2]]
  ],
  /* J: L mirrored — stem plus foot on the left. */
  J: [
    [[0, 0], [0, 1], [1, 1], [2, 1]],
    [[1, 0], [2, 0], [1, 1], [1, 2]],
    [[0, 1], [1, 1], [2, 1], [2, 2]],
    [[1, 0], [1, 1], [0, 2], [1, 2]]
  ],
  /* L: stem plus foot on the right. Mirror of J. */
  L: [
    [[2, 0], [0, 1], [1, 1], [2, 1]],
    [[1, 0], [1, 1], [1, 2], [2, 2]],
    [[0, 1], [1, 1], [2, 1], [0, 2]],
    [[0, 0], [1, 0], [1, 1], [1, 2]]
  ]
};

/* Names used when picking a random piece. */
var PIECE_NAMES = ["I", "O", "T", "S", "Z", "J", "L"];

/* Simple wall-kick offsets tried after a rotate fails in place.
 * Order: stay, left, right, up (floor kick). */
var KICKS = [[0, 0], [-1, 0], [1, 0], [0, -1], [-2, 0], [2, 0]];

/* --- DOM handles --- */
/* Main playfield canvas. */
var canvas = document.getElementById("game");
/* 2D drawing context for the well. */
var ctx = canvas.getContext("2d");
/* Small canvas that shows the next piece. */
var nextCanvas = document.getElementById("nextBox");
/* 2D context for the next-piece box. */
var nctx = nextCanvas.getContext("2d");
/* Score label. */
var elScore = document.getElementById("score");
/* Lines-cleared label. */
var elLines = document.getElementById("lines");
/* Level label. */
var elLevel = document.getElementById("level");
/* Status text (PAUSE / GAME OVER). */
var elStatus = document.getElementById("status");

/* --- Game state --- */
/* 2D array ROWS x COLS. 0 empty, 1 filled. */
var board = [];
/* Current falling piece object, or null. */
var current = null;
/* Next piece waiting in the sidebar. */
var nextPiece = null;
/* Player score. */
var score = 0;
/* Total lines cleared this game. */
var lines = 0;
/* Current level (starts at 1). */
var level = 1;
/* True when the stack reached the spawn. */
var gameOver = false;
/* True when the player paused. */
var paused = false;
/* Timestamp of last gravity tick. */
var lastTick = 0;
/* True while the down arrow is held. */
var softDrop = false;
/* Bag used so pieces feel fair (7-bag). */
var bag = [];

/* -----------------------------------------------------------------------------
 * createEmptyBoard
 * Build a fresh ROWS x COLS grid filled with 0.
 * --------------------------------------------------------------------------- */
function createEmptyBoard() {
  var rows = [];
  var r;
  var c;
  for (r = 0; r < ROWS; r++) {
    rows[r] = [];
    for (c = 0; c < COLS; c++) {
      rows[r][c] = 0;
    }
  }
  return rows;
}

/* -----------------------------------------------------------------------------
 * refillBag
 * Classic 7-bag: shuffle all 7 names, then deal them one by one.
 * --------------------------------------------------------------------------- */
function refillBag() {
  bag = PIECE_NAMES.slice();
  var i;
  var j;
  var tmp;
  for (i = bag.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    tmp = bag[i];
    bag[i] = bag[j];
    bag[j] = tmp;
  }
}

/* -----------------------------------------------------------------------------
 * takeFromBag
 * Return the next piece name. Refill the bag when empty.
 * --------------------------------------------------------------------------- */
function takeFromBag() {
  if (bag.length === 0) {
    refillBag();
  }
  return bag.pop();
}

/* -----------------------------------------------------------------------------
 * makePiece
 * Build a piece object from a name. Spawn near the top center.
 * --------------------------------------------------------------------------- */
function makePiece(name) {
  return {
    /* Which tetromino this is (I, O, T, ...). */
    name: name,
    /* Current rotation index 0..3. */
    rot: 0,
    /* Grid column of the piece origin. */
    x: 3,
    /* Grid row of the piece origin (can be 0). */
    y: 0
  };
}

/* -----------------------------------------------------------------------------
 * cellsOf
 * Return absolute [x, y] cells for a piece at a given rotation and offset.
 * --------------------------------------------------------------------------- */
function cellsOf(piece, rot, ox, oy) {
  var shape = SHAPES[piece.name][rot];
  var out = [];
  var i;
  for (i = 0; i < shape.length; i++) {
    out.push([shape[i][0] + ox, shape[i][1] + oy]);
  }
  return out;
}

/* -----------------------------------------------------------------------------
 * fits
 * True if every cell is inside the well and not on a locked block.
 * --------------------------------------------------------------------------- */
function fits(piece, rot, ox, oy) {
  var cells = cellsOf(piece, rot, ox, oy);
  var i;
  var x;
  var y;
  for (i = 0; i < cells.length; i++) {
    x = cells[i][0];
    y = cells[i][1];
    if (x < 0 || x >= COLS || y >= ROWS) {
      return false;
    }
    if (y >= 0 && board[y][x]) {
      return false;
    }
  }
  return true;
}

/* -----------------------------------------------------------------------------
 * spawn
 * Move next into current and roll a new next. End the game if spawn is blocked.
 * --------------------------------------------------------------------------- */
function spawn() {
  current = nextPiece || makePiece(takeFromBag());
  nextPiece = makePiece(takeFromBag());
  current.x = 3;
  current.y = 0;
  if (!fits(current, current.rot, current.x, current.y)) {
    gameOver = true;
    elStatus.textContent = "GAME OVER — R to restart";
  }
}

/* -----------------------------------------------------------------------------
 * lockPiece
 * Write the current piece into the board, then clear lines and spawn again.
 * --------------------------------------------------------------------------- */
function lockPiece() {
  var cells = cellsOf(current, current.rot, current.x, current.y);
  var i;
  var x;
  var y;
  for (i = 0; i < cells.length; i++) {
    x = cells[i][0];
    y = cells[i][1];
    if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
      board[y][x] = 1;
    }
  }
  clearLines();
  spawn();
}

/* -----------------------------------------------------------------------------
 * clearLines
 * Remove every full row, drop the stack, add score.
 * --------------------------------------------------------------------------- */
function clearLines() {
  var cleared = 0;
  var r;
  var c;
  var full;
  for (r = ROWS - 1; r >= 0; r--) {
    full = true;
    for (c = 0; c < COLS; c++) {
      if (!board[r][c]) {
        full = false;
        break;
      }
    }
    if (full) {
      board.splice(r, 1);
      board.unshift(emptyRow());
      cleared += 1;
      r += 1;
    }
  }
  if (cleared > 0) {
    /* Classic-ish points: 1/2/3/4 lines. */
    var table = [0, 100, 300, 500, 800];
    score += table[cleared] * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    updateHud();
  }
}

/* -----------------------------------------------------------------------------
 * emptyRow
 * One new empty row used when a line is cleared.
 * --------------------------------------------------------------------------- */
function emptyRow() {
  var row = [];
  var c;
  for (c = 0; c < COLS; c++) {
    row[c] = 0;
  }
  return row;
}

/* -----------------------------------------------------------------------------
 * tryMove
 * Shift the current piece by dx, dy. Return true if it moved.
 * --------------------------------------------------------------------------- */
function tryMove(dx, dy) {
  if (!current || gameOver || paused) {
    return false;
  }
  if (fits(current, current.rot, current.x + dx, current.y + dy)) {
    current.x += dx;
    current.y += dy;
    return true;
  }
  return false;
}

/* -----------------------------------------------------------------------------
 * tryRotate
 * Rotate clockwise. Try a few wall kicks if the new pose overlaps a wall.
 * --------------------------------------------------------------------------- */
function tryRotate() {
  if (!current || gameOver || paused) {
    return;
  }
  var nextRot = (current.rot + 1) % 4;
  var k;
  var dx;
  var dy;
  for (k = 0; k < KICKS.length; k++) {
    dx = KICKS[k][0];
    dy = KICKS[k][1];
    if (fits(current, nextRot, current.x + dx, current.y + dy)) {
      current.rot = nextRot;
      current.x += dx;
      current.y += dy;
      return;
    }
  }
}

/* -----------------------------------------------------------------------------
 * hardDrop
 * Slam the piece to the floor and lock it. Award 2 points per cell dropped.
 * --------------------------------------------------------------------------- */
function hardDrop() {
  if (!current || gameOver || paused) {
    return;
  }
  var dist = 0;
  while (tryMove(0, 1)) {
    dist += 1;
  }
  score += dist * 2;
  updateHud();
  lockPiece();
}

/* -----------------------------------------------------------------------------
 * ghostY
 * Lowest row the current piece can sit without colliding (for the ghost).
 * --------------------------------------------------------------------------- */
function ghostY() {
  var y = current.y;
  while (fits(current, current.rot, current.x, y + 1)) {
    y += 1;
  }
  return y;
}

/* -----------------------------------------------------------------------------
 * fallInterval
 * Gravity delay for the current level (or soft-drop speed).
 * --------------------------------------------------------------------------- */
function fallInterval() {
  if (softDrop) {
    return SOFT_MS;
  }
  var ms = BASE_MS - (level - 1) * LEVEL_STEP_MS;
  if (ms < MIN_MS) {
    ms = MIN_MS;
  }
  return ms;
}

/* -----------------------------------------------------------------------------
 * updateHud
 * Push score / lines / level into the sidebar.
 * --------------------------------------------------------------------------- */
function updateHud() {
  elScore.textContent = String(score);
  elLines.textContent = String(lines);
  elLevel.textContent = String(level);
}

/* -----------------------------------------------------------------------------
 * drawCell
 * Paint one block on a given canvas context.
 * --------------------------------------------------------------------------- */
function drawCell(context, x, y, color, size) {
  context.fillStyle = color;
  context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
}

/* -----------------------------------------------------------------------------
 * drawBoard
 * Clear the well, draw grid, locked blocks, ghost, and falling piece.
 * --------------------------------------------------------------------------- */
function drawBoard() {
  var r;
  var c;
  var cells;
  var i;
  var gy;

  ctx.fillStyle = COLOR_BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  /* Grid */
  ctx.strokeStyle = COLOR_GRID;
  ctx.lineWidth = 1;
  for (c = 0; c <= COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * CELL + 0.5, 0);
    ctx.lineTo(c * CELL + 0.5, ROWS * CELL);
    ctx.stroke();
  }
  for (r = 0; r <= ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * CELL + 0.5);
    ctx.lineTo(COLS * CELL, r * CELL + 0.5);
    ctx.stroke();
  }

  /* Locked stack */
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      if (board[r][c]) {
        drawCell(ctx, c, r, COLOR_BLOCK, CELL);
      }
    }
  }

  if (!current) {
    return;
  }

  /* Ghost */
  gy = ghostY();
  cells = cellsOf(current, current.rot, current.x, gy);
  for (i = 0; i < cells.length; i++) {
    if (cells[i][1] >= 0) {
      drawCell(ctx, cells[i][0], cells[i][1], COLOR_GHOST, CELL);
    }
  }

  /* Active piece */
  cells = cellsOf(current, current.rot, current.x, current.y);
  for (i = 0; i < cells.length; i++) {
    if (cells[i][1] >= 0) {
      drawCell(ctx, cells[i][0], cells[i][1], COLOR_BLOCK, CELL);
    }
  }
}

/* -----------------------------------------------------------------------------
 * drawNext
 * Draw the queued piece in the small sidebar canvas.
 * --------------------------------------------------------------------------- */
function drawNext() {
  var cells;
  var i;
  var minX = 99;
  var minY = 99;
  var maxX = -99;
  var maxY = -99;
  var size = 20;
  var ox;
  var oy;

  nctx.fillStyle = COLOR_BG;
  nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

  if (!nextPiece) {
    return;
  }

  cells = cellsOf(nextPiece, 0, 0, 0);
  for (i = 0; i < cells.length; i++) {
    if (cells[i][0] < minX) minX = cells[i][0];
    if (cells[i][1] < minY) minY = cells[i][1];
    if (cells[i][0] > maxX) maxX = cells[i][0];
    if (cells[i][1] > maxY) maxY = cells[i][1];
  }
  ox = Math.floor((nextCanvas.width / size - (maxX - minX + 1)) / 2) - minX;
  oy = Math.floor((nextCanvas.height / size - (maxY - minY + 1)) / 2) - minY;
  for (i = 0; i < cells.length; i++) {
    drawCell(nctx, cells[i][0] + ox, cells[i][1] + oy, COLOR_BLOCK, size);
  }
}

/* -----------------------------------------------------------------------------
 * tick
 * Main loop: gravity, then redraw.
 * --------------------------------------------------------------------------- */
function tick(now) {
  if (!lastTick) {
    lastTick = now;
  }
  if (!gameOver && !paused) {
    if (now - lastTick >= fallInterval()) {
      lastTick = now;
      if (!tryMove(0, 1)) {
        lockPiece();
      } else if (softDrop) {
        score += 1;
        updateHud();
      }
    }
  }
  drawBoard();
  drawNext();
  requestAnimationFrame(tick);
}

/* -----------------------------------------------------------------------------
 * resetGame
 * Wipe state and start a new game.
 * --------------------------------------------------------------------------- */
function resetGame() {
  board = createEmptyBoard();
  score = 0;
  lines = 0;
  level = 1;
  gameOver = false;
  paused = false;
  softDrop = false;
  bag = [];
  lastTick = 0;
  nextPiece = makePiece(takeFromBag());
  elStatus.textContent = "";
  updateHud();
  spawn();
}

/* -----------------------------------------------------------------------------
 * onKeyDown
 * Handle movement, rotate, drop, pause, restart.
 * --------------------------------------------------------------------------- */
function onKeyDown(e) {
  var key = e.key;
  if (key === "r" || key === "R") {
    resetGame();
    e.preventDefault();
    return;
  }
  if (key === "p" || key === "P") {
    if (!gameOver) {
      paused = !paused;
      elStatus.textContent = paused ? "PAUSED" : "";
    }
    e.preventDefault();
    return;
  }
  if (gameOver || paused) {
    return;
  }
  if (key === "ArrowLeft") {
    tryMove(-1, 0);
    e.preventDefault();
  } else if (key === "ArrowRight") {
    tryMove(1, 0);
    e.preventDefault();
  } else if (key === "ArrowDown") {
    softDrop = true;
    e.preventDefault();
  } else if (key === "ArrowUp" || key === "x" || key === "X") {
    tryRotate();
    e.preventDefault();
  } else if (key === " ") {
    hardDrop();
    e.preventDefault();
  }
}

/* -----------------------------------------------------------------------------
 * onKeyUp
 * Stop soft drop when the down key is released.
 * --------------------------------------------------------------------------- */
function onKeyUp(e) {
  if (e.key === "ArrowDown") {
    softDrop = false;
  }
}

/* --- Wire events and start --- */
document.addEventListener("keydown", onKeyDown);
document.addEventListener("keyup", onKeyUp);
resetGame();
requestAnimationFrame(tick);
</script>
</body>
</html>
