<!DOCTYPE html>
<!--
  AR Theme Game
  Phone camera + Three.js overlay, optional WebXR immersive-ar.
  Default theme: Pet (multi-pet picker). DLC: Zombie / Ghost.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AR Theme Game</title>
  <link rel="stylesheet" href="ar-game.css?v=20260928m" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="ui-root">
    <!-- Live rear camera (hidden during WebXR AR — XR provides passthrough) -->
    <video id="camera" playsinline autoplay muted></video>

    <!-- Three.js overlay (also used as the XR canvas) -->
    <canvas id="view"></canvas>

    <div id="msg">Allow camera to play</div>

    <!-- Ghost chase: edge arrow toward an off-screen ghost -->
    <div id="ghost-arrow" hidden aria-hidden="true"></div>

    <!-- Controls live in a TOP toolbar: the top edge is never cut off by the
         mobile URL bar, the Android nav bar, or a 100vh hub iframe. -->
    <div id="topbar">
      <div id="hud">
        <span>Theme: <strong id="theme-name">Pet</strong></span>
        <span>Score: <strong id="score">0</strong></span>
      </div>

      <div id="themes">
        <button type="button" data-theme="pet" class="active">Pet</button>
        <button type="button" data-theme="zombie">Zombie</button>
        <button type="button" data-theme="ghost">Ghost</button>
        <button type="button" id="ar-btn" hidden>Enter AR</button>
      </div>

      <div id="pet-picker" hidden>
        <button type="button" data-pet="dog">Dog</button>
        <button type="button" data-pet="cat">Cat</button>
        <button type="button" data-pet="chicken">Chicken</button>
        <button type="button" data-pet="bunny">Bunny</button>
        <button type="button" data-pet="ours" class="active">Ours</button>
      </div>
    </div>
  </div>

  <script type="module" src="ar-game_logic.js"></script>
</body>
</html>
