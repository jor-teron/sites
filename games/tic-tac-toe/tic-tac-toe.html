<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tic-tac-toe</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --x-color: #3b82f6;
            --o-color: #ef4444;
            --accent: #10b981;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 90vmin;
            height: 90vmin;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 2rem;
        }

        .header {
            text-align: center;
        }

        .title {
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .status {
            font-size: clamp(0.875rem, 2.5vw, 1.25rem);
            color: var(--text-secondary);
            height: 1.5em;
            min-height: 1.5em;
        }

        .status.x-turn {
            color: var(--x-color);
        }

        .status.o-turn {
            color: var(--o-color);
        }

        .status.winner {
            color: var(--accent);
            font-weight: 600;
        }

        .board-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75vmin;
            aspect-ratio: 1;
            width: 100%;
            max-width: 100%;
        }

        .cell {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 12vw, 5rem);
            font-weight: 700;
            transition: all 0.2s ease;
            user-select: none;
        }

        .cell:hover:not(.filled) {
            background: var(--border);
            transform: scale(1.05);
        }

        .cell.filled {
            cursor: default;
        }

        .cell.x {
            color: var(--x-color);
        }

        .cell.o {
            color: var(--o-color);
        }

        .cell.winner {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--accent);
            box-shadow: 0 0 0.5rem rgba(16, 185, 129, 0.3);
        }

        .footer {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }

        .reset-btn {
            padding: 0.75rem 1.5rem;
            font-size: clamp(0.875rem, 2vw, 1rem);
            font-weight: 600;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: -0.01em;
        }

        .reset-btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        @media (prefers-reduced-motion: reduce) {
            .cell,
            .reset-btn {
                transition: none;
                transform: none !important;
            }
        }

        @media (max-width: 600px) {
            .container {
                gap: 1.5rem;
                padding: 1rem;
            }

            .footer {
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Tic-tac-toe</h1>
            <p class="status" id="status">X's turn</p>
        </div>

        <div class="board-container">
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <div class="footer">
            <button class="reset-btn" id="resetBtn">New game</button>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const cells = document.querySelectorAll('.cell');

        let gameState = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;

        const winPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function checkWin(state, player) {
            return winPatterns.some(pattern =>
                pattern.every(index => state[index] === player)
            );
        }

        function isBoardFull(state) {
            return state.every(cell => cell !== '');
        }

        function updateStatus() {
            if (!gameActive) return;

            if (checkWin(gameState, 'X')) {
                statusEl.textContent = 'X wins!';
                statusEl.className = 'status winner';
                gameActive = false;
                highlightWinningCells('X');
            } else if (checkWin(gameState, 'O')) {
                statusEl.textContent = 'O wins!';
                statusEl.className = 'status winner';
                gameActive = false;
                highlightWinningCells('O');
            } else if (isBoardFull(gameState)) {
                statusEl.textContent = 'Draw!';
                statusEl.className = 'status winner';
                gameActive = false;
            } else {
                statusEl.textContent = `${currentPlayer}'s turn`;
                statusEl.className = `status ${currentPlayer === 'X' ? 'x-turn' : 'o-turn'}`;
            }
        }

        function highlightWinningCells(player) {
            winPatterns.forEach(pattern => {
                if (pattern.every(index => gameState[index] === player)) {
                    pattern.forEach(index => {
                        cells[index].classList.add('winner');
                    });
                }
            });
        }

        function handleCellClick(e) {
            if (!gameActive) return;

            const cell = e.target;
            const index = parseInt(cell.dataset.index);

            if (gameState[index] !== '') return;

            gameState[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add('filled', currentPlayer.toLowerCase());

            if (checkWin(gameState, currentPlayer)) {
                updateStatus();
            } else if (isBoardFull(gameState)) {
                updateStatus();
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateStatus();
            }
        }

        function resetGame() {
            gameState = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;

            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('filled', 'x', 'o', 'winner');
            });

            updateStatus();
        }

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        resetBtn.addEventListener('click', resetGame);

        updateStatus();
    </script>
</body>
</html>
