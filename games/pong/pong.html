<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <!--
    ========================================================================
    Pong — HTML + CSS + JS (split: pong.css, pong_config.js, pong_logic.js)
    Author: built for local play
    Description:
      Classic two-paddle Pong on a canvas. Left paddle is the human player
      (W / S or Arrow Up / Arrow Down). Right paddle is a lightweight AI
      that tracks the ball Y with a speed cap (not token-heavy).
      Space pauses. R restarts after a point or anytime.
    ========================================================================
  -->
  <link rel="stylesheet" href="pong.css" />
</head>
<body>
  <!-- Game title -->
  <h1>Pong</h1>

  <!-- Live score and status -->
  <div id="hud">0 — 0</div>

  <!-- Drawing surface -->
  <canvas id="court" width="800" height="480"></canvas>

  <!-- Controls reminder -->
  <div id="hint">W/S or ↑/↓ move · Space pause · R restart</div>

  <script src="pong_config.js"></script>
  <script src="pong_logic.js"></script>
</body>
</html>
