<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <!--
    ========================================================================
    Pong — HTML + CSS + JS (single file)
    Author: built for local play
    Description:
      Classic two-paddle Pong on a canvas. Left paddle is the human player
      (W / S or Arrow Up / Arrow Down). Right paddle is a lightweight AI
      that tracks the ball Y with a speed cap (not token-heavy).
      Space pauses. R restarts after a point or anytime.
    ========================================================================
  -->
  <style>
    /* Page layout: centered dark court */
    * {
      box-sizing: border-box;
    }

    /* Full-page background */
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0f14;
      color: #e8eef5;
      font-family: system-ui, sans-serif;
    }

    /* Center the game stack */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* Title above the canvas */
    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Score line */
    #hud {
      font-variant-numeric: tabular-nums;
      font-size: 1rem;
      opacity: 0.9;
    }

    /* Hint text under the court */
    #hint {
      font-size: 0.8rem;
      opacity: 0.65;
    }

    /* Canvas: the playfield */
    canvas {
      background: #111820;
      border: 2px solid #3a4a5c;
      border-radius: 4px;
      max-width: 96vw;
      height: auto;
      touch-action: none;
    }
  </style>
</head>
<body>
  <!-- Game title -->
  <h1>Pong</h1>

  <!-- Live score and status -->
  <div id="hud">0 — 0</div>

  <!-- Drawing surface -->
  <canvas id="court" width="800" height="480"></canvas>

  <!-- Controls reminder -->
  <div id="hint">W/S or ↑/↓ move · Space pause · R restart</div>

  <script>
    /*
     * ========================================================================
     * GAME SCRIPT
     * All state, drawing, input, physics, and simple AI live here.
     * ========================================================================
     */

    // --- DOM handles --------------------------------------------------------

    // Canvas element used as the court
    const canvas = document.getElementById("court");

    // 2D drawing context
    const ctx = canvas.getContext("2d");

    // Score / pause text node
    const hud = document.getElementById("hud");

    // --- Court constants ----------------------------------------------------

    // Playfield width in pixels
    const COURT_W = canvas.width;

    // Playfield height in pixels
    const COURT_H = canvas.height;

    // Paddle width in pixels
    const PADDLE_W = 12;

    // Paddle height in pixels
    const PADDLE_H = 88;

    // Distance from each side wall to a paddle
    const PADDLE_MARGIN = 24;

    // How fast the human paddle moves (pixels per frame at 60fps-ish)
    const PLAYER_SPEED = 7;

    // Max speed of the AI paddle (slightly slower than the player)
    const AI_SPEED = 5.2;

    // Ball radius in pixels
    const BALL_R = 7;

    // Starting ball speed on serve
    const BALL_SPEED = 5.4;

    // Speed added after each paddle hit
    const BALL_SPEED_BUMP = 0.28;

    // Hard cap so the ball never becomes unplayable
    const BALL_SPEED_MAX = 12;

    // --- Mutable game state -------------------------------------------------

    // Left paddle Y (top edge)
    let leftY = (COURT_H - PADDLE_H) / 2;

    // Right paddle Y (top edge)
    let rightY = (COURT_H - PADDLE_H) / 2;

    // Ball center X
    let ballX = COURT_W / 2;

    // Ball center Y
    let ballY = COURT_H / 2;

    // Ball velocity X
    let ballVX = BALL_SPEED;

    // Ball velocity Y
    let ballVY = 0;

    // Player (left) score
    let scoreL = 0;

    // AI (right) score
    let scoreR = 0;

    // True while the match is frozen
    let paused = false;

    // True after a point until serve
    let waitingServe = true;

    // Held keys map
    const keys = Object.create(null);

    // --- Input handlers -----------------------------------------------------

    /**
     * Mark a key as held when pressed.
     * Space toggles pause. R restarts the whole match.
     */
    function onKeyDown(e) {
      keys[e.key] = true;

      // Pause / unpause
      if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        paused = !paused;
        updateHud();
      }

      // Full reset
      if (e.key === "r" || e.key === "R") {
        resetMatch();
      }
    }

    /**
     * Mark a key as released.
     */
    function onKeyUp(e) {
      keys[e.key] = false;
    }

    // Bind keyboard listeners
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);

    // --- Helpers ------------------------------------------------------------

    /**
     * Clamp a number between lo and hi.
     */
    function clamp(n, lo, hi) {
      return Math.max(lo, Math.min(hi, n));
    }

    /**
     * Reset paddles and ball for a new serve.
     * dir: +1 serve toward AI, -1 serve toward player.
     */
    function serve(dir) {
      leftY = (COURT_H - PADDLE_H) / 2;
      rightY = (COURT_H - PADDLE_H) / 2;
      ballX = COURT_W / 2;
      ballY = COURT_H / 2;
      ballVX = BALL_SPEED * dir;
      ballVY = (Math.random() * 2 - 1) * 3;
      waitingServe = false;
    }

    /**
     * Zero scores and serve toward the AI.
     */
    function resetMatch() {
      scoreL = 0;
      scoreR = 0;
      paused = false;
      waitingServe = false;
      serve(1);
      updateHud();
    }

    /**
     * Refresh the HUD string (scores + pause).
     */
    function updateHud() {
      const extra = paused ? "  ·  PAUSED" : "";
      hud.textContent = scoreL + " — " + scoreR + extra;
    }

    /**
     * Axis-aligned hit test: ball circle vs paddle rectangle.
     */
    function ballHitsPaddle(px, py) {
      const nearestX = clamp(ballX, px, px + PADDLE_W);
      const nearestY = clamp(ballY, py, py + PADDLE_H);
      const dx = ballX - nearestX;
      const dy = ballY - nearestY;
      return dx * dx + dy * dy <= BALL_R * BALL_R;
    }

    /**
     * After a paddle hit, bounce X and add spin from contact point.
     */
    function bounceOffPaddle(py) {
      // Reverse horizontal direction
      ballVX = -ballVX;

      // Speed up a little, capped
      const speed = Math.min(
        Math.hypot(ballVX, ballVY) + BALL_SPEED_BUMP,
        BALL_SPEED_MAX
      );

      // Offset from paddle center: -1 top … +1 bottom
      const rel = (ballY - (py + PADDLE_H / 2)) / (PADDLE_H / 2);

      // New velocity from angle
      const angle = rel * 0.6;
      const sign = ballVX < 0 ? -1 : 1;
      ballVX = Math.cos(angle) * speed * sign;
      ballVY = Math.sin(angle) * speed;

      // Nudge out so we do not stick
      if (sign > 0) {
        ballX = PADDLE_MARGIN + PADDLE_W + BALL_R + 1;
      } else {
        ballX = COURT_W - PADDLE_MARGIN - PADDLE_W - BALL_R - 1;
      }
    }

    // --- Update loop pieces -------------------------------------------------

    /**
     * Move the left paddle from held keys.
     */
    function updatePlayer() {
      // Up
      if (keys["w"] || keys["W"] || keys["ArrowUp"]) {
        leftY -= PLAYER_SPEED;
      }
      // Down
      if (keys["s"] || keys["S"] || keys["ArrowDown"]) {
        leftY += PLAYER_SPEED;
      }
      leftY = clamp(leftY, 0, COURT_H - PADDLE_H);
    }

    /**
     * Lightweight AI: chase ball Y with a speed cap.
     * Intentionally imperfect so rallies stay playable.
     */
    function updateAI() {
      // Target is ball center minus half paddle
      const target = ballY - PADDLE_H / 2;

      // Dead zone so the paddle does not jitter
      const dead = 6;
      const delta = target - rightY;

      if (delta > dead) {
        rightY += Math.min(AI_SPEED, delta);
      } else if (delta < -dead) {
        rightY -= Math.min(AI_SPEED, -delta);
      }

      rightY = clamp(rightY, 0, COURT_H - PADDLE_H);
    }

    /**
     * Integrate ball, walls, paddles, and scoring.
     */
    function updateBall() {
      ballX += ballVX;
      ballY += ballVY;

      // Top / bottom walls
      if (ballY - BALL_R <= 0) {
        ballY = BALL_R;
        ballVY = Math.abs(ballVY);
      } else if (ballY + BALL_R >= COURT_H) {
        ballY = COURT_H - BALL_R;
        ballVY = -Math.abs(ballVY);
      }

      // Left paddle
      const leftX = PADDLE_MARGIN;
      if (ballVX < 0 && ballHitsPaddle(leftX, leftY)) {
        bounceOffPaddle(leftY);
      }

      // Right paddle
      const rightX = COURT_W - PADDLE_MARGIN - PADDLE_W;
      if (ballVX > 0 && ballHitsPaddle(rightX, rightY)) {
        bounceOffPaddle(rightY);
      }

      // Point for AI (ball past left)
      if (ballX + BALL_R < 0) {
        scoreR += 1;
        waitingServe = true;
        updateHud();
        setTimeout(function () {
          serve(1);
        }, 700);
      }

      // Point for player (ball past right)
      if (ballX - BALL_R > COURT_W) {
        scoreL += 1;
        waitingServe = true;
        updateHud();
        setTimeout(function () {
          serve(-1);
        }, 700);
      }
    }

    // --- Draw ---------------------------------------------------------------

    /**
     * Paint one frame: net, paddles, ball.
     */
    function draw() {
      // Clear court
      ctx.fillStyle = "#111820";
      ctx.fillRect(0, 0, COURT_W, COURT_H);

      // Dashed center net
      ctx.strokeStyle = "#2a3644";
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(COURT_W / 2, 0);
      ctx.lineTo(COURT_W / 2, COURT_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = "#d7e2ee";
      ctx.fillRect(PADDLE_MARGIN, leftY, PADDLE_W, PADDLE_H);
      ctx.fillRect(
        COURT_W - PADDLE_MARGIN - PADDLE_W,
        rightY,
        PADDLE_W,
        PADDLE_H
      );

      // Ball
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
      ctx.fill();
    }

    /**
     * Main loop: update then draw, forever.
     */
    function tick() {
      if (!paused && !waitingServe) {
        updatePlayer();
        updateAI();
        updateBall();
      } else if (!paused) {
        // Still allow paddle aim while waiting on serve
        updatePlayer();
      }
      draw();
      requestAnimationFrame(tick);
    }

    // --- Boot ---------------------------------------------------------------

    // First serve toward the AI
    serve(1);

    // Show initial score
    updateHud();

    // Start the animation loop
    requestAnimationFrame(tick);
  </script>
</body>
</html>
