<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Ball Blitz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Arial', sans-serif;
      color: white;
    }

    .container {
      position: relative;
      width: 800px;
      height: 600px;
      background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
      border: 4px solid #333;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: inherit;
    }

    .ui {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .score, .timer {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      border-radius: 4px;
    }

    .end-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 24px;
      z-index: 100;
    }

    .end-screen.show {
      display: flex;
    }

    .end-screen .rank {
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
    }

    .end-screen .time-display {
      font-size: 20px;
      margin: 10px 0;
      opacity: 0.8;
    }

    .end-screen .badge {
      font-size: 80px;
      margin: 20px 0;
    }

    .end-screen .restart-hint {
      font-size: 16px;
      margin-top: 30px;
      opacity: 0.7;
    }

    .controls-hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="ui">
      <div class="score">Score: <span id="scoreValue">0</span>/100</div>
      <div class="timer">Time: <span id="timerValue">0.0</span>s</div>
    </div>
    <div class="end-screen" id="endScreen">
      <div>🎉 FINISHED! 🎉</div>
      <div class="badge" id="badge">🥇</div>
      <div class="rank" id="rankText">GOLD</div>
      <div class="time-display">Time: <span id="finalTime">0.0</span>s</div>
      <div class="restart-hint">Press SPACE or A to play again</div>
    </div>
    <div class="controls-hint">
      ← → to aim | ↑ ↓ for power | SPACE to throw | R to reset
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game state
    const game = {
      score: 0,
      targetScore: 100,
      time: 0,
      startTime: null,
      isRunning: false,
      isFinished: false,
      
      // Physics
      gravity: 0.35,
      ballSpeed: 12,
      
      // Input state
      aimAngle: 45, // degrees
      aimPower: 0.5, // 0-1 scale
      
      // Objects
      targets: [],
      balls: [],
      
      // Target pool
      targetPool: [
        { type: 'balloon', points: 5, emoji: '🎈', count: 4 },
        { type: 'bullseye', points: 10, emoji: '◎', count: 2 },
        { type: 'bird', points: 15, emoji: '🐦', count: 2, speed: 1 },
        { type: 'star', points: 20, emoji: '⭐', count: 2 },
        { type: 'gift', points: 25, emoji: '🎁', count: 1 }
      ]
    };

    // Initialize
    function init() {
      game.score = 0;
      game.time = 0;
      game.startTime = Date.now();
      game.isRunning = true;
      game.isFinished = false;
      game.aimAngle = 45;
      game.aimPower = 0.5;
      game.targets = [];
      game.balls = [];
      
      document.getElementById('endScreen').classList.remove('show');
      
      // Populate target pool
      game.targetPool.forEach(poolItem => {
        for (let i = 0; i < poolItem.count; i++) {
          spawnTarget(poolItem.type);
        }
      });
    }

    function spawnTarget(type) {
      const poolItem = game.targetPool.find(p => p.type === type);
      const target = {
        type: type,
        x: Math.random() * (canvas.width - 60) + 30,
        y: Math.random() * (canvas.height - 200) + 50,
        vx: type === 'bird' ? (Math.random() > 0.5 ? 1 : -1) * poolItem.speed : 0,
        emoji: poolItem.emoji,
        points: poolItem.points,
        radius: type === 'star' ? 15 : 25
      };
      game.targets.push(target);
    }

    function throwBall() {
      const radians = (game.aimAngle * Math.PI) / 180;
      const speed = game.ballSpeed * game.aimPower;
      
      const ball = {
        x: canvas.width / 2,
        y: canvas.height - 40,
        vx: Math.cos(radians) * speed,
        vy: -Math.sin(radians) * speed,
        trailX: [],
        trailY: [],
        maxTrail: 20
      };
      game.balls.push(ball);
    }

    function updateBalls() {
      game.balls = game.balls.filter(ball => {
        // Physics
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vy += game.gravity;

        // Trail
        ball.trailX.push(ball.x);
        ball.trailY.push(ball.y);
        if (ball.trailX.length > ball.maxTrail) {
          ball.trailX.shift();
          ball.trailY.shift();
        }

        // Out of bounds
        if (ball.x < 0 || ball.x > canvas.width || ball.y > canvas.height) {
          return false;
        }

        // Collision with targets
        for (let i = game.targets.length - 1; i >= 0; i--) {
          const target = game.targets[i];
          const dx = ball.x - target.x;
          const dy = ball.y - target.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < target.radius + 10) {
            game.score += target.points;
            game.targets.splice(i, 1);
            spawnTarget(target.type);
            return false; // Ball disappears
          }
        }

        return true;
      });
    }

    function updateTargets() {
      game.targets.forEach(target => {
        if (target.type === 'bird') {
          target.x += target.vx;
          if (target.x - target.radius < 0 || target.x + target.radius > canvas.width) {
            target.vx *= -1;
          }
        }
      });
    }

    function updateTimer() {
      if (game.isRunning) {
        game.time = ((Date.now() - game.startTime) / 1000).toFixed(1);
        document.getElementById('timerValue').textContent = game.time;
      }
    }

    function updateScore() {
      document.getElementById('scoreValue').textContent = game.score;
      if (game.score >= game.targetScore && !game.isFinished) {
        finishGame();
      }
    }

    function getRank(seconds) {
      const sec = parseFloat(seconds);
      if (sec < 30) return { name: 'GOLD', emoji: '🥇' };
      if (sec < 45) return { name: 'SILVER', emoji: '🥈' };
      if (sec < 60) return { name: 'BRONZE', emoji: '🥉' };
      return { name: 'FINISHED', emoji: '⭐' };
    }

    function finishGame() {
      game.isRunning = false;
      game.isFinished = true;
      
      const rank = getRank(game.time);
      const endScreen = document.getElementById('endScreen');
      
      document.getElementById('rankText').textContent = rank.name;
      document.getElementById('badge').textContent = rank.emoji;
      document.getElementById('finalTime').textContent = game.time;
      
      endScreen.classList.add('show');
    }

    function drawBalls() {
      game.balls.forEach(ball => {
        // Trail
        ctx.strokeStyle = 'rgba(255, 200, 0, 0.5)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        if (ball.trailX.length > 0) {
          ctx.moveTo(ball.trailX[0], ball.trailY[0]);
          for (let i = 1; i < ball.trailX.length; i++) {
            ctx.lineTo(ball.trailX[i], ball.trailY[i]);
          }
          ctx.stroke();
        }

        // Ball
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#FFA500';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    function drawTargets() {
      game.targets.forEach(target => {
        ctx.font = (target.radius * 2) + 'px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(target.emoji, target.x, target.y);
      });
    }

    function drawAim() {
      const radians = (game.aimAngle * Math.PI) / 180;
      const speed = game.ballSpeed * game.aimPower;
      const previewLength = 150;
      
      const startX = canvas.width / 2;
      const startY = canvas.height - 40;
      const endX = startX + Math.cos(radians) * previewLength;
      const endY = startY - Math.sin(radians) * previewLength;

      // Crosshair
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX - 20, startY);
      ctx.lineTo(startX + 20, startY);
      ctx.moveTo(startX, startY - 20);
      ctx.lineTo(startX, startY + 20);
      ctx.stroke();

      // Aim line
      ctx.strokeStyle = 'rgba(255, 255, 100, 0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // Power indicator
      ctx.fillStyle = `rgba(${Math.round(game.aimPower * 255)}, ${Math.round((1 - game.aimPower) * 255)}, 0, 0.8)`;
      ctx.fillRect(startX - 30, startY + 30, game.aimPower * 60, 8);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 1;
      ctx.strokeRect(startX - 30, startY + 30, 60, 8);
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Sky gradient
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#87CEEB');
      gradient.addColorStop(1, '#E0F6FF');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawTargets();
      drawBalls();
      if (!game.isFinished) {
        drawAim();
      }
    }

    function gameLoop() {
      updateTimer();
      updateScore();
      if (game.isRunning) {
        updateBalls();
        updateTargets();
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Input handling
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;

      if (e.key === ' ' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        if (game.isFinished) {
          init();
        } else if (game.isRunning) {
          throwBall();
        }
      }
      if (e.key === 'r' || e.key === 'R') {
        game.aimAngle = 45;
        game.aimPower = 0.5;
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // Continuous input
    setInterval(() => {
      if (game.isRunning) {
        if (keys['ArrowLeft']) game.aimAngle = Math.max(0, game.aimAngle - 2);
        if (keys['ArrowRight']) game.aimAngle = Math.min(180, game.aimAngle + 2);
        if (keys['ArrowUp']) game.aimPower = Math.min(1, game.aimPower + 0.02);
        if (keys['ArrowDown']) game.aimPower = Math.max(0.1, game.aimPower - 0.02);
      }
    }, 30);

    // Start
    init();
    gameLoop();
  </script>
</body>
</html>
