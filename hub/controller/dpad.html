<!DOCTYPE html>
<!-- Old QR links point here (controller/dpad.html#code=...): redirect to controller.html, keeping ?query and the #hash. H78: no visible body; colours follow the Hub theme. Legacy: no <noscript> fallback and a visible "Redirecting..." body. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controller</title>
  <style>html,body{margin:0;background:#fff;color:#202124}html.dark,html.dark body{background:#121418;color:#9aa0a6}html.dark a{color:#6ea8fe}</style>
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { /* blocked */ }
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.className = 'dark';
      location.replace('controller.html' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=controller.html"></noscript>
</head>
<body><noscript><p><a href="controller.html">Open Controller</a></p></noscript></body>
</html>
