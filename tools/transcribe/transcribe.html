<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Transcribe</title>
  <link rel="stylesheet" href="transcribe.css" />
</head>
<body>
  <h1>Transcribe</h1>

  <label for="apiKey">API Key</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="API Key" />

  <label for="langSelect">Language</label>
  <select id="langSelect">
    <option value="auto" selected>Auto</option>
    <option value="as">Assamese</option>
    <option value="hi">Hindi</option>
    <option value="bn">Bengali</option>
    <option value="ne">Nepali</option>
  </select>

  <div class="row">
    <button id="btnStart" class="primary" type="button">Start</button>
    <button id="btnStop" class="danger" type="button" disabled>Stop</button>
    <button id="btnCopy" type="button">Copy all</button>
    <button id="btnClear" type="button">Clear</button>
    <button id="btnRoman" type="button">Romanizer: on</button>
    <button id="btnTrans" type="button">Translate: on</button>
  </div>
  <div id="status">Idle</div>
  <div id="blocks"></div>

  <!-- Order matters: maps → romanizer → vocab → translation → app -->
  <script src="hindi.js"></script>
  <script src="assamese.js"></script>
  <script src="bengali.js"></script>
  <script src="romanizer.js"></script>
  <script src="vocab.js"></script>
  <script src="translation.js"></script>
  <script src="transcribe.js"></script>
</body>
</html>
