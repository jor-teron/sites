<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Clone - JS Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 100;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="info">
        <strong>Controls:</strong><br>
        W,A,S,D = Move<br>
        SPACE = Jump<br>
        MOUSE = Look Around<br>
        LEFT CLICK = Break Block<br>
        RIGHT CLICK = Place Block<br>
        <em>(Click screen to start)</em>
    </div>

    <!-- Import Three.js as ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- CONFIGURATION ---
        const BLOCK_SIZE = 10;
        const WORLD_HEIGHT = 5;
        const WORLD_WIDTH = 20;
        
        let camera, scene, renderer, controls;
        let raycaster;
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;
        
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // Array to store all blocks for collision/raycasting
        const objects = []; 

        init();
        animate();

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 10, 750);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.y = 10;

            // Lights
            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 200, 100);
            scene.add(dirLight);

            // Controls
            controls = new PointerLockControls(camera, document.body);

            const infoDiv = document.getElementById('info');
            
            document.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                infoDiv.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                infoDiv.style.display = 'block';
            });

            scene.add(controls.getObject());

            // Raycaster for block interaction
            raycaster = new THREE.Raycaster();

            // Input Listeners
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                    case 'Space': if (canJump === true) velocity.y += 350; canJump = false; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);

            // Generate World
            generateWorld();

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function generateWorld() {
            const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            
            // Materials: Grass Top, Dirt Sides, Stone Bottom
            const materialGrassTop = new THREE.MeshLambertMaterial({ color: 0x5da645 });
            const materialDirtSide = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
            const materialStoneBottom = new THREE.MeshLambertMaterial({ color: 0x7d7d7d });
            
            // We use an array of materials for different faces of the cube
            // Order: right, left, top, bottom, front, back
            const materials = [
                materialDirtSide, 
                materialDirtSide, 
                materialGrassTop,   // Top
                materialStoneBottom,// Bottom
                materialDirtSide, 
                materialDirtSide
            ];

            for (let x = 0; x < WORLD_WIDTH; x++) {
                for (let z = 0; z < WORLD_WIDTH; z++) {
                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        // Only render visible blocks or just fill everything for simplicity
                        // Here we fill everything but optimize slightly by checking neighbors would be complex for this snippet.
                        
                        const mesh = new THREE.Mesh(geometry, materials);
                        mesh.position.x = (x - WORLD_WIDTH / 2) * BLOCK_SIZE;
                        mesh.position.z = (z - WORLD_WIDTH / 2) * BLOCK_SIZE;
                        mesh.position.y = (y * BLOCK_SIZE) + (BLOCK_SIZE / 2);
                        
                        // Add random noise to height for terrain feel? 
                        // For now, flat world. Let's make some hills.
                        if(y > 0 && Math.random() > 0.9) continue; // Random holes
                        
                        scene.add(mesh);
                        objects.push(mesh);
                    }
                }
            }
        }

        function onMouseDown(event) {
            if (!controls.isLocked) return;

            // Set raycaster origin at camera center
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                // Left Click (Button 0): Remove Block
                if (event.button === 0) {
                    scene.remove(intersect.object);
                    objects.splice(objects.indexOf(intersect.object), 1);
                }
                
                // Right Click (Button 2): Add Block
                if (event.button === 2) {
                    const voxel = new THREE.Mesh(
                        new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE),
                        [
                            new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
                            new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
                            new THREE.MeshLambertMaterial({ color: 0x5da645 }),
                            new THREE.MeshLambertMaterial({ color: 0x7d7d7d }),
                            new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
                            new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
                        ]
                    );
                    
                    // Calculate new position based on face normal
                    voxel.position.copy(intersect.point).add(intersect.face.normal.multiplyScalar(BLOCK_SIZE / 2));
                    voxel.position.divideScalar(BLOCK_SIZE).floor().multiplyScalar(BLOCK_SIZE).addScalar(BLOCK_SIZE / 2);
                    
                    scene.add(voxel);
                    objects.push(voxel);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 100.0 * delta; // Gravity

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // Ensure consistent speed in all directions

                if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                controls.getObject().position.y += (velocity.y * delta); // Update Y position

                // Floor Collision Detection (Simple)
                // Check if player is below ground level
                if (controls.getObject().position.y < BLOCK_SIZE / 2) {
                    velocity.y = 0;
                    controls.getObject().position.y = BLOCK_SIZE / 2;
                    canJump = true;
                }
                
                // Advanced Collision: Cast ray down to see if there is a block under us
                raycaster.set(controls.getObject().position, new THREE.Vector3(0, -1, 0));
                const intersects = raycaster.intersectObjects(objects);
                
                if (intersects.length > 0) {
                     // If distance to hit is small enough, we are standing on something
                     if (intersects[0].distance <= (BLOCK_SIZE / 2) + 1) {
                         velocity.y = 0;
                         // Snap to top of block
                         controls.getObject().position.y = intersects[0].object.position.y + (BLOCK_SIZE / 2) + (BLOCK_SIZE / 2);
                         canJump = true;
                     }
                } else {
                    canJump = false;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
