<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swell Foop SF1a</title>
    <!-- Self-contained: no CDN / network requests (works offline and from file://) -->
    <link rel="stylesheet" href="ui/style.css?v=SF1a" />
</head>
<body>
    <div class="game-container">
        <!-- Own top bar (hidden with body.in-hub when the sites hub shows it in its header) -->
        <h1 class="sf-title"><span id="appName">Swell Foop</span> <small id="appVersion" class="sf-version"></small></h1>
        <div class="game-info">
            <div class="sf-stat">Score: <span id="score">0</span></div>
            <div class="sf-stat">Moves: <span id="moves">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="sf-controls">
            <button id="newGameBtn" class="btn">New Game</button>
            <button id="themeBtn" class="btn" type="button" aria-haspopup="dialog">Theme: <span id="themeLabel">Classic Balls</span></button>
        </div>
    </div>

    <!-- Theme picker sheet (built by ui/theme_picker.js) -->
    <div id="themePanel" class="sf-theme-panel hidden" role="dialog" aria-label="Choose a block theme">
        <div class="sf-theme-sheet">
            <div class="sf-theme-head"><span>Block theme</span><button id="themeClose" type="button" class="sf-theme-x" aria-label="Close">&times;</button></div>
            <div id="themeList" class="sf-theme-list"></div>
        </div>
    </div>

    <!-- Message Box HTML -->
    <div id="messageBox" class="message-box hidden">
        <div class="message-content">
            <h2 id="messageTitle"></h2>
            <p id="messageText"></p>
            <button id="messageButton">OK</button>
        </div>
    </div>

  <script src="core/config.js?v=SF1a"></script>
  <script src="core/themes.js?v=SF1a"></script>
  <script src="assets/themes/shared.js?v=SF1a"></script>
  <script src="assets/themes/classic.js?v=SF1a"></script>
  <script src="assets/themes/gems.js?v=SF1a"></script>
  <script src="assets/themes/candy.js?v=SF1a"></script>
  <script src="assets/themes/fruit.js?v=SF1a"></script>
  <script src="assets/themes/space.js?v=SF1a"></script>
  <script src="assets/themes/neon.js?v=SF1a"></script>
  <script src="assets/themes/pixel.js?v=SF1a"></script>
  <script src="assets/themes/ocean.js?v=SF1a"></script>
  <script src="assets/themes/marble.js?v=SF1a"></script>
  <script src="assets/themes/emoji.js?v=SF1a"></script>
  <script src="ui/theme_picker.js?v=SF1a"></script>
  <script src="core/logic.js?v=SF1a"></script>
</body>
</html>
