<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swell Foop SFR1a</title>
    <!-- Self-contained: no CDN / network requests (works offline and from file://) -->
    <link rel="stylesheet" href="ui/style.css?v=SFR1a" />
</head>
<body>
    <div class="game-container">
        <!-- Own top bar (hidden with body.in-hub when the sites hub shows it in its header) -->
        <h1 class="sf-title"><span id="appName">Swell Foop</span> <small id="appVersion" class="sf-version"></small></h1>
        <div class="game-info">
            <div class="sf-stat">Score: <span id="score">0</span></div>
            <div class="sf-stat">Moves: <span id="moves">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="sf-controls">
            <button id="newGameBtn" class="btn">New Game</button>
        </div>
    </div>

    <!-- Message Box HTML -->
    <div id="messageBox" class="message-box hidden">
        <div class="message-content">
            <h2 id="messageTitle"></h2>
            <p id="messageText"></p>
            <button id="messageButton">OK</button>
        </div>
    </div>

  <script src="core/config.js?v=SFR1a"></script>
  <script src="core/logic.js?v=SFR1a"></script>
</body>
</html>
