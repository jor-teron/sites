<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris B/W</title>
  <link rel="stylesheet" href="tetris.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="240" height="480"></canvas>
    <div id="side">
      <h1>TETRIS</h1>
      <div>SCORE<br /><strong id="score">0</strong></div>
      <div>LINES<br /><strong id="lines">0</strong></div>
      <div>LEVEL<br /><strong id="level">1</strong></div>
      <div>NEXT</div>
      <canvas id="nextBox" width="96" height="96"></canvas>
      <div class="muted">
        <kbd>←</kbd> <kbd>→</kbd> move<br />
        <kbd>↑</kbd> / <kbd>X</kbd> rotate<br />
        <kbd>↓</kbd> soft drop<br />
        <kbd>SPACE</kbd> hard drop<br />
        <kbd>P</kbd> pause<br />
        <kbd>R</kbd> restart
      </div>
      <p id="status" class="muted"></p>
    </div>
  </div>

  <script src="tetris_config.js"></script>
  <script src="tetris_logic.js"></script>
</body>
</html>
