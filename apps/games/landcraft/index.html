<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>LandCraft LCR1a</title>
  <link rel="stylesheet" href="ui/landcraft.css?v=LCR1a" />
  <script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.min.js" } }</script>
</head>
<body>
  <div id="cross">+</div>
  <div id="hint">Click to look &middot; WASD move &middot; Space jump &middot; left break &middot; right place &middot; 1-7 / wheel pick &middot; Esc maps</div>
  <div id="stick"><div id="knob"></div></div>
  <nav id="hotbar"></nav>
  <button id="break" class="act" type="button">Break</button>
  <button id="place" class="act" type="button">Place</button>
  <button id="jump" type="button" aria-label="Jump">&#8679;</button>
  <button id="mapbtn" type="button" hidden aria-label="Change map">Map --</button>
  <div id="picker" hidden>
    <form class="card" onsubmit="return false">
      <h1>LandCraft</h1>
      <label for="map-input">Map number</label>
      <input id="map-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="00" />
      <p id="map-note"></p>
      <div class="row">
        <button id="map-play" type="button">Play</button>
        <button id="map-random" type="button">Random</button>
      </div>
      <button id="map-continue" type="button">Continue</button>
      <button id="map-reset" type="button" hidden>Reset map</button>
    </form>
  </div>
  <script type="module" src="core/main.js?v=LCR1a"></script>
</body>
</html>
