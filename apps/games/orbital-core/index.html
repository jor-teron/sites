<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Orbital Core 3D</title>
  <script>
    (function() {
      var theme = localStorage.getItem('sites-hub.theme');
      if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      location.replace('orbital-core.html' + location.search + location.hash);
    })();
  </script>
</head>
<body style="background:#060913;margin:0;"></body>
</html>
