<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOE RTS - Tiny Slice ARR1a</title>
    <!-- Project CSS -->
    <link rel="icon" href="aoe-rts_icon.png">
    <link rel="stylesheet" href="ui/aoe-rts.css?v=ARR1a">
</head>
<body>
    <!-- Main game container -->
    <div id="game-container"></div>
    <!-- Bottom command bar (touch buttons) -->
    <div id="command-bar"></div>
    <!-- R1a: resource box (top-left), info line, minimap, pause -->
    <div id="topbar"><span id="hud"></span></div>
    <div id="info"></div>
    <div id="minimap-wrap"><canvas id="minimap"></canvas></div>
    <button id="pause-btn" aria-label="Pause">⏸</button>
    <button id="speed-btn" aria-label="Game speed" title="Game speed (+ / -)">1x</button>
    <div id="pause-overlay"><div><h2>Paused</h2><div id="pause-map"></div><div id="pause-speed">Speed 1x</div><button id="resume-btn">▶ Resume</button> <button id="newmap-btn">New map</button><p>P to toggle · camera still moves</p></div></div>
    <div id="title-overlay"><div><h1>AOE RTS</h1><label for="map-input">Map</label>
        <input id="map-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" spellcheck="false" placeholder="00" aria-label="Map number 00-99">
        <div id="map-note"></div>
        <div class="picker-row"><button id="map-resume-btn">▶ Resume</button><button id="map-restart-btn">↺ Restart</button><button id="map-random-btn">🎲 Random</button></div>
        <button id="picker-cancel">Back</button>
        <p>Type 00-99 · same number = same map · 00 is a small demo · each map keeps its own save (this browser)</p></div></div>
    <!-- In-game confirm box (Restart) -->
    <div id="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-msg"><div><h2>Are you sure?</h2><p id="confirm-msg"></p>
        <div class="picker-row"><button id="confirm-ok">↺ Restart</button><button id="confirm-cancel">Cancel</button></div></div></div>
    <!-- Mute toggle -->
    <button id="mute-btn" aria-label="Mute">🔊</button>
    <!-- Phaser library from local vendor folder -->
    <script src="vendor/phaser.min.js?v=ARR1a"></script>
    <!-- Game scripts (plain script tags, order matters) -->
    <script src="core/config.js?v=ARR1a"></script>
    <script src="core/state.js?v=ARR1a"></script>
    <script src="assets/maps/mapgen.js?v=ARR1a"></script>
    <script src="assets/maps/water.js?v=ARR1a"></script>
    <script src="assets/maps/resources.js?v=ARR1a"></script>
    <script src="assets/maps/rivers.js?v=ARR1a"></script>
    <script src="assets/maps/terrain.js?v=ARR1a"></script>
    <script src="core/pathfind.js?v=ARR1a"></script>
    <script src="core/units.js?v=ARR1a"></script>
    <script src="core/gather.js?v=ARR1a"></script>
    <script src="core/buildings.js?v=ARR1a"></script>
    <script src="core/render.js?v=ARR1a"></script>
    <script src="core/input.js?v=ARR1a"></script>
    <script src="core/debug.js?v=ARR1a"></script>
    <script src="core/audio.js?v=ARR1a"></script>
    <script src="core/save.js?v=ARR1a"></script>
    <script src="core/hud.js?v=ARR1a"></script>
    <script src="assets/models/art.js?v=ARR1a"></script>
    <script src="assets/models/villager.js?v=ARR1a"></script>
    <script src="assets/models/animals.js?v=ARR1a"></script>
    <script src="assets/models/nature.js?v=ARR1a"></script>
    <script src="assets/models/buildings.js?v=ARR1a"></script>
    <script src="assets/models/terrain.js?v=ARR1a"></script>
    <script src="core/main.js?v=ARR1a"></script>
</body>
</html>
