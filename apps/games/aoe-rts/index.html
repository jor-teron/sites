<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOE RTS - Tiny Slice ARR1a ARQ1t ARQ1t2 ARQ1t3 ARQ1a ARQ1b</title>
    <!-- Project CSS -->
    <link rel="icon" href="aoe-rts_icon.png">
    <link rel="stylesheet" href="ui/aoe-rts.css">
</head>
<body>
    <!-- Main game container -->
    <div id="game-container"></div>
    <!-- Bottom command bar (touch buttons) -->
    <div id="command-bar"></div>
    <!-- R1a: resource box (top-left), info line, minimap, pause -->
    <div id="topbar"><span id="hud"></span></div>
    <div id="info"></div>
    <div id="minimap-wrap"><canvas id="minimap"></canvas></div>
    <button id="pause-btn" aria-label="Pause">⏸</button>
    <button id="speed-btn" aria-label="Game speed" title="Game speed (+ / -)">1x</button>
    <div id="pause-overlay"><div><h2>Paused</h2><div id="pause-map"></div><div id="pause-speed">Speed 1x</div><button id="resume-btn">▶ Resume</button> <button id="newmap-btn">New map</button> <button id="mode-btn">Modes</button><p>P to toggle · camera still moves</p></div></div>
    <div id="title-overlay"><div><h1>AOE RTS</h1><label for="map-input">Map</label>
        <input id="map-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" spellcheck="false" placeholder="00" aria-label="Map number 00-99">
        <div id="map-note"></div>
        <div class="picker-row"><button id="map-resume-btn">▶ Resume</button><button id="map-restart-btn">↺ Restart</button><button id="map-random-btn">🎲 Random</button></div>
        <button id="picker-cancel">Back</button>
        <p>Type 00-99 · same number = same map · 00 is a small demo · each map keeps its own save (this browser)</p></div></div>
    <!-- ARQ1a start screen: game mode -->
    <div id="mode-overlay"><div><h1>AOE RTS</h1><p>Choose a mode</p>
        <div class="mode-col"><button data-mode="open">🌲 Open World<small>just you, build and gather</small></button><button data-mode="vs">⚔ Vs AI<small>you vs one AI · destroy its Town Center and villagers</small></button><button data-mode="aivai">👀 AI vs AI<small>watch two AIs fight</small></button></div>
        <p>AI difficulty</p><div class="diff-row"><button data-diff="easy">Easy</button><button data-diff="normal">Normal</button><button data-diff="hard">Hard</button></div></div></div>
    <!-- ARQ1b game over -->
    <div id="end-overlay"><div><h1 id="end-msg"></h1><div class="diff-row"><button id="end-again">↺ Play again</button><button id="end-modes">Modes</button></div></div></div>
    <!-- In-game confirm box (Restart) -->
    <div id="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-msg"><div><h2>Are you sure?</h2><p id="confirm-msg"></p>
        <div class="picker-row"><button id="confirm-ok">↺ Restart</button><button id="confirm-cancel">Cancel</button></div></div></div>
    <!-- Mute toggle -->
    <button id="mute-btn" aria-label="Mute">🔊</button>
    <!-- Phaser library from local vendor folder -->
    <script src="vendor/phaser.min.js"></script>
    <!-- Game scripts (plain script tags, order matters) -->
    <script src="core/config.js"></script>
    <script src="core/state.js"></script>
    <script src="assets/maps/mapgen.js"></script>
    <script src="assets/maps/water.js"></script>
    <script src="assets/maps/resources.js"></script>
    <script src="assets/maps/rivers.js"></script>
    <script src="assets/maps/terrain.js"></script>
    <script src="core/pathfind.js"></script>
    <script src="core/units.js"></script>
    <script src="core/gather.js"></script>
    <script src="core/buildings.js"></script>
    <script src="core/combat.js"></script>
    <script src="core/ai.js"></script>
    <script src="core/render.js"></script>
    <script src="core/input.js"></script>
    <script src="core/debug.js"></script>
    <script src="core/audio.js"></script>
    <script src="core/save.js"></script>
    <script src="core/hud.js"></script>
    <script src="assets/models/art.js"></script>
    <script src="assets/models/villager.js"></script>
    <script src="assets/models/animals.js"></script>
    <script src="assets/models/nature.js"></script>
    <script src="assets/models/buildings.js"></script>
    <script src="assets/models/terrain.js"></script>
    <script src="core/main.js"></script>
</body>
</html>
