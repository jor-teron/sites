<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOE RTS - Tiny Slice</title>
    <!-- Project CSS -->
    <link rel="icon" href="aoe-rts_icon.png">
    <link rel="stylesheet" href="aoe-rts.css">
</head>
<body>
    <!-- Main game container -->
    <div id="game-container"></div>
    <!-- Bottom command bar (touch buttons) -->
    <div id="command-bar"></div>
    <!-- R1a: resource box (top-left), info line, minimap, pause -->
    <div id="topbar"><span id="hud"></span></div>
    <div id="info"></div>
    <div id="minimap-wrap"><canvas id="minimap"></canvas></div>
    <button id="pause-btn" aria-label="Pause">⏸</button>
    <button id="speed-btn" aria-label="Game speed" title="Game speed (+ / -)">1x</button>
    <div id="pause-overlay"><div><h2>Paused</h2><div id="pause-map"></div><div id="pause-speed">Speed 1x</div><button id="resume-btn">▶ Resume</button> <button id="newmap-btn">New map</button><p>P to toggle · camera still moves</p></div></div>
    <div id="title-overlay"><div><h1>AOE RTS</h1><label for="map-select">Map</label>
        <select id="map-select"></select><div id="map-note"></div><button id="start-btn">▶ Start</button> <button id="picker-cancel">Back</button>
        <p>Same number = same map · 00 is a small demo</p></div></div>
    <!-- Mute toggle -->
    <button id="mute-btn" aria-label="Mute">🔊</button>
    <!-- Phaser library from local vendor folder -->
    <script src="vendor/phaser.min.js"></script>
    <!-- Main game script -->
    <script src="aoe-rts_audio.js"></script>
    <script src="aoe-rts_art.js"></script>
    <script src="aoe-rts.js"></script>
</body>
</html>
