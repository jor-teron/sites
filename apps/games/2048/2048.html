<!DOCTYPE html>
<!--
  ============================================================
  File:        2048.html
  Project:     2048
  Purpose:     Markup only for the 2048 board game.
               Styles live in 2048.css. Logic lives in
               2048_logic.js, tunables in 2048_config.js.
  Location:    apps/games/2048/2048.html
  Layout:      HUD (title, score, best) → stage/board →
               overlay → undo / new-game controls.
  Notes:       Touch-friendly, no user scaling. Board cells
               and tiles are injected by the script.
               Inside the sites hub the HUD / buttons hide and
               Score / Best / New Game / Undo move to the hub bar.
  ============================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>2048 NIX-G2</title>
  <link rel="stylesheet" href="ui/style.css" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="title">2048</div>
      <div class="stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="stat"><span class="label">BEST</span><span class="value" id="best">0</span></div>
    </div>

    <div id="stage">
      <div id="board-wrap">
        <div id="board">
          <!-- 16 static cells injected by JS -->
        </div>
        <div id="overlay" class="hidden">
          <h2 id="overlay-title">GAME OVER</h2>
          <p id="overlay-msg">No more moves</p>
          <button id="overlay-btn">NEW GAME</button>
          <button id="overlay-undo" class="secondary" hidden>UNDO</button>
        </div>
      </div>
    </div>

    <div id="controls">
      <button id="undo-btn" disabled>UNDO</button>
      <button id="new-btn">NEW GAME</button>
    </div>
  </div>

  <!-- GS2: shared Games Settings (optional: the game runs with defaults if it fails to load) -->
  <script src="../common/settings/games-settings.js"></script>
  <script src="core/config.js"></script>
  <script src="ui/settings.js"></script>
  <script src="core/logic.js"></script>
</body>
</html>
