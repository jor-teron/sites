<!DOCTYPE html>
<!-- Redirect entry point to chess.html (keeps ?query and #hash). NIX-G1: no visible body; colours follow the Hub theme (sites-hub.theme, else the device setting). Legacy: index.html held the full game and chess.html was a visible "Moved" redirect back to it; NIX-G1 swapped them (game now in chess.html, git mv). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess</title>
  <link rel="canonical" href="chess.html">
  <style>html,body{margin:0;background:#fff;color:#202124}html.dark,html.dark body{background:#121418;color:#9aa0a6}html.dark a{color:#6ea8fe}</style>
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { /* blocked */ }
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.className = 'dark';
      location.replace('chess.html' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=chess.html"></noscript>
</head>
<body><noscript><p><a href="chess.html">Chess</a></p></noscript></body>
</html>
