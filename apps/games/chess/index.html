<!DOCTYPE html>
<!--
  File: index.html
  Project: chess
  Purpose: Shell only. Config, rules, AI, rendering, and input are separate scripts
           on the Chess namespace. No build step and no remote assets.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Chess CHR1a</title>
  <link rel="icon" href="chess_icon.png" />
  <link rel="stylesheet" href="ui/chess.css?v=CHR1a" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Chess</h1>
      <p id="status" role="status" aria-live="polite">Choose a side to start</p>
    </header>
    <div id="stage">
      <div id="board-wrap">
        <canvas id="board" aria-label="Chessboard"></canvas>
        <div id="promo" hidden>
          <button type="button" data-promo="5" aria-label="Queen"><canvas width="64" height="64"></canvas></button>
          <button type="button" data-promo="4" aria-label="Rook"><canvas width="64" height="64"></canvas></button>
          <button type="button" data-promo="3" aria-label="Bishop"><canvas width="64" height="64"></canvas></button>
          <button type="button" data-promo="2" aria-label="Knight"><canvas width="64" height="64"></canvas></button>
        </div>
      </div>
      <aside id="panel">
        <div id="caps">
          <p><b id="cap-you-label">You</b> <span id="cap-you" class="glyphs"></span></p>
          <p><b>Computer</b> <span id="cap-ai" class="glyphs"></span></p>
        </div>
        <div id="moves" aria-label="Move list"></div>
        <p id="keys">Tap or drag pieces. Arrows and Enter. U undo, H hint.</p>
        <div id="actions">
          <button type="button" id="btn-hint" hidden>Hint</button>
          <button type="button" id="btn-undo" disabled>Undo</button>
          <button type="button" id="btn-new">New game</button>
        </div>
      </aside>
    </div>
    <div id="overlay">
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <h1 id="ov-title">Chess</h1>
        <p id="ov-msg">Play the computer. Two levels, for learning the game.</p>
        <div id="ov-setup">
          <div id="color-choices" class="choices" role="group" aria-label="Your colour">
            <button type="button" data-color="white" class="on">Play White</button>
            <button type="button" data-color="black">Play Black</button>
          </div>
          <div id="level-choices" class="choices" role="group" aria-label="Difficulty">
            <button type="button" data-level="beginner" class="on">Beginner</button>
            <button type="button" data-level="medium">Medium</button>
          </div>
          <div id="anim-choices" class="choices" role="group" aria-label="Move animation">
            <button type="button" id="btn-anim" class="on" aria-pressed="true">Animation: On</button>
          </div>
          <p id="ov-help"></p>
        </div>
        <div class="choices">
          <button type="button" id="btn-start">Start</button>
          <button type="button" id="btn-back" hidden>Back</button>
          <button type="button" id="btn-undo-over" hidden>Undo last move</button>
        </div>
      </div>
    </div>
  </div>
  <script src="core/config.js?v=CHR1a"></script>
  <script src="core/rules.js?v=CHR1a"></script>
  <script src="core/ai.js?v=CHR1a"></script>
  <script src="core/anim.js?v=CHR1a"></script>
  <script src="assets/models/pieces.js?v=CHR1a"></script>
  <script src="assets/models/board.js?v=CHR1a"></script>
  <script src="core/input.js?v=CHR1a"></script>
  <script src="core/logic.js?v=CHR1a"></script>
</body>
</html>
