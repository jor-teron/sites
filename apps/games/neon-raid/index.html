<!DOCTYPE html>
<!--
  Neon Raid (Alpha) — HTML entry
  Futuristic run-and-gun. Keyboard, on-screen touch, and gamepad.
  Timer selectable: 250 / 200 / 150 / 100 seconds.
  Audio hooks exist; assets added later.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>NEON RAID — Alpha</title>
  <link rel="stylesheet" href="css/neon-raid.css" />
</head>
<body>
  <div id="wrap">
    <header id="hud">
      <div id="title">NEON RAID <span>ALPHA</span></div>
      <div id="stats">
        <span id="lives">LIVES 3</span>
        <span id="hp">HP 2</span>
        <span id="score">SCORE 0</span>
        <span id="timer">TIME 250</span>
      </div>
    </header>

    <div id="stage">
      <div id="frame">
        <canvas id="game" width="960" height="540"></canvas>

        <section id="menu">
          <h1>NEON RAID</h1>
          <p>Futuristic run-and-gun · Alpha</p>
          <label for="duration">Mission length</label>
          <select id="duration">
            <option value="250" selected>250 seconds</option>
            <option value="200">200 seconds</option>
            <option value="150">150 seconds</option>
            <option value="100">100 seconds</option>
          </select>
          <button id="startBtn" type="button">START</button>
          <p class="keys">← → / A D move · ↑ / W / SPACE jump · Z / X fire · ENTER start / pause · ESC menu</p>
          <p class="keys">Gamepad: stick / d-pad move, A jump, B / X fire, Start pause</p>
        </section>

        <section id="overlay" class="hidden">
          <h2 id="overlayTitle">MISSION FAILED</h2>
          <p id="overlayMsg"></p>
          <button id="retryBtn" type="button">RETRY</button>
          <button id="menuBtn" type="button">MENU</button>
        </section>
      </div>
    </div>

    <div id="touch">
      <div class="touch-cluster">
        <button type="button" id="tLeft" data-code="ArrowLeft" aria-label="Move left">◀</button>
        <button type="button" id="tRight" data-code="ArrowRight" aria-label="Move right">▶</button>
      </div>
      <div class="touch-cluster">
        <button type="button" id="tPause" data-action="pause" aria-label="Pause">II</button>
        <button type="button" id="tMenu" data-action="menu" aria-label="Menu">MENU</button>
      </div>
      <div class="touch-cluster">
        <button type="button" id="tJump" data-code="Space" aria-label="Jump">JUMP</button>
        <button type="button" id="tFire" data-code="KeyZ" aria-label="Fire">FIRE</button>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/input.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
