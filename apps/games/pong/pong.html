<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong</title>
  <!--
    ========================================================================
    Ping Pong — HTML + CSS + JS (split: pong.css, pong_config.js, pong_logic.js)
    Author: Jor Teron
    Description:
      Classic two-paddle Pong on a canvas that fills the page. Left paddle is
      the human player, right paddle a lightweight AI. First to
      PONG_CONFIG.WIN_SCORE wins. Controls: see PONG_CONFIG.keys.
      In the sites hub the own title / score bar hides and the hub header
      shows name, version, score and New Game (hub bridge in pong_logic.js).
    ========================================================================
  -->
  <link rel="stylesheet" href="pong.css" />
</head>
<body>
  <!-- Own bar: title + live score (hidden inside the hub) -->
  <div id="topbar">
    <h1>Ping Pong</h1>
    <div id="hud">0 — 0</div>
  </div>

  <!-- Drawing surface (sized to the page by pong_logic.js) -->
  <canvas id="court"></canvas>

  <script src="pong_config.js"></script>
  <script src="pong_logic.js"></script>
</body>
</html>
