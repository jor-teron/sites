<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dino Run</title>
  <link rel="stylesheet" href="dino-run.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <span id="score">00000</span>
    <span id="best">HI 00000</span>
  </div>
  <div id="help">↑/A jump · ↓ duck · ←→ move · B shield · Start pause · Select restart</div>
  <div id="overlay" class="overlay">
    <div class="card">
      <h1 id="title">DINO RUN</h1>
      <p id="msg">Press Start / Enter</p>
      <p id="sub" class="sub"></p>
    </div>
  </div>
  <script src="dino-run_config.js"></script>
  <script src="dino-run_logic.js"></script>
</body>
</html>
