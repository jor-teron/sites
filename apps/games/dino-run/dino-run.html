<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <span id="score">00000</span>
    <span id="best">HI 00000</span>
  </div>
  <button id="styleBtn" class="dr-style-btn" type="button" data-dr-ui aria-haspopup="dialog" aria-controls="stylePanel" aria-expanded="false">Dino &amp; Theme</button>
  <div id="help">↑/A jump · ↓ duck · ←→ move · B shield · Start pause · Select restart</div>
  <div id="overlay" class="overlay">
    <div class="card">
      <h1 id="title">DINO RUN</h1>
      <p id="msg">Press Start / Enter</p>
      <p id="sub" class="sub"></p>
    </div>
  </div>
  <!-- Dino & theme picker (built by ui/picker.js) -->
  <div id="stylePanel" class="dr-panel hidden" role="dialog" aria-modal="true" aria-labelledby="styleTitle" data-dr-ui>
    <div class="dr-sheet">
      <div class="dr-head"><span id="styleTitle">Dino &amp; Theme</span><button id="styleClose" type="button" class="dr-x" aria-label="Close">&times;</button></div>
      <div class="dr-tabs" role="tablist" aria-label="Choose what to change">
        <button id="styleTab-dino" class="dr-tab" type="button" role="tab" data-tab="dino" aria-controls="styleList" aria-selected="true">Dino</button>
        <button id="styleTab-theme" class="dr-tab" type="button" role="tab" data-tab="theme" aria-controls="styleList" aria-selected="false" tabindex="-1">Theme</button>
      </div>
      <div id="styleList" class="dr-list" role="tabpanel"></div>
    </div>
  </div>
