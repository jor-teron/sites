<!DOCTYPE html>
<!--
  File: tower-defence.html
  Project: tower-defence
  Purpose: Game shell. Markup only. Styles live in tower-defence.css.
           Logic lives in modules/ and boots from modules/main.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tower Defence</title>
  <link rel="stylesheet" href="tower-defence.css" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game"></canvas>
      <!-- See-through stats strip over board row 0. Taps pass through. -->
      <div id="hud">
        <div class="stats">
          <span class="stat hp">♥<b id="hud-lives">20</b></span>
          <span class="stat gold">$<b id="hud-gold">150</b></span>
          <span class="stat wave">W<b id="hud-wave">0</b></span>
          <span class="stat score">★<b id="hud-score">0</b></span>
        </div>
        <span id="hud-timer"></span>
      </div>
      <div id="hint"></div>
      <div id="overlay">
        <h2 id="overlay-title">TOWER DEFENCE</h2>
        <p id="overlay-msg">Build towers • Stop the waves • Survive</p>
        <p id="overlay-msg2" style="font-size:11px;opacity:0.7;">Tap a tower button, then tap a grass tile</p>
        <button id="overlay-btn">START</button>
      </div>
    </div>

    <div id="toolbar">
      <button class="tbtn" data-tower="gun">GUN<span class="cost">$50</span></button>
      <button class="tbtn" data-tower="cannon">CANNON<span class="cost">$100</span></button>
      <button class="tbtn" data-tower="frost">FROST<span class="cost">$75</span></button>
      <div id="ctrls">
        <button class="abtn" id="btn-upgrade" disabled>UPGRADE</button>
        <button class="abtn" id="btn-sell" disabled>SELL</button>
        <button class="abtn" id="btn-speed">1×</button>
        <button class="abtn warn" id="btn-pause">PAUSE</button>
      </div>
    </div>
  </div>
  <script type="module" src="modules/main.js"></script>
</body>
</html>
