<!DOCTYPE html>
<!--
  Unblock (UNB-4) — sliding block puzzle. Free the red hero block through the EXIT.
  Phone-first layout (UNB-3) + flat 2D board themes (Classic, Wood, Car & Bus, Floor, Stone).
  Core: config, gameLogic, solver, levels, storage, game.
  UI: layout, render, input, hud, hint, levelPicker, themePicker, themes/*, modals, settings, app.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Unblock UNB-4</title>
    <link rel="stylesheet" href="ui/base.css">
    <link rel="stylesheet" href="ui/theme.css">
    <link rel="stylesheet" href="ui/board.css">
    <link rel="stylesheet" href="ui/components.css">
    <link rel="stylesheet" href="ui/themes/classic.css">
    <link rel="stylesheet" href="ui/themes/wood.css">
    <link rel="stylesheet" href="ui/themes/carbus.css">
    <link rel="stylesheet" href="ui/themes/floor.css">
    <link rel="stylesheet" href="ui/themes/stone.css">
    <link rel="stylesheet" href="ui/themes/hint-overlay.css">
</head>
<body>
    <div id="app">
        <div id="loading" class="loading">Loading levels…</div>

        <header class="app-header">
            <div class="header-left">
                <button id="btn-levels" class="btn btn-icon" title="Level Select">☰</button>
                <button id="btn-board-theme" class="btn btn-icon" title="Board theme">🎨</button>
            </div>
            <div class="header-center">
                <h1 class="game-title">UNBLOCK</h1>
                <div class="level-indicator">Lv <span id="current-level-num">000</span></div>
            </div>
            <div class="header-right">
                <div class="stat-badge" title="Moves">
                    <span class="stat-label">Mv</span>
                    <span id="move-count" class="stat-value">0</span>
                </div>
                <div class="stat-badge" title="Par (best possible)">
                    <span class="stat-label">Par</span>
                    <span id="par-count" class="stat-value">0</span>
                </div>
                <button id="btn-restart" class="btn btn-icon" title="Restart">↺</button>
                <span id="gearSlot" class="gear-slot"></span>
            </div>
        </header>

        <main class="game-main">
            <div class="board-container">
                <div class="exit-marker">EXIT</div>
                <div id="game-board" class="game-board"></div>
            </div>
        </main>

        <footer class="app-footer">
            <button id="btn-undo" class="btn btn-secondary" disabled>Undo</button>
            <button id="btn-hint" class="btn btn-secondary">Hint</button>
            <button id="btn-next" class="btn btn-primary" style="display: none;">Next →</button>
        </footer>

        <div id="modal-levels" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Select Level</h2>
                    <button id="btn-close-levels" class="btn btn-close">×</button>
                </div>
                <div class="level-search-bar">
                    <input type="number" id="level-jump-input" min="0" max="999" placeholder="Jump to level # (0-999)">
                    <button id="btn-jump-level" class="btn btn-primary">Go</button>
                </div>
                <div class="level-page-bar">
                    <button id="btn-page-prev" class="btn btn-secondary">← Prev</button>
                    <span id="level-page-label">000 – 099</span>
                    <button id="btn-page-next" class="btn btn-secondary">Next →</button>
                </div>
                <div id="level-grid" class="level-grid"></div>
            </div>
        </div>

        <div id="modal-themes" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Board Theme</h2>
                    <button id="btn-close-themes" class="btn btn-close">×</button>
                </div>
                <div id="theme-grid" class="theme-grid"></div>
            </div>
        </div>

        <div id="modal-victory" class="modal" style="display: none;">
            <div class="modal-content victory-content">
                <div class="victory-icon">🎉</div>
                <h2>Level Completed!</h2>
                <div id="vic-stars" class="vic-stars">★★★</div>
                <p>You solved level <span id="vic-level">000</span> in <span id="vic-moves">0</span> moves
                    (par <span id="vic-par">0</span>).</p>
                <p id="vic-hints" class="vic-hints">No hints used</p>
                <div class="victory-actions">
                    <button id="btn-vic-replay" class="btn btn-secondary">Replay</button>
                    <button id="btn-vic-next" class="btn btn-primary">Next Level →</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../common/settings/games-settings.js"></script>
    <script type="module" src="ui/app.js"></script>
</body>
</html>
