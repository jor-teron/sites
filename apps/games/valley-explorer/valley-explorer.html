<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Valley Explorer HEX-7a</title>
  <link rel="stylesheet" href="ui/style.css">
  <link rel="stylesheet" href="../engine/3d/ui/overlay.css">
</head>
<body>
  <div id="wrap">
    <div id="boot">Starting Valley Explorer…</div>
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="left">
        <span class="pill" id="gathered">Landmarks 0 / 0</span>
        <span class="pill" id="fps">— fps</span>
      </div>
      <div class="right">
        <button type="button" id="btn-quality">Quality: Med</button>
        <button type="button" id="btn-pause">Pause</button>
        <button type="button" id="btn-restart">Restart</button>
      </div>
    </div>
    <button type="button" id="btn-jump" aria-label="Jump">Jump</button>
    <div id="help">WASD / arrows / left-half stick to move · right-half drag to look · Space or Jump · Quality = resolution/shadows (30 fps cap) · collect landmarks</div>
  </div>
  <script type="module" src="ui/main.js"></script>
</body>
</html>
