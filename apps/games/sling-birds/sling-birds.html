<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Sling Birds SB1a</title>
<link rel="stylesheet" href="ui/style.css?v=sb1a" />
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat picker" id="picker">
      <span class="label">LEVEL</span>
      <div class="pick-row">
        <button type="button" id="lvl-prev" aria-label="Previous level">&#8249;</button>
        <input id="lvl-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" spellcheck="false" value="00" aria-label="Level 00 to 50" />
        <button type="button" id="lvl-next" aria-label="Next level">&#8250;</button>
      </div>
    </div>
    <div class="stat"><span class="label">BIRDS</span><span class="value" id="hud-birds">3</span></div>
    <div class="stat"><span class="label">PIGS</span><span class="value" id="hud-pigs">0</span></div>
    <div class="stat"><span class="label">SCORE</span><span class="value" id="hud-score">0</span></div>
    <button id="btn-reset">RESET</button>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hint">DRAG FROM THE SLINGSHOT</div>
    <div id="overlay" class="hidden">
      <h2 id="overlay-title">LEVEL CLEAR</h2>
      <div class="stars" id="overlay-stars">☆☆☆</div>
      <p id="overlay-msg"></p>
      <div>
        <button id="overlay-btn">NEXT LEVEL</button>
        <button id="overlay-btn2" class="alt">RETRY</button>
      </div>
    </div>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script type="module" src="core/main.js?v=sb1a"></script>
</body>
</html>
