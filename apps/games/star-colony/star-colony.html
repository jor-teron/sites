<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Colony · SC-1a</title><link rel="stylesheet" href="ui/style.css"></head>
<body><main id="app">
<header><a class="back" href="../games.html" aria-label="Back to Games">‹</a><h1>Star Colony <small id="release">SC-1a</small></h1><button id="pause">Pause</button><select id="speed" aria-label="Simulation speed"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select><span id="gear"></span></header>
<section id="resources" aria-label="Colony resources"></section>
