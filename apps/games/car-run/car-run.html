<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Car Run CRR1a</title>
  <link rel="stylesheet" href="ui/style.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="left">
      <div id="score">0 m</div>
      <div id="coins">● 0</div>
      <div class="hp-wrap"><span id="hpLabel">HP</span><div class="hp-bar"><div id="hp"></div></div><span id="hpNum">100</span></div>
    </div>
    <div class="right">
      <div id="fps">-- FPS</div>
      <div id="speed">0</div>
      <div class="nitro-wrap"><div id="nitro"></div></div>
      <div id="best">BEST 0</div>
    </div>
  </div>
  <div id="help"></div>
  <div id="overlay" class="overlay">
    <div class="card">
      <h1 id="title">CAR RUN</h1>
      <p id="msg">Press Start / Enter</p>
      <p id="sub" class="sub"></p>
      <button id="fpsBtn" class="opt" type="button">FPS: 30</button>
    </div>
  </div>
  <script src="core/config.js"></script>
  <script src="assets/car_model.js"></script>
  <script src="assets/car.js"></script>
  <script src="assets/traffic_car.js"></script>
  <script src="assets/barrier.js"></script>
  <script src="assets/cones.js"></script>
  <script src="assets/pothole.js"></script>
  <script src="assets/coin.js"></script>
  <script src="assets/smoke.js"></script>
  <script src="core/logic.js"></script>
</body>
</html>
