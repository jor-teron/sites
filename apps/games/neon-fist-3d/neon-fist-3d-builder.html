<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Neon Fist 3D — Hero Builder v0.5</title><link rel="stylesheet" href="css/nf3d.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body class="builder">
<div id="view"></div>
<aside id="panel">
  <div class="head"><a id="backBtn" href="index.html">← Back</a><b>HERO BUILDER v0.5</b></div>
  <label>Gender</label><div class="seg" data-key="gender"><button data-v="male">Male</button><button data-v="female">Female</button></div>
  <label>Build</label><div class="seg" data-key="build"><button data-v="lean">Lean</button><button data-v="average">Average</button><button data-v="muscular">Muscular</button><button data-v="fat">Fat</button></div>
  <label>Height <span id="hVal"></span></label><input type="range" id="height" min="150" max="205" step="1">
  <label>Skin</label><div id="skins" class="swatches"></div>
  <label>Hair</label><div class="seg" data-key="hair"></div>
  <label>Hair colour</label><div id="hairColors" class="swatches"></div>
  <label>Footwear</label><div class="seg" data-key="footwear"></div>
  <label>Top</label><div class="seg" data-key="top"></div>
  <label>Bottom</label><div class="seg" data-key="bottom"></div>
  <label>Headwear</label><div class="seg" data-key="headwear"></div>
  <div class="actions"><button id="randomBtn">🎲 Random</button><button id="saveJson">Save .json</button><button id="savePng">Save PNG</button>
  <label class="file">Load .json<input type="file" id="loadJson" accept=".json,application/json"></label></div>
</aside>
<script type="module" src="core/builder.js"></script>
</body></html>
