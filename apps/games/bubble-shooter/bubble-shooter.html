<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172235"><title>Bubble Shooter</title><link rel="icon" href="bubble-shooter_icon.png"><link rel="stylesheet" href="ui/style.css"></head>
<body>
<div class="app">
  <header><a class="back" href="../games.html" aria-label="Back to Games">‹</a><img src="bubble-shooter_icon.png" width="32" height="32" alt=""><h1>Bubble Shooter</h1><div class="actions"><button id="pauseBtn" title="Pause (P / Esc)">Ⅱ</button><button id="muteBtn" title="Mute sounds">♪</button><button id="helpBtn" title="How to play">?</button><span id="gear"></span></div></header>
  <section class="hud" aria-label="Game status"><div><span id="levelName">First flight</span><b id="score">0</b></div><div class="small"><span id="stage">Level 1 / 20</span><span>Best <b id="best">0</b></span></div><div class="small"><span id="pressure">Ceiling in 6 misses</span><span id="combo">Combo ×0</span></div></section>
  <main class="arena" id="arena"><canvas id="board" tabindex="0" aria-label="Bubble board. Left and right arrows to aim. Space to fire. X to swap.">Aim and match three bubbles of the same symbol.</canvas></main>
  <section class="controls"><div class="buttons"><button id="swapBtn" title="Swap current and next (X)">⇄ Swap</button><button id="fireBtn" class="primary">Fire ↑</button><button id="levelsBtn">Levels</button></div><p id="message" role="status">Drag to aim · release to fire</p><p class="keys">← → aim · Space fire · X swap · P pause</p></section>
</div>
<div id="overlay" class="overlay" hidden><section class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle" tabindex="-1"><h2 id="cardTitle">Paused</h2><div id="cardBody"></div><div id="cardButtons" class="buttons"></div></section></div>
<script src="../common/settings/games-settings.js"></script><script src="core/levels.js"></script><script src="core/rules.js"></script><script src="ui/settings.js"></script><script src="ui/sound.js"></script><script src="ui/render.js"></script><script src="core/game.js"></script>
</body></html>
