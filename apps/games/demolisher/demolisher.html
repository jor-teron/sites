<!--
  File: demolisher.html
  Project: Demolisher
  Purpose: Shell only. Styles: ui/style.css. Game code: core/*.js (plain scripts, load order below).
  Matter.js is a local copy in core/vendor/ (no CDN). SVG art: assets/{hero,villain,enemies,weapons,fx,env}/,
  listed in core/assets.js and drawn by core/sprites.js (all local files, nothing external).
  Buttons use tabindex="-1" so Enter / Space never re-click them (game keys).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Demolisher DMQ1a</title>
  <link rel="stylesheet" href="ui/style.css?v=DMQ1a" />
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat health" id="stat-health"><span class="label">HP</span><span class="value" id="hud-hp">100</span></div>
    <div class="stat"><span class="label">SCORE</span><span class="value" id="hud-score">0</span></div>
    <div class="stat"><span class="label">TARGETS</span><span class="value" id="hud-targets">0</span></div>
    <div class="stat"><span class="label">ENEMIES</span><span class="value" id="hud-enemies">0</span></div>
    <button id="btn-reset" type="button" tabindex="-1">RESET</button>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hint"></div>
    <button id="btn-pause" type="button" tabindex="-1" aria-label="Pause" hidden>❚❚</button>

    <div id="mobile-controls">
      <div class="joy joy-left" id="joy-move">
        <div class="knob" id="joy-move-knob"></div>
        <div class="label">MOVE</div>
      </div>
      <div class="joy joy-right" id="joy-aim">
        <div class="knob" id="joy-aim-knob"></div>
        <div class="label">AIM</div>
      </div>
      <button id="btn-fire" type="button" tabindex="-1">FIRE</button>
      <button id="btn-jump" type="button" tabindex="-1">JUMP</button>
    </div>

    <div id="overlay">
      <h2 id="overlay-title">DEMOLISHER</h2>
      <p id="overlay-line"></p>
      <p class="keys" id="overlay-keys"></p>
      <div class="mode-btns">
        <button id="overlay-btn" type="button" tabindex="-1">SANDBOX</button>
        <button id="overlay-btn2" class="alt" type="button" tabindex="-1">MISSION</button>
      </div>
      <div class="level-pick" id="level-pick">
        <button id="lvl-prev" type="button" tabindex="-1" aria-label="Previous level">&#8249;</button>
        <input id="lvl-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" spellcheck="false" value="00" aria-label="Level 00 to 100" />
        <button id="lvl-next" type="button" tabindex="-1" aria-label="Next level">&#8250;</button>
        <button id="lvl-go" type="button" tabindex="-1">LEVEL</button>
      </div>
      <p class="lvl-info" id="lvl-info"></p>
    </div>
  </div>

  <div id="toolbar">
    <button class="weapon active" data-w="pistol" type="button" tabindex="-1">PISTOL <span class="ammo" id="ammo-pistol">∞</span></button>
    <button class="weapon" data-w="rocket" type="button" tabindex="-1">ROCKET <span class="ammo" id="ammo-rocket">10</span></button>
    <button class="weapon" data-w="grenade" type="button" tabindex="-1">GRENADE <span class="ammo" id="ammo-grenade">5</span></button>
    <button class="weapon" data-w="laser" type="button" tabindex="-1">LASER <span class="ammo" id="ammo-laser">50</span></button>
  </div>
</div>
<script src="core/vendor/matter.min.js?v=DMQ1a"></script>
<script src="core/seed.js?v=DMQ1a"></script>
<script src="core/levels.js?v=DMQ1a"></script>
<script src="core/config.js?v=DMQ1a"></script>
<script src="core/state.js?v=DMQ1a"></script>
<script src="core/terrain.js?v=DMQ1a"></script>
<script src="core/physics.js?v=DMQ1a"></script>
<script src="core/weapons.js?v=DMQ1a"></script>
<script src="core/effects.js?v=DMQ1a"></script>
<script src="core/entities.js?v=DMQ1a"></script>
<script src="core/modes.js?v=DMQ1a"></script>
<script src="core/ui.js?v=DMQ1a"></script>
<script src="core/input.js?v=DMQ1a"></script>
<script src="core/hub.js?v=DMQ1a"></script>
<script src="core/assets.js?v=DMQ1a"></script>
<script src="core/sprites.js?v=DMQ1a"></script>
<script src="core/render.js?v=DMQ1a"></script>
<script src="core/main.js?v=DMQ1a"></script>
</body>
</html>
