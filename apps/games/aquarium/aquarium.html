<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aquarium AQQ1e</title>
  <link rel="icon" href="aquarium_icon.png" />
  <link rel="stylesheet" href="ui/aquarium.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <aside id="card" hidden role="dialog" aria-labelledby="c-name">
    <button id="close" type="button" title="Close (Esc)">&times;</button>
    <h2 id="c-name"></h2>
    <div id="c-sci"></div>
    <div id="c-state"><span id="c-mood"></span><span id="c-hunger"></span><i id="c-barbox"><b id="c-bar"></b></i></div>
    <p id="c-desc"></p>
    <ul id="c-facts"></ul>
  </aside>
  <div id="hint">Tap a fish to meet it &middot; tap near the surface to feed</div>
  <div id="note" hidden>New animals arrive soon</div>
  <div id="picker" hidden><div class="box"><h2>Choose a tank</h2><div id="tiles"></div></div></div>
  <div id="hud">
    <div class="g" title="Average mood"><span>Mood</span><i><b id="g-mood"></b></i></div>
    <div class="g" title="Water quality"><span>Water</span><i><b id="g-water"></b></i></div>
    <div class="btns"><button id="feed" type="button" aria-pressed="false">Feed</button><button id="clean" type="button">Clean</button><button id="tank" type="button" title="Choose a tank">Tank</button></div>
  </div>
  <script src="core/registry.js"></script>
  <script src="assets/species/pleco.js"></script>
  <script src="assets/species/goldfish.js"></script>
  <script src="assets/species/angelfish.js"></script>
  <script src="assets/species/clownfish.js"></script>
  <script src="assets/species/guppy.js"></script>
  <script src="assets/species/neon.js"></script>
  <script src="assets/species/crab.js"></script>
  <script src="assets/species/starfish.js"></script>
  <script src="assets/species/seahorse.js"></script>
  <script src="assets/species/jellyfish.js"></script>
  <script src="assets/species/eel.js"></script>
  <script src="assets/species/squid.js"></script>
  <script src="assets/species/octopus.js"></script>
  <script src="assets/species/ray.js"></script>
  <script src="assets/species/turtle.js"></script>
  <script src="assets/species/shark.js"></script>
  <script src="assets/tanks/freshwater.js"></script>
  <script src="assets/tanks/reef.js"></script>
  <script src="assets/tanks/deepsea.js"></script>
  <script src="assets/tanks/kelp.js"></script>
  <script src="core/sim.js"></script>
  <script src="core/behave.js"></script>
  <script src="core/move.js"></script>
  <script src="ui/fish_draw.js"></script>
  <script src="ui/render.js"></script>
  <script src="ui/hud.js"></script>
  <script src="ui/hub.js"></script>
</body>
</html>
