<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aquarium AQ1b</title>
  <link rel="icon" href="aquarium_icon.png" />
  <link rel="stylesheet" href="css/aquarium.css?v=aq1b" />
</head>
<body>
  <canvas id="c"></canvas>
  <aside id="card" hidden role="dialog" aria-labelledby="c-name">
    <button id="close" type="button" title="Close (Esc)">&times;</button>
    <h2 id="c-name"></h2>
    <div id="c-sci"></div>
    <div id="c-state"><span id="c-mood"></span><span id="c-hunger"></span><i id="c-barbox"><b id="c-bar"></b></i></div>
    <p id="c-desc"></p>
    <ul id="c-facts"></ul>
  </aside>
  <div id="hint">Tap a fish to meet it &middot; tap near the surface to feed</div>
  <div id="hud">
    <div class="g" title="Average mood"><span>Mood</span><i><b id="g-mood"></b></i></div>
    <div class="g" title="Water quality"><span>Water</span><i><b id="g-water"></b></i></div>
    <div class="btns"><button id="feed" type="button" aria-pressed="false">Feed</button><button id="clean" type="button">Clean</button></div>
  </div>
  <script src="core/fish.js?v=aq1b"></script>
  <script src="core/tank.js?v=aq1b"></script>
</body>
</html>
