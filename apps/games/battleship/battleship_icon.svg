<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Battleship">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8db8"/>
      <stop offset="1" stop-color="#1f6488"/>
    </linearGradient>
    <clipPath id="r"><rect x="8" y="8" width="112" height="112" rx="22"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="#d8c9a6"/>
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="#8a6d3b" stroke-width="3"/>
  <g clip-path="url(#r)">
    <rect x="22" y="22" width="84" height="84" fill="url(#sea)"/>
    <g stroke="rgba(255,255,255,.28)" stroke-width="1" fill="none">
      <path d="M22 43h84M22 64h84M22 85h84M43 22v84M64 22v84M85 22v84"/>
    </g>
    <!-- top-down battleship, bow to the right -->
    <g transform="translate(28 52)">
      <path d="M2 12 C 8 2, 18 1, 28 3 L 62 4 C 70 4, 74 8, 74 12 C 74 16, 70 20, 62 20 L 28 21 C 18 23, 8 22, 2 12 Z" fill="#4b5563" stroke="#1f2933" stroke-width="1.4"/>
      <rect x="30" y="6" width="14" height="12" rx="2" fill="#334155"/>
      <rect x="33" y="8" width="8" height="4" rx="1" fill="#7dd3fc"/>
      <circle cx="18" cy="12" r="5" fill="#374151" stroke="#111827" stroke-width="1"/>
      <rect x="6" y="10.5" width="10" height="1.6" fill="#111827"/>
      <rect x="6" y="12.4" width="10" height="1.6" fill="#111827"/>
      <circle cx="58" cy="12" r="4.5" fill="#374151" stroke="#111827" stroke-width="1"/>
      <rect x="58" y="10.6" width="12" height="1.5" fill="#111827"/>
      <rect x="58" y="12.4" width="12" height="1.5" fill="#111827"/>
    </g>
    <!-- a hit and a miss, so the icon reads as the game -->
    <circle cx="40" cy="88" r="3" fill="#1e3a8a"/>
    <path d="M86 36 l8 8 m0-8 l-8 8" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <path d="M24 18 v8 h8" fill="none" stroke="#8a6d3b" stroke-width="2"/>
  <path d="M104 18 v8 h-8" fill="none" stroke="#8a6d3b" stroke-width="2"/>
  <path d="M24 110 v-8 h8" fill="none" stroke="#8a6d3b" stroke-width="2"/>
  <path d="M104 110 v-8 h-8" fill="none" stroke="#8a6d3b" stroke-width="2"/>
</svg>
