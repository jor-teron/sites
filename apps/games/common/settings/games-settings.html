<!DOCTYPE html>
<!--
  apps/games/common/settings/games-settings.html — GS1 Games settings page.
  Phone-first; reads/writes window.GameSettings (games-settings.js), one key 'games.settings'.
  Open as games-settings.html?from=<game-folder> to get a Back link to that game.
  Controls are built from FIELDS below (data-driven), grouped Display/Sound/Controls/Gameplay/Data.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Settings GS1</title>
  <link rel="stylesheet" href="games-settings.css?v=GS1">
</head>
<body>
  <header class="top">
    <a id="back" class="back" href="../../games.html">‹ Games</a>
    <h1>Games Settings</h1>
  </header>
  <main id="groups"></main>
  <section class="card" id="data">
    <h2>Data</h2>
    <div class="btns">
      <button id="btnReset">Reset settings</button>
      <button id="btnExport">Export settings</button>
      <button id="btnImport">Import settings</button>
      <button id="btnClear" class="danger">Clear all game progress…</button>
    </div>
    <textarea id="json" rows="5" placeholder="Exported JSON appears here. Paste JSON and press Import." spellcheck="false"></textarea>
    <div id="confirm" class="confirm" hidden>
      <p>This deletes saves, best scores and choices of all games on this device (not these settings). Keys found:</p>
      <ul id="keyList"></ul>
      <div class="btns"><button id="btnClearYes" class="danger">Yes, clear</button><button id="btnClearNo">Cancel</button></div>
    </div>
    <p id="msg" class="msg" role="status"></p>
  </section>
  <script src="games-settings.js?v=GS1"></script>
  <script>
  (function () {
    'use strict';
    var GS = window.GameSettings;
    var $ = function (id) { return document.getElementById(id); };
    var msg = function (t) { $('msg').textContent = t; };

    /* UI description: [group, key, label, control]. Types/ranges come from GS.SCHEMA. */
    var FIELDS = [
      ['Display', 'theme', 'Theme', 'select'], ['Display', 'fpsLimit', 'FPS limit', 'select'],
      ['Display', 'lowGraphics', 'Low graphics', 'toggle'],
      ['Display', 'renderDistance', 'Render distance (3D, chunks)', 'select'], ['Display', 'pixelRatio', 'Resolution (pixel ratio)', 'select'], ['Display', 'screenShake', 'Screen shake', 'toggle'],
      ['Sound', 'masterVolume', 'Master volume', 'range'], ['Sound', 'music', 'Music', 'toggle'],
      ['Sound', 'sfx', 'Sound effects', 'toggle'], ['Sound', 'vibration', 'Vibration', 'toggle'],
      ['Controls', 'controlsSide', 'Joystick side', 'select'], ['Controls', 'joystickSize', 'Joystick size', 'range'],
      ['Controls', 'buttonOpacity', 'Button opacity', 'range'], ['Controls', 'sensitivity', 'Sensitivity', 'range'],
      ['Controls', 'showHints', 'Show control hints', 'toggle'],
      ['Controls', 'autoJump', 'Auto-jump (touch)', 'toggle'], ['Controls', 'holdRepeat', 'Hold button to repeat (touch)', 'toggle'],
      ['Gameplay', 'difficulty', 'Difficulty', 'select'], ['Gameplay', 'autoPause', 'Pause when app is hidden', 'toggle'],
      ['Gameplay', 'showFps', 'Show FPS counter', 'toggle'],
    ];
    var LABELS = { auto: 'Game default', light: 'Light', dark: 'Dark', right: 'Right', left: 'Left',
      easy: 'Easy', normal: 'Normal', hard: 'Hard', 1: '1× (fastest)', 1.5: '1.5×', 2: '2× (sharpest)' };

    // Hub look: follow the Hub's light/dark choice when the setting is 'auto'
    function applyTheme() {
      var t = GS.get('theme');
      var light = t === 'light' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.classList.toggle('light', light);
    }

    var inputs = {}, groups = {};
    FIELDS.forEach(function (f) {
      var g = groups[f[0]];
      if (!g) {
        g = groups[f[0]] = document.createElement('section');
        g.className = 'card';
        g.innerHTML = '<h2>' + f[0] + '</h2>';
        $('groups').appendChild(g);
      }
      var key = f[1], s = GS.SCHEMA[key], row = document.createElement('label'), el;
      row.className = 'row';
      row.innerHTML = '<span class="lbl">' + f[2] + '</span>';
      if (f[3] === 'select') {
        el = document.createElement('select');
        s.values.forEach(function (v) { var o = new Option(LABELS[v] || v, v); el.add(o); });
      } else if (f[3] === 'toggle') {
        el = document.createElement('input'); el.type = 'checkbox'; el.className = 'toggle';
      } else {
        el = document.createElement('input'); el.type = 'range'; el.min = s.min; el.max = s.max; el.step = 0.05;
        var out = document.createElement('output'); row.appendChild(out); el._out = out;
      }
      el.id = 'f_' + key;
      el.addEventListener(f[3] === 'range' ? 'input' : 'change', function () {
        GS.set(key, el.type === 'checkbox' ? el.checked : el.value);
      });
      row.appendChild(el);
      g.appendChild(row);
      inputs[key] = el;
    });

    /* Show current values (also after reset/import/other tab). */
    function render() {
      var a = GS.all();
      for (var k in inputs) {
        var el = inputs[k];
        if (el.type === 'checkbox') el.checked = a[k]; else el.value = a[k];
        if (el._out) el._out.textContent = k === 'masterVolume' || k === 'buttonOpacity' ? Math.round(a[k] * 100) + '%' : Number(a[k]).toFixed(2) + '×';
      }
      applyTheme();
    }
    GS.onChange(render);
    render();

    // Back link: ?from=<game folder> (letters, digits, '-' only, so it can't point elsewhere)
    var from = new URLSearchParams(location.search).get('from');
    if (from && /^[a-z0-9-]+$/i.test(from)) {
      $('back').href = '../../' + from + '/index.html';
      $('back').textContent = '‹ Back to game';
    }

    // Data buttons
    $('btnReset').onclick = function () { GS.reset(); msg('Settings reset to defaults.'); };
    $('btnExport').onclick = function () {
      $('json').value = JSON.stringify(GS.all(), null, 2);
      $('json').select();
      try { navigator.clipboard && navigator.clipboard.writeText($('json').value).catch(function () {}); } catch (e) {}
      msg('Exported (also copied if allowed).');
    };
    $('btnImport').onclick = function () {
      var obj;
      try { obj = JSON.parse($('json').value); } catch (e) { msg('That is not valid JSON.'); return; }
      msg('Imported ' + GS.importAll(obj) + ' settings.');
    };
    $('btnClear').onclick = function () {
      var ks = GS.progressKeys();
      $('keyList').innerHTML = ks.length ? ks.map(function (k) { return '<li>' + k.replace(/</g, '&lt;') + '</li>'; }).join('') : '<li>(none found)</li>';
      $('confirm').hidden = false;
    };
    $('btnClearNo').onclick = function () { $('confirm').hidden = true; };
    $('btnClearYes').onclick = function () {
      var ks = GS.clearGameProgress();
      $('confirm').hidden = true;
      msg('Cleared ' + ks.length + ' game save keys.');
    };
  })();
  </script>
</body>
</html>
