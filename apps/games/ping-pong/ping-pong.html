<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ping Pong PPR1a</title>
  <!--
    ========================================================================
    Ping Pong — HTML + CSS + JS (split: ping-pong.css, ping-pong_config.js, ping-pong_logic.js)
    Author: Jor Teron
    Description:
      Classic two-paddle Pong on a canvas that fills the page. Left paddle is
      the human player, right paddle a lightweight AI. First to
      PONG_CONFIG.WIN_SCORE wins. Controls: see PONG_CONFIG.keys; touch / mouse:
      drag on the left half moves the left paddle, a touch on the right half
      makes it a 2-player match (PONG_CONFIG.touch), tap = start / resume.
      Cache-busting: bump ?v= on the CSS / JS below when they change.
      In the sites hub the own title / score bar hides and the hub header
      shows name, version, score and New Game (hub bridge in ping-pong_logic.js).
    ========================================================================
  -->
  <link rel="stylesheet" href="ping-pong.css?v=PPR1a" />
</head>
<body>
  <!-- Own bar: title + live score (hidden inside the hub) -->
  <div id="topbar">
    <h1>Ping Pong</h1>
    <div id="hud">0 — 0</div>
  </div>

  <!-- Drawing surface (sized to the page by ping-pong_logic.js) + pause button in its corner -->
  <div id="court-wrap">
    <canvas id="court"></canvas>
    <button type="button" id="pause-btn" aria-label="Pause">⏸</button>
  </div>

  <script src="ping-pong_config.js?v=PPR1a"></script>
  <script src="ping-pong_logic.js?v=PPR1a"></script>
</body>
</html>
