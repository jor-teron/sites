<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ant Farm v0.4</title>
  <link rel="icon" href="ant-farm_icon.png" />
  <link rel="stylesheet" href="ui/ant-farm.css" />
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('games.settings'); if (t) t = (JSON.parse(t) || {}).theme || ''; } catch (_) { t = ''; }
      if (!t || t === 'auto') { try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { t = ''; }
        t = t ? t : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
      document.documentElement.className = t === 'light' ? 'light' : 'dark';
    })();
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <header id="bar">
    <a id="back" href="../" title="Games">&#8592;</a>
    <b>ANT FARM</b> <span id="ver">v0.4</span>
    <select id="tool" title="Tap tool">
      <option value="food">Food</option>
      <option value="water">Water</option>
    </select>
    <button id="pause" type="button">Pause</button>
    <button id="reset" class="wide-only" type="button">Reset</button>
    <label class="speed-wrap" title="Speed"><span class="wide-only">Speed</span> <input id="speed" type="range" min="0" max="6" step="1" value="2" /></label>
    <button id="moreBtn" type="button" title="More" aria-expanded="false">&#8943;</button>
  </header>
  <div id="more" hidden>
    <label><input id="trails" type="checkbox" checked /> Trails</label>
    <div class="row">
      <input id="seed" type="number" title="Colony seed" />
      <button id="newc" type="button">New colony</button>
    </div>
    <div class="row">
      <button id="resetPhone" class="phone-reset" type="button">Reset</button>
      <button id="fit" type="button">Fit farm</button>
      <button id="fill" type="button">Fill view</button>
    </div>
  </div>
  <div id="stats"></div>
  <script src="../common/settings/games-settings.js"></script>
  <script src="ui/settings.js"></script>
  <script src="core/world.js"></script>
  <script src="core/colony.js"></script>
  <script src="assets/models/ant.js"></script>
  <script src="assets/draw/soil.js"></script>
  <script src="assets/draw/surface.js"></script>
  <script src="assets/draw/chamber.js"></script>
  <script src="assets/draw/frame.js"></script>
  <script src="core/render.js"></script>
  <script src="core/ui.js"></script>
</body>
</html>
