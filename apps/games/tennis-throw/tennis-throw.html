<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tennis Ball Blitz TB8</title>
  <link rel="stylesheet" href="tennis-throw.css?v=TB8" />
</head>
<body>
  <div class="container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="ui">
      <div class="score">Score <span id="scoreValue">0</span> <span class="combo" id="comboValue"></span><br><small>Best <span id="bestValue">0</span></small></div>
      <div class="round">Round <span id="roundValue">1</span><br><small><span id="goalValue">0/0</span></small></div>
      <div class="timer">⏱ <span id="timerValue">0</span>s</div>
    </div>
    <div class="end-screen" id="endScreen">
      <div id="endTitle">TIME UP!</div>
      <div class="badge" id="badge">🥇</div>
      <div class="rank" id="rankText">GOLD</div>
      <div class="time-display">Round <span id="finalRound">1</span> · Score <span id="finalScore">0</span> · Best <span id="finalBest">0</span></div>
      <div class="restart-hint">Press SPACE / ENTER to play again</div>
    </div>
    <div class="controls-hint">
      ← → aim | ↑ ↓ power | SPACE throw | ENTER pause | R reset aim | ESC new game
    </div>
  </div>

  <!-- TB2: classic scripts sharing window.TT (ES modules are blocked on file://). Order matters. -->
  <!-- TB4/GS1: shared Games settings (optional: if it fails to load, modules/settings.js uses defaults) -->
  <script src="../common/settings/games-settings.js?v=GS1"></script>
  <script src="tennis-throw_config.js?v=TB8"></script>
  <script src="modules/state.js?v=TB8"></script>
  <script src="modules/targets.js?v=TB8"></script>
  <script src="modules/physics.js?v=TB8"></script>
  <script src="modules/rounds.js?v=TB8"></script>
  <script src="modules/render.js?v=TB8"></script>
  <script src="modules/input.js?v=TB8"></script>
  <script src="modules/settings.js?v=TB8"></script>
  <script src="modules/loop.js?v=TB8"></script>
  <script src="tennis-throw_logic.js?v=TB8"></script>
</body>
</html>
