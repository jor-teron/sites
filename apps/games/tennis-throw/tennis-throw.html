<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tennis Ball Blitz TB9 NIX-G2</title>
  <link rel="stylesheet" href="ui/style.css" />
</head>
<body>
  <div class="container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="ui">
      <div class="score">Score <span id="scoreValue">0</span> <span class="combo" id="comboValue"></span><br><small>Best <span id="bestValue">0</span></small></div>
      <div class="round">Round <span id="roundValue">1</span><br><small><span id="goalValue">0/0</span></small></div>
      <div class="timer">⏱ <span id="timerValue">0</span>s</div>
    </div>
    <div class="end-screen" id="endScreen">
      <div id="endTitle">TIME UP!</div>
      <div class="badge" id="badge">🥇</div>
      <div class="rank" id="rankText">GOLD</div>
      <div class="time-display">Round <span id="finalRound">1</span> · Score <span id="finalScore">0</span> · Best <span id="finalBest">0</span></div>
      <div class="restart-hint">Press SPACE / ENTER to play again</div>
    </div>
    <div class="controls-hint">
      ← → aim | ↑ ↓ power | SPACE throw | ENTER pause | R reset aim | ESC new game
    </div>
  </div>

  <!-- TB2: classic scripts sharing window.TT (ES modules are blocked on file://). Order matters. -->
  <!-- TB4/GS1: shared Games settings (optional: if it fails to load, ui/settings.js uses defaults) -->
  <script src="../common/settings/games-settings.js"></script>
  <script src="core/config.js"></script>
  <script src="core/state.js"></script>
  <script src="core/targets.js"></script>
  <script src="core/physics.js"></script>
  <script src="core/rounds.js"></script>
  <script src="ui/fx.js"></script>
  <script src="ui/sound.js"></script>
  <script src="ui/render.js"></script>
  <script src="ui/input.js"></script>
  <script src="ui/settings.js"></script>
  <script src="core/loop.js"></script>
  <script src="core/logic.js"></script>
</body>
</html>
