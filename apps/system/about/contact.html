<!DOCTYPE html>
<!-- Old Contact entry: the Contact card is in Settings → About. Redirects to Settings → About (apps/system/settings/#about). Keeps ?query; the hash is always #about. H78: no visible body; colours follow the Hub theme. Legacy: visible "Contact" link in <body>. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <style>html,body{margin:0;background:#fff;color:#202124}html.dark,html.dark body{background:#121418;color:#9aa0a6}html.dark a{color:#6ea8fe}</style>
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { /* blocked */ }
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.className = 'dark';
      location.replace('../settings/' + location.search + '#about');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=../settings/#about"></noscript>
</head>
<body><noscript><p><a href="../settings/#about">Open Contact</a></p></noscript></body>
</html>
