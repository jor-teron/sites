<!doctype html>
<!--
  Terminal (apps/system/terminal/index.html), T1 + T2 + T3 — a small command line for the Hub: prompt
  hub@hub:<folder>$, history (up / down, kept in localStorage 'hub-terminal.history'), Tab completion,
  Ctrl+L clear, Ctrl+C cancel line. Commands: help, clear, echo, date, history, apps, open, build, theme
  and (T2) pwd, cd, ls, cat, head, tail, wc, tree, stat, drives, allow on the unix-style tree
  /drive/local, /drive/gdrive, /drive/<folder>, and (T3, change files) mkdir, touch, cp, mv, rm, rmdir, edit
  (full-screen editor), find, grep and the redirects > and >>, and (T5) BusyBox: ls /bin, sed, awk, sort, ...
  with pipes |, < and >, the read-only /etc; (T6) ~/.hubrc, alias, export, $VAR, ssh; (T7) BusyBox in a Web Worker (terminal_worker.js), streamed output, Ctrl+C stops it (terminal_bb.js loads bin/busybox.js + bin/busybox.wasm on first use). Fixed look (near-black + terminal green), whatever the
  Hub theme is. Scripts: terminal_wr.js + terminal_edit.js + terminal_fs.js + terminal_etc.js + terminal_bb.js + terminal_rc.js + terminal.js; the files come from the shared code (shared/fs:
  fs_drives, fs_ops, filetypes, fs_ref; shared/google for the Drive mount, same set as the Viewer app);
  the app list comes from hub/core/hub_appindex.js (generated; also works on file://).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#050a06" />
  <title>Terminal</title>
  <link rel="icon" href="terminal_icon.png" />
  <link rel="stylesheet" href="terminal.css" />
  <script src="../../../shared/theme/hub_theme.js" data-own-key="hub-terminal.theme"></script>
</head>
<body>
  <main id="term" class="term" aria-label="Terminal">
    <div id="out" class="out" role="log" aria-live="polite"></div>
    <form id="line" class="line" autocomplete="off"><!-- no whitespace between children: the line is pre-wrap
      --><span id="ps" class="ps" aria-hidden="true">hub@hub:~$&nbsp;</span><span id="before"></span><span id="cur" class="cur"> </span><span id="after"></span><input
        id="in" class="in" type="text" aria-label="Command" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" enterkeyhint="send" /></form>
  </main>
  <script src="../../../hub/core/hub_appindex.js"></script>
  <script src="../../../shared/google/google_config.js"></script>
  <script src="../../../shared/google/google_auth.js"></script>
  <script src="../../../shared/google/gdrive_fs.js"></script>
  <script src="../../../shared/fs/fs_drives.js"></script>
  <script src="../../../shared/fs/fs_ops.js"></script>
  <script src="../../../shared/fs/filetypes.js"></script>
  <script src="../../../shared/fs/fs_ref.js"></script>
  <script src="terminal_wr.js"></script>
  <script src="terminal_edit.js"></script>
  <script src="terminal_fs.js"></script>
  <script src="terminal_etc.js"></script>
  <script src="terminal_bb.js"></script>
  <script src="terminal_rc.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
