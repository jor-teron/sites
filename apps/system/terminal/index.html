<!doctype html>
<!--
  Terminal (apps/system/terminal/index.html), T1 + T2 — a small command line for the Hub: prompt
  jor@hub:<folder>$, history (up / down, kept in localStorage 'hub-terminal.history'), Tab completion,
  Ctrl+L clear, Ctrl+C cancel line. Commands: help, clear, echo, date, history, apps, open, build, theme
  and (T2, read only) pwd, cd, ls, cat, head, tail, wc, tree, stat, drives, allow on the unix-style tree
  /drive/local, /drive/gdrive, /drive/<folder>. Fixed look (near-black + terminal green), whatever the
  Hub theme is. Scripts: terminal_fs.js + terminal.js; the files come from the shared code (shared/fs:
  fs_drives, fs_ops, filetypes, fs_ref; shared/google for the Drive mount, same set as the Viewer app);
  the app list comes from hub/core/hub_appindex.js (generated; also works on file://).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#050a06" />
  <title>Terminal</title>
  <link rel="icon" href="terminal_icon.png" />
  <link rel="stylesheet" href="terminal.css?v=20261023i" />
</head>
<body>
  <main id="term" class="term" aria-label="Terminal">
    <div id="out" class="out" role="log" aria-live="polite"></div>
    <form id="line" class="line" autocomplete="off"><!-- no whitespace between children: the line is pre-wrap
      --><span id="ps" class="ps" aria-hidden="true">jor@hub:~$&nbsp;</span><span id="before"></span><span id="cur" class="cur"> </span><span id="after"></span><input
        id="in" class="in" type="text" aria-label="Command" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" enterkeyhint="send" /></form>
  </main>
  <script src="../../../hub/core/hub_appindex.js?v=20261023i"></script>
  <script src="../../../shared/google/google_config.js?v=20261019r"></script>
  <script src="../../../shared/google/google_auth.js?v=20261019r"></script>
  <script src="../../../shared/google/gdrive_fs.js?v=20261019r"></script>
  <script src="../../../shared/fs/fs_drives.js?v=20261019r"></script>
  <script src="../../../shared/fs/fs_ops.js?v=20261019r"></script>
  <script src="../../../shared/fs/filetypes.js?v=20261019r"></script>
  <script src="../../../shared/fs/fs_ref.js?v=20261019r"></script>
  <script src="terminal_fs.js?v=20261023i"></script>
  <script src="terminal.js?v=20261023i"></script>
</body>
</html>
