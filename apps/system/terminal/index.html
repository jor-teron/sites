<!doctype html>
<!--
  Terminal (apps/system/terminal/index.html), T1 — a small command line for the Hub: prompt hub:~$,
  history (up / down, kept in localStorage 'hub-terminal.history'), Tab completion, Ctrl+L clear,
  Ctrl+C cancel line. Commands: help, clear, echo, date, history, apps, open, build, theme.
  Fixed look (near-black + terminal green), whatever the Hub theme is. Scripts: terminal.js;
  the app list comes from hub/core/hub_appindex.js (generated; also works on file://).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#050a06" />
  <title>Terminal</title>
  <link rel="icon" href="terminal_icon.png" />
  <link rel="stylesheet" href="terminal.css?v=20261023f" />
</head>
<body>
  <main id="term" class="term" aria-label="Terminal">
    <div id="out" class="out" role="log" aria-live="polite"></div>
    <form id="line" class="line" autocomplete="off"><!-- no whitespace between children: the line is pre-wrap
      --><span class="ps" aria-hidden="true">hub:~$&nbsp;</span><span id="before"></span><span id="cur" class="cur"> </span><span id="after"></span><input
        id="in" class="in" type="text" aria-label="Command" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" enterkeyhint="send" /></form>
  </main>
  <script src="../../../hub/core/hub_appindex.js?v=20261023f"></script>
  <script src="terminal.js?v=20261023f"></script>
</body>
</html>
