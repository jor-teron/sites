<!doctype html>
<!--
  Settings app (apps/system/settings/index.html) — Hub settings: Wallpaper, Desktop, Windows, Sizes, Look, API Keys (H28), How-to, About.
  Sections list left, options right (phone: list first, tap into a section, ‹ Back).
  Choices are saved in localStorage (settings_store.js) and the Hub applies them live
  (hub/core/hub_prefs.js, storage event + postMessage). Deep link: index.html#about etc.
  Files: settings.css, settings_store.js, settings.js (shell), sec_*.js (one per section).
-->

</head>

      <div id="nav" class="nav"></div>
    </nav>
    <main class="pane">
      <header class="pane-head">
        <button type="button" id="back" class="back" aria-label="Back to sections">&#8249; Back</button>

      </header>
      <div id="pane" class="pane-body"></div>

  </div>
  <script src="../../../shared/wallpaper/wallpapers.js?v=20261020a"></script>

  <script src="sec_wallpaper.js?v=20261020a"></script>
  <script src="sec_desktop.js?v=20261023n"></script>
