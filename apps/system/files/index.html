<!doctype html>
<!--
  Files (apps/system/files/index.html) — file explorer for the Hub's drives: "Local" (the
  browser's private storage for this site) and folders added with "Add folder" (Chrome / Edge
  on a computer). Grid / list, sort, search, multi-select, cut / copy / paste and drag & drop
  (also between drives), upload by drop, right-click / long-press menu, keyboard, viewers.
  Shared: shared/fs/fs_drives.js (drives), shared/fs/fs_ops.js (file operations),
  shared/google/* (Google Drive drive: QR sign-in + Drive adapter; shared/vendor/qrcode.js),
  shared/dialog/ (ask / confirm / choose), shared/ctxmenu/ (menu).
  App: files_core.js (state + helpers), files_view.js (grid / list, selection, drag & drop),
  files_marquee.js (H124: mouse drag-to-select box),
  files_drives.js (drives, path, hash), files_actions.js (operations, Open with), files_viewer.js
  (text view), files_thumbs.js (previews; cache shared/fs/thumbs_store.js), files_menu.js (menu + keys), files.js (start-up), files.css.
  Open with: shared/fs/filetypes.js (which app) + shared/fs/fs_ref.js (hand the file to the
  Viewer, apps/system/viewer/, in its own window); text → Notely.
  H126: files_tabs.js (browser-style tabs above the path bar; saved in localStorage sites-hub.filesTabs).
  Deep link: index.html#drive=local&path=Docs/Sub (the Hub uses it; a window session keeps it).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Files</title>
  <link rel="stylesheet" href="../../../shared/dialog/dialog.css" />
  <link rel="stylesheet" href="../../../shared/ctxmenu/ctxmenu.css" />
  <link rel="stylesheet" href="../../../shared/google/google.css" />
  <link rel="stylesheet" href="files.css" />
  <script src="../../../shared/theme/hub_theme.js"></script>
</head>
<body>
  <div class="app">
    <aside class="side">
      <h1 class="side-title"><img src="files_icon.png" alt="" /> Files</h1>
      <div id="drives" class="drives" role="list" aria-label="Drives"></div>
      <!-- H109: quick links (folders on the Local drive) + footer (Manage drives, storage meter) -->
      <nav id="quick" class="quick" aria-label="Quick access" hidden></nav>
      <div class="side-foot">
        <div id="manage-slot"></div>
        <div id="storage" class="storage" hidden><b><i></i></b><span></span></div>
      </div>
    </aside>
    <main class="main">
      <!-- H126: tabs (files_tabs.js): one tab per open folder, + = new tab -->
      <div id="tabs" class="tabs"></div>
      <!-- H106: Explorer-style toolbar. Row 1: Back / Forward / Up, path (breadcrumbs), search.
           Row 2: commands (New folder, Upload, Sort, View, Refresh, More). Icons: inline SVG (currentColor). -->
      <div class="bar nav-bar">
        <button type="button" id="back" class="tb ico" title="Back (Alt+Left)" aria-label="Back" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button type="button" id="fwd" class="tb ico" title="Forward (Alt+Right)" aria-label="Forward" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <button type="button" id="up" class="tb ico" title="Up one folder (Alt+Up or Backspace)" aria-label="Up one folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <div class="path"><svg class="path-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><nav id="crumbs" class="crumbs" aria-label="Path"></nav></div>
        <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input type="search" id="search" class="search" placeholder="Search this folder" aria-label="Search this folder" /></label>
      </div>
      <div class="bar cmd-bar">
        <button type="button" id="mkdir" class="tb" title="New folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v6M9 13h6"/></svg><span>New folder</span></button>
        <button type="button" id="upload" class="tb" title="Upload files (or drop them here)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span>Upload</span></button>
        <span class="cmd-sep" aria-hidden="true"></span>
        <label class="tb sort-box" title="Sort"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M14 6h7M14 11h5M14 16h3"/></svg>
          <select id="sort" class="sort" aria-label="Sort">
            <option value="name-asc">Name (A&#8211;Z)</option>
            <option value="name-desc">Name (Z&#8211;A)</option>
            <option value="size-asc">Size (smallest)</option>
            <option value="size-desc">Size (largest)</option>
            <option value="modified-desc">Date (newest)</option>
            <option value="modified-asc">Date (oldest)</option>
          </select></label>
        <div id="view" class="seg" role="group" aria-label="View">
          <button type="button" data-v="grid" title="Grid view" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Grid</span></button>
          <button type="button" data-v="list" title="List view" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>List</span></button>
        </div>
        <span id="selinfo" class="selinfo" aria-live="polite"></span>
        <button type="button" id="refresh" class="tb ico" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
        <button type="button" id="more" class="tb ico" title="More actions" aria-label="More actions"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
        <input type="file" id="file-in" multiple hidden />
      </div>
      <div id="msg" class="msg" hidden role="status"></div>
      <div id="gd-panel" class="gd-panel" hidden></div>
      <div id="list" class="list v-grid" role="listbox" aria-multiselectable="true" aria-label="Files"></div>
      <div id="status" class="status" hidden aria-live="polite"><span></span><span class="status-sel"></span></div>   <!-- H107 -->
      <div id="prog" class="prog" hidden><span></span><b><i></i></b><button type="button" class="tb">Stop</button></div>
    </main>
  </div>
  <script src="../../../shared/vendor/qrcode.js"></script>
  <script src="../../../shared/google/google_config.js"></script>
  <script src="../../../shared/google/google_auth.js"></script>
  <script src="../../../shared/google/gdrive_fs.js"></script>
  <script src="../../../shared/google/google_gis.js"></script>
  <script src="../../../shared/google/phonekey.js"></script>
  <script src="../../../shared/google/gdrive_connect.js"></script>
  <script src="../../../shared/fs/webdav_fs.js"></script>
  <script src="../../../shared/fs/webdav_accounts.js"></script>
  <script src="../../../shared/fs/sftp_fs.js"></script><!-- H119: SFTP drives -->
  <script src="../../../shared/fs/sftp_accounts.js"></script>
  <script src="../../../shared/fs/fs_drives.js"></script>
  <script src="../../../shared/fs/fs_ops.js"></script>
  <script src="../../../shared/fs/filetypes.js"></script>
  <script src="../../../shared/fs/fs_ref.js"></script>
  <script src="../../../shared/fs/thumbs_store.js"></script>
  <script src="../../../shared/dialog/dialog.js"></script>
  <script src="../../../shared/ctxmenu/ctxmenu.js"></script>
  <script src="files_core.js"></script>
  <script src="files_view.js"></script>
  <script src="files_marquee.js"></script><!-- H124: drag-to-select box -->
  <script src="files_drives.js"></script>
  <script src="files_actions.js"></script>
  <script src="files_viewer.js"></script>
  <script src="files_thumbs.js"></script>
  <script src="files_menu.js"></script>
  <script src="files_tabs.js"></script><!-- H126: tabs -->
  <script src="files.js"></script>
</body>
</html>
