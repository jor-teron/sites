<!DOCTYPE html>
<!--
  Agent — image.html: the Image page (AG15; was the AG14 slide-over inside agent.html). Own URL, Back works; '← Chat' goes to agent.html.
  Provider tabs (only ready ones): Pollinations (free, no key, 50 s cooldown), Gemini, DeepInfra, OpenRouter (each when its key exists; AG16), Ollama.
  AG25: visible Hub image providers via the shared bridge; local fallbacks retained.
  Same settings (localStorage 'agent.settings'), keys (Hub first, app/core/hubkeys.js) and gallery (IndexedDB 'agent-images').
  AG17: Steps on every tab, size chips (app/gui/imagesize.js), prices in the picker, prompt filenames, Recent models.
  AG19: top row = Provider + Model dropdowns (no tabs); Ratio / Size / Steps as one compact line of dropdowns.
  AG21: download name = [model]_[prompt].png (real extension kept).
  AG20: ☆/★ favourite models (⭐ Favourites group on top), full-screen viewer (app/gui/imageviewer.js).
  AG42: app/gui/confirm.js before the viewer. Delete confirms in-app; the viewer rebuilds from gallery()'s new picture URLs.
  Scripts: hubkeys, presets, registry (keys + Ollama URL), settings (HR.set only), imagegen + img_* providers, imagestore, imagepage.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111318">
  <title>Agent · Image</title>
  <link rel="icon" href="agent_icon.png">
  <link rel="stylesheet" href="ui/main.css">
  <link rel="stylesheet" href="ui/components.css">
  <link rel="stylesheet" href="ui/modelbar.css">
  <link rel="stylesheet" href="ui/imagepage.css">
  <script src="../../../shared/theme/hub_theme.js"></script>
  <script>try{var s=JSON.parse(localStorage.getItem('agent.settings')||localStorage.getItem('harness.settings')||'{}'),m=s.theme||'dark';document.documentElement.dataset.ht=m==='light'?'light':m==='system'?(localStorage.getItem('sites-hub.theme')==='light'?'light':'dark'):'dark'}catch(e){document.documentElement.dataset.ht='dark'}</script>
</head>
<body class="igbody">
<header class="top ig-top">
  <a class="hb ig-back" id="imgBack" href="agent.html" aria-label="Back to chat" title="Back to chat">← <span class="ig-bt">Chat</span></a>
  <span class="mbar">   <!-- AG19: Provider + Model dropdowns, same look as the chat top row (ui/modelbar.css) -->
    <select id="imgProv" class="mb-sel mb-prov" aria-label="Image provider"></select>
    <select id="imgModel" class="mb-sel mb-model" aria-label="Image model"></select>
    <button type="button" class="hb mb-find ig-fav" id="imgFav" title="Add to favourites" aria-label="Add to favourites" aria-pressed="false">☆</button>
  </span>
</header>
<main class="ig-body">
  <p id="imgNote" class="hint ig-note"></p>
  <textarea id="imgPrompt" class="inp ig-prompt" rows="3" placeholder="Describe a picture to make…" aria-label="Picture prompt"></textarea>
  <div class="ig-line">   <!-- AG19: one compact line: Ratio, Size (or Custom W / H), Steps -->
    <select id="imgRatio" class="ig-dd" aria-label="Shape" title="Shape"></select>
    <select id="imgSize" class="ig-dd" aria-label="Size"></select>
    <span id="imgCustom" class="ig-cust" hidden><input id="imgW" class="ig-dd ig-num" type="number" min="256" max="4096" step="16" aria-label="Width" title="Width"><span>×</span><input id="imgH" class="ig-dd ig-num" type="number" min="256" max="4096" step="16" aria-label="Height" title="Height"></span>
    <select id="imgSteps" class="ig-dd" aria-label="Steps" title="Steps"></select>
  </div>
  <p id="imgSizeNote" class="hint ig-note"></p>
  <button type="button" class="hb ig-go" id="imgGo">✨ Generate</button>
  <div id="imgBar" class="ig-bar" hidden><span class="mt-bar"><i id="imgFill"></i></span><span id="imgStep" class="mt-t"></span></div>
  <div id="imgCard" class="ig-card" hidden></div>
  <h3 class="ig-h">Gallery</h3>
  <p id="imgEmpty" class="hint">No pictures yet. They stay in this browser, apart from your chats.</p>
  <div id="imgGrid" class="ig-grid"></div>
</main>
<dialog id="imgView" class="iv" aria-label="Picture" tabindex="-1">   <!-- AG20: full-screen viewer (app/gui/imageviewer.js) -->
  <div class="iv-top"><span id="ivCount" class="iv-n"></span><span class="grow"></span><button type="button" class="iv-b" id="ivX" title="Close (Esc)" aria-label="Close">✕</button></div>
  <div class="iv-stage" id="ivStage"><img id="ivImg" alt="" draggable="false"></div>
  <button type="button" class="iv-side iv-prev" id="ivPrev" title="Previous (←)" aria-label="Previous picture">‹</button>
  <button type="button" class="iv-side iv-next" id="ivNext" title="Next (→)" aria-label="Next picture">›</button>
  <div class="iv-bar"><p id="ivCap" class="iv-cap"></p><a id="ivDl" class="iv-b iv-w" href="#">⬇ Download</a><button type="button" class="iv-b iv-w" id="ivDel">🗑 Delete</button></div>
</dialog>
<script>window.HR = window.HR || {};</script>
<script src="app/api/host.js"></script>   <!-- AG37: Agent's own provider runtime (Hub Builder 1 code, app namespace) -->
<script src="app/api/hub/hub_credentials.js"></script>
<script src="app/api/hub/hub_keys.js"></script>
<script src="app/api/hub/hub_providers.js"></script>
<script src="app/api/hub/hub_embeddings.js"></script>
<script src="app/api/hub/hub_api.js"></script>
<script src="app/api/legacy.js"></script>
<script src="app/core/hubkeys.js"></script>
<script src="app/core/hubapi.js"></script>
<script src="app/models/presets.js"></script>
<script src="app/models/registry.js"></script>
<script src="app/gui/settings.js"></script>
<script src="app/storage/fs.js"></script>   <!-- AG39: image usage goes to the same agent/usage/ file as chat -->
<script src="app/storage/usage.js"></script>
<script src="app/models/imagegen.js"></script>
<script src="app/models/img_pollinations.js"></script>
<script src="app/models/img_gemini.js"></script>
<script src="app/models/img_deepinfra.js"></script>
<script src="app/models/img_openrouter.js"></script>
<script src="app/models/img_ollama.js"></script>
<script src="app/storage/imagestore.js"></script>
<script src="app/gui/imagesize.js"></script>
<script src="app/gui/confirm.js"></script>   <!-- AG42: HR.confirm, native dialog above the picture viewer -->
<script src="app/gui/imageviewer.js"></script>
<script src="app/gui/imagepage.js"></script>
<script>
  HR.set.applyTheme();
  document.getElementById('imgBack').onclick = function (e) {   /* came from chat: real Back keeps its state */
    try { if (document.referrer && new URL(document.referrer).pathname.slice(-10) === 'agent.html' && history.length > 1) { e.preventDefault(); history.back(); } } catch (x) {}
  };
  Promise.race([HR.hubKeys.load().catch(function () {}), new Promise(function (r) { setTimeout(r, 1500); })]).then(function () { return HR.fs.init().catch(function () {}); }).then(function () { HR.imgpage.init(); });   /* AG39: folder known before usage writes */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('agent_sw.js', { scope: './', updateViaCache: 'none' }).catch(function () {});
</script>
</body>
</html>
