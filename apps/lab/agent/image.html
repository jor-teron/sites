<!DOCTYPE html>
<!--
  Agent — image.html: the Image page (AG15; was the AG14 slide-over inside agent.html). Own URL, Back works; '← Chat' goes to agent.html.
  Provider tabs (only ready ones): Pollinations (free, no key, 50 s cooldown), Gemini, DeepInfra, OpenRouter (each when its key exists; AG16), Ollama.
  Same settings (localStorage 'agent.settings'), keys (Hub first, app/core/hubkeys.js) and gallery (IndexedDB 'agent-images').
  AG17: Steps on every tab, size chips (app/gui/imagesize.js), prices in the picker, prompt filenames, Recent models.
  Scripts: hubkeys, presets, registry (keys + Ollama URL), settings (HR.set only), imagegen + img_* providers, imagestore, imagepage.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111318">
  <title>Agent · Image</title>
  <link rel="icon" href="agent_icon.png">
  <link rel="stylesheet" href="ui/main.css">
  <link rel="stylesheet" href="ui/components.css">
  <link rel="stylesheet" href="ui/imagepage.css">
  <script src="../../../shared/theme/hub_theme.js"></script>
  <script>try{var s=JSON.parse(localStorage.getItem('agent.settings')||localStorage.getItem('harness.settings')||'{}'),m=s.theme||'dark';document.documentElement.dataset.ht=m==='light'?'light':m==='system'?(localStorage.getItem('sites-hub.theme')==='light'?'light':'dark'):'dark'}catch(e){document.documentElement.dataset.ht='dark'}</script>
</head>
<body class="igbody">
<header class="top">
  <a class="hb ig-back" id="imgBack" href="agent.html" aria-label="Back to chat">← Chat</a>
  <h1 class="brand">🖼 Image</h1>
  <span class="grow"></span>
</header>
<main class="ig-body">
  <div id="imgTabs" class="ig-tabs" role="tablist" aria-label="Image provider"></div>
  <p id="imgNote" class="hint ig-note"></p>
  <textarea id="imgPrompt" class="inp ig-prompt" rows="3" placeholder="Describe a picture to make…" aria-label="Picture prompt"></textarea>
  <div class="ig-opts">
    <label class="lbl">Model <select id="imgModel" class="inp" aria-label="Image model"></select></label>
    <label class="lbl" id="imgStepsL">Steps <input id="imgSteps" class="inp num" type="number" min="1" max="50" step="1"></label>
    <span id="imgStepsNote" class="ig-size"></span>
  </div>
  <div id="imgSizes" class="ig-sizes" role="group" aria-label="Picture size"></div>
  <div id="imgCustom" class="ig-opts" hidden><label class="lbl">Width <input id="imgW" class="inp num" type="number" min="256" max="4096" step="16"></label><label class="lbl">Height <input id="imgH" class="inp num" type="number" min="256" max="4096" step="16"></label></div>
  <p id="imgSizeNote" class="hint ig-note"></p>
  <button type="button" class="hb ig-go" id="imgGo">✨ Generate</button>
  <div id="imgBar" class="ig-bar" hidden><span class="mt-bar"><i id="imgFill"></i></span><span id="imgStep" class="mt-t"></span></div>
  <div id="imgCard" class="ig-card" hidden></div>
  <h3 class="ig-h">Gallery</h3>
  <p id="imgEmpty" class="hint">No pictures yet. They stay in this browser, apart from your chats.</p>
  <div id="imgGrid" class="ig-grid"></div>
</main>
<dialog id="imgView" class="dlg ig-view" aria-label="Picture">
  <img id="imgBig" alt="">
  <p id="imgCap" class="hint"></p>
  <div class="ec-row"><a id="imgDl" class="hb wide ig-a" href="#">⬇ Download</a><button type="button" class="hb wide" id="imgDel">🗑 Delete</button><button type="button" class="hb wide" id="imgViewX">✕ Close</button></div>
</dialog>
<script>window.HR = window.HR || {};</script>
<script src="app/core/hubkeys.js"></script>
<script src="app/models/presets.js"></script>
<script src="app/models/registry.js"></script>
<script src="app/gui/settings.js"></script>
<script src="app/models/imagegen.js"></script>
<script src="app/models/img_pollinations.js"></script>
<script src="app/models/img_gemini.js"></script>
<script src="app/models/img_deepinfra.js"></script>
<script src="app/models/img_openrouter.js"></script>
<script src="app/models/img_ollama.js"></script>
<script src="app/storage/imagestore.js"></script>
<script src="app/gui/imagesize.js"></script>
<script src="app/gui/imagepage.js"></script>
<script>
  HR.set.applyTheme();
  document.getElementById('imgBack').onclick = function (e) {   /* came from chat: real Back keeps its state */
    try { if (document.referrer && new URL(document.referrer).pathname.slice(-10) === 'agent.html' && history.length > 1) { e.preventDefault(); history.back(); } } catch (x) {}
  };
  Promise.race([HR.hubKeys.load().catch(function () {}), new Promise(function (r) { setTimeout(r, 1500); })]).then(function () { HR.imgpage.init(); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('agent_sw.js', { scope: './', updateViaCache: 'none' }).catch(function () {});
</script>
</body>
</html>
