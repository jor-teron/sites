<!--
  File: index.html
  Project: basic-mail
  Purpose: Entry redirect. Opens the real client page basic-mail.html.
  Theme and mail UI live in basic-mail.html, basic-mail.css, basic-mail.js, basic-mail-config.js.
  Personal use only. Not the Gmail web UI.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page title shown if redirect is slow. -->
  <meta charset="utf-8">
  <title>Mail</title>
  <!-- Immediate redirect to the project HTML file. -->
  <meta http-equiv="refresh" content="0; url=basic-mail.html">
  <link rel="canonical" href="basic-mail.html">
</head>
<body>
  <!-- Fallback if the browser ignores the meta refresh. -->
  <p><a href="basic-mail.html">Open Mail</a></p>
</body>
</html>
