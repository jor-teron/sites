<!--
  File: basic-mail.html
  Project: basic-mail
  Purpose: Minimal personal Gmail client. Own UI, not Gmail chrome.
  Theme from basic-mail-config.js. Mail from the Gmail API after Google sign-in.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail</title>
  <link rel="stylesheet" href="basic-mail.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand" id="brand">Mail</div>
      <label class="search">
        <span class="sr">Search</span>
        <input id="search" type="search" placeholder="Search" autocomplete="off">
      </label>
      <button type="button" id="theme-toggle" class="ghost" title="Switch theme">Theme</button>
      <button type="button" id="connect" class="accent">Connect</button>
      <button type="button" id="compose-open" class="accent" hidden>Compose</button>
    </header>

    <nav class="rail" aria-label="Folders">
      <button type="button" class="rail-btn is-on" data-folder="inbox" title="Inbox">Inbox</button>
      <button type="button" class="rail-btn" data-folder="sent" title="Sent">Sent</button>
      <button type="button" class="rail-btn" data-folder="drafts" title="Drafts">Drafts</button>
      <button type="button" class="rail-btn" data-folder="all" title="All">All</button>
    </nav>

    <section class="list-pane" id="list-pane">
      <p id="status" class="status">Paste your Google client id in basic-mail-config.js, then Connect.</p>
      <ul id="list" class="list"></ul>
    </section>

    <section class="read-pane" id="read-pane" hidden>
      <button type="button" id="back" class="back">Back</button>
      <h1 id="read-subject"></h1>
      <div class="meta">
        <div>
          <strong id="read-from"></strong>
          <div id="read-email" class="muted"></div>
        </div>
        <time id="read-time"></time>
      </div>
      <article id="read-body"></article>
      <div class="actions">
        <button type="button" id="act-reply">Reply</button>
        <button type="button" id="act-forward">Forward</button>
        <button type="button" id="act-archive">Archive</button>
        <button type="button" id="act-delete">Delete</button>
      </div>
    </section>
  </div>

  <div id="compose" class="sheet" hidden>
    <form id="compose-form">
      <header class="sheet-bar">
        <strong id="compose-title">New message</strong>
        <button type="button" id="compose-close" class="ghost">Close</button>
      </header>
      <label>To <input id="to" type="email" required></label>
      <label>Subject <input id="subject" type="text" required></label>
      <label>Message <textarea id="body" rows="8" required></textarea></label>
      <button type="submit" class="accent">Send</button>
    </form>
  </div>

  <script src="basic-mail-config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="basic-mail.js"></script>
</body>
</html>
