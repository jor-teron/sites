<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Timer</title>
    <link rel="stylesheet" href="ct_base.css">
    <link rel="stylesheet" href="ct_cards.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🍳 Cooking Timer</h1>
            <p>Simple multi-timers for the kitchen</p>
        </header>

        <main class="app-main">
            <section class="card">
                <h2>Quick Presets</h2>
                <div class="presets-grid" id="presets-grid">
                    <!-- Populated by JS -->
                </div>
            </section>

            <section class="card">
                <h2>Custom Timer</h2>
                <form id="custom-timer-form" class="timer-form">
                    <div class="input-group">
                        <label for="timer-label">Label</label>
                        <input type="text" id="timer-label" placeholder="e.g. Pasta, Steak..." value="Timer">
                    </div>
                    <div class="time-inputs">
                        <div class="input-group">
                            <label for="timer-mins">Minutes</label>
                            <input type="number" id="timer-mins" min="0" max="120" value="5">
                        </div>
                        <span class="time-sep">:</span>
                        <div class="input-group">
                            <label for="timer-secs">Seconds</label>
                            <input type="number" id="timer-secs" min="0" max="59" value="0">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Start Timer</button>
                </form>
            </section>

            <section class="card">
                <h2>Active Timers</h2>
                <div id="active-timers-list" class="active-timers-list">
                    <p class="empty-state">No active timers. Start one above or pick a preset!</p>
                </div>
            </section>
        </main>
    </div>

    <script src="ct_presets.js"></script>
    <script src="ct_timers.js"></script>
    <script src="ct_sound.js"></script>
    <script src="ct_ui.js"></script>
    <script src="ct_main.js"></script>
</body>
</html>
