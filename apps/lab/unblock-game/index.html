<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unblock - Sliding Block Puzzle</title>
    <link rel="stylesheet" href="ui/base.css">
    <link rel="stylesheet" href="ui/theme.css">
    <link rel="stylesheet" href="ui/board.css">
    <link rel="stylesheet" href="ui/components.css">
</head>
<body>
    <div id="app">
        <!-- Header HUD -->
        <header class="app-header">
            <div class="header-left">
                <button id="btn-levels" class="btn btn-icon" title="Level Select">☰ Levels</button>
            </div>
            <div class="header-center">
                <h1 class="game-title">UNBLOCK</h1>
                <div class="level-indicator">Level <span id="current-level-num">000</span></div>
            </div>
            <div class="header-right">
                <div class="stat-badge" title="Moves">
                    <span class="stat-label">Moves</span>
                    <span id="move-count" class="stat-value">0</span>
                </div>
                <button id="btn-restart" class="btn btn-icon" title="Restart">↺</button>
            </div>
        </header>

        <!-- Main Game Board Area -->
        <main class="game-main">
            <div class="board-container">
                <div class="exit-marker">EXIT</div>
                <div id="game-board" class="game-board">
                    <!-- Dynamic blocks rendered here via JS -->
                </div>
            </div>
        </main>

        <!-- Footer Controls -->
        <footer class="app-footer">
            <button id="btn-undo" class="btn btn-secondary" disabled>Undo</button>
            <button id="btn-hint" class="btn btn-secondary">Hint</button>
            <button id="btn-next" class="btn btn-primary" style="display: none;">Next Level →</button>
        </footer>

        <!-- Level Select Modal -->
        <div id="modal-levels" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Select Level (000 - 999)</h2>
                    <button id="btn-close-levels" class="btn btn-close">×</button>
                </div>
                <div class="level-search-bar">
                    <input type="number" id="level-jump-input" min="0" max="999" placeholder="Jump to level # (0-999)">
                    <button id="btn-jump-level" class="btn btn-primary">Go</button>
                </div>
                <div id="level-grid" class="level-grid">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Victory Modal -->
        <div id="modal-victory" class="modal" style="display: none;">
            <div class="modal-content victory-content">
                <div class="victory-icon">🎉</div>
                <h2>Level Completed!</h2>
                <p>You solved level <span id="vic-level">000</span> in <span id="vic-moves">0</span> moves.</p>
                <div class="victory-actions">
                    <button id="btn-vic-replay" class="btn btn-secondary">Replay</button>
                    <button id="btn-vic-next" class="btn btn-primary">Next Level →</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ES Module Entry Point -->
    <script type="module" src="core/state.js"></script>
</body>
</html>
