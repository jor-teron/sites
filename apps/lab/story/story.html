<!DOCTYPE html>
<!--
  File: story.html
  Project: Story (apps/lab/story)
  Description: Minimal local story writer. One prompt box, one story feed,
               everything else (model, length, creativity, history, about)
               lives in the ⚙ settings panel.
  Scripts: story.js (entry) -> story_db.js, story_model.js (-> story_worker.js), story_ui.js
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Story</title>
  <link rel="stylesheet" href="story.css">
</head>
<body>
  <header class="bar">
    <h1>Story</h1>
    <span class="status" id="status">Starting…</span>
    <button class="icon-btn" id="settings-btn" aria-label="Settings">⚙</button>
  </header>

  <main class="feed" id="chat" aria-live="polite">
    <p class="empty" id="empty">Type a beginning, get a tiny story.</p>
  </main>

  <form class="composer" id="composer">
    <input type="text" id="user-input" placeholder="Once upon a time…" autocomplete="off" enterkeyhint="send">
    <button type="submit" class="send" id="send-btn" aria-label="Write">➤</button>
  </form>

  <!-- Settings panel (secondary controls) -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head"><h2>Settings</h2><button class="icon-btn" id="close-btn" aria-label="Close">✕</button></div>

      <label class="lbl">Model</label>
      <div class="seg" id="model-seg">
        <button type="button" data-model="lite">Lite<small>~1 MB download</small></button>
        <button type="button" data-model="mini">Mini<small>~20 MB download</small></button>
        <button type="button" data-model="pro">Pro<small>~50 MB download</small></button>
      </div>

      <label class="lbl" for="len">Length <span id="len-val"></span></label>
      <input type="range" id="len" min="240" max="600" step="20">

      <label class="lbl" for="temp">Creativity <span id="temp-val"></span></label>
      <input type="range" id="temp" min="0.3" max="1.2" step="0.1">

      <button type="button" class="wide" id="clear-btn">Clear history</button>

      <p class="about">Runs small TinyStories models fully in your browser (transformers.js).
        Each model downloads once when you pick it, then works offline. History is kept 30 days on this device.</p>
    </div>
  </div>

  <script type="module" src="story.js"></script>
</body>
</html>
