<!DOCTYPE html>
<!--
  ONNX Runner — run any single .onnx file in the browser (ONNX Runtime Web, raw mode).
  Two views: Generate (prompt → text, for token-id → logits models) and Tensors (raw inputs / outputs).
  Files: onnx-runner.css, onnx-runner_config.js, onnx-runner_tensor.js, onnx-runner_text.js (tokenizers),
         onnx-runner_logic.js, onnx-runner_gen.js, onnx-runner_worker.js (inference runs in the worker).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONNX Runner</title>
  <link rel="icon" href="onnx-runner_icon.png">
  <link rel="stylesheet" href="onnx-runner.css">
</head>
<body>
  <header><h1>ONNX Runner</h1><span id="backendBadge" class="badge" hidden></span></header>
  <main>
    <section id="modelPanel" class="panel">
      <h2>Model</h2>
      <label id="drop" class="drop" tabindex="0">
        <input id="file" type="file" accept=".onnx,.json,.txt" multiple hidden>
        <span>Drop a <b>.onnx</b> file (and its tokenizer files, or the whole folder) here, or click to pick files</span>
      </label>
      <div class="row small"><button class="ghost" id="pickFolder">Pick a folder…</button><input id="folder" type="file" webkitdirectory hidden>
        <select id="onnxPick" hidden title="Several .onnx files were found"></select></div>
      <div id="tokInfo" class="muted small">No tokenizer loaded.</div>
      <label class="row">Backend
        <select id="backend"></select>
      </label>
      <div id="modelInfo" class="muted">No model loaded.</div>
      <div id="metaIn"></div>
      <div id="metaOut"></div>
    </section>
    <section class="panel right">
      <div class="tabs"><button class="tab on" data-tab="gen">Generate</button><button class="tab" data-tab="raw">Tensors (advanced)</button></div>
      <div id="tab-gen">
        <div id="genNote" class="muted">Load a text model: token ids in (int64 <code>input_ids</code>), logits out, plus its tokenizer files.</div>
        <div id="genWarn" class="warn" hidden></div>
        <textarea id="prompt" placeholder="Type a prompt…" spellcheck="false"></textarea>
        <div class="row small">
          <label>Max new <input id="gMax" class="num" type="number" min="1"></label>
          <label>Context <input id="gCtx" class="num" type="number" min="2"></label>
          <label><input id="gGreedy" type="checkbox"> Greedy</label>
          <label>Temp <input id="gTemp" class="num" type="number" step="0.05" min="0"></label>
          <label>Top-k <input id="gTopK" class="num" type="number" min="0"></label>
          <label>Top-p <input id="gTopP" class="num" type="number" step="0.05" min="0" max="1"></label>
          <label>Rep. penalty <input id="gRep" class="num" type="number" step="0.05" min="1"></label>
          <label>Stop string <input id="gStop" type="text" class="shape" placeholder="optional"></label>
          <label><input id="gBos" type="checkbox"> Add BOS</label>
        </div>
        <div class="row"><button id="gen" disabled>Generate</button><button id="stop" class="ghost" disabled>Stop</button>
          <button id="clear" class="ghost">Clear</button><button id="copyGen" class="ghost">Copy</button>
          <span class="muted small">Ctrl+Enter</span><span id="genStats" class="muted small"></span></div>
        <div id="genOut" class="genout"><span class="muted">Output appears here.</span></div>
      </div>
      <div id="tab-raw" hidden>
      <h2>Inputs</h2>
      <div id="inputs" class="muted">Load a model to see its inputs.</div>
      <div class="row">
        <button id="run" disabled>Run</button><span class="muted small">Ctrl+Enter</span>
        <span id="runTime" class="muted"></span>
      </div>
      <div id="error" class="error" hidden></div>
      <h2>Outputs</h2>
      <label class="row small"><input id="softmax" type="checkbox"> Softmax for top-k</label>
      <div id="outputs" class="muted">Run the model to see outputs.</div>
      </div>
    </section>
  </main>
  <script src="onnx-runner_config.js"></script>
  <script src="onnx-runner_tensor.js"></script>
  <script src="onnx-runner_text.js"></script>
  <script src="onnx-runner_logic.js"></script>
  <script src="onnx-runner_gen.js"></script>
</body>
</html>
