<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player · Drag & Drop M3U</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #eef2f8;
        }

        /* Drop zone overlay */
        .drop-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: background 0.2s;
            border: 3px dashed #2a3a5a;
            border-radius: 2rem;
            margin: 1.5rem;
            background: #11161f;
            cursor: pointer;
            position: relative;
        }

        .drop-zone.drag-over {
            background: #1e2a3a;
            border-color: #4f9eff;
        }

        .drop-zone .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .drop-zone h2 {
            font-weight: 500;
            font-size: 1.8rem;
            letter-spacing: -0.01em;
            color: #b7c9e2;
        }

        .drop-zone p {
            color: #7a8ba8;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        /* Player & grid container (visible after load) */
        .player-container {
            display: none;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .video-section {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 0 0 45vh;
            position: relative;
        }

        .video-section video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .now-playing {
            position: absolute;
            bottom: 12px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grid-section {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.5rem 2rem;
            background: #0b0e14;
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .grid-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #b7c9e2;
        }

        .channel-count {
            background: #1e2a3a;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #8fa3c2;
        }

        .keyboard-hint {
            font-size: 0.78rem;
            color: #6f82a0;
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        .keyboard-hint kbd {
            background: #1e2a3a;
            border: 1px solid #2f4059;
            border-bottom-width: 2px;
            border-radius: 5px;
            padding: 0.05rem 0.4rem;
            font-family: inherit;
            font-size: 0.75rem;
            color: #c9d8ee;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
        }

        .channel-card {
            background: #151e2c;
            border-radius: 1rem;
            padding: 1rem 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            outline: none;
        }

        .channel-card:hover {
            background: #1e2a3e;
            transform: translateY(-3px);
        }

        .channel-card.active {
            border-color: #4f9eff;
            background: #1b2a3f;
            box-shadow: 0 0 0 1px #4f9eff, 0 8px 16px #00000060;
        }

        /* Keyboard focus ring — distinct from the "active/playing" state */
        .channel-card:focus-visible {
            outline: 2px solid #ffd479;
            outline-offset: 3px;
        }

        .channel-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: #1b2535;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 600;
            color: #7b9cd6;
            margin-bottom: 0.7rem;
            text-transform: uppercase;
            object-fit: cover;
            flex-shrink: 0;
            overflow: hidden;
        }

        .channel-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .channel-name {
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.3;
            color: #e0e9f5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .hidden {
            display: none !important;
        }

        .error-message {
            background: #2e1a1a;
            color: #ffa7a7;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            margin-top: 1rem;
            border: 1px solid #5a2a2a;
        }
    </style>
</head>
<body>

    <!-- Drag & drop area -->
    <div id="dropZone" class="drop-zone">
        <div class="icon">📁</div>
        <h2>Drop your M3U file here</h2>
        <p>or click to browse · plays first channel instantly</p>
        <input type="file" id="fileInput" accept=".m3u, .m3u8, audio/x-mpegurl, application/x-mpegurl">
        <div id="dropError" class="error-message hidden"></div>
    </div>

    <!-- Player UI (hidden until playlist loads) -->
    <div id="playerContainer" class="player-container">
        <div class="video-section">
            <video id="videoPlayer" controls autoplay playsinline></video>
            <div id="nowPlayingLabel" class="now-playing">No channel</div>
        </div>
        <div class="grid-section">
            <div class="grid-header">
                <h3>📺 Channels</h3>
                <span id="channelCount" class="channel-count">0 channels</span>
            </div>
            <div class="keyboard-hint">
                Press <kbd>G</kbd> to focus channels ·
                <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> to navigate ·
                <kbd>Enter</kbd> to play ·
                <kbd>Esc</kbd> to exit grid
            </div>
            <div id="channelGrid" class="channel-grid">
                <!-- channel cards will be injected here -->
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- DOM elements ----------
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const dropError = document.getElementById('dropError');
            const playerContainer = document.getElementById('playerContainer');
            const videoPlayer = document.getElementById('videoPlayer');
            const channelGrid = document.getElementById('channelGrid');
            const nowPlayingLabel = document.getElementById('nowPlayingLabel');
            const channelCountSpan = document.getElementById('channelCount');

            // ---------- state ----------
            let channels = [];          // array of { name, url, logo }
            let activeIndex = -1;       // currently playing
            let focusedIndex = -1;      // currently keyboard-focused tile

            // ---------- helper: hide error ----------
            function hideError() {
                dropError.classList.add('hidden');
                dropError.textContent = '';
            }

            function showError(msg) {
                dropError.textContent = msg;
                dropError.classList.remove('hidden');
            }

            // ---------- escape HTML ----------
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // ---------- parse M3U ----------
            function parseM3U(text) {
                const lines = text.split(/\r?\n/);
                const result = [];
                let currentInfo = null;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line) continue;

                    if (line.startsWith('#EXTINF:')) {
                        const commaIndex = line.lastIndexOf(',');
                        let name = 'Unnamed channel';
                        if (commaIndex !== -1 && commaIndex < line.length - 1) {
                            name = line.substring(commaIndex + 1).trim();
                        } else {
                            name = line.replace('#EXTINF:', '').trim();
                        }

                        let logo = null;
                        const logoMatch = line.match(/tvg-logo=["']([^"']+)["']/i);
                        if (logoMatch) logo = logoMatch[1];

                        currentInfo = { name, logo };
                    } else if (line.startsWith('#')) {
                        continue;
                    } else {
                        if (currentInfo) {
                            result.push({
                                name: currentInfo.name,
                                url: line,
                                logo: currentInfo.logo || null
                            });
                            currentInfo = null;
                        } else {
                            const shortName = line.length > 40 ? line.slice(0, 37) + '...' : line;
                            result.push({ name: shortName, url: line, logo: null });
                        }
                    }
                }

                if (result.length === 0) {
                    for (let line of lines) {
                        line = line.trim();
                        if (line && !line.startsWith('#')) {
                            const shortName = line.length > 40 ? line.slice(0, 37) + '...' : line;
                            result.push({ name: shortName, url: line, logo: null });
                        }
                    }
                }

                return result;
            }

            // ---------- render grid ----------
            function renderChannelGrid() {
                if (!channels.length) {
                    channelGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#7a8ba8; padding:2rem;">No channels found</div>';
                    channelCountSpan.textContent = '0 channels';
                    return;
                }

                channelCountSpan.textContent = `${channels.length} channel${channels.length > 1 ? 's' : ''}`;
                let html = '';

                channels.forEach((ch, idx) => {
                    const activeClass = (idx === activeIndex) ? 'active' : '';
                    const initial = ch.name ? ch.name.charAt(0).toUpperCase() : '?';
                    const iconHtml = ch.logo
                        ? `<img src="${escapeHtml(ch.logo)}" alt="" onerror="this.style.display='none'; this.parentNode.innerText='${escapeHtml(initial)}';">`
                        : escapeHtml(initial);

                    // tabindex="-1" → focusable via JS, but not in Tab order
                    html += `
                        <div class="channel-card ${activeClass}" data-index="${idx}" tabindex="-1">
                            <div class="channel-icon">${iconHtml}</div>
                            <div class="channel-name">${escapeHtml(ch.name)}</div>
                        </div>
                    `;
                });

                channelGrid.innerHTML = html;

                document.querySelectorAll('.channel-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const index = parseInt(card.getAttribute('data-index'), 10);
                        focusedIndex = index;
                        playChannel(index);
                    });
                });
            }

            // ---------- play channel ----------
            function playChannel(index) {
                if (index < 0 || index >= channels.length) return;
                const channel = channels[index];
                activeIndex = index;

                videoPlayer.src = channel.url;
                videoPlayer.load();
                videoPlayer.play().catch(err => {
                    console.warn('Playback error:', err);
                });

                nowPlayingLabel.textContent = channel.name;

                document.querySelectorAll('.channel-card').forEach((card, i) => {
                    card.classList.toggle('active', i === index);
                });
            }

            // ---------- focus helpers ----------
            function focusCard(index) {
                const cards = document.querySelectorAll('.channel-card');
                if (!cards.length) return;
                index = Math.max(0, Math.min(index, cards.length - 1));
                focusedIndex = index;
                cards[index].focus();
            }

            function getColumnCount() {
                const style = getComputedStyle(channelGrid);
                const cols = style.gridTemplateColumns;
                if (!cols || cols === 'none') return 1;
                return cols.split(' ').length;
            }

            // ---------- arrow / enter / esc inside the grid ----------
            channelGrid.addEventListener('keydown', (e) => {
                const cards = Array.from(document.querySelectorAll('.channel-card'));
                if (!cards.length) return;

                let current = cards.indexOf(document.activeElement);
                if (current === -1) current = focusedIndex >= 0 ? focusedIndex : 0;

                const cols = getColumnCount();
                let next = current;

                switch (e.key) {
                    case 'ArrowRight':
                        next = Math.min(current + 1, cards.length - 1);
                        break;
                    case 'ArrowLeft':
                        next = Math.max(current - 1, 0);
                        break;
                    case 'ArrowDown':
                        next = Math.min(current + cols, cards.length - 1);
                        break;
                    case 'ArrowUp':
                        next = Math.max(current - cols, 0);
                        break;
                    case 'Enter':
                    case ' ':
                        e.preventDefault();
                        focusedIndex = current;
                        playChannel(current);
                        return;
                    case 'Escape':
                        e.preventDefault();
                        videoPlayer.focus();
                        return;
                    default:
                        return;
                }

                e.preventDefault();
                focusCard(next);
            });

            // ---------- global shortcut: G focuses the grid ----------
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.metaKey || e.ctrlKey || e.altKey) return;
                if (!channels.length) return; // player not loaded yet

                if (e.key === 'g' || e.key === 'G') {
                    e.preventDefault();
                    if (focusedIndex < 0) focusedIndex = activeIndex >= 0 ? activeIndex : 0;
                    focusCard(focusedIndex);
                }
            });

            // ---------- process M3U file ----------
            async function processM3UFile(file) {
                hideError();
                if (!file) {
                    showError('No file selected.');
                    return;
                }

                try {
                    const text = await file.text();
                    const parsed = parseM3U(text);

                    if (!parsed.length) {
                        showError('No playable channels found in the M3U file.');
                        return;
                    }

                    channels = parsed;
                    activeIndex = -1;
                    focusedIndex = -1;

                    dropZone.style.display = 'none';
                    playerContainer.style.display = 'flex';

                    renderChannelGrid();
                    playChannel(0);
                } catch (err) {
                    console.error('Error reading file:', err);
                    showError('Could not read the file. Is it a valid M3U?');
                }
            }

            // ---------- drag & drop handlers ----------
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('drag-over');

                const files = e.dataTransfer?.files;
                if (files && files.length > 0) {
                    processM3UFile(files[0]);
                } else {
                    showError('No file detected in drop.');
                }
            });

            dropZone.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') fileInput.click();
            });

            fileInput.addEventListener('change', () => {
                if (fileInput.files && fileInput.files.length > 0) {
                    processM3UFile(fileInput.files[0]);
                }
                fileInput.value = '';
            });

            // Prevent browser from opening dropped files outside the drop zone
            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => e.preventDefault());

            // Playback error feedback
            videoPlayer.addEventListener('error', () => {
                nowPlayingLabel.textContent = '⚠️ Playback error — try another channel';
            });
        })();
    </script>
</body>
</html>
