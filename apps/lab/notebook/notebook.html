<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paper Notebook</title>
<!--
  Project: notebook
  File: notebook.html
  Role: Markup only. Paper Notebook: 50 pages, LocalStorage, no undo, crumble page, PNG/PDF export.
  Scripts are plain (no build step) and share globals; order matters (store first, notebook.js last).
-->
<link rel="stylesheet" href="notebook.css?v=20261012j">
</head>
<body>
<div id="main">
  <canvas id="canvas"></canvas>
  <svg id="wrinkle" hidden></svg>
  <div id="overlay"></div>
  <svg id="jelly" viewBox="0 0 240 240" aria-hidden="true"></svg>
  <div id="floatBtn" aria-label="Notebook menu">☰</div>
  <div id="pageToast"></div>
  <div id="pagesGrid"><h3>Pages</h3><div id="gridContainer"></div></div>
  <div id="settingsPanel">
    <h2>Settings</h2>
    <button id="closeSettings">Close</button>
    <button id="dlPng">Download Page PNG</button>
    <button id="dlPdf">Download Notebook PDF</button>
    <button id="resetNotebook">Reset Notebook</button>
    <p style="margin-top:30px;color:#888;font-size:13px;">50 pages · LocalStorage · No undo</p>
  </div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="nb_store.js?v=20261012j"></script>
<script src="nb_wrinkle.js?v=20261012j"></script>
<script src="nb_cover.js?v=20261012j"></script>
<script src="nb_canvas.js?v=20261012j"></script>
<script src="nb_pages.js?v=20261012j"></script>
<script src="nb_draw.js?v=20261012j"></script>
<script src="nb_export.js?v=20261012j"></script>
<script src="nb_settings.js?v=20261012j"></script>
<script src="nb_jelly.js?v=20261012j"></script>
<script src="nb_float.js?v=20261012j"></script>
<script src="notebook.js?v=20261012j"></script>
</body>
</html>
