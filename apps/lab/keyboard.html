<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Landscape phone keyboard demo (HTML + CSS + JS).
    Scope:
      - Letters, digits, common punctuation
      - Esc, Tab, Enter, Backspace, Delete
      - Shift, Caps Lock, Ctrl, Alt (sticky modifiers)
      - Space and arrow keys
      - No F-keys, no Fn layer, no numpad
    Portrait: hide the board and ask to rotate.
    Output: last key + modifier state. Hook sendKey() to your gamepad channel later.
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Web Keyboard</title>
  <style>
    /* Page reset — stop bounce/zoom on phone */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0e0e10;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }

    /* Portrait-only message */
    #rotateHint {
      display: none;
      height: 100%;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      font-size: 1.15rem;
    }
    @media (orientation: portrait) {
      #rotateHint { display: flex; }
      #wrap { display: none !important; }
    }

    /* Landscape shell */
    #wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 6px;
      gap: 6px;
    }

    /* Status line: modifiers + last key */
    #status {
      height: 22px;
      font-size: 12px;
      color: #8ab4ff;
      padding: 0 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    /* Keyboard row */
    .row {
      display: flex;
      flex: 1;
      gap: 4px;
    }

    /* Base key */
    button.key {
      flex: 1;
      border: 0;
      border-radius: 6px;
      background: #2b2b30;
      color: #f2f2f2;
      font-size: 13px;
      font-weight: 650;
    }
    button.key:active { background: #4a7c59; }

    /* Wider action keys */
    button.w15 { flex: 1.5; }
    button.w2 { flex: 2; }
    button.space { flex: 6; background: #33353c; }

    /* Modifier looks "latched" when .on */
    button.mod { background: #3a3d48; }
    button.mod.on { background: #3d6ea5; }

    /* Special colors */
    button.esc { background: #5a3a3a; }
    button.enter { background: #2a4a62; }
    button.back { background: #5a3232; }
    button.del { background: #4a3038; }
  </style>
</head>
<body>
  <!-- Shown only in portrait -->
  <div id="rotateHint">Rotate the phone to landscape</div>

  <div id="wrap">
    <!-- Live modifier + last-key readout -->
    <div id="status">ready</div>

    <!-- Number + punctuation row -->
    <div class="row">
      <button class="key esc" data-key="Escape">Esc</button>
      <button class="key" data-key="1" data-shift="!">1</button>
      <button class="key" data-key="2" data-shift="@">2</button>
      <button class="key" data-key="3" data-shift="#">3</button>
      <button class="key" data-key="4" data-shift="$">4</button>
      <button class="key" data-key="5" data-shift="%">5</button>
      <button class="key" data-key="6" data-shift="^">6</button>
      <button class="key" data-key="7" data-shift="&amp;">7</button>
      <button class="key" data-key="8" data-shift="*">8</button>
      <button class="key" data-key="9" data-shift="(">9</button>
      <button class="key" data-key="0" data-shift=")">0</button>
      <button class="key" data-key="-" data-shift="_">-</button>
      <button class="key" data-key="=" data-shift="+">=</button>
      <button class="key back w15" data-key="Backspace">⌫</button>
    </div>

    <!-- QWERTY top -->
    <div class="row">
      <button class="key w15" data-key="Tab">Tab</button>
      <button class="key letter" data-key="q">Q</button>
      <button class="key letter" data-key="w">W</button>
      <button class="key letter" data-key="e">E</button>
      <button class="key letter" data-key="r">R</button>
      <button class="key letter" data-key="t">T</button>
      <button class="key letter" data-key="y">Y</button>
      <button class="key letter" data-key="u">U</button>
      <button class="key letter" data-key="i">I</button>
      <button class="key letter" data-key="o">O</button>
      <button class="key letter" data-key="p">P</button>
      <button class="key" data-key="[" data-shift="{">[</button>
      <button class="key" data-key="]" data-shift="}">]</button>
      <button class="key" data-key="\\" data-shift="|">\</button>
    </div>

    <!-- Home row -->
    <div class="row">
      <button class="key mod w15" data-mod="caps">Caps</button>
      <button class="key letter" data-key="a">A</button>
      <button class="key letter" data-key="s">S</button>
      <button class="key letter" data-key="d">D</button>
      <button class="key letter" data-key="f">F</button>
      <button class="key letter" data-key="g">G</button>
      <button class="key letter" data-key="h">H</button>
      <button class="key letter" data-key="j">J</button>
      <button class="key letter" data-key="k">K</button>
      <button class="key letter" data-key="l">L</button>
      <button class="key" data-key=";" data-shift=":">;</button>
      <button class="key" data-key="'" data-shift="&quot;">'</button>
      <button class="key enter w15" data-key="Enter">Enter</button>
    </div>

    <!-- Bottom letter row + arrows -->
    <div class="row">
      <button class="key mod w15" data-mod="shift">Shift</button>
      <button class="key letter" data-key="z">Z</button>
      <button class="key letter" data-key="x">X</button>
      <button class="key letter" data-key="c">C</button>
      <button class="key letter" data-key="v">V</button>
      <button class="key letter" data-key="b">B</button>
      <button class="key letter" data-key="n">N</button>
      <button class="key letter" data-key="m">M</button>
      <button class="key" data-key="," data-shift="&lt;">,</button>
      <button class="key" data-key="." data-shift="&gt;">.</button>
      <button class="key" data-key="/" data-shift="?">/</button>
      <button class="key del" data-key="Delete">Del</button>
    </div>

    <!-- Modifiers + space + arrows -->
    <div class="row">
      <button class="key mod" data-mod="ctrl">Ctrl</button>
      <button class="key mod" data-mod="alt">Alt</button>
      <button class="key space" data-key=" ">Space</button>
      <button class="key" data-key="ArrowLeft">←</button>
      <button class="key" data-key="ArrowUp">↑</button>
      <button class="key" data-key="ArrowDown">↓</button>
      <button class="key" data-key="ArrowRight">→</button>
    </div>
  </div>

  <script>
    /**
     * Sticky modifier flags.
     * caps stays until tapped again.
     * shift / ctrl / alt stay until the next non-modifier key (one-shot),
     * or until tapped again to cancel.
     */
    var mods = {
      shift: false,
      caps: false,
      ctrl: false,
      alt: false
    };

    /** Status line element */
    var statusEl = document.getElementById("status");

    /**
     * paintMods
     * Refresh modifier button .on class and the status text.
     */
    function paintMods() {
      document.querySelectorAll("button.mod").forEach(function (btn) {
        var name = btn.getAttribute("data-mod");
        if (mods[name]) btn.classList.add("on");
        else btn.classList.remove("on");
      });
    }

    /**
     * setStatus
     * Show active modifiers plus the last sent key.
     */
    function setStatus(lastKey) {
      var bits = [];
      if (mods.ctrl) bits.push("Ctrl");
      if (mods.alt) bits.push("Alt");
      if (mods.shift) bits.push("Shift");
      if (mods.caps) bits.push("Caps");
      var prefix = bits.length ? bits.join("+") + " + " : "";
      statusEl.textContent = prefix + lastKey;
    }

    /**
     * sendKey
     * Payload you will later forward on the same channel as the gamepad.
     */
    function sendKey(payload) {
      console.log(payload);
      setStatus(payload.key);
      if (navigator.vibrate) {
        navigator.vibrate(18);
      }
    }

    /**
     * resolveLetter
     * Apply Caps and Shift to a letter key.
     */
    function resolveLetter(base) {
      var upper = mods.shift !== mods.caps;
      return upper ? base.toUpperCase() : base.toLowerCase();
    }

    /**
     * resolveSymbol
     * If Shift is on and the key has data-shift, use that glyph.
     */
    function resolveSymbol(btn) {
      var shifted = btn.getAttribute("data-shift");
      if (mods.shift && shifted !== null) return shifted;
      return btn.getAttribute("data-key");
    }

    /**
     * tapMod
     * Toggle a modifier and update the UI.
     */
    function tapMod(name) {
      mods[name] = !mods[name];
      paintMods();
      setStatus("(" + name + (mods[name] ? " on" : " off") + ")");
    }

    /**
     * consumeOneShotMods
     * After a real key, drop Shift / Ctrl / Alt. Caps stays.
     */
    function consumeOneShotMods() {
      mods.shift = false;
      mods.ctrl = false;
      mods.alt = false;
      paintMods();
    }

    /**
     * onKeyButton
     * Handle one physical tap on the board.
     */
    function onKeyButton(btn) {
      var modName = btn.getAttribute("data-mod");
      if (modName) {
        tapMod(modName);
        return;
      }

      var raw = btn.getAttribute("data-key");
      var outKey = raw;

      if (btn.classList.contains("letter")) {
        outKey = resolveLetter(raw);
      } else if (btn.getAttribute("data-shift") !== null) {
        outKey = resolveSymbol(btn);
      }

      sendKey({
        type: "key",
        key: outKey,
        ctrl: mods.ctrl,
        alt: mods.alt,
        shift: mods.shift,
        caps: mods.caps
      });

      consumeOneShotMods();
    }

    /**
     * Bind touchend + click on every key.
     * touchend avoids the 300ms mobile click delay.
     */
    document.querySelectorAll("button.key").forEach(function (btn) {
      btn.addEventListener("touchend", function (ev) {
        ev.preventDefault();
        onKeyButton(btn);
      });
      btn.addEventListener("click", function () {
        onKeyButton(btn);
      });
    });

    paintMods();
  </script>
</body>
</html>
