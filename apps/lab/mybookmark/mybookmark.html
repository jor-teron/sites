<!DOCTYPE html>
<!--
  MyBookmark — bookmark viewer first, manager second (replaces apps/lab/bookmark-manager).
  Files: mybookmark.css, mybookmark_config.js, mybookmark_store.js (IndexedDB), mybookmark_netscape.js
         (import / export HTML), mybookmark_dialog.js, mybookmark_data.js (tree + changes),
         mybookmark_view.js (tree, cards, list), mybookmark_logic.js (events, import, manager).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBookmark</title>
  <link rel="icon" href="mybookmark_icon.png">
  <link rel="stylesheet" href="mybookmark.css">
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="drawerBtn" title="Folders" aria-label="Show folders" aria-controls="tree" aria-expanded="false">☰</button>
    <h1 class="brand"><img src="mybookmark_icon.png" alt=""><span>MyBookmark</span></h1>
    <div class="search"><input id="search" type="search" placeholder="Search  ( / )" aria-label="Search bookmarks" autocomplete="off"></div>
    <div class="seg" role="group" aria-label="View">
      <button class="seg-btn" id="viewCards" data-view="cards" title="Cards">▦</button>
      <button class="seg-btn" id="viewList" data-view="list" title="List">☰</button>
    </div>
    <button class="btn" id="importBtn" title="Import a bookmarks .html file">Import</button>
    <button class="btn" id="exportBtn" title="Export as bookmarks .html">Export</button>
    <button class="btn" id="editBtn" aria-pressed="false" title="Add, edit, move and delete">Edit</button>
    <input id="importFile" type="file" accept=".html,.htm,text/html" hidden>
  </header>
  <div class="body">
    <aside id="tree" class="tree" aria-label="Folders"></aside>
    <div id="drawerBack" class="drawer-back" hidden></div>
    <main class="main">
      <nav id="crumbs" class="crumbs" aria-label="Folder path"></nav>
      <div class="bar">
        <select id="domainFilter" aria-label="Filter by site"><option value="">All sites</option></select>
        <select id="sort" aria-label="Sort">
          <option value="name">Name</option><option value="date">Date added</option><option value="domain">Site</option>
        </select>
        <span id="info" class="muted"></span>
      </div>
      <div id="editBar" class="bar edit-bar" hidden>
        <button class="btn" id="addBm">+ Bookmark</button>
        <button class="btn" id="addFolder">+ Folder</button>
        <button class="btn" id="selAll">Select all</button>
        <button class="btn" id="moveSel" disabled>Move to…</button>
        <button class="btn danger" id="delSel" disabled>Delete</button>
        <button class="btn" id="renameFolder">Rename folder</button>
        <button class="btn danger" id="delFolder">Delete folder</button>
        <span id="selInfo" class="muted"></span>
      </div>
      <div id="items" class="items cards" tabindex="-1"></div>
    </main>
  </div>
  <div id="dropZone" class="drop-zone" hidden><div>Drop a bookmarks .html file to import</div></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="mybookmark_config.js"></script>
  <script src="mybookmark_store.js"></script>
  <script src="mybookmark_netscape.js"></script>
  <script src="mybookmark_dialog.js"></script>
  <script src="mybookmark_data.js"></script>
  <script src="mybookmark_view.js"></script>
  <script src="mybookmark_logic.js"></script>
</body>
</html>
