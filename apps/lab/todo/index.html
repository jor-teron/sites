<!--
  Project: Todo
  File: index.html
  Description: Minimal todo list with 5 background colors. Tasks and color persist in localStorage.
  Date: 2026-11-11
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Todo</h1>

    <!-- Color picker: 5 preset backgrounds -->
    <div class="colors" id="colors">
      <button class="color-btn" data-color="#f5f5f5" style="background:#f5f5f5"></button>
      <button class="color-btn" data-color="#e8f4f8" style="background:#e8f4f8"></button>
      <button class="color-btn" data-color="#f8f0e8" style="background:#f8f0e8"></button>
      <button class="color-btn" data-color="#f0f8e8" style="background:#f0f8e8"></button>
      <button class="color-btn" data-color="#1a1a1a" style="background:#1a1a1a"></button>
    </div>

    <!-- Add task form -->
    <form id="addForm">
      <input type="text" id="taskInput" placeholder="New task..." required>
      <button type="submit">Add</button>
    </form>

    <!-- Task list -->
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
