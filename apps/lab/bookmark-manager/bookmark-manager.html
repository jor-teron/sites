<!DOCTYPE html>
<!--
================================================================================
File: bookmark-manager.html
Project: bookmark-manager
Description: Main HTML file for the Bookmark Manager WebApp.
Purpose: Organize bookmarks into folders, import/export Chrome HTML,
         batch delete, and manage categories.
Author: Grok
Date: 2026-10-18
================================================================================
-->
<html lang="en">
<head>
    <!-- Character encoding and responsive viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <!-- Link to project stylesheet -->
    <link rel="stylesheet" href="bookmark-manager.css">
</head>
<body>
    <!-- Application header -->
    <header>
        <h1>Bookmark Manager</h1>
        <div class="controls">
            <button id="export-btn">Export HTML</button>
            <input type="file" id="import-input" accept=".html" style="display:none;">
            <button id="import-btn">Import HTML</button>
        </div>
    </header>

    <!-- Add controls -->
    <div class="controls">
        <input type="text" id="name-input" placeholder="Bookmark name">
        <input type="text" id="url-input" placeholder="URL">
        <select id="folder-select"></select>
        <button id="add-btn">Add Bookmark</button>
        <input type="text" id="new-folder-input" placeholder="New folder name">
        <button id="add-folder-btn">Add Folder</button>
    </div>

    <!-- Search -->
    <div class="controls">
        <input type="text" id="search-input" placeholder="Search bookmarks...">
        <button id="delete-selected-btn">Delete Selected</button>
    </div>

    <!-- Folders container -->
    <div id="folders"></div>

    <!-- Status -->
    <div id="status"></div>

    <!-- Load the application logic -->
    <script type="module" src="bookmark-manager.js"></script>
</body>
</html>
