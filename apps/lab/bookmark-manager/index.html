<!DOCTYPE html>
<!--
================================================================================
File: index.html
Project: bookmark-manager
Description: Entry point that redirects to the main application file.
Purpose: Satisfies the project structure rule requiring index.html to redirect
         to the primary HTML file named after the project.
Author: Grok
Date: 2026-10-18
================================================================================
-->
<html lang="en">
<head>
    <!-- Meta tags for character set and viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Bookmark Manager</title>
    <!-- Immediate redirect to the main project file -->
    <meta http-equiv="refresh" content="0; url=bookmark-manager.html">
</head>
<body>
    <!-- Fallback message if redirect is blocked -->
    <p>Redirecting to <a href="bookmark-manager.html">Bookmark Manager</a>...</p>
    <!-- JavaScript fallback redirect -->
    <script>
        // Immediate client-side redirect as backup
        window.location.href = "bookmark-manager.html";
    </script>
</body>
</html>
