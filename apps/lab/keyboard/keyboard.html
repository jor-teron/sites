<!DOCTYPE html>
<!--
  Project: keyboard (Lab)
  File: keyboard.html
  Role: On-screen keyboard (OSK) demo page. Types into the text box on this page and, when the
  page runs inside a frame (Hub window), posts every key to the parent as the Hub controller
  message {t:'key', key, code, s:1|0, shift, ctrl, alt, repeat}.
  Board + pointer handling: hub/controller/kb_common.js (CTRL_KB, shared with the phone Gamepad).
  Scripts: kb_common.js → keyboard_layout.js → keyboard_type.js → keyboard.js (start-up).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keyboard</title>
  <link rel="stylesheet" href="keyboard.css?v=20261019a">
</head>
<body>
  <div id="bar">
    <div id="status" role="status" aria-live="polite">ready</div>
    <button type="button" class="tool" id="vibBtn" tabindex="-1" aria-pressed="true">Vibrate</button>
    <button type="button" class="tool" id="clearBtn" tabindex="-1">Clear</button>
  </div>

  <!-- Demo text box: inputmode none keeps the phone's own keyboard away -->
  <textarea id="pad" inputmode="none" spellcheck="false" autocomplete="off" aria-label="Typed text" placeholder="Tap here, then type on the keys below"></textarea>

  <!-- Keys are drawn here by keyboard.js -->
  <div id="board" aria-label="On-screen keyboard"></div>

  <script src="../../../hub/controller/kb_common.js?v=20261012a"></script>
  <script src="keyboard_layout.js?v=20261019a"></script>
  <script src="keyboard_type.js?v=20261019a"></script>
  <script src="keyboard.js?v=20261019a"></script>
</body>
</html>
