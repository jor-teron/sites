<!--
  Project: paper-keyboard
  File: paper-keyboard.html
  Role: Demo page. Home role pick, desktop output with QR, phone input.
  Screen keyboard sends characters over PeerJS. Paper panel stays on this page.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Keyboard</title>
  <link rel="stylesheet" href="paper-keyboard.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>Paper Keyboard</h1>
        <span id="status">Pick a role</span>
      </div>
      <span id="echo"></span>
      <button type="button" id="disconnect" class="hidden">Disconnect</button>
    </header>

    <!-- Home. Desktop picks Output. Phone picks Input, or arrives from the QR link. -->
    <section id="home">
      <button type="button" id="pick-output" class="role">Use as Output</button>
      <button type="button" id="pick-input" class="role">Use as Input</button>
      <a class="role" href="paper-keyboard-A4.pdf" download>Download keyboard</a>
    </section>

    <!-- Desktop output. Text lands here. QR is a normal URL any scanner can open. -->
    <section id="output-view" class="hidden">
      <textarea id="note" placeholder="Input text appears here"></textarea>
      <p class="hint">On the phone: Use as Input, then type this code or scan the QR.</p>
      <div id="code-big" aria-label="Pairing code"></div>
      <div id="qr"></div>
    </section>

    <!-- Phone input. Connect, then screen keyboard or paper panel. -->
    <section id="input-view" class="hidden">
      <div id="connect-box">
        <label class="hint" for="code-input">4-digit code from the desktop</label>
        <input id="code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000">
        <button type="button" id="code-go">Connect</button>
        <button type="button" id="scan-qr" class="role">Scan QR</button>
        <video id="scan-video" class="hidden" playsinline></video>
      </div>
      <div id="key-box" class="hidden">
        <div class="modes">
          <button type="button" id="mode-touch" class="active">Screen keyboard</button>
          <button type="button" id="mode-paper">Paper keyboard</button>
        </div>
        <div id="touch-board">
          <div class="row" id="row-top"></div>
          <div class="row" id="row-mid"></div>
          <div class="row" id="row-low"></div>
          <div class="row" id="row-bottom"></div>
          <div class="row" id="row-arrows"></div>
        </div>
        <div id="paper-board" class="paper-panel hidden">
          <div class="finder">
            <video id="paper-video" playsinline autoplay muted></video>
            <canvas id="paper-overlay"></canvas>
            <span id="led-tl">TL</span>
            <span id="led-tr">TR</span>
            <span id="led-bl">BL</span>
            <span id="led-br">BR</span>
          </div>
          <p id="paper-status">Keep all four shapes in view.</p>
        </div>
      </div>
    </section>
  </div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="paper-link.js"></script>
  <script src="paper-corners.js"></script>
  <script src="paper-keyboard.js"></script>
</body>
</html>
