<!DOCTYPE html>
<!--
================================================================================
File: m3u-cleaner.html
Project: m3u-cleaner
Description: Main HTML file for the M3U Playlist Cleaner WebApp.
Purpose: Provides UI to load M3U (local or URL), test channels in parallel queues
         (ok / fail / unsure), tap a row to preview and mark Works/Dead,
         auto-select failed channels, and export the cleaned playlist.
Author: Grok
Date: 2026-10-19 (R1)
================================================================================
-->
<html lang="en">
<head>
    <!-- Character encoding and responsive viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U Cleaner</title>
    <!-- Link to project stylesheet -->
    <link rel="stylesheet" href="m3u-cleaner.css">
</head>
<body>
    <!-- Application header with load controls in the same row -->
    <header>
        <h1>M3U Cleaner</h1>
        <div class="header-load">
            <input type="file" id="file-input" accept=".m3u,.m3u8,text/plain">
            <input type="text" id="url-input" placeholder="Or paste M3U URL...">
            <button id="load-btn">Load</button>
        </div>
        <button id="theme-toggle">Toggle Theme</button>
    </header>

    <!-- Test controls -->
    <div class="controls">
        <label for="queue-select">Parallel queues:</label>
        <select id="queue-select">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
        </select>
        <button id="test-btn" disabled>Test All</button>
        <button id="select-failed-btn" disabled>Select Failed</button>
        <button id="remove-selected-btn" disabled>Remove Selected</button>
        <button id="export-btn" disabled>Export Clean M3U</button>
        <button id="stop-btn" disabled>Stop</button>
    </div>

    <!-- Status -->
    <div id="status">Load an M3U file or URL to begin.</div>

    <!-- Channel table -->
    <table id="channel-table">
        <thead>
            <tr>
                <th><input type="checkbox" id="select-all"></th>
                <th>Name</th>
                <th>Group</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="channel-body"></tbody>
    </table>

    <!-- Preview panel: bottom sheet on phones, corner on desktop -->
    <div id="preview" class="preview" role="dialog" aria-label="Channel preview" hidden>
        <div class="pv-head">
            <span id="pv-name" class="pv-name"></span>
            <button id="pv-close" class="pv-icon" aria-label="Close preview">✕</button>
        </div>
        <video id="pv-video" playsinline controls></video>
        <div id="pv-msg" class="pv-msg"></div>
        <div class="pv-actions">
            <button id="pv-prev" class="pv-icon" aria-label="Previous channel">‹</button>
            <button id="pv-works" class="pv-works">Works</button>
            <button id="pv-dead" class="pv-dead">Dead</button>
            <button id="pv-next" class="pv-icon" aria-label="Next channel">›</button>
        </div>
    </div>

    <!-- hls.js (local copy, no CDN) for HLS where the browser has no native HLS -->
    <script src="vendor/hls/hls.min.js"></script>
    <!-- Load the application logic -->
    <script type="module" src="m3u-cleaner.js"></script>
</body>
</html>
