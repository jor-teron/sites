<!DOCTYPE html>
<!--
  Project: print
  File: print.html
  Role: Host station. Registers a 4-digit code (peer jtprint-1234), shows a
  QR of print-send.html?code=1234 while idle, the 4 digits big and a short
  link to type on a phone. Header: title, short status, New code (idle) /
  Disconnect (linked). Body: Ready when a phone is linked, a receive bar
  (name, x / y MB, speed, then Received ✓ — printing), and the file history
  (name · size · time · kind, Print, Clear) kept across reloads in
  localStorage + IndexedDB. A reload keeps the code and the phone link
  (the phone reconnects by itself); only a manual Disconnect ends it.
  Internet path only: PeerJS public broker + its TURN relay, no LAN discovery.
  All libraries are local in vendor/.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>print</title>
  <link rel="stylesheet" href="print.css">
</head>
<body data-page="host">
  <main class="station">
    <!-- Header: title, short status, common actions only. -->
    <header class="top">
      <h1>print</h1>
      <p id="host-status" class="status">Starting…</p>
      <div class="top-actions">
        <button id="new-code" class="ghost" type="button">New code</button>
        <button id="host-disconnect" class="ghost" type="button" hidden>Disconnect</button>
      </div>
    </header>

    <!-- Shown only while no sender is linked. -->
    <section id="qr-panel" class="qr-panel">
      <p id="wait-note" class="wait-note" hidden>Waiting for the phone to reconnect… or scan to link another.</p>
      <div id="qr" class="qr" aria-label="Scan to send a file"></div>
      <p id="host-code" class="code" aria-label="Station code">----</p>
      <p class="hint">Scan to send an image or PDF, or open this link on the phone and type the code.</p>
      <p id="join-url" class="join-url"></p>
    </section>

    <!-- Shown only while a sender is linked. -->
    <section id="ready-panel" class="ready-panel" hidden>
      <p class="ready">Ready</p>
      <p class="hint">Phone is connected. Files print as they arrive.</p>
    </section>

    <!-- Receive bar. Stays after a file so the last result is visible. -->
    <div id="host-bar" class="xfer" role="status" hidden>
      <span class="xfer-top"><span class="xfer-name"></span><span class="xfer-pct"></span></span>
      <span class="xfer-track"><span class="xfer-fill"></span></span>
      <span class="xfer-sub"></span>
    </div>

    <section class="history">
      <div class="history-head">
        <h2>Files</h2>
        <button id="clear-history" class="ghost small" type="button" hidden>Clear</button>
      </div>
      <ul id="file-list" class="file-list">
        <li class="empty">No files yet.</li>
      </ul>
    </section>
  </main>

  <!-- Hidden frame used only to call print() on a received blob. -->
  <iframe id="print-frame" class="print-frame" title="print frame"></iframe>

  <script src="vendor/peerjs.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="print_common.js"></script>
  <script src="print_bar.js"></script>
  <script src="print_store.js"></script>
  <script src="print_host.js"></script>
</body>
</html>
