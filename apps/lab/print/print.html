<!DOCTYPE html>
<!--
  Project: print
  File: print.html
  Role: Host station. Registers a 4-digit code (peer jtprint-1234), shows a
  QR of print-send.html?code=1234 while idle, the 4 digits big, a short link
  to type on a phone, and New code. Hides the QR and shows Ready when a
  sender connects (a new sender takes over), lists received files with a
  Print button, and opens the browser print dialog for each file.
  Internet path only: PeerJS public broker + its TURN relay, no LAN discovery.
  All libraries are local in vendor/.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>print</title>
  <link rel="stylesheet" href="print.css">
</head>
<body data-page="host">
  <main class="station">
    <header class="top">
      <h1>print</h1>
      <p id="host-status" class="status">Starting peer…</p>
      <button id="host-disconnect" class="ghost" type="button" hidden>Disconnect</button>
    </header>

    <!-- Shown only while no sender is linked. -->
    <section id="qr-panel" class="qr-panel">
      <div id="qr" class="qr" aria-label="Scan to send a file"></div>
      <p id="host-code" class="code" aria-label="Station code">----</p>
      <p class="hint">Scan to send an image or PDF, or open this link on the phone and type the code.</p>
      <p id="join-url" class="join-url"></p>
      <button id="new-code" class="ghost" type="button">New code</button>
    </section>

    <!-- Shown only while a sender is linked. -->
    <section id="ready-panel" class="ready-panel" hidden>
      <p class="ready">Ready</p>
      <p class="hint">Sender is connected. Files print as they arrive.</p>
    </section>

    <section class="history">
      <h2>Files</h2>
      <ul id="file-list" class="file-list">
        <li class="empty">No files yet.</li>
      </ul>
    </section>
  </main>

  <!-- Hidden frame used only to call print() on a received blob. -->
  <iframe id="print-frame" class="print-frame" title="print frame"></iframe>

  <script src="vendor/peerjs.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="print_common.js"></script>
  <script src="print_host.js"></script>
</body>
</html>
