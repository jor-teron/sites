<!DOCTYPE html>
<!--
  Project: print
  File: print-send.html
  Role: Sender page opened by the QR (print-send.html?code=1234) or typed in.
  Header: title, short status, Disconnect. Body views:
  - join (no code, or after a final drop): reason, Reconnect, 4-digit code
    box + Connect, Scan QR (in-page camera). Hidden once connected.
  - retry: 'Link lost — reconnecting…' while the link auto-reconnects
    (also after a reload; only a manual Disconnect ends the link).
  - linked: Take photo (camera app), In-page camera (hi-res, A4 guide),
    Pick image or PDF, the transfer bar (tap to retry on failure) and the
    sent list. All libraries are local in vendor/.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>print send</title>
  <link rel="stylesheet" href="print.css">
</head>
<body data-page="send">
  <main class="station">
    <!-- Header: title, short status, common actions only. -->
    <header class="top">
      <h1>print</h1>
      <p id="send-status" class="status">Starting…</p>
      <div class="top-actions">
        <button id="send-disconnect" class="ghost" type="button" hidden>Disconnect</button>
      </div>
    </header>

    <!-- Join screen. Hidden while connected or auto-reconnecting. -->
    <section id="join-panel" class="join-panel" hidden>
      <p id="join-msg" class="join-msg"></p>
      <button id="reconnect" class="big" type="button" hidden>Reconnect <span id="reconnect-code" class="code-tag"></span></button>
      <form id="code-form" class="code-form" autocomplete="off">
        <label for="code-input" class="hint">Station code</label>
        <input id="code-input" class="code-input" type="text" inputmode="numeric"
          pattern="[0-9]{4}" maxlength="4" placeholder="0000" required
          title="4 digits shown on the print station">
        <button class="big" type="submit">Connect</button>
      </form>
      <button id="scan-open" class="big ghost" type="button">Scan QR</button>
      <!-- In-page scanner. Rear camera; stops on a hit or Cancel. -->
      <div id="scan-panel" class="scan-panel" hidden>
        <video id="scan-video" autoplay playsinline muted></video>
        <p id="scan-msg" class="hint"></p>
        <button id="scan-cancel" class="big ghost" type="button">Cancel scan</button>
      </div>
    </section>

    <!-- Auto-reconnect screen. Disconnect in the header stops it. -->
    <section id="retry-panel" class="retry-panel" hidden>
      <p class="spinner" aria-hidden="true"></p>
      <p id="retry-msg" class="join-msg">Reconnecting…</p>
      <p class="hint">Keep this page open. Press Disconnect to stop.</p>
    </section>

    <!-- Connected screen. -->
    <section id="send-actions" class="actions" hidden>
      <p class="ready">Connected</p>
      <button id="take-photo" class="big" type="button">Take photo (camera app)</button>
      <button id="open-camera" class="big" type="button">In-page camera</button>
      <button id="pick-file" class="big" type="button">Pick image or PDF</button>
      <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
      <input id="file-input" type="file" accept="image/*,application/pdf" hidden>

      <!-- In-page camera: whole frame, A4 portrait guide on top. -->
      <div id="camera-panel" class="camera-panel" hidden>
        <div class="cam-wrap">
          <video id="camera" autoplay playsinline muted></video>
          <div class="a4-guide" aria-hidden="true"></div>
        </div>
        <p id="camera-info" class="hint"></p>
        <button id="snap" class="big" type="button">Snap &amp; send</button>
        <button id="close-camera" class="big ghost" type="button">Close camera</button>
      </div>

      <!-- Transfer bar. A button so a failed send can be tapped to retry. -->
      <button id="send-bar" class="xfer" type="button" hidden disabled>
        <span class="xfer-top"><span class="xfer-name"></span><span class="xfer-pct"></span></span>
        <span class="xfer-track"><span class="xfer-fill"></span></span>
        <span class="xfer-sub"></span>
      </button>

      <ul id="sent-list" class="sent-list" hidden></ul>
    </section>
  </main>

  <script src="vendor/peerjs.min.js"></script>
  <script src="vendor/jsQR.js"></script>
  <script src="print_common.js"></script>
  <script src="print_bar.js"></script>
  <script src="print_scan.js"></script>
  <script src="print_camera.js"></script>
  <script src="print_send.js"></script>
</body>
</html>
