<!DOCTYPE html>
<!--
================================================================================
File: local-ai-chat.html
Project: local-ai-chat
Description: Main HTML file for the Local AI Chat WebApp.
Purpose: Minimalist chat: one thin header row (title, model, ☾/☀, ⋯ menu) and a
         single input bubble with a ✨ popover for prompt helpers and in-chat
         Pollinations.ai image generation. ⋯ › Models… opens the model sheet.
Author: Grok
Date: 2026-10-19 (R2: model options filled by JS with RAM cues, Models… sheet.
                  R1: minimalist layout, old icon section removed)
================================================================================
-->
<html lang="en">
<head>
    <!-- Character encoding and responsive viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Local AI Chat</title>
    <!-- Link to project stylesheet -->
    <link rel="stylesheet" href="local-ai-chat.css">
</head>
<body>
    <!-- One thin header row -->
    <header>
        <h1>Local AI Chat</h1>
        <!-- Compact model selector (options built from local-ai-chat-models.js) -->
        <select id="model-select" aria-label="Model">
            <option value="HuggingFaceTB/SmolLM2-135M-Instruct" selected>SmolLM2 135M</option>
        </select>
        <!-- Theme icon button (☾ / ☀ set by JS) -->
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">☾</button>
        <!-- ⋯ menu -->
        <div class="pop-wrap">
            <button id="menu-btn" class="icon-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">⋯</button>
            <div id="menu" class="pop pop-right" hidden>
                <button id="models-btn" class="chip">Models…</button>
                <button id="clear-chat" class="chip">Clear chat</button>
            </div>
        </div>
    </header>

    <!-- Chat history (status notes appear inline here) -->
    <main id="chat-history" aria-live="polite"></main>

    <!-- Single input bubble -->
    <div id="input-area">
        <div class="pop-wrap">
            <button id="spark-btn" class="icon-btn" aria-label="Helpers" aria-haspopup="true" aria-expanded="false">✨</button>
            <!-- ✨ helpers popover -->
            <div id="spark-pop" class="pop pop-up" hidden>
                <button id="improve-prompt" class="chip">Improve</button>
                <button id="icon-style" class="chip">Icon-style</button>
                <button id="shorten" class="chip">Shorten</button>
                <div class="pop-row">
                    <button id="make-image" class="chip">Make image</button>
                    <select id="resolution-select" aria-label="Image size">
                        <option value="32">32</option>
                        <option value="64" selected>64</option>
                        <option value="128">128</option>
                        <option value="256">256</option>
                        <option value="512">512</option>
                    </select>
                </div>
            </div>
        </div>
        <input type="text" id="user-input" placeholder="Message…" autocomplete="off" enterkeyhint="send">
        <button id="send-btn" class="send" aria-label="Send">➤</button>
    </div>

    <!-- Models sheet: cached size + Delete / Re-download per model -->
    <div id="models-sheet" class="sheet" hidden>
        <div class="sheet-panel" role="dialog" aria-label="Models">
            <div class="sheet-head">
                <strong>Models</strong>
                <button id="models-close" class="icon-btn" aria-label="Close">✕</button>
            </div>
            <div id="models-list"></div>
        </div>
    </div>

    <!-- Load the application logic -->
    <script type="module" src="local-ai-chat.js"></script>
</body>
</html>
