<!--
  File: index.html
  Project: mail
  Purpose: Entry redirect. Opens the real client page mail.html.
  Theme and mail UI live in mail.html, mail.css, mail.js, mail-config.js.
  Personal use only. Not the Gmail web UI.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page title shown if redirect is slow. -->
  <meta charset="utf-8">
  <title>Mail</title>
  <!-- Immediate redirect to the project HTML file. -->
  <meta http-equiv="refresh" content="0; url=mail.html">
  <link rel="canonical" href="mail.html">
</head>
<body>
  <!-- Fallback if the browser ignores the meta refresh. -->
  <p><a href="mail.html">Open Mail</a></p>
</body>
</html>
