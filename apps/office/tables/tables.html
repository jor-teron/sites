<!DOCTYPE html>
<!-- TB1 Tables: a simple database that works like a spreadsheet. Logic: tables_model.js, tables.js.
     TB2 adds a card view, a record panel, and Link columns. Same files, no cache buster.
     TB4: grid look matches Spreadsheet. Sheet tabs sit in the footer. No cache buster.
     HOT1: native .hot files. No cache buster.
     TB5: Office ribbon (File, Home, Settings gear), Quick Access bar and Hub title bar,
     all from ../shared (not edited). Wiring: tables_ribbon.js. No cache buster. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- (before TB5) <title>Tables</title> -->
  <title>Tables TB5</title>
  <link rel="icon" href="tables_icon.svg">
  <link rel="stylesheet" href="../shared/office-ribbon.css">
  <link rel="stylesheet" href="../shared/office-tools.css">
  <link rel="stylesheet" href="../shared/office-dialog.css">
  <link rel="stylesheet" href="../shared/office-settings.css">
  <link rel="stylesheet" href="../shared/office-collapse.css">
  <link rel="stylesheet" href="../shared/office-quick.css">
  <link rel="stylesheet" href="tables.css">
  <script>
    (function () {
      try {
        /* (before HOT1) the first paint read localStorage tables-v1 for the theme.
           HOT1 does not load that key. Auto follows the Hub theme until a .hot file opens.
        var saved = JSON.parse(localStorage.getItem('tables-v1') || '{}');
        var mode = saved.theme || 'auto';
        */
        var mode = 'auto';
        var hub = localStorage.getItem('sites-hub.theme') || '';
        var dark = mode === 'dark' || (mode !== 'light' && (hub === 'dark' || (hub !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)));
        if (!dark) document.documentElement.classList.add('tb-light');
      } catch (e) { /* storage blocked; tables.js picks a theme after load */ }
    })();
  </script>
</head>
<body>
  <!-- (before TB5) header with the app name, search and Auto / Light / Dark buttons, then a flat toolbar.
       TB5 moved search into the top row, the theme into Settings, and every command into File or Home.
  <header class="top">
    <h1>Tables</h1>
    <label class="search-lab">
      <span class="sr">Search this table</span>
      <input id="search" type="search" placeholder="Search this table" autocomplete="off" enterkeyhint="search" aria-label="Search this table">
    </label>
    <div class="theme" role="group" aria-label="Theme">
      <button type="button" data-theme="auto">Auto</button>
      <button type="button" data-theme="light">Light</button>
      <button type="button" data-theme="dark">Dark</button>
    </div>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Table">
    <div class="view-toggle" role="group" aria-label="Layout">
      <button type="button" id="btn-view-grid" aria-pressed="true">Grid</button>
      <button type="button" id="btn-view-cards" aria-pressed="false">Cards</button>
    </div>
    <button type="button" id="btn-new-record">New record</button>
    <button type="button" id="btn-add-row">+ Row</button>
    <button type="button" id="btn-del-row">− Row</button>
    <button type="button" id="btn-add-col">+ Column</button>
    <button type="button" id="btn-rename">Rename</button>
    <button type="button" id="btn-del-table" class="danger">Delete table</button>
    <span class="grow"></span>
    <button type="button" id="btn-save">Save</button>
    <button type="button" id="btn-save-as">Save As</button>
    <button type="button" id="btn-open-hot">Open .hot</button>
    <input id="hot-file" type="file" accept=".hot,application/json" hidden>
    <button type="button" id="btn-import">Import CSV</button>
    <button type="button" id="btn-export">Export CSV</button>
    <input id="file-import" type="file" accept=".csv,text/csv,text/plain" hidden>
  </div>
  -->

  <!-- TB5 TOP ROW: Quick Access (office-quick.js) + File + ribbon tabs (office-ribbon.js), search, Settings gear -->
  <header class="of-topbar tb-topbar" id="of-topbar">
    <button type="button" class="of-file-btn" id="of-file-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="of-file-menu">File</button>
    <div class="of-tabs" id="of-tabs" role="tablist" aria-label="Ribbon"></div>
    <label class="search-lab">
      <span class="sr">Search this table</span>
      <input id="search" type="search" placeholder="Search this table" autocomplete="off" enterkeyhint="search" aria-label="Search this table">
    </label>
    <button type="button" class="tb-gear" id="settingsBtn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>

  <!-- TB5 File menu: shared look (office-tools.css .file-item, icons from office-icons.js). Ids kept from the old toolbar. -->
  <div class="of-file-menu file-menu" id="of-file-menu" role="menu" aria-labelledby="of-file-btn" hidden>
    <button type="button" class="file-item" role="menuitem" id="btn-new" data-icon="fileNew"><span>New</span></button>
    <button type="button" class="file-item" role="menuitem" id="btn-open-hot" data-icon="fileOpen"><span>Open .hot</span></button>
    <div class="file-sep" role="separator"></div>
    <button type="button" class="file-item" role="menuitem" id="btn-save" data-icon="fileSave"><span>Save</span></button>
    <button type="button" class="file-item" role="menuitem" id="btn-save-as" data-icon="fileSave"><span>Save As</span></button>
    <div class="file-sep" role="separator"></div>
    <button type="button" class="file-item" role="menuitem" id="btn-import" data-icon="fileOpen"><span>Import CSV</span></button>
    <button type="button" class="file-item" role="menuitem" id="btn-export" data-icon="fileExport"><span>Export CSV</span></button>
    <div class="file-sep" role="separator"></div>
    <button type="button" class="file-item" role="menuitem" id="settingsMenuBtn" data-icon="fileSettings"><span>Settings</span></button>
  </div>
  <input id="hot-file" type="file" accept=".hot,application/json" hidden>
  <input id="file-import" type="file" accept=".csv,text/csv,text/plain" hidden>

  <!-- TB5 RIBBON: Home only (the old toolbar commands). Scrolls sideways when narrow. -->
  <nav class="of-ribbon tb-ribbon" id="of-ribbon" aria-label="Ribbon commands">
    <div class="of-panel" role="tabpanel" id="of-panel-home" data-tab="home" aria-labelledby="of-tab-home">
      <div class="of-group tool-group view-toggle" role="group" aria-label="Layout">
        <button type="button" class="tool-btn" id="btn-view-grid" aria-pressed="true">Grid</button>
        <button type="button" class="tool-btn" id="btn-view-cards" aria-pressed="false">Cards</button>
      </div>
      <div class="of-group tool-group" role="group" aria-label="Records">
        <button type="button" class="tool-btn" id="btn-new-record">New record</button>
        <button type="button" class="tool-btn" id="btn-add-row">+ Row</button>
        <button type="button" class="tool-btn" id="btn-del-row">− Row</button>
      </div>
      <div class="of-group tool-group" role="group" aria-label="Table">
        <button type="button" class="tool-btn" id="btn-add-col">+ Column</button>
        <button type="button" class="tool-btn" id="btn-rename">Rename</button>
        <button type="button" class="tool-btn danger" id="btn-del-table">Delete table</button>
      </div>
    </div>
  </nav>

  <div id="banner" class="banner" hidden></div>

  <div class="grid-wrap sheet-wrap" id="grid-wrap" tabindex="0" aria-label="Table grid">
    <table class="grid sheet" id="grid">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="cards-wrap" id="cards-wrap" hidden>
    <div class="card-tools" id="card-tools" role="toolbar" aria-label="Sort and filter"></div>
    <div class="cards" id="cards" tabindex="0" aria-label="Records"></div>
  </div>

  <div id="record-panel" class="record-panel" hidden>
    <div class="record-sheet" role="dialog" aria-modal="true" aria-labelledby="record-title">
      <div class="record-head">
        <h2 id="record-title">Record</h2>
        <button type="button" id="record-close">Close</button>
      </div>
      <div class="record-body" id="record-body"></div>
      <div class="record-actions">
        <button type="button" id="record-prev">Previous</button>
        <button type="button" id="record-next">Next</button>
        <button type="button" id="record-delete" class="danger">Delete record</button>
        <span class="grow"></span>
        <button type="button" id="record-save">Save</button>
      </div>
    </div>
  </div>

  <!-- (before TB4)
  <div class="tabs-bar">
    <div class="tabs" id="tabs" role="tablist" aria-label="Tables"></div>
    <button type="button" id="btn-add-table" class="tab-add">+ Table</button>
  </div>

  <footer class="status">
    <span id="count">No rows</span>
    <span id="status" aria-live="polite"></span>
  </footer>
  -->
  <footer class="tabs-bar sheet-footer">
    <div class="tabs sheet-tabs" id="tabs" role="tablist" aria-label="Tables"></div>
    <button type="button" id="btn-add-table" class="tab-add sheet-tab-add" title="Add table" aria-label="Add table">+</button>
    <span id="count" class="sheet-stats">No rows</span>
    <span id="status" class="status" aria-live="polite"></span>
  </footer>

  <script src="../shared/office-icons.js"></script>
  <script src="../shared/office-dialog.js"></script>
  <script src="../shared/office-ribbon.js"></script>
  <script src="../shared/office-settings.js"></script>
  <script src="../shared/office-hover.js"></script>
  <script src="../shared/office-collapse.js"></script>
  <script src="../shared/office-hubbar.js"></script>
  <script src="../shared/office-quick.js"></script>
  <script src="../../../shared/fs/fs_drives.js"></script>
  <script src="../../../shared/fs/fs_ops.js"></script>
  <script src="../../../shared/fs/fs_ref.js"></script>
  <script src="../shared/office-native.js"></script>
  <script src="tables_model.js"></script>
  <script src="tables_hot.js"></script>
  <script src="tables_ribbon.js"></script>
  <script src="tables.js"></script>
</body>
</html>
