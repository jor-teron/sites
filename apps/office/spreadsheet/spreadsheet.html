<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spreadsheet</title>
  <link rel="icon" href="spreadsheet_icon.png">
  <link rel="stylesheet" href="spreadsheet.css?v=4">
  <link rel="stylesheet" href="../shared/office-ribbon.css?v=1">
  <link rel="stylesheet" href="../shared/office-dialog.css?v=1">
  <link rel="stylesheet" href="spreadsheet_ribbon.css?v=4">
  <link rel="stylesheet" href="spreadsheet_page.css?v=4">
</head>
<body>
  <!-- TOP BAR: File button + ribbon tabs (built from SHEET_RIBBON_TABS by ../shared/office-ribbon.js) -->
  <header class="of-topbar" id="of-topbar">
    <button type="button" class="of-file-btn" id="of-file-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="of-file-menu">File</button>
    <div class="of-tabs" id="of-tabs" role="tablist" aria-label="Ribbon"></div>
  </header>

  <!-- File menu -->
  <div class="of-file-menu" id="of-file-menu" role="menu" aria-labelledby="of-file-btn" hidden>
    <button type="button" class="of-file-item" role="menuitem" id="btn-clear">New / Clear</button>
    <label class="of-file-item" role="menuitem">Open / Import CSV
      <input id="file-import" type="file" accept=".csv,text/csv,text/plain" hidden>
    </label>
    <button type="button" class="of-file-item" role="menuitem" id="btn-export">Export CSV</button>
    <button type="button" class="of-file-item" role="menuitem" id="btn-print">Print / PDF</button>
    <a class="of-file-item" role="menuitem" href="FUNCTIONS.txt" target="_blank" rel="noopener">Functions</a>
  </div>

  <!-- RIBBON: one row per tab, scrolls sideways when narrow -->
  <nav class="toolbar of-ribbon" id="of-ribbon" aria-label="Ribbon commands">
    <div class="of-panel" role="tabpanel" id="of-panel-home" data-tab="home">
      <div class="of-group">
        <button type="button" id="btn-undo" title="Undo (Ctrl/⌘+Z)">↶</button>
        <button type="button" id="btn-redo" title="Redo (Ctrl/⌘+Y, Ctrl/⌘+Shift+Z)">↷</button>
      </div>
      <div class="of-group">
        <button type="button" id="btn-bold" title="Bold"><b>B</b></button>
        <button type="button" id="btn-italic" title="Italic"><i>I</i></button>
        <button type="button" id="btn-under" title="Underline"><u>U</u></button>
      </div>
      <div class="of-group">
        <select id="align-sel" title="Align">
          <option value="left">Left</option>
          <option value="center" selected>Center</option>
          <option value="right">Right</option>
        </select>
        <select id="fmt-sel" title="Number format">
          <option value="general">General</option>
          <option value="int">0</option>
          <option value="dec2">0.00</option>
          <option value="thousands">1,000</option>
          <option value="percent">%</option>
          <option value="currency">₹ Currency</option>
        </select>
      </div>
      <div class="of-group">
        <input id="fill-color" type="color" title="Cell colour" value="#1e1e1e">
        <input id="text-color" type="color" title="Text colour" value="#e8e8e8">
      </div>
      <span class="of-note">Copy / cut / paste: Ctrl/⌘+C, X, V</span>
    </div>
    <div class="of-panel" role="tabpanel" id="of-panel-insert" data-tab="insert" hidden>
      <div class="of-group">
        <button type="button" id="btn-row-ins" title="Insert row above the selection">+ Row</button>
        <button type="button" id="btn-row-del" title="Delete selected row(s)">− Row</button>
      </div>
      <div class="of-group">
        <button type="button" id="btn-col-ins" title="Insert column left of the selection">+ Col</button>
        <button type="button" id="btn-col-del" title="Delete selected column(s)">− Col</button>
      </div>
      <span class="of-note">Fill: drag the cell corner, or Ctrl/⌘+D down, Ctrl/⌘+R right</span>
    </div>
    <div class="of-panel" role="tabpanel" id="of-panel-page" data-tab="page" hidden>
      <div class="of-group" role="group" aria-label="Orientation">
        <button type="button" data-page-orientation="portrait" aria-pressed="true">Portrait</button>
        <button type="button" data-page-orientation="landscape" aria-pressed="false">Landscape</button>
      </div>
      <div class="of-group" role="group" aria-label="Paper">
        <button type="button" data-page-paper="A4" aria-pressed="true">A4</button>
        <button type="button" data-page-paper="Letter" aria-pressed="false">Letter</button>
      </div>
      <div class="of-group" role="group" aria-label="Margins">
        <span class="of-group-label">Margins</span>
        <button type="button" data-page-margins="normal" aria-pressed="true">Normal</button>
        <button type="button" data-page-margins="narrow" aria-pressed="false">Narrow</button>
        <button type="button" data-page-margins="wide" aria-pressed="false">Wide</button>
        <button type="button" data-page-margins="custom" id="page-custom-margins" aria-haspopup="dialog" aria-pressed="false">Custom…</button>
      </div>
      <div class="of-group" role="group" aria-label="When printing">
        <span class="of-group-label">Print</span>
        <button type="button" data-page-toggle="gridlines" aria-pressed="true" title="Print cell gridlines">Gridlines</button>
        <button type="button" data-page-toggle="headings" aria-pressed="false" title="Print row numbers and column letters">Headings</button>
        <button type="button" data-page-toggle="fit" aria-pressed="false" title="Shrink to fit the page width">Fit width</button>
      </div>
      <div class="of-group">
        <button type="button" id="page-print" title="Print / Save as PDF">Print</button>
      </div>
    </div>
    <div class="of-panel" role="tabpanel" id="of-panel-data" data-tab="data" hidden>
      <div class="of-group">
        <button type="button" id="btn-sort-asc" title="Sort A→Z by the active column">Sort A→Z</button>
        <button type="button" id="btn-sort-desc" title="Sort Z→A by the active column">Sort Z→A</button>
      </div>
    </div>
  </nav>

  <!-- Formula bar: its own row -->
  <div class="toolbar sheet-formula-row">
    <span class="eq-mark">=</span>
    <input id="formula-bar" type="text" placeholder="A1+B1" aria-label="Formula bar">
  </div>
  <div id="status" class="status"></div>
  <div id="sheet-wrap" class="sheet-wrap"></div>
  <script src="../shared/office-dialog.js?v=1"></script>
  <script src="../shared/office-page.js?v=1"></script>
  <script src="../shared/office-ribbon.js?v=1"></script>
  <script src="spreadsheet_config.js?v=4"></script>
  <script src="spreadsheet_formula.js?v=4"></script>
  <script src="spreadsheet_functions.js?v=4"></script>
  <script src="spreadsheet_refs.js?v=4"></script>
  <script src="spreadsheet_state.js?v=4"></script>
  <script src="spreadsheet_storage.js?v=4"></script>
  <script src="spreadsheet_files.js?v=4"></script>
  <script src="spreadsheet_grid.js?v=4"></script>
  <script src="spreadsheet_edit.js?v=4"></script>
  <script src="spreadsheet_fill.js?v=4"></script>
  <script src="spreadsheet_toolbar.js?v=4"></script>
  <script src="spreadsheet_page.js?v=4"></script>
  <script src="spreadsheet_ribbon.js?v=4"></script>
  <script src="spreadsheet_logic.js?v=4"></script>
  <script src="spreadsheet_format.js?v=4"></script>
  <script src="spreadsheet_undo.js?v=4"></script>
  <script src="spreadsheet_select.js?v=4"></script>
  <script src="spreadsheet_clipboard.js?v=4"></script>
  <script src="spreadsheet_rows.js?v=4"></script>
  <script src="spreadsheet_sort.js?v=4"></script>
  <script src="spreadsheet_resize.js?v=4"></script>
  <script src="spreadsheet_keys.js?v=4"></script>
</body>
</html>
