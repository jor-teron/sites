<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- legacy: <title>Spreadsheet</title> -->
  <!-- legacy (before SH13): <title>Spreadsheet SH12</title> -->
  <!-- legacy (before SH14): <title>Spreadsheet SH13</title> -->
  <!-- (before SH18) <title>Spreadsheet SH14</title> -->
  <title>Spreadsheet SH18</title>
  <!-- (before HO3) every local cache token (?v=) on this page was SH18; HO3 bumps them for the 12pt default. Title stays SH18. -->
  <link rel="icon" href="spreadsheet_icon.png">
  <link rel="stylesheet" href="spreadsheet.css?v=HO3">
  <link rel="stylesheet" href="../shared/office-ribbon.css">
  <link rel="stylesheet" href="../shared/office-tools.css">
  <link rel="stylesheet" href="../shared/office-dialog.css">
  <link rel="stylesheet" href="../shared/office-theme.css">
  <link rel="stylesheet" href="../shared/office-notify.css">
  <link rel="stylesheet" href="../shared/office-settings.css">
  <link rel="stylesheet" href="../shared/office-collapse.css">
  <link rel="stylesheet" href="../shared/office-colour.css">
  <link rel="stylesheet" href="../shared/office-quick.css">
  <link rel="stylesheet" href="spreadsheet_ribbon.css?v=HO3">
  <link rel="stylesheet" href="spreadsheet_page.css?v=HO3">
</head>
<body>
  <!-- TOP BAR: File button + ribbon tabs (built from SHEET_RIBBON_TABS by ../shared/office-ribbon.js) -->
  <header class="of-topbar" id="of-topbar">
    <button type="button" class="of-file-btn" id="of-file-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="of-file-menu">File</button>
    <div class="of-tabs" id="of-tabs" role="tablist" aria-label="Ribbon"></div>
    <!-- SH1 Settings gear: panel built by ../shared/office-settings.js (spreadsheet_settings.js) -->
    <button type="button" class="sheet-gear" id="settingsBtn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <!-- SH1 colour palettes (filled by ../shared/office-colour.js) -->
  <div id="fill-colour-menu" role="menu" aria-label="Cell fill colour" hidden></div>
  <div id="text-colour-menu" role="menu" aria-label="Text colour" hidden></div>

  <!-- File menu: Draftly look (../shared/office-tools.css .file-item, icons from office-icons.js) -->
  <div class="of-file-menu file-menu" id="of-file-menu" role="menu" aria-labelledby="of-file-btn" hidden>
    <button type="button" class="file-item" role="menuitem" id="btn-clear" data-icon="fileNew"><span>New / Clear</span></button>
    <button type="button" class="file-item" role="menuitem" id="btn-open-hos" data-icon="fileOpen"><span>Open .hos</span></button>
    <input id="hos-file" type="file" accept=".hos,application/json" hidden>
    <label class="file-item" role="menuitem" data-icon="fileOpen"><span>Open (XLSX / CSV)</span>
      <input id="file-import" type="file" accept=".xlsx,.xls,.csv,text/csv,text/plain" hidden>
    </label>
    <div class="file-sep" role="separator"></div>
    <button type="button" class="file-item" role="menuitem" id="btn-save" data-icon="fileSave"><span>Save</span></button>
    <button type="button" class="file-item" role="menuitem" id="btn-save-as" data-icon="fileSave"><span>Save As</span></button>
    <button type="button" class="file-item" role="menuitem" id="btn-export" data-icon="fileExport"><span>Export CSV</span></button>
    <button type="button" class="file-item" role="menuitem" id="btn-export-xlsx" data-icon="fileExport"><span>Export XLSX</span></button>
    <button type="button" class="file-item" role="menuitem" id="btn-print" data-icon="filePrint"><span>Print / PDF</span></button>
    <button type="button" class="file-item" role="menuitem" id="settingsMenuBtn" data-icon="fileSettings"><span>Settings</span></button>
    <div class="file-sep" role="separator"></div>
    <a class="file-item" role="menuitem" href="FUNCTIONS.txt" target="_blank" rel="noopener" data-icon="fileHelp"><span>Functions</span></a>
  </div>

  <!-- RIBBON: one row per tab, scrolls sideways when narrow -->
  <nav class="toolbar of-ribbon" id="of-ribbon" aria-label="Ribbon commands">
    <div class="of-panel" role="tabpanel" id="of-panel-home" data-tab="home">
      <div class="of-group tool-group">
        <button type="button" id="btn-undo" title="Undo (Ctrl/⌘+Z)">↶</button>
        <button type="button" id="btn-redo" title="Redo (Ctrl/⌘+Y, Ctrl/⌘+Shift+Z)">↷</button>
      </div>
      <div class="of-group tool-group">
        <button type="button" class="tool-btn" id="btn-bold" data-icon="bold" title="Bold (Ctrl/⌘+B)" aria-label="Bold"></button>
        <button type="button" class="tool-btn" id="btn-italic" data-icon="italic" title="Italic (Ctrl/⌘+I)" aria-label="Italic"></button>
        <button type="button" class="tool-btn" id="btn-under" data-icon="underline" title="Underline (Ctrl/⌘+U)" aria-label="Underline"></button>
        <select id="font-size-sel" title="Font size" aria-label="Font size"></select>
        <button type="button" id="btn-wrap" title="Wrap text">Wrap</button>
        <button type="button" id="btn-painter" title="Format painter (double-click to keep it on)">Painter</button>
      </div>
      <div class="of-group tool-group">
        <!-- (before SH17):
        <select id="bd-sel" title="Borders" aria-label="Borders">
          <option value="">Borders</option>
          <option value="all">All</option>
          <option value="outside">Outside</option>
          <option value="inside">Inside</option>
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
          <option value="none">No border</option>
        </select>
        -->
        <button type="button" class="tool-btn" id="btn-borders" title="Borders" aria-label="Borders" aria-haspopup="menu" aria-expanded="false" aria-controls="bd-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><path d="M4 12h16M12 4v16"/></svg>
          Borders
          <svg class="bd-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
        </button>
        <select id="bd-sel" class="bd-sel-keep" title="Borders" aria-label="Borders" hidden>
          <option value="">Borders</option>
          <option value="all">All</option>
          <option value="outside">Outside</option>
          <option value="inside">Inside</option>
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
          <option value="none">No border</option>
        </select>
        <button type="button" id="btn-merge" title="Merge the selected cells">Merge</button>
        <button type="button" id="btn-unmerge" title="Unmerge cells in the selection">Unmerge</button>
        <button type="button" id="btn-cf" title="Conditional formatting">Highlight</button>
      </div>
      <div class="of-group tool-group" role="group" aria-label="Alignment">
        <button type="button" class="tool-btn" data-align="left" data-icon="alignLeft" title="Align left" aria-label="Align left"></button>
        <button type="button" class="tool-btn" data-align="center" data-icon="alignCenter" title="Align center" aria-label="Align center"></button>
        <button type="button" class="tool-btn" data-align="right" data-icon="alignRight" title="Align right" aria-label="Align right"></button>
      </div>
      <div class="of-group tool-group">
        <select id="fmt-sel" title="Number format">
          <option value="general">General</option>
          <option value="int">0</option>
          <option value="dec2">0.00</option>
          <option value="thousands">1,000</option>
          <option value="percent">%</option>
          <option value="currency">₹ Currency</option>
          <option value="date">Date (YYYY-MM-DD)</option>
          <option value="datedmy">Date (DD/MM/YYYY)</option>
          <option value="time">Time (HH:MM)</option>
          <option value="datetime">Date and time</option>
        </select>
      </div>
      <div class="of-group tool-group">
        <div class="of-split" role="group" aria-label="Cell fill">
          <button type="button" class="of-split-main" id="fill-colour-btn" title="Cell fill" aria-label="Apply cell fill"><span class="of-colour-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 11 6-6 7 7-6 6z"/><path d="M19 15s2 2.2 2 3.5a2 2 0 0 1-4 0c0-1.3 2-3.5 2-3.5z"/></svg><span class="of-colour-bar" id="fill-colour-bar"></span></span></button>
          <button type="button" class="of-split-arrow" id="fill-colour-arrow" title="Cell fill options" aria-label="Cell fill options" aria-haspopup="menu" aria-expanded="false" aria-controls="fill-colour-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
        </div>
        <div class="of-split" role="group" aria-label="Text colour">
          <button type="button" class="of-split-main" id="text-colour-btn" title="Text colour" aria-label="Apply text colour"><span class="of-colour-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 16 12 4l5 12M8.7 12h6.6"/></svg><span class="of-colour-bar" id="text-colour-bar"></span></span></button>
          <button type="button" class="of-split-arrow" id="text-colour-arrow" title="Text colour options" aria-label="Text colour options" aria-haspopup="menu" aria-expanded="false" aria-controls="text-colour-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
        </div>
      </div>
      <span class="of-note">Copy / cut / paste: Ctrl/⌘+C, X, V</span>
    </div>
    <div class="of-panel" role="tabpanel" id="of-panel-insert" data-tab="insert" hidden>
      <div class="of-group tool-group">
        <button type="button" id="btn-row-ins" title="Insert row above the selection">+ Row</button>
        <button type="button" id="btn-row-del" title="Delete selected row(s)">− Row</button>
      </div>
      <div class="of-group tool-group">
        <button type="button" id="btn-col-ins" title="Insert column left of the selection">+ Col</button>
        <button type="button" id="btn-col-del" title="Delete selected column(s)">− Col</button>
      </div>
      <div class="of-group tool-group" role="group" aria-label="Charts">
        <span class="of-group-label">Chart</span>
        <button type="button" id="btn-chart-col" title="Column chart from the selection">Column</button>
        <button type="button" id="btn-chart-bar" title="Bar chart from the selection">Bar</button>
        <button type="button" id="btn-chart-line" title="Line chart from the selection">Line</button>
        <button type="button" id="btn-chart-pie" title="Pie chart from the first series in the selection">Pie</button>
      </div>
      <span class="of-note">Fill: drag the cell corner, or Ctrl/⌘+D down, Ctrl/⌘+R right</span>
    </div>
    <div class="of-panel" role="tabpanel" id="of-panel-page" data-tab="page" hidden>
      <div class="of-group tool-group" role="group" aria-label="Orientation">
        <button type="button" data-page-orientation="portrait" aria-pressed="true">Portrait</button>
        <button type="button" data-page-orientation="landscape" aria-pressed="false">Landscape</button>
      </div>
      <div class="of-group tool-group" role="group" aria-label="Paper">
        <button type="button" data-page-paper="A4" aria-pressed="true">A4</button>
        <button type="button" data-page-paper="Letter" aria-pressed="false">Letter</button>
      </div>
      <div class="of-group tool-group" role="group" aria-label="Margins">
        <span class="of-group-label">Margins</span>
        <button type="button" data-page-margins="normal" aria-pressed="true">Normal</button>
        <button type="button" data-page-margins="narrow" aria-pressed="false">Narrow</button>
        <button type="button" data-page-margins="wide" aria-pressed="false">Wide</button>
        <button type="button" data-page-margins="custom" id="page-custom-margins" aria-haspopup="dialog" aria-pressed="false">Custom…</button>
      </div>
      <div class="of-group tool-group" role="group" aria-label="When printing">
        <span class="of-group-label">Print</span>
        <button type="button" data-page-toggle="gridlines" aria-pressed="true" title="Print cell gridlines">Gridlines</button>
        <button type="button" data-page-toggle="headings" aria-pressed="false" title="Print row numbers and column letters">Headings</button>
        <button type="button" data-page-toggle="fit" aria-pressed="false" title="Shrink to fit the page width">Fit width</button>
      </div>
      <div class="of-group tool-group">
        <button type="button" id="page-print" title="Print / Save as PDF">Print</button>
      </div>
    </div>
    <div class="of-panel" role="tabpanel" id="of-panel-data" data-tab="data" hidden>
      <div class="of-group tool-group">
        <button type="button" id="btn-find" title="Find and replace (Ctrl/⌘+F)">Find</button>
      </div>
      <div class="of-group tool-group">
        <button type="button" id="btn-sort-asc" title="Sort A→Z by the active column">Sort A→Z</button>
        <button type="button" id="btn-sort-desc" title="Sort Z→A by the active column">Sort Z→A</button>
        <button type="button" id="btn-sort-more" title="Sort by more than one column, with an optional header row">Sort…</button>
      </div>
      <div class="of-group tool-group">
        <button type="button" id="btn-filter" title="Show filter arrows on the header row of the used area or selection">Filter</button>
        <button type="button" id="btn-filter-clear" title="Clear filter choices (keeps the arrows)">Clear filter</button>
      </div>
      <div class="of-group tool-group">
        <button type="button" id="btn-valid" title="Set a dropdown list for the selected cells">Data validation</button>
        <button type="button" id="btn-dups" title="Remove duplicate rows from the selection">Remove duplicates</button>
      </div>
    </div>
    <div class="of-panel" role="tabpanel" id="of-panel-view" data-tab="view" hidden>
      <div class="of-group tool-group" role="group" aria-label="Freeze panes">
        <span class="of-group-label">Freeze</span>
        <button type="button" id="btn-freeze-top" title="Keep the top row visible while scrolling">Top row</button>
        <button type="button" id="btn-freeze-first" title="Keep the first column visible while scrolling">First column</button>
        <button type="button" id="btn-freeze-panes" title="Freeze rows above and columns to the left of the active cell">Panes</button>
        <button type="button" id="btn-unfreeze" title="Unfreeze panes">Unfreeze</button>
      </div>
      <div class="of-group tool-group" role="group" aria-label="Hide rows and columns">
        <span class="of-group-label">Hide</span>
        <button type="button" id="btn-hide-rows" title="Hide the selected rows">Hide rows</button>
        <button type="button" id="btn-hide-cols" title="Hide the selected columns">Hide columns</button>
        <button type="button" id="btn-unhide" title="Unhide rows and columns in the selection">Unhide</button>
        <button type="button" id="btn-unhide-all" title="Unhide every hidden row and column on this sheet">Unhide all</button>
      </div>
    </div>
  </nav>

  <!-- Formula bar: its own row -->
  <div class="toolbar sheet-formula-row" id="sheet-formula-row">
    <button type="button" class="sheet-fx-btn" id="btn-fx" title="Insert function" aria-label="Insert function" aria-haspopup="dialog">fx</button>
    <span class="eq-mark">=</span>
    <input id="formula-bar" type="text" placeholder="A1+B1" aria-label="Formula bar" autocomplete="off">
  </div>
  <div id="fx-hint" class="fx-hint" hidden></div>
  <div id="fx-picker" class="fx-picker" hidden role="dialog" aria-label="Function picker">
    <div class="fx-picker-head">
      <strong>Insert function</strong>
      <button type="button" class="fx-picker-close" data-fx-close="1" title="Close" aria-label="Close">×</button>
    </div>
    <input id="fx-picker-q" type="search" placeholder="Search functions" aria-label="Search functions" autocomplete="off">
    <div id="fx-picker-list" class="fx-picker-list"></div>
  </div>
  <div id="data-find" class="data-panel" hidden role="dialog" aria-label="Find and replace">
    <div class="fx-picker-head">
      <strong>Find and replace</strong>
      <button type="button" class="fx-picker-close" data-find-close="1" title="Close" aria-label="Close">×</button>
    </div>
    <label class="data-field">Find <input id="data-find-q" type="text" autocomplete="off"></label>
    <label class="data-field">Replace with <input id="data-find-r" type="text" autocomplete="off"></label>
    <label class="data-check"><input type="checkbox" id="data-find-case"> Match case</label>
    <div class="data-scope">
      <label class="data-check"><input type="radio" name="data-find-scope" value="sheet" checked> This sheet</label>
      <label class="data-check"><input type="radio" name="data-find-scope" value="book"> All sheets</label>
    </div>
    <div class="data-actions">
      <button type="button" id="data-find-next">Find next</button>
      <button type="button" id="data-find-rep">Replace</button>
      <button type="button" id="data-find-all">Replace all</button>
    </div>
  </div>
  <div id="data-sort" class="data-panel" hidden role="dialog" aria-label="Sort"></div>
  <div id="data-dups" class="data-panel" hidden role="dialog" aria-label="Remove duplicates"></div>
  <div id="data-valid" class="data-panel" hidden role="dialog" aria-label="Data validation"></div>
  <div id="data-filter" class="data-panel data-filter-menu" hidden role="dialog" aria-label="Filter"></div>
  <button type="button" id="data-valid-arrow" class="data-valid-arrow" hidden title="Pick a value" aria-label="Pick a value" aria-haspopup="listbox">▾</button>
  <div id="data-valid-list" class="data-panel" hidden role="listbox" aria-label="Allowed values"></div>
  <div id="style-cf" class="data-panel" hidden role="dialog" aria-label="Conditional formatting"></div>
  <div id="bd-menu" class="bd-menu" role="menu" aria-label="Borders" hidden>
    <button type="button" role="menuitem" data-border="all">All</button>
    <button type="button" role="menuitem" data-border="outside">Outside</button>
    <button type="button" role="menuitem" data-border="inside">Inside</button>
    <button type="button" role="menuitem" data-border="top">Top</button>
    <button type="button" role="menuitem" data-border="bottom">Bottom</button>
    <button type="button" role="menuitem" data-border="left">Left</button>
    <button type="button" role="menuitem" data-border="right">Right</button>
    <button type="button" role="menuitem" data-border="none">No border</button>
  </div>
  <div id="sheet-wrap" class="sheet-wrap"></div>
  <div class="sheet-footer" id="sheet-footer">
    <div class="sheet-tabs" id="sheet-tabs" role="tablist" aria-label="Sheets"></div>
    <button type="button" class="sheet-tab-add" id="btn-sheet-add" title="Add sheet" aria-label="Add sheet">+</button>
    <div class="sheet-stats" id="sheet-stats" hidden></div>
    <div id="status" class="status"></div>
  </div>
  <script src="../shared/office-icons.js"></script>
  <script src="../shared/office-dialog.js"></script>
  <script src="../shared/office-page.js"></script>
  <script src="../shared/office-ribbon.js"></script>
  <script src="../shared/office-notify.js"></script>
  <script src="../shared/office-theme.js"></script>
  <script src="../shared/office-settings.js"></script>
  <script src="../shared/office-hover.js"></script>
  <script src="../shared/office-collapse.js"></script>
  <script src="../shared/office-colour.js"></script>
  <script src="../shared/office-hubbar.js"></script>
  <script src="../shared/office-quick.js"></script>
  <script src="spreadsheet_config.js?v=HO3"></script>
  <script src="spreadsheet_formula.js?v=HO3"></script>
  <script src="spreadsheet_functions.js?v=HO3"></script>
  <script src="spreadsheet_fx.js?v=HO3"></script>
  <script src="spreadsheet_refs.js?v=HO3"></script>
  <script src="spreadsheet_state.js?v=HO3"></script>
  <script src="spreadsheet_storage.js?v=HO3"></script>
  <script src="spreadsheet_files.js?v=HO3"></script>
  <script src="spreadsheet_grid.js?v=HO3"></script>
  <script src="spreadsheet_edit.js?v=HO3"></script>
  <script src="spreadsheet_fill.js?v=HO3"></script>
  <script src="spreadsheet_toolbar.js?v=HO3"></script>
  <script src="spreadsheet_settings.js?v=HO3"></script>
  <script src="spreadsheet_page.js?v=HO3"></script>
  <script src="spreadsheet_ribbon.js?v=HO3"></script>
  <script src="spreadsheet_logic.js?v=HO3"></script>
  <script src="spreadsheet_format.js?v=HO3"></script>
  <script src="spreadsheet_style.js?v=HO3"></script>
  <script src="spreadsheet_charts.js?v=HO3"></script>
  <script src="spreadsheet_undo.js?v=HO3"></script>
  <script src="spreadsheet_select.js?v=HO3"></script>
  <script src="spreadsheet_clipboard.js?v=HO3"></script>
  <script src="spreadsheet_rows.js?v=HO3"></script>
  <script src="spreadsheet_sheets.js?v=HO3"></script>
  <script src="spreadsheet_sort.js?v=HO3"></script>
  <script src="spreadsheet_data.js?v=HO3"></script>
  <script src="spreadsheet_resize.js?v=HO3"></script>
  <script src="spreadsheet_keys.js?v=HO3"></script>
  <script src="spreadsheet_xlsx.js?v=HO3"></script>
  <script src="spreadsheet_hub.js?v=HO3"></script>
  <script src="spreadsheet_quick.js?v=HO3"></script>
  <script src="../../../shared/fs/fs_drives.js"></script>
  <script src="../../../shared/fs/fs_ops.js"></script>
  <script src="../../../shared/fs/fs_ref.js"></script>
  <script src="../shared/office-native.js"></script>
  <script src="spreadsheet_hos.js"></script>
</body>
</html>
