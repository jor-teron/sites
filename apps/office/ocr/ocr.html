<!DOCTYPE html>
<!--
  OCR — scan images or PDFs to text. Page shell only.
  Styles: ocr.css. Settings: ocr_config.js. Logic: the other ocr_*.js files (one job each),
  loaded as plain scripts sharing window.OCR. Libraries are local in ./vendor (no CDN):
  tesseract.js 5.1.1 (+ wasm core + English data), pdf.js 3.11.174 (legacy build), JSZip 3.10.1, PeerJS 1.5.4 + qrcode.js (send from phone, ocr_send*.js).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121418">
  <title>OCR</title>
  <link rel="stylesheet" href="ocr.css?v=20261004b">
</head>
<body class="empty">
<div id="app">
  <header id="bar">
    <div class="seg" id="engine-seg" role="group" aria-label="Engine">
      <button type="button" data-engine="tesseract">Tesseract</button><button type="button" data-engine="vision">Cloud Vision</button>
    </div>
    <button type="button" class="btn" id="key-btn" hidden>Key 🗝️</button>
    <div id="nav" hidden>
      <button type="button" class="btn icon" id="prev" aria-label="Previous page">‹</button>
      <button type="button" class="btn plain" id="page-label" title="Go to page">1 / 1</button>
      <input type="number" id="page-input" inputmode="numeric" hidden aria-label="Page number">
      <button type="button" class="btn icon" id="next" aria-label="Next page">›</button>
    </div>
    <button type="button" class="btn primary" id="start" disabled>Start OCR</button>
    <button type="button" class="btn" id="all" hidden>All pages</button>
    <button type="button" class="btn" id="qr-btn" title="Send a file from your phone">QR</button>
    <span class="chip" id="phone-chip" hidden><span id="phone-chip-text">📱 Connected</span><button type="button" id="phone-x" title="Disconnect phone" aria-label="Disconnect phone">✕</button></span>
    <span class="grow"></span>
    <button type="button" class="btn" id="copy" disabled>Copy</button>
    <span class="dl"><span class="dl-label">Download</span><button type="button" class="btn small" id="dl-txt" disabled>.txt</button><button type="button" class="btn small" id="dl-docx" disabled>.docx</button></span>
  </header>

  <div id="status" role="status" aria-live="polite"></div>

  <nav id="tabs">
    <button type="button" data-tab="preview">Preview</button>
    <button type="button" data-tab="text">Text</button>
  </nav>

  <main id="panels">
    <section class="panel" id="panel-preview" aria-label="Preview — drop files here">
      <img id="preview" alt="Preview" hidden>
      <div class="hint" id="hint-preview">
        <div class="big">Tap to open, drop or paste</div>
        <div>JPG · PNG · WebP · PDF · max 20 MB</div>
      </div>
      <div class="corner">
        <button type="button" class="corner-btn" id="cam-btn" title="Take photo" aria-label="Take photo">📷</button>
        <button type="button" class="corner-btn plus" title="Open files" aria-label="Open files">＋</button>
      </div>
    </section>
    <section class="panel" id="panel-text" aria-label="Recognised text — drop files here">
      <textarea id="ocr-text" spellcheck="false" aria-label="Recognised text"></textarea>
      <div class="hint" id="hint-text">
        <div class="big">Recognised text appears here</div>
        <div>Tap to open a file</div>
      </div>
      <div class="corner">
        <button type="button" class="corner-btn plus" title="Open files" aria-label="Open files">＋</button>
      </div>
    </section>
  </main>

  <div id="key-pop" class="pop" hidden>
    <label for="key-input">API Key</label>
    <input type="password" id="key-input" autocomplete="off" spellcheck="false" placeholder="Cloud Vision API key">
    <div class="row">
      <button type="button" class="btn" id="key-show">Show</button>
      <button type="button" class="btn" id="key-clear">Clear</button>
      <button type="button" class="btn primary" id="key-save">Save</button>
    </div>
    <p class="note">Saved only in this browser.</p>
  </div>

  <div id="qr-pop" class="pop" hidden role="dialog" aria-label="Send from phone">
    <div class="qr-head"><span>Scan with your phone</span><button type="button" class="btn icon" id="qr-close" aria-label="Close">✕</button></div>
    <div id="qr-img"></div>
    <div id="qr-state">Waiting for phone…</div>
    <a id="qr-link" target="_blank" rel="noopener"></a>
  </div>

  <input type="file" id="file-in" multiple hidden>
  <input type="file" id="camera-in" accept="image/*" capture="environment" hidden>
</div>
<script src="vendor/tesseract.min.js?v=20261004a"></script>
<script src="vendor/pdf.min.js?v=20261004a"></script>
<script src="vendor/jszip.min.js?v=20261004a"></script>
<script src="ocr_config.js?v=20261004b"></script>
<script src="ocr_state.js?v=20261004a"></script>
<script src="ocr_engine.js?v=20261004a"></script>
<script src="ocr_pdf.js?v=20261004a"></script>
<script src="ocr_io.js?v=20261004a"></script>
<script src="ocr_jobs.js?v=20261004b"></script>
<script src="vendor/peerjs.min.js?v=20261004b"></script>
<script src="vendor/qrcode.js?v=20261004b"></script>
<script src="ocr_send_common.js?v=20261004b"></script>
<script src="ocr_send.js?v=20261004b"></script>
<script src="ocr_ui.js?v=20261004b"></script>
</body>
</html>
