<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181b21">
  <!-- (before HO6) <title>Hub Office</title> -->
  <!-- (before HO7) <title>Hub Office HO6</title> -->
  <!-- (before HO8) <title>Hub Office HO7</title> -->
  <!-- (before HO8a) <title>Hub Office HO8</title> -->
  <!-- (before HO9) <title>Hub Office HO8a</title> -->
  <!-- (before HO10) <title>Hub Office HO9</title> -->
  <!-- (before HO11) <title>Hub Office HO10</title> -->
  <!-- (before HO12) <title>Hub Office HO11</title> -->
  <title>Hub Office HO12</title>
  <!-- (before HO6) <meta name="version" content="HO-SC2"> -->
  <!-- (before HO7) <meta name="version" content="HO6"> -->
  <!-- (before HO8) <meta name="version" content="HO7"> -->
  <!-- (before HO8a) <meta name="version" content="HO8"> -->
  <!-- (before HO9) <meta name="version" content="HO8a"> -->
  <!-- (before HO10) <meta name="version" content="HO9"> -->
  <!-- (before HO11) <meta name="version" content="HO10"> -->
  <!-- (before HO12) <meta name="version" content="HO11"> -->
  <meta name="version" content="HO12">
  <link rel="icon" href="hub_office_icon.png">
  <!-- (before HO8a) <link rel="stylesheet" href="hub_office.css?v=HO8"> -->
  <!-- (before HO9) <link rel="stylesheet" href="hub_office.css?v=HO8a"> -->
  <!-- (before HO10) <link rel="stylesheet" href="hub_office.css?v=HO9"> -->
  <!-- (before HO11) <link rel="stylesheet" href="hub_office.css?v=HO10"> -->
  <!-- (before HO12) <link rel="stylesheet" href="hub_office.css?v=HO11"> -->
  <link rel="stylesheet" href="hub_office.css?v=HO12">
  <link rel="stylesheet" href="../shared/office-notify.css">
  <link rel="stylesheet" href="../shared/office-dialog.css">
  <script src="../../../shared/theme/hub_theme.js"></script>
</head>
<body>
  <div class="ho-container" id="ho-container">
    <!-- Top Tab Bar -->
    <!-- (before HO8) a pinned Start Page tab sat in this row and kept the
         bar visible even when no documents were open. Home now lives in the
         Hub title bar (H49), with a compact in-row button as a standalone
         fallback. The row hides until a document tab is open. -->
    <header class="ho-tab-bar ho-tab-bar-empty" id="ho-tab-bar" role="tablist" aria-label="Office tabs">
      <button type="button" class="ho-home-btn active" id="btn-home" title="Start Page" aria-label="Start Page" aria-pressed="true">
        <span class="ho-tab-icon">🏠</span>
        <span class="ho-home-label">Home</span>
      </button>
      <div class="ho-tabs-list" id="ho-tabs-list">
        <!-- Dynamic tabs inserted here: [ 📝 Untitled 1 ✕ ] or [ 📊 Budget.hos ✕ ] -->
      </div>
      <button type="button" class="ho-tab-add" id="btn-add-tab" title="New Writer document">+</button>
    </header>

    <!-- Views Area -->
    <div class="ho-views-container" id="ho-views-container">
      <!-- Start Page View -->
      <!-- (before HO8) aria-labelledby pointed at the Start Page tab in the strip. -->
      <div class="ho-view active" id="view-start" role="tabpanel" aria-label="Start Page">
        <!-- (before HO6) Start Page was a sidebar (brand, Open File, suite filter nav,
             search) plus a drop zone with a long Supported: line, description cards
             with taglines and format chips, and a recent list with a Refresh button. -->
        <!-- (before HO7) HO6 was a single column: Open file on top, a New row of five
             icons, a Recent list, and a Supported formats link and panel. Suite cards
             were removed. The layout below restores the cards under a Hub Office
             header, with Open/drop below them. -->
        <div class="ho-start" id="ho-start">
          <header class="ho-start-header">
            <h1 class="ho-heading">Hub Office</h1>
            <p class="ho-subheading">Write, calculate, present and organise. Files save on this device.</p>
          </header>

          <section class="ho-section" id="section-suites" aria-label="Office suites">
            <div class="ho-cards-grid" id="suites-grid">
              <!-- Dynamically populated -->
            </div>
          </section>

          <section class="ho-section" id="section-open" aria-label="Open a file">
            <div class="ho-open-box">
              <button type="button" class="ho-btn-primary" id="btn-open-file" title="Open an existing document (Ctrl+O)">Open file</button>
              <p class="ho-open-hint">or drop a file anywhere on this page</p>
              <!-- (before HOP1) accept=".how,.hos,.hslides,.hot,..." -->
              <!-- (before HOB1) accept=".how,.hos,.hop,.hslides,.hot,.docx,..." -->
              <!-- (before PN1) accept=".how,.hos,.hop,.hslides,.hot,.hob,.hbase,.docx,.xlsx,.pptx,.odt,.csv,.tsv,.txt,.md,.json" -->
              <!-- (before BS11) accept=".how,.hos,.hop,.hslides,.hot,.hob,.hbase,.docx,.xlsx,.pptx,.odp,.odt,.csv,.tsv,.txt,.md,.json" -->
              <!-- (before SH27) accept=".how,.hos,.hop,.hslides,.hot,.hob,.hbase,.odb,.docx,.xlsx,.pptx,.odp,.odt,.csv,.tsv,.txt,.md,.json" -->
              <!-- (before HO6) accept=".how,.hos,.hop,.hslides,.hot,.hob,.hbase,.odb,.docx,.xlsx,.ods,.pptx,.odp,.odt,.csv,.tsv,.txt,.md,.json" -->
              <!-- (before PN4) accept=".how,.docx,.odt,.hos,.xlsx,.xls,.ods,.csv,.hop,.hslides,.pptx,.odp,.hob,.hbase,.odb,.tsv,.txt,.json,.sqlite,.sqlite3,.db,.hot" -->
              <input type="file" id="file-input" hidden accept=".how,.docx,.odt,.hos,.xlsx,.xls,.ods,.csv,.hop,.pptx,.odp,.hob,.hbase,.odb,.tsv,.txt,.json,.sqlite,.sqlite3,.db,.hot">
            </div>
          </section>

          <section class="ho-section" id="section-recent">
            <h2 class="ho-sec-title">Recent</h2>
            <div class="ho-recent-list" id="recent-list">
              <!-- Dynamically populated -->
            </div>
          </section>

          <section class="ho-section" id="section-settings" aria-label="Settings">
            <h2 class="ho-sec-title">Settings</h2>
            <div class="ho-settings" id="ho-settings">
              <div class="ho-set-row">
                <span class="ho-set-label" id="lbl-set-font">Font</span>
                <div class="ho-set-controls">
                  <select id="set-font" aria-labelledby="lbl-set-font">
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Tinos">Tinos</option>
                  </select>
                  <label class="ho-set-size" for="set-font-size">Size
                    <input type="number" id="set-font-size" min="6" max="72" step="1" value="12" aria-label="Font size">
                  </label>
                </div>
              </div>
              <div class="ho-set-row">
                <span class="ho-set-label" id="lbl-set-paper">Paper</span>
                <div class="ho-set-controls">
                  <select id="set-paper" aria-labelledby="lbl-set-paper">
                    <option value="A4">A4</option>
                    <option value="Letter">Letter</option>
                  </select>
                  <label class="ho-set-size" for="set-units">Units
                    <select id="set-units">
                      <option value="cm">cm</option>
                      <option value="in">in</option>
                    </select>
                  </label>
                </div>
              </div>
              <div class="ho-set-row">
                <span class="ho-set-label" id="lbl-set-date">Date format</span>
                <div class="ho-set-controls">
                  <select id="set-date-format" aria-labelledby="lbl-set-date">
                    <option value="dmy">31/12/2026</option>
                    <option value="ymd">2026-12-31</option>
                    <option value="mdy">12/31/2026</option>
                  </select>
                  <label class="ho-set-size" for="set-number-locale">Numbers
                    <select id="set-number-locale">
                      <option value="en-IN">1,00,000 Indian</option>
                      <option value="en-US">100,000 US</option>
                      <option value="en-GB">100,000 UK</option>
                    </select>
                  </label>
                </div>
              </div>
              <div class="ho-set-row">
                <label class="ho-set-label" for="set-autosave">Autosave</label>
                <div class="ho-set-controls">
                  <input type="checkbox" id="set-autosave" checked>
                </div>
              </div>
              <div class="ho-set-row">
                <label class="ho-set-label" for="set-save-location">Save to</label>
                <div class="ho-set-controls">
                  <select id="set-save-location">
                    <option value="documents">Hub Documents</option>
                    <option value="ask">Ask each time</option>
                  </select>
                </div>
              </div>
              <div class="ho-set-row">
                <label class="ho-set-label" for="set-author">Your name</label>
                <div class="ho-set-controls">
                  <input type="text" id="set-author" maxlength="60" autocomplete="name" spellcheck="false">
                </div>
              </div>
            </div>
            <p class="ho-set-note">Defaults for new documents. Each app's own settings still win.</p>
          </section>
        </div>
      </div>
      <!-- Dynamic document views inserted here -->
    </div>
  </div>

  <div class="ho-drop-overlay" id="ho-drop-overlay" hidden>
    <div class="ho-drop-overlay-inner">Drop a file to open it</div>
  </div>

  <script src="../../../shared/fs/fs_drives.js"></script>
  <script src="../../../shared/fs/filetypes.js"></script>
  <script src="../../../shared/fs/fs_ref.js"></script>
  <script src="../shared/office-notify.js"></script>
  <script src="../shared/office-dialog.js"></script>
  <script src="../shared/office-hubbar.js"></script>
  <script src="../shared/office-docname.js"></script>
  <script src="../shared/office-newdoc.js"></script>
  <script src="../shared/office-shared-settings.js"></script>
  <!-- (before HO8a) <script src="hub_office.js?v=HO8"></script> -->
  <!-- (before HO9) <script src="hub_office.js?v=HO8a"></script> -->
  <!-- (before HO10) <script src="hub_office.js?v=HO9"></script> -->
  <!-- (before HO11) <script src="hub_office.js?v=HO10"></script> -->
  <!-- (before HO12) <script src="hub_office.js?v=HO11"></script> -->
  <script src="hub_office.js?v=HO12"></script>
</body>
</html>
