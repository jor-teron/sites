<!DOCTYPE html>
<!-- Hub Office Suite Start Center — redirect entry point to hub_office.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub Office</title>
  <link rel="canonical" href="hub_office.html">
  <style>html,body{margin:0;background:#fff;color:#202124}html.dark,html.dark body{background:#121418;color:#9aa0a6}html.dark a{color:#6ea8fe}</style>
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { /* blocked */ }
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.className = 'dark';
      location.replace('hub_office.html' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=hub_office.html"></noscript>
</head>
<body><noscript><p><a href="hub_office.html">Open Hub Office</a></p></noscript></body>
</html>
