<!DOCTYPE html>
<!--
  ============================================================
  FILE: draftly.html
  PROJECT: Draftly
  ROLE: Shell only. Styles live in ui/*.css.
        Behavior lives in modules/. This file does not
        contain magic numbers or editor logic.
  LOAD ORDER: vendor libs (html-docx, jspdf, html2canvas; all local, works
  offline / file://), then config, storage, ui, editor, pages, flow, marks,
  export, pdf, lists, view, app.
  ============================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draftly</title>
  <meta name="theme-color" content="#5b5bf0">
  <link rel="icon" href="draftly_icon.png">
  <link rel="stylesheet" href="ui/fonts.css?v=7">
  <link rel="stylesheet" href="ui/theme.css?v=8">
  <link rel="stylesheet" href="ui/base.css?v=7">
  <link rel="stylesheet" href="ui/toolbar.css?v=7">
  <link rel="stylesheet" href="ui/popups.css?v=7">
  <link rel="stylesheet" href="../shared/office-dialog.css?v=1">
  <link rel="stylesheet" href="ui/workspace.css?v=7">
  <link rel="stylesheet" href="ui/ribbon.css?v=9">
  <link rel="stylesheet" href="ui/page.css?v=7">
  <link rel="stylesheet" href="ui/editor.css?v=7">
  <link rel="stylesheet" href="ui/marks.css?v=7">
  <link rel="stylesheet" href="ui/toast.css?v=7">
  <link rel="stylesheet" href="ui/print.css?v=7">
  <link rel="stylesheet" href="ui/colour.css?v=7">
  <link rel="stylesheet" href="ui/find.css?v=7">
  <link rel="stylesheet" href="ui/statusbar.css?v=7">
  <link rel="stylesheet" href="ui/ruler.css?v=1">
  <link rel="stylesheet" href="ui/table.css?v=7">
  <link rel="stylesheet" href="ui/image.css?v=1">
  <link rel="stylesheet" href="ui/format.css?v=7">
  <link rel="stylesheet" href="ui/headerfooter.css?v=1">
  <link rel="stylesheet" href="ui/margins.css?v=1">
  <link rel="stylesheet" href="ui/merge.css?v=2">
</head>
<body>

  <!-- ============================================================
       TOP BAR: File button, document name, ribbon tabs, theme.
       RIBBON: one row of controls per tab; scrolls sideways when narrow.
       ============================================================ -->
  <header class="toolbar topbar" id="toolbar">
    <div class="brand" title="Draftly">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h4"/></svg></span>
      <span class="brand-name">Draftly</span>
    </div>
    <button type="button" class="tool-btn labeled file-btn" id="fileBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="fileMenu"><span>File</span></button>
    <div class="ribbon-tabs" role="tablist" aria-label="Ribbon">
      <button type="button" class="ribbon-tab" role="tab" id="tabHome" aria-controls="panelHome" aria-selected="true" data-tab="home">Home</button>
      <button type="button" class="ribbon-tab" role="tab" id="tabInsert" aria-controls="panelInsert" aria-selected="false" tabindex="-1" data-tab="insert">Insert</button>
      <button type="button" class="ribbon-tab" role="tab" id="tabPage" aria-controls="pagePanel" aria-selected="false" tabindex="-1" data-tab="page">Page</button>
      <button type="button" class="ribbon-tab" role="tab" id="tabMerge" aria-controls="panelMerge" aria-selected="false" tabindex="-1" data-tab="merge">Merge</button>
    </div>
    <input id="fileNameInput" class="file-name" type="text" spellcheck="false" title="Document name" aria-label="Document name">
    <button class="tool-btn" id="themeToggleBtn" title="Dark theme" aria-label="Toggle theme">
      <span class="icon-moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span>
      <span class="icon-sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></span>
    </button>
  </header>

  <!-- File menu (FT1) -->
  <div class="pop-menu file-menu" id="fileMenu" role="menu" aria-labelledby="fileBtn" hidden>
      <button type="button" class="file-item" role="menuitem" id="newBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M12 10v7M8.5 13.5h7"/></svg><span>New</span></button>
      <button type="button" class="file-item" role="menuitem" id="renameBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z"/></svg><span>Rename</span></button>
      <button type="button" class="file-item" role="menuitem" id="deleteCurrentBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/></svg><span>Delete document</span></button>
      <div class="file-sep" role="separator"></div>
      <button type="button" class="file-item" role="menuitem" id="themeMenuBtn"><span class="icon-moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span><span class="icon-sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></span><span id="themeMenuLabel">Dark mode</span></button>
      <button type="button" class="file-item" role="menuitem" id="saveBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span>Save <kbd>Ctrl+S</kbd></span></button>
      <button type="button" class="file-item" role="menuitem" id="printBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="1.5"/><path d="M7 14h10v6H7z"/></svg><span>Print <kbd>Ctrl+P</kbd></span></button>
      <button type="button" class="file-item" role="menuitem" id="exportDocxBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg><span>Export DOCX</span></button>
      <button type="button" class="file-item" role="menuitem" id="exportPdfBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg><span>Export PDF</span></button>
      <div class="file-sep" role="separator"></div>
      <button type="button" class="file-item file-recent-head" role="menuitem" id="recentBtn" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Recent</span></button>
      <div class="recent-menu recent-inline" id="recentMenu" hidden></div>
  </div>

  <!-- Custom margins dialog -->
  <div class="pop-menu margin-dialog" id="marginDialog" role="dialog" aria-label="Custom margins" hidden>
    <div class="md-title">Custom margins (cm)</div>
    <div class="md-grid">
      <label>Top <input type="number" id="mTop" min="0.5" max="5" step="0.1"></label>
      <label>Bottom <input type="number" id="mBottom" min="0.5" max="5" step="0.1"></label>
      <label>Left <input type="number" id="mLeft" min="0.5" max="5" step="0.1"></label>
      <label>Right <input type="number" id="mRight" min="0.5" max="5" step="0.1"></label>
    </div>
    <label class="md-same"><input type="checkbox" id="mSame"> Same for all</label>
    <div class="md-actions">
      <button type="button" class="find-text-btn" id="mCancel">Cancel</button>
      <button type="button" class="find-text-btn md-apply" id="mApply">Apply</button>
    </div>
  </div>

  <!-- FT3 colour palettes -->
  <div class="pop-menu colour-menu" id="textColourMenu" role="menu" aria-label="Font colour" hidden></div>
  <div class="pop-menu colour-menu" id="hiliteColourMenu" role="menu" aria-label="Highlight colour" hidden></div>

  <!-- Ribbon: one tabpanel visible at a time -->
  <nav class="toolbar ribbon" aria-label="Ribbon commands">
    <div class="ribbon-panel" role="tabpanel" id="panelHome" aria-labelledby="tabHome">
      <div class="tool-group">
        <button class="tool-btn" id="undoBtn" title="Undo (Ctrl/⌘+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H11"/></svg></button>
        <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Y / ⌘+Shift+Z)" aria-label="Redo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l4.5 4.5L15 16"/><path d="M19 11.5H9.5a5 5 0 0 0 0 10H13"/></svg></button>
      </div>
      <div class="tool-group">
        <select id="fontFamilySelect" class="font-select" title="Font family">
          <option value="Times New Roman" selected>Times New Roman</option>
          <option value="Tinos">Tinos</option>
        </select>
        <select id="fontSizeSelect" class="size-select" title="Font size">
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12" selected>12</option>
          <option value="14">14</option>
          <option value="18">18</option>
          <option value="24">24</option>
          <option value="36">36</option>
        </select>
      </div>
      <div class="tool-group">
        <button class="tool-btn" id="boldBtn" title="Bold (Ctrl/⌘+B)" aria-label="Bold"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h6a3.5 3.5 0 0 1 0 7H7z"/><path d="M7 11.5h7a3.75 3.75 0 0 1 0 7.5H7z"/></svg></button>
        <button class="tool-btn" id="italicBtn" title="Italic (Ctrl/⌘+I)" aria-label="Italic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4.5h8M6 19.5h8M14.5 4.5l-5 15"/></svg></button>
        <button class="tool-btn" id="underlineBtn" title="Underline (Ctrl/⌘+U)" aria-label="Underline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v7a5 5 0 0 0 10 0V4"/><path d="M5 20.5h14"/></svg></button>
        <button class="tool-btn" id="strikeBtn" title="Strikethrough (Ctrl/⌘+Shift+X)" aria-label="Strikethrough"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5C15.6 5.2 14 4.5 12 4.5c-2.8 0-4.5 1.5-4.5 3.5 0 1.6 1 2.6 3 3.2"/><path d="M4 12h16"/><path d="M15.8 14.5c.5.6.7 1.2.7 2 0 2.1-1.9 3.5-4.6 3.5-2.2 0-3.9-.8-4.8-2.2"/></svg></button>
        <button class="tool-btn" id="superBtn" title="Superscript (Ctrl/⌘+.)" aria-label="Superscript"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8 11M12 8l-8 11"/><path d="M16 5.5a1.8 1.8 0 1 1 3.2 1.2L16 10h3.6"/></svg></button>
        <button class="tool-btn" id="subBtn" title="Subscript (Ctrl/⌘+,)" aria-label="Subscript"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5l8 11M12 5l-8 11"/><path d="M16 15.5a1.8 1.8 0 1 1 3.2 1.2L16 20h3.6"/></svg></button>
      </div>
      <div class="tool-group">
        <div class="split-btn" role="group" aria-label="Font colour">
          <button class="tool-btn split-main" id="textColourBtn" title="Font colour" aria-label="Apply font colour"><span class="colour-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 16 12 4l5 12M8.7 12h6.6"/></svg><span class="colour-bar" id="textColourBar"></span></span></button>
          <button class="tool-btn split-arrow" id="textColourArrow" title="Font colour options" aria-label="Font colour options" aria-haspopup="menu" aria-expanded="false" aria-controls="textColourMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
        </div>
        <div class="split-btn" role="group" aria-label="Highlight colour">
          <button class="tool-btn split-main" id="hiliteColourBtn" title="Highlight" aria-label="Apply highlight"><span class="colour-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 4 4 4-7 7h-4v-4z"/><path d="M7.5 15 5 17.5h4"/></svg><span class="colour-bar" id="hiliteColourBar"></span></span></button>
          <button class="tool-btn split-arrow" id="hiliteColourArrow" title="Highlight options" aria-label="Highlight options" aria-haspopup="menu" aria-expanded="false" aria-controls="hiliteColourMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
        </div>
      </div>
      <div class="tool-group">
        <button class="tool-btn" id="alignLeftBtn" title="Align left" aria-label="Align left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
        <button class="tool-btn" id="alignCenterBtn" title="Align center" aria-label="Align center"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
        <button class="tool-btn" id="alignRightBtn" title="Align right" aria-label="Align right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
        <button class="tool-btn" id="alignJustifyBtn" title="Justify (Ctrl+J)" aria-label="Justify"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></button>
      </div>
      <div class="tool-group">
        <select id="lineSpacingSelect" class="spacing-select" title="Line spacing" aria-label="Line spacing">
          <option value="" hidden>Spacing</option>
          <option value="1">1.0</option>
          <option value="1.15">1.15</option>
          <option value="1.5">1.5</option>
          <option value="2">2.0</option>
        </select>
        <button class="tool-btn" id="indentDecBtn" title="Decrease indent (Shift+Tab)" aria-label="Decrease indent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M11 10h9M11 14h9M4 19h16M8 9l-4 3 4 3"/></svg></button>
        <button class="tool-btn" id="indentIncBtn" title="Increase indent (Tab)" aria-label="Increase indent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M11 10h9M11 14h9M4 19h16M4 9l4 3-4 3"/></svg></button>
      </div>
      <div class="tool-group">
        <select id="listKindSelect" class="list-select" title="List kind">
          <option value="" hidden>List</option>
          <option value="bullet">• List</option>
          <option value="1">1 2 3</option>
          <option value="a">a b c</option>
          <option value="A">A B C</option>
          <option value="none">None</option>
        </select>
        <select id="listSuffixSelect" class="suffix-select" title="Number suffix" disabled>
          <option value=".">.</option>
          <option value=",">,</option>
          <option value=")">)</option>
          <option value="none">–</option>
        </select>
      </div>
      <div class="tool-group">
        <button class="tool-btn" id="nonPrintingBtn" title="Show format marks (¶ ↵)" aria-label="Show format marks" aria-pressed="false"><span class="glyph">¶</span></button>
      </div>
      <div class="tool-group">
        <button class="tool-btn labeled" id="findRibbonBtn" title="Find (Ctrl/⌘+F) · Replace (Ctrl+H)" aria-label="Find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg><span>Find</span></button>
      </div>
    </div>
    <div class="ribbon-panel" role="tabpanel" id="panelInsert" aria-labelledby="tabInsert" hidden>
      <div class="tool-group">
        <button class="tool-btn labeled" id="pageBreakBtn" title="Page break (Ctrl/⌘+Enter)" aria-label="Insert page break"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v6h12V3"/><path d="M6 21v-6h12v6"/><path d="M3 12h3M9 12h2M13 12h2M18 12h3"/></svg><span>Page break</span></button>
        <button class="tool-btn labeled" id="tableBtn" title="Insert table" aria-label="Insert table" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 4.5v15M14.5 4.5v15"/></svg><span>Table</span></button>
        <button class="tool-btn labeled" id="imageBtn" title="Insert image" aria-label="Insert image"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg><span>Image</span></button>
        <input type="file" id="imageFile" accept="image/*" hidden>
        <button class="tool-btn labeled" id="hfBtn" title="Header &amp; Footer (or double-click the top / bottom margin)" aria-label="Header and footer" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="1"/><path d="M8 7h8M8 17h8"/></svg><span>Header &amp; Footer</span></button>
      </div>
      <div class="tool-group hf-tools" id="hfTools" hidden>
        <button class="tool-btn labeled" data-hf-field="{page}" title="Insert page number"><span>Page #</span></button>
        <button class="tool-btn labeled" data-hf-field="of {pages}" title="Insert total pages"><span>of Pages</span></button>
        <button class="tool-btn labeled" data-hf-field="{date}" title="Insert today&#39;s date"><span>Date</span></button>
        <button class="tool-btn labeled" id="hfCloseBtn" title="Close header &amp; footer (Esc)"><span>Close</span></button>
      </div>
      <div class="tool-group table-tools" id="tableTools" hidden>
        <button class="tool-btn labeled" data-tbl="rowAbove" title="Insert row above"><span>Row above</span></button>
        <button class="tool-btn labeled" data-tbl="rowBelow" title="Insert row below"><span>Row below</span></button>
        <button class="tool-btn labeled" data-tbl="colLeft" title="Insert column left"><span>Col left</span></button>
        <button class="tool-btn labeled" data-tbl="colRight" title="Insert column right"><span>Col right</span></button>
        <button class="tool-btn labeled" data-tbl="delRow" title="Delete row"><span>Del row</span></button>
        <button class="tool-btn labeled" data-tbl="delCol" title="Delete column"><span>Del col</span></button>
        <button class="tool-btn labeled" data-tbl="delTable" title="Delete table"><span>Del table</span></button>
      </div>
      <span class="ribbon-note">Image coming later</span>
      <div class="table-picker" id="tablePicker" hidden role="dialog" aria-label="Table size"><div class="tp-grid" id="tpGrid"></div><div class="tp-label" id="tpLabel">1 x 1</div></div>
    </div>
    <div class="ribbon-panel page-row" role="tabpanel" id="pagePanel" aria-labelledby="tabPage" hidden>
      <div class="seg" role="group" aria-label="Orientation">
        <button type="button" class="seg-btn" data-orient="portrait"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3.5" width="10" height="17" rx="1.5"/></svg><span>Portrait</span></button>
        <button type="button" class="seg-btn" data-orient="landscape"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="10" rx="1.5"/></svg><span>Landscape</span></button>
      </div>
      <div class="seg" role="group" aria-label="Paper size">
        <button type="button" class="seg-btn" data-size="A4"><span>A4</span></button>
        <button type="button" class="seg-btn" data-size="Legal"><span>Legal</span></button>
      </div>
      <div class="seg" role="group" aria-label="Margins">
        <button type="button" class="seg-btn" data-margins="normal"><span>Normal</span></button>
        <button type="button" class="seg-btn" data-margins="narrow"><span>Narrow</span></button>
        <button type="button" class="seg-btn" id="customMarginsBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="marginDialog" aria-pressed="false"><span>Custom…</span></button>
      </div>
      <div class="seg" role="group" aria-label="Page numbers">
        <button type="button" class="seg-btn" data-pn="off"><span>No numbers</span></button>
        <button type="button" class="seg-btn" data-pn="center"><span>Centre</span></button>
        <button type="button" class="seg-btn" data-pn="right"><span>Right</span></button>
      </div>
      <div class="seg" role="group" aria-label="Status bar">
        <button type="button" class="seg-btn" id="statusBarToggle" aria-pressed="true" title="Show or hide the status bar"><span>Status bar</span></button>
      </div>
      <div class="seg" role="group" aria-label="Ruler">
        <button type="button" class="seg-btn" id="rulerToggle" aria-pressed="false" title="Show or hide the ruler"><span>Ruler</span></button>
      </div>
      <select id="orientationSelect" class="visually-hidden" tabindex="-1" aria-hidden="true">
        <option value="portrait" selected>Portrait</option>
        <option value="landscape">Landscape</option>
      </select>
          <select id="orientationSelect" class="visually-hidden" tabindex="-1" aria-hidden="true">
        <option value="portrait" selected>Portrait</option>
        <option value="landscape">Landscape</option>
      </select>
      <dl class="panel-info">
        <dt>Size</dt><dd><span id="paperSizeLabel">A4</span> · <span id="orientationLabel">Portrait</span></dd>
        <dt>Margins</dt><dd id="marginInfo">—</dd>
        <dt>Pages</dt><dd id="pageCountLabel">1 page</dd>
      </dl>
    </div>
    <!-- MM1 / MM3 Merge tab: mail merge from a CSV or an Excel .xlsx file (draftly-merge-ui.js). Placeholders are written {{Column Name}}. -->
    <div class="ribbon-panel mm-row" role="tabpanel" id="panelMerge" aria-labelledby="tabMerge" hidden>
      <div class="tool-group mm-group" role="group" aria-label="Data">
        <span class="mm-cap">Data</span>
        <button class="tool-btn labeled" id="mmChooseBtn" title="Choose a CSV or Excel (.xlsx) file from a Hub drive" aria-label="Choose file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5a1.5 1.5 0 0 1 1.5-1.5H10l2 2.5h6.5A1.5 1.5 0 0 1 20 10v7.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/></svg><span>Choose file</span></button>
        <button class="tool-btn labeled" id="mmRefreshBtn" title="Read the data file again" aria-label="Refresh data file" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg><span>Refresh</span></button>
        <select id="mmDelim" class="size-select mm-delim" title="Delimiter" aria-label="Delimiter">
          <option value="auto" selected>Auto</option>
          <option value=",">Comma ,</option>
          <option value=";">Semicolon ;</option>
          <option value="&#9;">Tab</option>
        </select>
        <select id="mmSheetPick" class="size-select mm-sheetpick" title="Sheet of the Excel workbook" aria-label="Sheet" hidden></select>
        <span class="mm-status" id="mmStatus" aria-live="polite">No file chosen</span>
        <span class="mm-changed" id="mmChanged" hidden title="The file on disk is different from what is loaded">&#9679; File changed</span>
      </div>
      <div class="tool-group mm-group" role="group" aria-label="Fields">
        <span class="mm-cap">Fields</span>
        <button class="tool-btn labeled" id="mmFieldsBtn" title="Insert a field at the cursor: {{Column Name}}" aria-label="Insert field" aria-haspopup="menu" aria-expanded="false" aria-controls="mmFieldsMenu" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H7.5A1.5 1.5 0 0 0 6 6.5v3A1.5 1.5 0 0 1 4.5 11 1.5 1.5 0 0 1 6 12.5v5A1.5 1.5 0 0 0 7.5 19H9"/><path d="M15 5h1.5A1.5 1.5 0 0 1 18 6.5v3a1.5 1.5 0 0 0 1.5 1.5 1.5 1.5 0 0 0-1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5H15"/></svg><span>Insert field</span></button>
        <button class="tool-btn labeled mm-warn" id="mmWarnBtn" title="Warnings about the fields and the CSV" aria-label="Warnings" aria-haspopup="true" aria-expanded="false" aria-controls="mmWarnMenu" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 3.5 19h17z"/><path d="M12 10v4M12 16.5v.5"/></svg><span id="mmWarnLabel">Warnings</span></button>
      </div>
      <div class="tool-group mm-group" role="group" aria-label="Preview">
        <span class="mm-cap">Preview</span>
        <button class="tool-btn labeled" id="mmPreviewBtn" title="Show the document with the values of one row" aria-label="Preview" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg><span>Preview</span></button>
        <button class="tool-btn" id="mmPrevBtn" title="Previous row" aria-label="Previous row" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <span class="mm-counter" id="mmCounter" aria-live="polite">Row &ndash;</span>
        <button class="tool-btn" id="mmNextBtn" title="Next row" aria-label="Next row" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div class="tool-group mm-group" role="group" aria-label="Finish">
        <span class="mm-cap">Finish</span>
        <button class="tool-btn labeled accent" id="mmExportBtn" title="One DOCX per row (.zip) or one combined file" aria-label="Export all" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></svg><span>Export all</span></button>
      </div>
      <input type="file" id="mmFile" accept=".csv,.tsv,.txt,.xlsx,.xlsm,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </div>

  <!-- ============================================================
       WORKSPACE — pages are scaled to fit narrow screens
       (#pagesScaler holds the scaled size, #pages is laid out at true A4)
       ============================================================ -->
  <main class="workspace" id="workspace">
    <div class="pages-scaler" id="pagesScaler">
      <div class="pages" id="pages">
        <div class="paper" id="paper">
          <div class="editor" contenteditable="true" data-placeholder="Start typing here…" spellcheck="false"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- MM1 merge preview: read-only overlay over the workspace, filled with a merged copy -->
  <div class="mm-preview" id="mmPreview" role="region" aria-label="Merge preview" hidden>
    <div class="mm-pv-note" id="mmPvNote" role="status" hidden></div>
    <div class="mm-pv-scroll">
      <div class="mm-sheet" id="mmSheet">
        <div class="mm-hfbox mm-hf-head" id="mmHfHead"></div>

        <div class="mm-hfbox mm-hf-foot" id="mmHfFoot"></div>
      </div>
    </div>
  </div>
  <div class="pop-menu mm-menu" id="mmFieldsMenu" role="menu" aria-label="Fields" hidden></div>
  <div class="pop-menu mm-menu mm-warn-menu" id="mmWarnMenu" role="dialog" aria-label="Merge warnings" hidden></div>

  <!-- FT4 find bar (Ctrl/⌘+F, Ctrl+H) -->
  <div class="find-bar" id="findBar" role="search" aria-label="Find and replace" hidden>
    <div class="find-row">
      <button type="button" class="find-btn" id="findExpandBtn" title="Toggle replace" aria-label="Toggle replace" aria-expanded="false" aria-controls="replaceRow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      <input type="text" id="findInput" class="find-input" placeholder="Find" aria-label="Find" spellcheck="false" autocomplete="off">
      <button type="button" class="find-btn find-case" id="findCaseBtn" title="Match case" aria-label="Match case" aria-pressed="false">Aa</button>
      <span class="find-count" id="findCount" aria-live="polite"></span>
      <button type="button" class="find-btn" id="findPrevBtn" title="Previous (Shift+Enter)" aria-label="Previous match"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
      <button type="button" class="find-btn" id="findNextBtn" title="Next (Enter)" aria-label="Next match"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button type="button" class="find-btn" id="findCloseBtn" title="Close (Esc)" aria-label="Close find"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="find-row replace-row" id="replaceRow" hidden>
      <input type="text" id="replaceInput" class="find-input" placeholder="Replace" aria-label="Replace with" spellcheck="false" autocomplete="off">
      <button type="button" class="find-text-btn" id="replaceBtn" title="Replace (Enter)">Replace</button>
      <button type="button" class="find-text-btn" id="replaceAllBtn" title="Replace all (Ctrl+Enter)">Replace all</button>
    </div>
  </div>

  <!-- FT4 status bar: word count -->
  <footer class="status-bar" id="statusBar">
    <span class="status-item" id="statusPages">Page 1 of 1</span>
    <button type="button" class="status-item status-btn" id="wordCountBtn" title="Word count" aria-haspopup="dialog" aria-expanded="false" aria-controls="wordCountPop">0 words</button>
    <div class="zoom-ctl" role="group" aria-label="Zoom">
      <button type="button" class="status-btn zoom-btn" id="zoomOutBtn" title="Zoom out (Ctrl+−)" aria-label="Zoom out">−</button>
      <button type="button" class="status-btn zoom-pct" id="zoomPctBtn" title="Reset zoom to 100% (Ctrl+0)" aria-label="Reset zoom">100%</button>
      <button type="button" class="status-btn zoom-btn" id="zoomInBtn" title="Zoom in (Ctrl+=)" aria-label="Zoom in">+</button>
    </div>
  </footer>
  <div class="pop-menu wc-pop" id="wordCountPop" role="dialog" aria-label="Word count" hidden></div>
