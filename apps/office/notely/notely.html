<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181b21">
<title>Notely</title>
<meta name="version" content="NL2">
<link rel="icon" href="notely_icon.png">
<link rel="stylesheet" href="notely.css">
<script src="../../../shared/theme/hub_theme.js"></script>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Notely">
  <button id="btn-open" type="button" title="Open a text file (Ctrl+O)">Open</button>
  <button id="btn-download" type="button" title="Download as Notely.txt (Ctrl+S)">Download</button>
  <span id="status" class="status" role="status" aria-live="polite"></span>
</div>
<textarea id="text" wrap="soft" spellcheck="true" autocomplete="off" autocapitalize="sentences" aria-label="Notes" placeholder="Start typing… (saved automatically)"></textarea>
<input id="file" type="file" accept=".txt,.md,.markdown,.csv,.log,.json,text/*" hidden>
<script src="notely_config.js"></script>
<script src="nl_store.js"></script>
<script src="nl_theme.js"></script>
<script src="nl_editor.js"></script>
<script src="nl_files.js"></script>
<script src="nl_keys.js"></script>
<script src="nl_handoff.js"></script>
<script src="nl_main.js"></script>
</body>
</html>
