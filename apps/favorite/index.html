<!DOCTYPE html>
<!-- Redirect entry point to favorite.html (keeps ?query and #hash). IX7: no visible body; colours follow the Hub theme (sites-hub.theme, else the device setting). Legacy: script redirect with a visible "Favorite" link in <body>; it now lives in <noscript>. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favorite</title>
  <link rel="canonical" href="favorite.html">
  <style>html,body{margin:0;background:#fff;color:#202124}html.dark,html.dark body{background:#121418;color:#9aa0a6}html.dark a{color:#6ea8fe}</style>
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { /* blocked */ }
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.className = 'dark';
      location.replace('favorite.html' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=favorite.html"></noscript>
</head>
<body><noscript><p><a href="favorite.html">Open Favorite</a></p></noscript></body>
</html>
