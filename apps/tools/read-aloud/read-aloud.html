<!DOCTYPE html>
<!--
  Read Aloud (RA1) — standalone reader for News headlines and pasted or opened text.
  Modules: ra_store (localStorage readaloud.*), ra_text (markdown strip + sentences),
  ra_speech (speechSynthesis), ra_news (News cache via news_store.js / news_feed.js),
  ra_ui (tabs, player, settings). Does not edit the News app or write News settings/seen.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#141821">
  <title>Read Aloud · RA1</title>
  <link rel="icon" href="read-aloud_icon.svg">
  <link rel="stylesheet" href="read-aloud.css?v=RA1">
  <script src="../../../shared/theme/hub_theme.js"></script>
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('readaloud.theme') || '"auto"'), t = localStorage.getItem('sites-hub.theme');
      var m = (s === 'light' || s === 'dark') ? s : (t === 'dark' ? 'dark' : 'light');
      document.documentElement.dataset.ra = m;
    } catch (e) { document.documentElement.dataset.ra = 'light'; }
  </script>
</head>
<body>
<div id="app">
  <header class="top">
    <h1 class="brand">🔊 Read Aloud</h1>
    <div class="srcseg" id="srcSeg" role="tablist" aria-label="Source">
      <button type="button" class="nb" data-src="news" role="tab" aria-selected="true">News</button>
      <button type="button" class="nb" data-src="text" role="tab" aria-selected="false">Text</button>
    </div>
    <button type="button" class="nb" id="btnRef" title="Refresh news" aria-label="Refresh news">↻</button>
    <button type="button" class="nb" id="btnSet" title="Settings" aria-label="Settings">⚙</button>
  </header>
  <nav id="newsTabs" class="tabs" role="tablist" aria-label="News tabs"></nav>
  <div id="banner" class="banner" hidden role="status"></div>
  <div id="status" class="status" aria-live="polite"></div>
  <main id="main">
    <section id="paneNews" class="pane on" aria-label="News headlines"></section>
    <section id="paneText" class="pane" aria-label="Text to read" hidden>
      <div class="textbar">
        <button type="button" class="nb wide" id="btnOpen">Open file</button>
        <input id="fileIn" type="file" accept=".txt,.md,text/plain,text/markdown" hidden>
        <button type="button" class="nb wide" id="btnClear">Clear</button>
        <span id="textMeta" class="mut"></span>
      </div>
      <label class="sr" for="textIn">Text to read</label>
      <textarea id="textIn" rows="6" placeholder="Paste text here, or open a .txt or .md file. It is read sentence by sentence."></textarea>
      <div id="sentList" class="slist" aria-label="Sentences"></div>
    </section>
  </main>
  <footer class="player" id="player">
    <div class="now" id="nowPlaying" aria-live="polite">Nothing to read yet</div>
    <div class="pbtns">
      <button type="button" class="nb play" id="btnPrev" title="Previous" aria-label="Previous">⏮</button>
      <button type="button" class="nb play pri" id="btnPlay" title="Play" aria-label="Play">▶</button>
      <button type="button" class="nb play" id="btnNext" title="Next" aria-label="Next">⏭</button>
      <button type="button" class="nb play" id="btnStop" title="Stop" aria-label="Stop">⏹</button>
    </div>
  </footer>
</div>
<dialog id="settings" class="dlg" aria-labelledby="setTitle">
  <div class="dlg-head"><h2 id="setTitle">Settings</h2><button type="button" class="nb" id="setClose" aria-label="Close">✕</button></div>
  <h3>Theme</h3>
  <div class="seg" id="setTheme" role="radiogroup" aria-label="Theme"></div>
  <h3>Voice</h3>
  <select id="setVoice" aria-label="Voice"></select>
  <button type="button" class="nb wide" id="btnTest" style="margin-top:8px">Test voice</button>
  <h3>Speed</h3>
  <label class="rng"><input id="setRate" type="range" min="0.75" max="2" step="0.05" value="1"><span id="setRateVal">1×</span></label>
  <h3>Pitch</h3>
  <label class="rng"><input id="setPitch" type="range" min="0.5" max="1.5" step="0.05" value="1"><span id="setPitchVal">1</span></label>
  <h3>News</h3>
  <label class="chk"><input id="setOnlyNew" type="checkbox"> Only new stories</label>
  <p class="hint">Uses the browser’s built-in voice (no key, works offline for Saved and pasted text). News headlines come from the same cache as the News app. Auto theme follows the Hub. Release RA1.</p>
</dialog>
<script src="../../media/news/news_store.js"></script>
<script src="../../media/news/news_feed.js"></script>
<script src="ra_store.js?v=RA1"></script>
<script src="ra_text.js?v=RA1"></script>
<script src="ra_speech.js?v=RA1"></script>
<script src="ra_news.js?v=RA1"></script>
<script src="ra_ui.js?v=RA1"></script>
</body>
</html>
