<!DOCTYPE html>
<!-- AS1 Astrology: profiles, Western sun sign, daily card, sun-sign compatibility. Offline, no libraries. Logic: astrology.js. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Astrology · AS1</title>
  <link rel="icon" href="astrology_icon.svg">
  <link rel="stylesheet" href="astrology.css?v=AS1">
  <script>try{var s=JSON.parse(localStorage.getItem('astrology-v1')||'{}'),m=s.theme||'auto',t=localStorage.getItem('sites-hub.theme');if(m==='dark'||(m==='auto'&&(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))))document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
<div id="app">
  <header>
    <h1>✨ Astrology</h1>
    <select id="profileSel" aria-label="Profile"></select>
    <button type="button" class="mini" id="addBtn" title="Add profile">＋</button>
  </header>
  <nav id="tabs" role="tablist">
    <button type="button" data-tab="sign" class="on">Sign</button>
    <button type="button" data-tab="today">Today</button>
    <button type="button" data-tab="match">Match</button>
    <button type="button" data-tab="set">Settings</button>
  </nav>
  <main>
    <section class="pane on" id="pane-sign"></section>
    <section class="pane" id="pane-today"></section>
    <section class="pane" id="pane-match">
      <div class="row"><select id="mA" aria-label="First profile"></select><span>♥</span><select id="mB" aria-label="Second profile"></select></div>
      <div id="matchOut"></div>
    </section>
    <section class="pane" id="pane-set">
      <h2>Theme</h2>
      <div class="seg" id="themeSeg"><button type="button" data-v="auto">Auto</button><button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button></div>
      <h2>Profiles</h2>
      <ul id="profList"></ul>
      <button type="button" class="btn" id="addBtn2">＋ Add profile</button>
      <p class="note">Readings are traditional meanings from Western astrology, shown for fun. They are not facts or predictions. Everything stays on this device.</p>
      <p class="note small">Release <span id="rel"></span></p>
    </section>
  </main>
  <footer class="note">Traditional readings, for fun · not predictions</footer>
</div>
<div id="dlg" class="dlg" hidden><div class="box" role="dialog" aria-modal="true"><div id="dlgBody"></div><div class="acts" id="dlgActs"></div></div></div>
<script src="astrology.js?v=AS1"></script>
</body>
</html>
