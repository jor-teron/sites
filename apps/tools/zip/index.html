<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zip</title>
  <link rel="stylesheet" href="zp_base.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <h1>Zip</h1>
      <span class="tag">ZP1+ZP2</span>
    </header>

    <div class="modes" role="tablist" aria-label="Mode">
      <button type="button" class="mode-btn active" id="mode-make" role="tab" aria-selected="true">Make zip</button>
      <button type="button" class="mode-btn" id="mode-open" role="tab" aria-selected="false">Open zip</button>
    </div>

    <!-- MAKE -->
    <section class="panel" id="panel-make" aria-label="Make zip">
      <div class="dropzone" id="make-drop">Drop files or folders here</div>
      <div class="row">
        <label class="file-btn">
          Add files
          <input type="file" id="make-files" multiple hidden>
        </label>
        <label class="file-btn">
          Add folder
          <input type="file" id="make-folder" webkitdirectory directory multiple hidden>
        </label>
        <button type="button" class="btn btn-danger" id="make-clear" disabled>Clear</button>
      </div>
      <ul class="file-list" id="make-list" aria-live="polite"></ul>
      <div class="row">
        <input type="text" id="make-name" placeholder="archive.zip" aria-label="Zip file name" autocomplete="off">
      </div>
      <label class="toggle">
        <input type="checkbox" id="make-protect">
        Protect with password (AES-256)
      </label>
      <div class="row" id="make-pass-row" hidden>
        <input type="password" id="make-pass" placeholder="Password" autocomplete="new-password" aria-label="Zip password">
      </div>
      <div class="row">
        <button type="button" class="btn btn-primary" id="make-create" disabled>Create zip</button>
        <button type="button" class="btn" id="make-folder-btn">Choose save folder</button>
        <button type="button" class="btn" id="make-reconnect" hidden>Reconnect</button>
        <button type="button" class="btn btn-danger" id="make-cancel" hidden>Cancel</button>
      </div>
      <p class="folder-label" id="make-folder-label"></p>
      <p class="hint" id="make-fallback" hidden></p>
      <div class="progress-wrap" id="make-progress" hidden>
        <div class="progress-bar" aria-hidden="true"><span id="make-bar"></span></div>
        <div class="progress-label" id="make-prog-label">0%</div>
      </div>
    </section>

    <!-- OPEN -->
    <section class="panel" id="panel-open" aria-label="Open zip" hidden>
      <div class="dropzone" id="open-drop">Drop a .zip here</div>
      <div class="row">
        <label class="file-btn">
          Open .zip
          <input type="file" id="open-file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
        </label>
        <button type="button" class="btn" id="open-folder-btn">Choose extract folder</button>
        <button type="button" class="btn" id="open-reconnect" hidden>Reconnect</button>
      </div>
      <p class="folder-label" id="open-folder-label"></p>
      <p class="hint" id="open-fallback" hidden></p>
      <p class="muted" id="open-zip-name"></p>
      <div class="row" id="open-pass-row" hidden>
        <input type="password" id="open-pass" placeholder="Password for encrypted files" autocomplete="current-password" aria-label="Zip password">
      </div>
      <ul class="file-list" id="open-list" aria-live="polite"></ul>
      <div class="row">
        <button type="button" class="btn btn-primary" id="open-extract" disabled>Extract all</button>
        <button type="button" class="btn btn-danger" id="open-cancel" hidden>Cancel</button>
      </div>
      <div class="progress-wrap" id="open-progress" hidden>
        <div class="progress-bar" aria-hidden="true"><span id="open-bar"></span></div>
        <div class="progress-label" id="open-prog-label">0%</div>
      </div>
    </section>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <div class="drop-overlay" id="drop-overlay" hidden aria-hidden="true">Drop to add</div>

  <script src="vendor/zipjs/zip.min.js"></script>
  <script src="zp_helpers.js"></script>
  <script src="zp_save.js"></script>
  <script src="zp_make.js"></script>
  <script src="zp_open.js"></script>
  <script src="zp_ui.js"></script>
  <script src="zp_main.js"></script>
</body>
</html>
