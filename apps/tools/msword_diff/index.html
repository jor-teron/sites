<!DOCTYPE html>
<!-- Redirect entry point to msword_diff.html (keeps ?query and #hash). IX7: no visible body; colours follow the Hub theme (sites-hub.theme, else the device setting). Legacy: window.location.href redirect (adds a Back-button step, dropped ?query/#hash) with a visible "Redirecting..." title and body text. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MS Word Diff</title>
  <link rel="canonical" href="msword_diff.html">
  <style>html,body{margin:0;background:#fff;color:#202124}html.dark,html.dark body{background:#121418;color:#9aa0a6}html.dark a{color:#6ea8fe}</style>
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { /* blocked */ }
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.className = 'dark';
      location.replace('msword_diff.html' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=msword_diff.html"></noscript>
</head>
<body><noscript><p><a href="msword_diff.html">Open MS Word Diff</a></p></noscript></body>
</html>
