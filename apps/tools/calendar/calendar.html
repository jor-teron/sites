<!DOCTYPE html>
<!--
  Calendar — screens: Month (default), Year, Count (jump to date + day counter), Settings.
  Swipe >=75 px in the month grid = change month; on the top bar = change screen.
  Styles: calendar.css. Logic: calendar_logic.js. No libraries.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Calendar</title>
  <link rel="icon" href="calendar_icon.png">
  <link rel="stylesheet" href="calendar.css?v=20261022a">
  <script>try{var s=JSON.parse(localStorage.getItem('calendar-settings-v1')||'{}'),m=s.theme||'dark',t=localStorage.getItem('sites-hub.theme');if(m==='dark'||(m==='system'&&(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))))document.documentElement.classList.add('dark')}catch(e){document.documentElement.classList.add('dark')}</script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="dots" role="tablist" aria-label="Screen">
      <button type="button" class="dot" data-mode="month" role="tab" aria-label="Month"></button>
      <button type="button" class="dot" data-mode="year" role="tab" aria-label="Year"></button>
      <button type="button" class="dot" data-mode="count" role="tab" aria-label="Count"></button>
      <button type="button" class="dot" data-mode="set" role="tab" aria-label="Settings"></button>
    </div>
  </div>
  <div id="viewport">
    <div id="track">
      <section class="pane" id="pane-month">
        <div class="head">
          <h1 id="m-title"></h1>
          <button type="button" class="nav" id="m-prev" aria-label="Previous month">&#8249;</button>
          <button type="button" class="mini" id="m-today">Today</button>
          <button type="button" class="nav" id="m-next" aria-label="Next month">&#8250;</button>
        </div>
        <div id="grid-wrap">
          <div class="wd" id="m-wd"></div>
          <div class="grid" id="m-grid"></div>
        </div>
        <div id="info"></div>
      </section>
      <section class="pane" id="pane-year">
        <div class="head">
          <h1 id="y-title"></h1>
          <button type="button" class="nav" id="y-prev" aria-label="Previous year">&#8249;</button>
          <button type="button" class="mini" id="y-today">Today</button>
          <button type="button" class="nav" id="y-next" aria-label="Next year">&#8250;</button>
        </div>
        <div id="year"></div>
      </section>
      <section class="pane" id="pane-count">
        <div class="set-wrap">
          <h2>Jump to date</h2>
          <div class="row"><input type="date" id="jump-date"><button type="button" class="btn" id="jump-go">Go</button></div>
          <h2>Day counter</h2>
          <label class="row"><span>From</span><input type="date" id="c-from"></label>
          <label class="row"><span>To</span><input type="date" id="c-to"></label>
          <label class="row chk"><span>Include end date</span><input type="checkbox" id="c-inc"></label>
          <div id="c-out"></div>
        </div>
      </section>
      <section class="pane" id="pane-set">
        <div class="set-wrap">
          <h2>Settings</h2>
          <div class="set-row"><span>Week starts</span>
            <div class="seg" data-key="week"><button type="button" data-v="sun">Sunday</button><button type="button" data-v="mon">Monday</button></div></div>
          <div class="set-row"><span>Theme</span>
            <div class="seg" data-key="theme"><button type="button" data-v="system">System</button><button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button></div></div>
          <h2>About</h2>
          <div class="about">
            <img src="calendar_icon.png" alt="" width="40" height="40">
            <div><b>Calendar</b> <span id="ver"></span>
              <p>A basic calendar: month and year views, jump to any date and count the days between two dates. Swipe the grid to change month, swipe the top bar to change screens.</p></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="calendar_logic.js?v=20261022a"></script>
</body>
</html>
