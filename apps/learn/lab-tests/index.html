<!DOCTYPE html>
<!-- Redirect entry point to lab-tests.html (keeps ?query and #hash). NIX-L1: no visible body; colours follow the Hub theme (sites-hub.theme, else the device setting). Legacy: meta refresh + location.replace; visible text in <body>. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab &amp; Scan Explainer</title>
  <link rel="canonical" href="lab-tests.html">
  <style>html,body{margin:0;background:#fff;color:#202124}html.dark,html.dark body{background:#0f172a;color:#94a3b8}html.dark a{color:#38bdf8}</style>
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { /* blocked */ }
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.className = 'dark';
      location.replace('lab-tests.html' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=lab-tests.html"></noscript>
</head>
<body><noscript><p><a href="lab-tests.html">Open Lab & Scan Explainer</a></p></noscript></body>
</html>
