<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Physics Lab PS1g (Learn > Science): six experiments - Sandbox, Falling, Ramps, Bounce, Collision and Launch.
     Vanilla HTML/CSS/JS on a canvas, no build step. Drag to throw, tap to add, double-tap to remove; the HUD shows speed, height and energy.
     Classic scripts only, no build step, works from file://. -->
<title>Physics Lab PS1g</title>
<meta name="theme-color" content="#14171c">
<link rel="icon" href="physics-lab_icon.png">
<script src="../../../shared/theme/hub_theme.js"></script>
<link rel="stylesheet" href="../common/ui/learn.css">
<link rel="stylesheet" href="ui/physics-lab.css">
</head>
<body>
<div id="app" class="lrn pl">
  <header class="lrn-head pl-head">
    <h1>Physics Lab <span class="pl-ver">PS1g</span></h1>
  </header>

  <nav class="pl-chips" id="pl-chips" aria-label="Experiments"></nav>

  <div class="pl-goal">
    <div class="pl-goal-text">
      <p id="pl-goal-text">Free play</p>
      <p class="pl-tip" id="pl-tip"></p>
    </div>
    <button id="pl-done" class="pl-done" type="button" aria-pressed="false">Done</button>
  </div>

  <div class="pl-stage" id="pl-stage">
    <canvas id="pl-canvas" aria-label="A ball rolling down a ramp and a box on the floor."></canvas>
    <div class="pl-hud" id="pl-hud">
      <div class="pl-hud-row"><span class="pl-k">Time</span><b id="pl-time">0.00 s</b></div>
      <div class="pl-hud-row"><span class="pl-k">Body</span><b id="pl-body">-</b></div>
      <div class="pl-hud-row"><span class="pl-k">Speed</span><b id="pl-speed">0.00 m/s</b></div>
      <div class="pl-hud-row"><span class="pl-k">Height</span><b id="pl-height">0.00 m</b></div>
      <div class="pl-bars" aria-hidden="true"><span class="pl-bar pl-ke" id="pl-ke"></span><span class="pl-bar pl-pe" id="pl-pe"></span></div>
      <div class="pl-hud-row pl-small"><span class="pl-ke-key">moving</span><span class="pl-pe-key">height</span><b id="pl-total">0.0 J</b></div>
    </div>
    <p class="pl-sr" id="pl-live" aria-live="polite"></p>
  </div>

  <div class="pl-controls">
    <div class="pl-row">
      <button id="pl-play" type="button" class="pl-btn pl-btn-main">Pause</button>
      <button id="pl-reset" type="button" class="pl-btn">Reset</button>
      <button id="pl-trails" type="button" class="pl-btn" aria-pressed="true">Trails</button>
      <button id="pl-add" type="button" class="pl-btn">+ Ball</button>
    </div>
    <div class="pl-fields">
      <label class="pl-field">Gravity
        <select id="pl-gravity">
          <option value="9.81">Earth 9.8</option>
          <option value="1.62">Moon 1.6</option>
          <option value="3.71">Mars 3.7</option>
          <option value="0">Zero</option>
        </select>
      </label>
      <label class="pl-field">Bounce <output id="pl-bounce-out">0.50</output>
        <input id="pl-bounce" type="range" min="0" max="0.95" step="0.05" value="0.5">
      </label>
      <label class="pl-field">Friction <output id="pl-friction-out">0.40</output>
        <input id="pl-friction" type="range" min="0" max="1" step="0.05" value="0.4">
      </label>
    </div>
    <p class="pl-note" id="pl-note">Drag a body to throw it. Tap empty space or + Ball to add a ball; double-tap a body to remove it.</p>
  </div>
</div>
<noscript><p>Physics Lab needs JavaScript. It shows a ball rolling down a ramp and a box sliding on the floor.</p></noscript>
<script src="core/engine.js"></script>
<script src="core/scenes.js"></script>
<script src="core/app.js"></script>
</body>
</html>
