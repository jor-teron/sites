<!DOCTYPE html>
<!-- Redirect entry point to remote.html (keeps ?query and #hash). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote</title>
  <link rel="canonical" href="remote.html">
  <style>html,body{margin:0;background:#fff;color:#202124}html.dark,html.dark body{background:#0f172a;color:#94a3b8}html.dark a{color:#2dd4bf}</style>
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { /* blocked */ }
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.className = 'dark';
      location.replace('remote.html' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=remote.html"></noscript>
</head>
<body><noscript><p><a href="remote.html">Open Remote</a></p></noscript></body>
</html>
