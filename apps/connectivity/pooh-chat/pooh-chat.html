<!DOCTYPE html>
<!--
  Project: sites — Pooh Chat (release 4)
  File: apps/connectivity/pooh-chat/pooh-chat.html
  Role: The built-in group chat on the one Hub link (shared/link).
  Inside the Hub it talks through the Hub's link (postMessage); standalone on a phone it
  joins the Hub (saved code, code entry or Scan QR). History: SharedChat (last 200).
  Look: WebRTC Chat's dark neon gradients + Pooh's honey warmth. Plain scripts, no build.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pooh Chat</title>
  <link rel="stylesheet" href="pooh-chat.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <h1><span class="honey">🍯</span> Pooh Chat <span class="bear">🐻</span></h1>
      <span id="status" class="status" title="Link status"><i class="dot"></i><b id="status-text">…</b></span>
      <button type="button" id="btn-name" class="ghost" title="Rename this device">✏️</button>
      <button type="button" id="btn-join" class="ghost" hidden>Join Hub</button>
    </header>
    <main id="log" aria-live="polite"></main>
    <form id="composer" autocomplete="off">
      <button type="button" id="btn-wa" class="wa" title="Share to WhatsApp" aria-label="Share to WhatsApp">🟢</button>
      <input id="input" type="text" maxlength="2000" placeholder="Say something sweet…" enterkeyhint="send">
      <button type="submit" id="btn-send" class="send">Send</button>
    </form>
    <input type="file" id="file-share" multiple hidden>
  </div>
  <script src="../../../shared/link/link_core.js"></script>
  <script src="../../../shared/link/link_devices.js"></script>
  <script src="../../../shared/link/link_files.js"></script>
  <script src="../../../shared/link/link_chat.js"></script>
  <script src="../../../shared/link/link_scan.js"></script>
  <script src="../../../shared/share/share_wa.js"></script>
  <script src="vendor/jsQR.js"></script>
  <script src="pooh-chat-ui.js"></script>
  <script src="pooh-chat.js"></script>
</body>
</html>
