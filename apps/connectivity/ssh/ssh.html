<!DOCTYPE html>
<!--
  SSH — S1: connect + terminal through a WebSocket-to-TCP relay (see relay/README.md).
  Styles: ssh.css. Modules: ssh_ui.js (state, theme, menu, dialogs, toast), ssh_conn.js (SSH session over
  the relay WebSocket, host key, errors), ssh_term.js (xterm.js, fit, copy/paste, phone key bar),
  ssh_app.js (connect form, #host= hash, reconnect, wiring).
  The SSH encryption runs here in the browser; the relay only sees encrypted bytes.
  The password is kept in memory for Reconnect only and is never saved. Actions are a rail on the RIGHT.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <title>SSH</title>
  <link rel="icon" href="ssh_icon.png">
  <script>try{var m=(JSON.parse(localStorage.getItem('ssh-settings-v1')||'{}').theme)||'dark',t=localStorage.getItem('sites-hub.theme');if(m==='dark'||(m==='system'&&(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))))document.documentElement.classList.add('dark')}catch(e){document.documentElement.classList.add('dark')}</script>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="ssh.css?v=20261022a">
</head>
<body>
<div id="app">
  <header id="bar">
    <span id="dot" class="dot" title="Not connected"></span>
    <span id="title" class="fname">SSH</span>
    <span id="size" class="count"></span>
  </header>

  <main id="stage">
    <form id="form" class="form" autocomplete="off" novalidate>
      <h1>Connect</h1>
      <label>Relay <input id="f-relay" name="relay" type="url" placeholder="ws://192.168.1.10:8022" spellcheck="false" autocapitalize="off"></label>
      <div class="row">
        <label class="grow2">Host <input id="f-host" name="host" placeholder="192.168.1.20" spellcheck="false" autocapitalize="off"></label>
        <label class="port">Port <input id="f-port" name="port" type="number" min="1" max="65535" value="22"></label>
      </div>
      <label>User <input id="f-user" name="user" placeholder="pi" spellcheck="false" autocapitalize="off" autocomplete="username"></label>
      <label>Password <input id="f-pass" name="password" type="password" autocomplete="current-password"></label>
      <p id="f-err" class="err" role="alert" hidden></p>
      <p class="hint">Needs the relay running on your PC: see <b>Menu → Relay help</b>. The password is never saved.</p>
      <button type="submit" id="f-go" class="pill wide">Connect</button>
    </form>
    <div id="term-wrap" class="term-wrap" hidden><div id="term" class="term"></div></div>
    <div id="keys" class="keys" hidden>
      <button type="button" data-k="esc">Esc</button><button type="button" data-k="tab">Tab</button><button type="button" data-k="ctrl" id="k-ctrl">Ctrl</button>
      <button type="button" data-k="left">←</button><button type="button" data-k="up">↑</button><button type="button" data-k="down">↓</button><button type="button" data-k="right">→</button>
      <button type="button" data-k="|">|</button><button type="button" data-k="~">~</button><button type="button" data-k="/">/</button>
    </div>
    <div id="busy" class="busy" hidden><span class="spin"></span><span id="busy-text">Connecting…</span></div>
    <div id="gone" class="gone" hidden>
      <p id="gone-text" class="big">Disconnected</p>
      <div class="gone-btns"><button type="button" id="gone-edit" class="pill ghost">Edit</button><button type="button" id="gone-re" class="pill">Reconnect</button></div>
    </div>
  </main>

  <nav id="rail" aria-label="Actions">
    <button type="button" class="rb" id="b-menu" title="Menu" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    <span class="sep"></span>
    <button type="button" class="rb" id="b-copy" title="Copy selection (Ctrl+Shift+C)" aria-label="Copy" data-need="term"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
    <button type="button" class="rb" id="b-paste" title="Paste (Ctrl+Shift+V, right-click)" aria-label="Paste" data-need="live"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3h6v2M9 12h6M9 16h4"/></svg></button>
    <button type="button" class="rb" id="b-keys" title="Extra keys" aria-label="Extra keys" aria-pressed="false" data-need="live"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
    <span class="grow"></span>
    <button type="button" class="rb danger" id="b-off" title="Disconnect" aria-label="Disconnect" data-need="live"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 7a8 8 0 1 0 11.4 0"/></svg></button>
    <button type="button" class="rb main" id="b-go" title="Connect" aria-label="Connect"><svg viewBox="0 0 24 24"><path d="M5 12h12m-5-5 5 5-5 5"/><path d="M20 4v16"/></svg></button>
  </nav>

  <div id="menu" class="menu" hidden role="menu">
    <div class="mrow"><span>Theme</span>
      <div class="seg" id="theme-seg"><button type="button" data-v="system">System</button><button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button></div>
    </div>
    <div class="mrow"><span>Text size</span>
      <div class="seg" id="font-seg"><button type="button" data-d="-1">A−</button><button type="button" data-d="1">A+</button></div>
    </div>
    <button type="button" class="mi" id="m-relay">Relay help</button>
    <button type="button" class="mi" id="m-about">About</button>
  </div>

  <div id="dlg" class="dlg-back" hidden>
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title"></h2>
      <p id="dlg-text"></p>
      <textarea id="dlg-input" rows="4" hidden placeholder="Long-press here and choose Paste"></textarea>
      <div class="dlg-btns"><button type="button" id="dlg-no" class="pill ghost">Cancel</button><button type="button" id="dlg-yes" class="pill">OK</button></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script src="vendor/xterm.min.js"></script>
<script src="vendor/xterm-addon-fit.min.js"></script>
<script src="vendor/ssh-lib.min.js"></script>
<script src="ssh_ui.js?v=20261022a"></script>
<script src="ssh_conn.js?v=20261022a"></script>
<script src="ssh_term.js?v=20261022a"></script>
<script src="ssh_app.js?v=20261022a"></script>
</body>
</html>
