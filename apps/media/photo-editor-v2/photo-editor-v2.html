<!DOCTYPE html>
<!--
  Photo Editor v2 — minimalist, phone-first photo editor. Page shell only.
  Styles: photo-editor-v2.css. Settings: pe_config.js. Logic: the other pe_*.js files,
  each with one job, loaded as plain scripts sharing window.PE (works from file://).
  No libraries, no CDN; the folder is self-contained.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141518">
  <title>Photo Editor v2</title>
  <link rel="stylesheet" href="photo-editor-v2.css?v=20261004a">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="empty">
      <div class="card">
        <svg viewBox="0 0 48 48" class="logo"><rect x="5" y="9" width="38" height="30" rx="4"/><circle cx="17" cy="19" r="3.5"/><path d="M7 35l11-11 7 7 5-5 11 11"/></svg>
        <h1>Photo Editor v2</h1>
        <button type="button" tabindex="-1" class="primary" data-act="open">Open photo</button>
        <p>or drop a photo here, or paste one</p>
      </div>
    </div>
    <button id="zoom-pill" type="button" tabindex="-1" hidden>100%</button>
    <div id="toast"></div>
  </div>

  <div id="dock" hidden>
    <div id="panel-crop" class="panel" hidden>
      <div class="chips" id="ratio-chips"></div>
      <div class="row">
        <button type="button" tabindex="-1" class="btn ghost" data-act="cropCancel">Cancel</button>
        <button type="button" tabindex="-1" class="btn primary" data-act="cropApply">Apply</button>
      </div>
    </div>
    <div id="panel-adjust" class="panel" hidden>
      <div class="chips" id="adj-chips"></div>
      <div class="slider-row">
        <input type="range" id="adj-slider" min="-100" max="100" step="1" value="0" tabindex="-1" aria-label="Adjustment">
        <button type="button" tabindex="-1" id="adj-value" title="Tap to set to 0">0</button>
      </div>
      <div class="chips" id="preset-chips"></div>
    </div>
  </div>

  <nav id="toolbar">
    <button class="tb" data-act="open" type="button" tabindex="-1" title="Open photo (Ctrl+O)">
      <svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button class="tb" data-act="undo" type="button" tabindex="-1" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="tb" data-act="redo" type="button" tabindex="-1" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <span class="sep"></span>
    <button class="tb" data-act="rotl" type="button" tabindex="-1" title="Rotate left (Shift+R)">
      <svg viewBox="0 0 24 24"><path d="M3.5 4v5h5"/><path d="M4 9a8.5 8.5 0 1 1 1.6 8.6"/></svg>
    </button>
    <button class="tb" data-act="rotr" type="button" tabindex="-1" title="Rotate right (R)">
      <svg viewBox="0 0 24 24"><path d="M20.5 4v5h-5"/><path d="M20 9a8.5 8.5 0 1 0-1.6 8.6"/></svg>
    </button>
    <button class="tb" data-act="fliph" type="button" tabindex="-1" title="Flip horizontal (H)">
      <svg viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2.2"/><path d="M9 7L3.5 17H9z"/><path d="M15 7l5.5 10H15z"/></svg>
    </button>
    <button class="tb" data-act="flipv" type="button" tabindex="-1" title="Flip vertical (V)">
      <svg viewBox="0 0 24 24"><path d="M3 12h18" stroke-dasharray="2 2.2"/><path d="M7 9l10-5.5V9z"/><path d="M7 15l10 5.5V15z"/></svg>
    </button>
    <span class="sep"></span>
    <button class="tb" id="tb-crop" data-act="crop" type="button" tabindex="-1" title="Crop (C)">
      <svg viewBox="0 0 24 24"><path d="M6.5 2.5v13a2 2 0 0 0 2 2h13"/><path d="M17.5 21.5v-13a2 2 0 0 0-2-2h-13"/></svg>
    </button>
    <button class="tb" id="tb-adjust" data-act="adjust" type="button" tabindex="-1" title="Adjust (A)">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h3M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/></svg>
    </button>
    <span class="sep"></span>
    <button class="tb" id="tb-save" data-act="save" type="button" tabindex="-1" title="Save (Ctrl+S)">
      <svg viewBox="0 0 24 24"><path d="M12 3.5v11"/><path d="M7.5 10.5l4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/></svg>
    </button>
  </nav>

  <div id="pop-save" class="pop menu" hidden>
    <div class="menu-head" id="save-info"></div>
    <button type="button" tabindex="-1" data-act="saveJpeg">Save JPEG</button>
    <button type="button" tabindex="-1" data-act="savePng">Save PNG</button>
  </div>

  <input type="file" id="file-in" accept="image/*" hidden>
</div>
<script src="pe_config.js?v=20261004a"></script>
<script src="pe_state.js?v=20261004a"></script>
<script src="pe_transform.js?v=20261004a"></script>
<script src="pe_adjust.js?v=20261004a"></script>
<script src="pe_view.js?v=20261004a"></script>
<script src="pe_crop.js?v=20261004a"></script>
<script src="pe_io.js?v=20261004a"></script>
<script src="pe_input.js?v=20261004a"></script>
<script src="pe_ui.js?v=20261004a"></script>
</body>
</html>
