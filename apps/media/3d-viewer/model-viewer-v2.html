<!DOCTYPE html>
<!--
  File: model-viewer-v2.html
  Project: Simple 3D GLB / glTF model viewer (Beta)
  Purpose: Load a free .glb, orbit camera, list and play animation clips.
           Not a game.

  Beta adds: model info panel (full stats), PNG screenshot button,
             animation clip buttons + speed, slow turntable auto-rotate.

  Alpha notes:
    - Format: GLB / glTF only.
    - Play/Pause is one button. Spacebar toggles it.
    - Phone portrait: 3D on top, controls below.
    - PC / wide: 3D left, clip list right.
    - Drag and drop a .glb onto the page.
    - Last successful URL is saved in localStorage.
    - Landscape lock is NOT forced. Browsers ignore it on normal pages.
      We only hint; layout stays usable in portrait.

  How to use:
    1. Open in a browser.
    2. Default: Khronos Fox (Survey / Walk / Run).
    3. Paste URL, pick a file, or drop a .glb.
    4. Drag to rotate, scroll to zoom. Space = play/pause.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Model Viewer Beta</title>
  <style>
    /* Page shell */
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: sans-serif;
    }

    /* Wide = model left, panel right. Narrow = model top, panel bottom */
    #app {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: minmax(42vh, 1fr) auto;
      height: 100%;
      min-height: 100dvh;
    }

    /* 3D stage */
    #stage {
      position: relative;
      min-height: 42vh;
      background: #1a1a1a;
    }

    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Drop overlay */
    #dropMask {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(40, 90, 180, 0.35);
      border: 2px dashed #9cf;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      pointer-events: none;
    }

    #dropMask.on {
      display: flex;
    }

    /* Controls */
    #panel {
      background: #1c1c1c;
      border-top: 1px solid #333;
      padding: 8px;
      max-height: 48vh;
      overflow: auto;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }

    #urlInput {
      flex: 1;
      min-width: 140px;
      padding: 6px;
    }

    button, select, input[type="file"] {
      padding: 6px 8px;
    }

    #playBtn {
      min-width: 88px;
    }

    #status {
      font-size: 12px;
      opacity: 0.85;
      width: 100%;
    }

    /* Clip list */
    #clipList {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #clipList li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
    }

    #clipList li.active {
      background: #2a4a6a;
    }

    #clipList .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #clipList .dur {
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    #betaTag { position:absolute; top:8px; left:8px; background:#c63; color:#fff; font-size:11px; font-weight:bold; padding:2px 6px; border-radius:4px; pointer-events:none; }
    #clipBtns { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
    #clipBtns button { background:#2a2a2a; color:#eee; border:1px solid #444; border-radius:6px; }
    #clipBtns button.active { background:#2a6ad0; border-color:#5af; color:#fff; }
    #clipBtns button small { opacity:.7; margin-left:4px; }
    button.on { background:#2a6a3a; color:#fff; }
    #speedSel { padding:4px; }
    details#info { margin-top:8px; border:1px solid #333; border-radius:6px; background:#161616; }
    details#info summary { padding:8px; cursor:pointer; font-weight:bold; }
    #infoBody { padding:0 8px 8px; font-size:12px; }
    #infoBody h4 { margin:8px 0 4px; font-size:12px; color:#9cf; }
    #infoBody table { width:100%; border-collapse:collapse; }
    #infoBody td { padding:2px 4px; border-bottom:1px solid #242424; vertical-align:top; word-break:break-word; }
    #infoBody td:first-child { opacity:.75; white-space:nowrap; }
    #infoBody ul { margin:0; padding-left:16px; }
    #infoBody li { margin:2px 0; }
    /* PC / tablet landscape-ish */
    @media (min-width: 800px) and (orientation: landscape) {
      #app {
        grid-template-columns: 1fr 340px;
        grid-template-rows: 1fr;
      }
      #panel {
        border-top: none;
        border-left: 1px solid #333;
        max-height: none;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="stage">
      <div id="dropMask">Drop GLB / glTF here</div>
      <div id="betaTag">BETA</div>
    </div>
    <aside id="panel">
      <div class="row">
        <input id="urlInput" type="text" placeholder="https://… .glb" />
        <button id="loadUrlBtn" type="button">Load URL</button>
      </div>
      <div class="row">
        <input id="fileInput" type="file" accept=".glb,.gltf" />
        <button id="playBtn" type="button">Play</button>
        <button id="resetCamBtn" type="button">Reset cam</button>
      </div>
      <div class="row">
        <button id="spinBtn" type="button" class="on">Turntable: On</button>
        <button id="shotBtn" type="button">Screenshot</button>
        <label>Speed <select id="speedSel"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label>
      </div>
      <div id="status">Ready.</div>
      <div id="clipBtns"></div>
      <details id="info" open><summary>Model info</summary><div id="infoBody">No model.</div></details>
    </aside>
  </div>

  <script type="module">
    /**
     * Model Viewer Beta
     * Loads one glTF/GLB, info panel, clip buttons, screenshot, turntable.
     */

    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

    // --- Storage key for last successful URL ---
    const LAST_URL_KEY = "mv_alpha_last_url"; // shared with Alpha

    // --- Default sample (small, animated, public) ---
    const DEFAULT_URL = "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/glTF-Binary/Fox.glb";

    // --- DOM ---
    const stage = document.getElementById("stage");
    const dropMask = document.getElementById("dropMask");
    const urlInput = document.getElementById("urlInput");
    const loadUrlBtn = document.getElementById("loadUrlBtn");
    const fileInput = document.getElementById("fileInput");
    const playBtn = document.getElementById("playBtn");
    const resetCamBtn = document.getElementById("resetCamBtn");
    const statusEl = document.getElementById("status");
    const clipListEl = document.getElementById("clipBtns");
    const spinBtn = document.getElementById("spinBtn");
    const shotBtn = document.getElementById("shotBtn");
    const speedSel = document.getElementById("speedSel");
    const infoBody = document.getElementById("infoBody");
    let playSpeed = 1;
    let currentLabel = "model";

    // --- Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(3, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0; // slow: ~60 s per turn
    let spinEnabled = true;
    let resumeTimer = null;
    controls.addEventListener("start", function onDragStart() {
      clearTimeout(resumeTimer);
      controls.autoRotate = false;
    });
    controls.addEventListener("end", function onDragEnd() {
      clearTimeout(resumeTimer);
      if (spinEnabled) resumeTimer = setTimeout(function resume() { controls.autoRotate = spinEnabled; }, 3000);
    });
    window.__viewer = { controls: controls, camera: camera };

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.1);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(4, 8, 6);
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(8, 48),
      new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // --- Runtime ---
    const loader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath("https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/");
    loader.setDRACOLoader(dracoLoader);
    loader.setMeshoptDecoder(MeshoptDecoder);
    const clock = new THREE.Clock();
    let currentRoot = null;
    let mixer = null;
    let currentAction = null;
    let currentClipIndex = 0;
    let isPlaying = false;
    let lastFramedObject = null;

    /**
     * Show a short status line.
     * @param {string} text
     */
    function setStatus(text) {
      statusEl.textContent = text;
    }

    /**
     * Format clip length as m:ss.s
     * @param {number} seconds
     * @returns {string}
     */
    function formatDuration(seconds) {
      const s = Math.max(0, Number(seconds) || 0);
      const m = Math.floor(s / 60);
      const rem = s - m * 60;
      return m + ":" + rem.toFixed(1).padStart(4, "0");
    }

    /**
     * Fit the renderer to the stage box.
     */
    function resizeRenderer() {
      const w = stage.clientWidth || window.innerWidth;
      const h = stage.clientHeight || window.innerHeight;
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    /**
     * Remove previous model and mixer.
     */
    function clearModel() {
      if (currentRoot) {
        scene.remove(currentRoot);
        currentRoot = null;
      }
      if (mixer) {
        mixer.stopAllAction();
        mixer = null;
      }
      currentAction = null;
      isPlaying = false;
      playBtn.textContent = "Play";
      clipListEl.innerHTML = "";
    }

    /**
     * Frame camera on an object.
     * @param {THREE.Object3D} object
     */
    function frameObject(object) {
      lastFramedObject = object;
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const dist = maxDim * 2.2;
      controls.target.copy(center);
      camera.position.set(center.x + dist * 0.6, center.y + dist * 0.45, center.z + dist);
      camera.near = maxDim / 100;
      camera.far = maxDim * 50;
      camera.updateProjectionMatrix();
      controls.update();
    }

    /**
     * Build the clip list UI.
     * @param {THREE.AnimationClip[]} clips
     */
    function prettyName(raw, index) {
      if (!raw) return "Clip " + (index + 1);
      let s = String(raw).split(/[|:]/).pop();
      s = s.replace(/^(mixamo\.com|Armature|Action)$/i, "Clip " + (index + 1));
      s = s.replace(/[_\-.]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\s+/g, " ").trim();
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : "Clip " + (index + 1);
    }

    function renderClipList(clips) {
      clipListEl.innerHTML = "";
      if (!clips || clips.length === 0) {
        clipListEl.textContent = "(no animations)";
        return;
      }
      clips.forEach(function addBtn(clip, index) {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.index = String(index);
        b.title = clip.name || "";
        b.textContent = prettyName(clip.name, index);
        const sm = document.createElement("small");
        sm.textContent = clip.duration.toFixed(1) + "s";
        b.appendChild(sm);
        b.addEventListener("click", function onPick() {
          if (index === currentClipIndex && currentAction) togglePlay(); else playClip(index, true);
        });
        clipListEl.appendChild(b);
      });
    }

    /**
     * Mark the active row.
     * @param {number} index
     */
    function highlightClip(index) {
      const rows = clipListEl.querySelectorAll("button");
      rows.forEach(function mark(row) {
        row.classList.toggle("active", row.dataset.index === String(index));
      });
    }

    /**
     * Play a clip by index.
     * @param {number} index
     * @param {boolean} startNow
     */
    function playClip(index, startNow) {
      const clips = currentRoot && currentRoot.userData.clips ? currentRoot.userData.clips : [];
      const clip = clips[index];
      if (!clip || !mixer) return;
      if (currentAction) currentAction.stop();
      currentClipIndex = index;
      currentAction = mixer.clipAction(clip);
      currentAction.reset();
      currentAction.setLoop(THREE.LoopRepeat, Infinity);
      mixer.timeScale = playSpeed;
      if (startNow) {
        currentAction.play();
        isPlaying = true;
        playBtn.textContent = "Pause";
        setStatus("Playing: " + (clip.name || index) + "  (" + formatDuration(clip.duration) + ")");
      } else {
        currentAction.play();
        mixer.timeScale = 0;
        isPlaying = false;
        playBtn.textContent = "Play";
      }
      highlightClip(index);
    }

    /**
     * Toggle play / pause.
     */
    function togglePlay() {
      if (!mixer || !currentAction) return;
      if (isPlaying) {
        mixer.timeScale = 0;
        isPlaying = false;
        playBtn.textContent = "Play";
        setStatus("Paused.");
      } else {
        mixer.timeScale = playSpeed;
        currentAction.play();
        isPlaying = true;
        playBtn.textContent = "Pause";
        setStatus("Playing.");
      }
    }

    function fmtBytes(n) {
      if (n == null || isNaN(n)) return "n/a";
      if (n < 1024) return n + " B";
      if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
      return (n / 1048576).toFixed(2) + " MB";
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    const MAP_KEYS = ["map", "normalMap", "roughnessMap", "metalnessMap", "aoMap", "emissiveMap", "alphaMap", "bumpMap", "displacementMap", "lightMap", "envMap", "clearcoatMap", "clearcoatNormalMap", "clearcoatRoughnessMap", "sheenColorMap", "sheenRoughnessMap", "transmissionMap", "thicknessMap", "specularIntensityMap", "specularColorMap", "iridescenceMap", "iridescenceThicknessMap", "anisotropyMap"];

    /** Gather full stats for the loaded model. */
    function computeStats(gltf, meta) {
      const root = gltf.scene;
      root.updateMatrixWorld(true);
      const st = { nodes: 0, meshes: 0, skinned: 0, tris: 0, verts: 0, morph: 0, morphNames: [], bones: new Set(), skeletons: new Set() };
      const mats = new Map();
      const texs = new Map();
      root.traverse(function (o) {
        st.nodes++;
        if (o.isBone) st.bones.add(o);
        if (!o.isMesh && !o.isPoints && !o.isLine) return;
        st.meshes++;
        const g = o.geometry;
        const pos = g.attributes.position;
        const vc = pos ? pos.count : 0;
        const inst = o.isInstancedMesh ? o.count : 1;
        st.verts += vc * inst;
        if (o.isMesh) st.tris += (g.index ? g.index.count / 3 : vc / 3) * inst;
        if (o.isSkinnedMesh) {
          st.skinned++;
          if (o.skeleton) { st.skeletons.add(o.skeleton); o.skeleton.bones.forEach(function (b) { st.bones.add(b); }); }
        }
        if (g.morphAttributes && g.morphAttributes.position) {
          st.morph += g.morphAttributes.position.length;
          if (o.morphTargetDictionary) Object.keys(o.morphTargetDictionary).forEach(function (k) { if (st.morphNames.indexOf(k) < 0) st.morphNames.push(k); });
        }
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(function (m) {
          if (!m || mats.has(m)) return;
          const used = [];
          MAP_KEYS.forEach(function (k) {
            const t = m[k];
            if (t && t.isTexture) {
              used.push(k);
              if (!texs.has(t)) texs.set(t, []);
              texs.get(t).push(k);
            }
          });
          mats.set(m, used);
        });
      });
      const texList = [];
      let texMem = 0;
      texs.forEach(function (slots, t) {
        const img = t.image || (t.source && t.source.data);
        const w = (img && (img.naturalWidth || img.videoWidth || img.width)) || 0;
        const h = (img && (img.naturalHeight || img.videoHeight || img.height)) || 0;
        // RGBA8 + full mip chain (~4/3)
        const mem = Math.round(w * h * 4 * (t.generateMipmaps !== false ? 4 / 3 : 1));
        texMem += mem;
        texList.push({ name: t.name || (img && img.src && !img.src.startsWith("blob:") && !img.src.startsWith("data:") ? img.src.split("/").pop() : "") || "(unnamed)", w: w, h: h, mem: mem, slots: slots, cs: t.colorSpace || "" });
      });
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const clips = (gltf.animations || []).map(function (c) { return { name: c.name || "(unnamed)", dur: c.duration, tracks: c.tracks.length }; });
      return { meta: meta, st: st, mats: mats, texList: texList, texMem: texMem, size: size, clips: clips, asset: (gltf.asset || {}) };
    }

    function renderInfo(s) {
      const fx = function (v) { return (Math.round(v * 1000) / 1000).toString(); };
      let h = "<h4>File</h4><table>";
      h += "<tr><td>Name</td><td>" + esc(s.meta.name) + "</td></tr>";
      h += "<tr><td>Size</td><td>" + fmtBytes(s.meta.bytes) + (s.meta.bytes != null ? " (" + s.meta.bytes.toLocaleString() + " B)" : "") + "</td></tr>";
      h += "<tr><td>Format</td><td>" + esc(s.meta.format) + (s.asset.version ? " · glTF " + esc(s.asset.version) : "") + "</td></tr>";
      if (s.asset.generator) h += "<tr><td>Generator</td><td>" + esc(s.asset.generator) + "</td></tr>";
      h += "<tr><td>Load time</td><td>" + s.meta.loadMs.toFixed(0) + " ms</td></tr></table>";
      h += "<h4>Geometry</h4><table>";
      h += "<tr><td>Triangles</td><td id='iTris'>" + Math.round(s.st.tris).toLocaleString() + "</td></tr>";
      h += "<tr><td>Vertices</td><td id='iVerts'>" + s.st.verts.toLocaleString() + "</td></tr>";
      h += "<tr><td>Meshes</td><td id='iMeshes'>" + s.st.meshes + "</td></tr>";
      h += "<tr><td>Nodes</td><td>" + s.st.nodes + "</td></tr>";
      h += "<tr><td>Skinned meshes</td><td>" + s.st.skinned + "</td></tr>";
      h += "<tr><td>Bones</td><td id='iBones'>" + s.st.bones.size + (s.st.skeletons.size ? " (" + s.st.skeletons.size + " skeleton" + (s.st.skeletons.size > 1 ? "s" : "") + ")" : "") + "</td></tr>";
      h += "<tr><td>Morph targets</td><td>" + s.st.morph + (s.st.morphNames.length ? " — " + esc(s.st.morphNames.slice(0, 20).join(", ")) : "") + "</td></tr>";
      h += "<tr><td>Bounding box</td><td id='iBox'>" + fx(s.size.x) + " × " + fx(s.size.y) + " × " + fx(s.size.z) + " units (W×H×D, 1 unit = 1 m in glTF)</td></tr></table>";
      h += "<h4>Materials (" + s.mats.size + ")</h4><ul>";
      s.mats.forEach(function (used, m) { h += "<li><b>" + esc(m.name || "(unnamed)") + "</b> — " + esc(m.type) + (used.length ? "<br>maps: " + esc(used.join(", ")) : "<br>no maps") + "</li>"; });
      h += "</ul><h4>Textures (" + s.texList.length + ") — est. GPU " + fmtBytes(s.texMem) + "</h4><ul>";
      s.texList.forEach(function (t) { h += "<li>" + esc(t.name) + " — " + t.w + "×" + t.h + " · ~" + fmtBytes(t.mem) + "<br>used as: " + esc(t.slots.join(", ")) + "</li>"; });
      if (!s.texList.length) h += "<li>none</li>";
      h += "</ul><div style='opacity:.6'>GPU memory estimate: RGBA8 × mipmaps (4/3); compressed textures may be smaller.</div>";
      h += "<h4>Animations (" + s.clips.length + ")</h4><ul>";
      s.clips.forEach(function (c) { h += "<li>" + esc(c.name) + " — " + c.dur.toFixed(2) + " s, " + c.tracks + " tracks</li>"; });
      if (!s.clips.length) h += "<li>none</li>";
      h += "</ul>";
      infoBody.innerHTML = h;
    }

    /**
     * Attach a loaded glTF.
     */
    function onGltfLoaded(gltf, label, meta) {
      clearModel();
      currentLabel = label || "model";
      currentRoot = gltf.scene;
      currentRoot.userData.clips = gltf.animations || [];
      scene.add(currentRoot);
      mixer = new THREE.AnimationMixer(currentRoot);
      currentClipIndex = 0;
      renderClipList(gltf.animations);
      frameObject(currentRoot);
      if (gltf.animations && gltf.animations.length) {
        playClip(0, true);
      }
      try {
        const stats = computeStats(gltf, meta);
        renderInfo(stats);
        window.__viewer.stats = { tris: Math.round(stats.st.tris), verts: stats.st.verts, meshes: stats.st.meshes, materials: stats.mats.size, textures: stats.texList.map(function (t) { return [t.w, t.h]; }), bones: stats.st.bones.size, clips: stats.clips, size: stats.size.toArray(), bytes: meta.bytes };
      } catch (e) {
        infoBody.textContent = "Info failed: " + e.message;
      }
      const n = (gltf.animations && gltf.animations.length) || 0;
      setStatus("Loaded " + currentLabel + ". Clips: " + n);
    }

    function detectFormat(buf) {
      if (buf.byteLength >= 4) {
        const m = new Uint8Array(buf, 0, 4);
        if (m[0] === 0x67 && m[1] === 0x6c && m[2] === 0x54 && m[3] === 0x46) return "GLB (binary glTF)";
      }
      return "glTF (JSON)";
    }

    function parseBuffer(buf, basePath, label, t0, onFail) {
      loader.parse(buf, basePath, function onOk(gltf) {
        onGltfLoaded(gltf, label, { name: label, bytes: buf.byteLength, format: detectFormat(buf) + ((gltf.parser && gltf.parser.json.extensionsUsed || []).length ? " · ext: " + gltf.parser.json.extensionsUsed.join(", ") : ""), loadMs: performance.now() - t0 });
      }, onFail);
    }

    /**
     * Load from a remote URL and remember it if it works.
     */
    function loadFromUrl(url) {
      setStatus("Loading URL…");
      const t0 = performance.now();
      const label = decodeURIComponent(url.split("?")[0].split("/").pop() || "model");
      const fail = function (err) {
        setStatus("URL failed (CORS or bad file). Use local / drop. " + (err && err.message ? err.message : ""));
      };
      fetch(url).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.arrayBuffer();
      }).then(function (buf) {
        const base = THREE.LoaderUtils.extractUrlBase(new URL(url, location.href).href);
        parseBuffer(buf, base, label, t0, fail);
        try { localStorage.setItem(LAST_URL_KEY, url); } catch (e) {}
        urlInput.value = url;
      }).catch(fail);
    }

    /**
     * Load a local File.
     */
    function loadFromFile(file) {
      if (!file) return;
      const name = file.name || "file";
      const lower = name.toLowerCase();
      if (!lower.endsWith(".glb") && !lower.endsWith(".gltf")) {
        setStatus("Need a .glb or .gltf file.");
        return;
      }
      setStatus("Loading " + name + "…");
      const t0 = performance.now();
      file.arrayBuffer().then(function (buf) {
        parseBuffer(buf, "", name, t0, function (err) { setStatus("File failed. " + (err && err.message ? err.message : "")); });
      });
    }

    function takeScreenshot() {
      renderer.render(scene, camera);
      const d = new Date();
      const p = function (n) { return String(n).padStart(2, "0"); };
      const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
      const base = currentLabel.replace(/\.(glb|gltf)$/i, "").replace(/[^a-z0-9_-]+/gi, "_") || "model";
      const a = document.createElement("a");
      a.download = base + "_" + stamp + ".png";
      a.href = renderer.domElement.toDataURL("image/png");
      document.body.appendChild(a);
      a.click();
      a.remove();
      setStatus("Saved " + a.download);
    }

    /**
     * Hint landscape only. Do not lock (browsers block it on normal pages).
     */
    function hintOrientation() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(function ignore() {});
      }
    }

    /**
     * Main draw loop.
     */
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }

    // --- Events ---
    loadUrlBtn.addEventListener("click", function onLoadClick() {
      const url = urlInput.value.trim();
      if (url) loadFromUrl(url);
    });

    fileInput.addEventListener("change", function onFileChange(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (file) loadFromFile(file);
    });

    playBtn.addEventListener("click", togglePlay);
    shotBtn.addEventListener("click", takeScreenshot);
    spinBtn.addEventListener("click", function onSpin() {
      spinEnabled = !spinEnabled;
      clearTimeout(resumeTimer);
      controls.autoRotate = spinEnabled;
      spinBtn.textContent = "Turntable: " + (spinEnabled ? "On" : "Off");
      spinBtn.classList.toggle("on", spinEnabled);
    });
    speedSel.addEventListener("change", function onSpeed() {
      playSpeed = parseFloat(speedSel.value) || 1;
      if (mixer && isPlaying) mixer.timeScale = playSpeed;
    });

    resetCamBtn.addEventListener("click", function onResetCam() {
      if (lastFramedObject) frameObject(lastFramedObject);
    });

    window.addEventListener("keydown", function onKey(ev) {
      if (ev.code !== "Space") return;
      const tag = (ev.target && ev.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      ev.preventDefault();
      togglePlay();
    });

    window.addEventListener("resize", resizeRenderer);

    // Drag and drop on the whole page
    ;["dragenter", "dragover"].forEach(function bindOver(type) {
      window.addEventListener(type, function onDragOver(ev) {
        ev.preventDefault();
        dropMask.classList.add("on");
      });
    });

    ;["dragleave", "drop"].forEach(function bindLeave(type) {
      window.addEventListener(type, function onDragEnd(ev) {
        ev.preventDefault();
        if (type === "dragleave" && ev.target !== document.documentElement) return;
        dropMask.classList.remove("on");
      });
    });

    window.addEventListener("drop", function onDrop(ev) {
      ev.preventDefault();
      dropMask.classList.remove("on");
      const file = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (file) loadFromFile(file);
    });

    // Start
    resizeRenderer();
    hintOrientation();
    animate();

    let startUrl = DEFAULT_URL;
    const qModel = new URLSearchParams(location.search).get("model");
    try {
      const saved = localStorage.getItem(LAST_URL_KEY);
      if (saved) startUrl = saved;
    } catch (e) {}
    if (qModel) startUrl = qModel;
    urlInput.value = startUrl;
    loadFromUrl(startUrl);
  </script>
</body>
</html>
