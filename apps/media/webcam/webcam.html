<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Webcam</title>
  <link rel="stylesheet" href="webcam.css?v=20261005a">
</head>
<body class="theme-dark">
  <video id="webcamFeed" autoplay playsinline muted></video>
  <canvas id="photoCanvas" class="hidden" aria-hidden="true"></canvas>

  <div class="chrome" aria-label="Controls">
    <button type="button" id="themeBtn" class="chip" title="Theme" aria-label="Toggle theme">☾</button>
    <button type="button" id="flipBtn" class="chip" title="Flip camera" aria-label="Flip camera" hidden>⟲</button>
    <button type="button" id="captureButton" class="shutter" title="Capture" aria-label="Capture photo" disabled></button>
    <a id="downloadLink" class="chip download hidden" download>Save</a>
  </div>

  <div id="message" class="msg" role="status" aria-live="polite"></div>

  <script src="webcam_config.js?v=20261005a"></script>
  <script src="webcam_logic.js?v=20261005a"></script>
</body>
</html>
