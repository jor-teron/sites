<!DOCTYPE html>
<!-- VPL1 Video Player: play local video files, folder list, resume, SRT/VTT, speed, PiP. Helpers: video-player_helpers.js. UI: video-player.js. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Video Player · VPL1</title>
  <link rel="icon" href="video-player_icon.png">
  <link rel="stylesheet" href="video-player.css?v=VPL1">
  <script>try{var s=JSON.parse(localStorage.getItem('video-player-v1')||'{}'),m=s.theme||'auto',t=localStorage.getItem('sites-hub.theme');if(m==='dark'||(m==='auto'&&(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))))document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="vid" playsinline></video>
    <div id="empty">
      <h1>Video Player</h1>
      <div class="open-row">
        <button type="button" class="btn acc" id="emptyFile">Open file</button>
        <button type="button" class="btn" id="emptyFolder">Open folder</button>
      </div>
      <p class="hint">Or drop a video here</p>
    </div>
    <div id="msg" hidden role="status"></div>
  </div>

  <div id="chrome">
    <div id="top">
      <button type="button" class="ghost" id="btnOpen" aria-haspopup="menu" aria-label="Open">Open</button>
      <button type="button" class="ghost" id="btnList" hidden aria-pressed="false" aria-label="Playlist">List</button>
      <span id="now" class="now"></span>
      <button type="button" class="ghost icon" id="btnMore" aria-haspopup="dialog" aria-label="More">⋯</button>
    </div>
    <aside id="list" hidden aria-label="Videos">
      <ul id="listIn"></ul>
    </aside>
    <div id="bar">
      <button type="button" class="icon" id="btnPlay" aria-label="Play">
        <svg id="icPlay" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="icPause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <span id="time" class="time">0:00 / 0:00</span>
      <button type="button" class="icon" id="btnMute" aria-label="Mute">
        <svg id="icVol" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 9v6h4l5 5V4L9 9H5zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <svg id="icMuted" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" hidden><path fill="currentColor" d="M16.5 12a4.5 4.5 0 0 0-2.5-4v2.18L16.5 12.7V12zM19 12c0 .82-.15 1.6-.43 2.32l1.46 1.46A7.9 7.9 0 0 0 21 12a8 8 0 0 0-7-7.93v2.02A6 6 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.05a8.9 8.9 0 0 0 3.58-1.55L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <input type="range" id="vol" min="0" max="100" value="100" step="1" aria-label="Volume">
      <button type="button" class="ghost speed" id="btnSpeed" aria-label="Playback speed">1×</button>
      <button type="button" class="ghost cc" id="btnSub" aria-pressed="false" aria-label="Subtitles">CC</button>
      <button type="button" class="icon" id="btnFs" aria-label="Full screen">
        <svg id="icFs" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm0-4h2V7h3V5H5v5h2zm12 9h-5v2h5c1.1 0 2-.9 2-2v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <svg id="icFsExit" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" hidden><path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      </button>
    </div>
  </div>

  <div id="openMenu" class="pop" hidden role="menu">
    <button type="button" role="menuitem" id="menuFile">Open file</button>
    <button type="button" role="menuitem" id="menuFolder">Open folder</button>
  </div>

  <div id="speedMenu" class="pop" hidden role="menu" aria-label="Playback speed">
    <button type="button" role="menuitem" data-sp="0.5">0.5×</button>
    <button type="button" role="menuitem" data-sp="0.75">0.75×</button>
    <button type="button" role="menuitem" data-sp="1">1×</button>
    <button type="button" role="menuitem" data-sp="1.25">1.25×</button>
    <button type="button" role="menuitem" data-sp="1.5">1.5×</button>
    <button type="button" role="menuitem" data-sp="2">2×</button>
  </div>

  <aside id="panel" hidden>
    <header>
      <h2>Settings</h2>
      <button type="button" class="ghost icon" id="panelClose" aria-label="Close">×</button>
    </header>
    <div class="row"><span>Theme</span>
      <div class="seg" id="themeSeg" role="group" aria-label="Theme">
        <button type="button" data-v="auto">Auto</button>
        <button type="button" data-v="light">Light</button>
        <button type="button" data-v="dark">Dark</button>
      </div>
    </div>
    <div class="row"><span>Subtitle size</span>
      <div class="seg" id="subSizeSeg" role="group" aria-label="Subtitle size">
        <button type="button" data-v="s">S</button>
        <button type="button" data-v="m">M</button>
        <button type="button" data-v="l">L</button>
      </div>
    </div>
    <div class="row wrap">
      <button type="button" class="btn" id="btnLoadSub">Load subtitle…</button>
      <button type="button" class="btn" id="btnPip">Picture-in-picture</button>
    </div>
    <h3>Keyboard</h3>
    <p class="keys"><kbd>Space</kbd> Play / pause · <kbd>←</kbd> <kbd>→</kbd> 10 seconds · <kbd>↑</kbd> <kbd>↓</kbd> Volume · <kbd>F</kbd> Full screen · <kbd>M</kbd> Mute</p>
    <p class="note">Release <span id="rel"></span>. Everything stays on this device.</p>
  </aside>
</div>

<div id="dlg" class="dlg" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="dlgT"><p id="dlgT"></p><p id="dlgM" class="mut"></p><div class="acts" id="dlgActs"></div></div></div>

<input type="file" id="inFile" hidden multiple accept="video/*,.mp4,.m4v,.webm,.mkv,.mov,.ogv,.3gp,.srt,.vtt">
<input type="file" id="inFolder" hidden webkitdirectory>
<input type="file" id="inSub" hidden accept=".srt,.vtt,text/vtt">

<script src="video-player_helpers.js?v=VPL1"></script>
<script src="video-player.js?v=VPL1"></script>
</body>
</html>
