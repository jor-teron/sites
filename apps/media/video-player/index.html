<!DOCTYPE html>
<!-- Redirect entry point to video-player.html (keeps ?query and #hash). VPL1: no visible body; colours follow the Hub theme (sites-hub.theme, else the device setting). Legacy: meta refresh and the "Open Video Player" link were always visible in <head>/<body>; both now live in <noscript>. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Player · VPL1</title>
  <link rel="canonical" href="video-player.html">
  <style>html,body{margin:0;background:#fff;color:#202124}html.dark,html.dark body{background:#111214;color:#9aa0a6}html.dark a{color:#6ea8fe}</style>
  <script>
    (function () {
      var t = ''; try { t = localStorage.getItem('sites-hub.theme') || ''; } catch (_) { /* blocked */ }
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.className = 'dark';
      location.replace('video-player.html' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=video-player.html"></noscript>
</head>
<body><noscript><p><a href="video-player.html">Open Video Player</a></p></noscript></body>
</html>
