<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo Collage</title>
  <link rel="icon" href="photo-collage_icon.png">
  <link rel="stylesheet" href="photo-collage.css">
</head>
<body>
  <div id="app">
    <!-- TOP TITLE BAR -->
    <header id="titlebar">
      <!-- (before PC5)
      <div class="brand">
        <img src="photo-collage_icon.png" alt="" width="26" height="26">
        <h1>Photo Collage</h1>
      </div>
      -->

      <div class="titlebar-actions">
        <button type="button" id="btn-undo" class="btn secondary" title="Undo (Ctrl+Z)" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          Undo
        </button>
        <button type="button" id="btn-redo" class="btn secondary" title="Redo (Ctrl+Y or Ctrl+Shift+Z)" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
          Redo
        </button>
        <button type="button" id="btn-add-photos" class="btn primary" title="Add photos to collage">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><line x1="16" y1="5" x2="22" y2="5"/><line x1="19" y1="2" x2="19" y2="8"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          Add Photos
        </button>
        <button type="button" id="btn-add-page" class="btn" title="Add another empty page">
          + Page
        </button>
        <button type="button" id="btn-print" class="btn secondary" title="Print collage (Ctrl+P)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print
        </button>
        <button type="button" id="btn-pdf" class="btn secondary" title="Save collage as PDF">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Save PDF
        </button>
        <button type="button" id="btn-clear" class="btn danger" title="Clear all photos">
          Clear
        </button>
      </div>
    </header>

    <!-- OPTIONS TOOLBAR -->
    <div id="topbar">
      <div class="controls-group">
        <div class="control-item">
          <label for="layout-select">Layout:</label>
          <select id="layout-select" aria-label="Layout">
            <option value="4-grid" selected>4 Photos / Page (2×2)</option>
            <option value="2-stack">2 Photos / Page (Vertical)</option>
            <option value="2-split">2 Photos / Page (Horizontal)</option>
            <option value="1-full">1 Photo / Page (Full)</option>
          </select>
        </div>

        <div class="control-item">
          <label for="orient-select">Orientation:</label>
          <select id="orient-select" aria-label="Orientation">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>

        <div class="control-item">
          <label for="paper-select">Paper:</label>
          <select id="paper-select" aria-label="Paper Size">
            <option value="a4" selected>A4</option>
            <option value="letter">Letter</option>
            <option value="india-legal">India Legal</option>
          </select>
        </div>

        <div class="control-item">
          <label for="margin-select">Margin:</label>
          <select id="margin-select" aria-label="Margin Spacing">
            <option value="none">None</option>
            <option value="small" selected>Small</option>
            <option value="normal">Standard</option>
            <option value="wide">Wide</option>
          </select>
        </div>

        <div class="control-item">
          <label for="color-select">Color:</label>
          <select id="color-select" aria-label="Page Color">
            <option value="#ffffff" selected>White</option>
            <option value="#faf8f5">Cream</option>
            <option value="#181a1f">Dark</option>
          </select>
        </div>
      </div>
      <div class="topbar-meta">
        <div class="subbar-info" id="status-text">
          0 photos • 1 page • Drop photos anywhere to populate slots
        </div>
        <div class="zoom-controls">
          <button type="button" id="btn-zoom-out" title="Zoom out">−</button>
          <button type="button" id="btn-zoom-reset" title="Reset zoom">100%</button>
          <button type="button" id="btn-zoom-in" title="Zoom in">+</button>
        </div>
      </div>
    </div>

    <!-- (before PC6)
    <div id="subbar">
      <div class="subbar-info" id="status-text">
        0 photos • 1 page • Drop photos anywhere to populate slots
      </div>
      <div class="zoom-controls">
        <button type="button" id="btn-zoom-out" title="Zoom out">−</button>
        <button type="button" id="btn-zoom-reset" title="Reset zoom">100%</button>
        <button type="button" id="btn-zoom-in" title="Zoom in">+</button>
      </div>
    </div>
    -->

    <!-- MAIN SHEETS PREVIEW WORKSPACE -->
    <main id="workspace">
      <div id="sheets-container"></div>
    </main>

    <!-- FULL SCREEN DRAG & DROP OVERLAY -->
    <div id="global-drop-zone" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <h2>Drop Photos to Fill Collage</h2>
      <p>Supports multi-page auto expansion</p>
    </div>

    <!-- CROP MODAL -->
    <div id="crop-modal" class="crop-modal" role="dialog" aria-modal="true" aria-labelledby="crop-modal-title" hidden>
      <div class="crop-modal-card">
        <div class="crop-modal-header">
          <h2 id="crop-modal-title">Crop Photo</h2>
          <button type="button" id="btn-crop-close" class="btn" aria-label="Close crop dialog" title="Close (Esc)">✕</button>
        </div>

        <div class="crop-presets" role="group" aria-label="Crop aspect ratio presets">
          <button type="button" class="btn crop-preset-btn active" data-aspect="free">Free</button>
          <button type="button" class="btn crop-preset-btn" data-aspect="slot">Match Tile</button>
          <button type="button" class="btn crop-preset-btn" data-aspect="1:1">1:1</button>
          <button type="button" class="btn crop-preset-btn" data-aspect="4:3">4:3</button>
          <button type="button" class="btn crop-preset-btn" data-aspect="3:2">3:2</button>
          <button type="button" class="btn crop-preset-btn" data-aspect="16:9">16:9</button>
        </div>

        <div class="crop-stage" id="crop-stage">
          <div class="crop-stage-frame" id="crop-stage-frame">
            <canvas id="crop-canvas"></canvas>
            <div class="crop-box" id="crop-box" tabindex="0" aria-label="Crop selection">
              <div class="crop-grid" aria-hidden="true"></div>
              <span class="crop-handle handle-nw" data-handle="nw"></span>
              <span class="crop-handle handle-n" data-handle="n"></span>
              <span class="crop-handle handle-ne" data-handle="ne"></span>
              <span class="crop-handle handle-e" data-handle="e"></span>
              <span class="crop-handle handle-se" data-handle="se"></span>
              <span class="crop-handle handle-s" data-handle="s"></span>
              <span class="crop-handle handle-sw" data-handle="sw"></span>
              <span class="crop-handle handle-w" data-handle="w"></span>
            </div>
          </div>
        </div>

        <div class="crop-modal-footer">
          <span class="crop-dimensions" id="crop-dimensions">Full image</span>
          <div class="crop-modal-actions">
            <button type="button" id="btn-crop-reset" class="btn">Reset</button>
            <button type="button" id="btn-crop-cancel" class="btn">Cancel</button>
            <button type="button" id="btn-crop-apply" class="btn primary">Apply Crop</button>
          </div>
        </div>
      </div>
    </div>

    <!-- HIDDEN INPUTS -->
    <input type="file" id="file-input" multiple accept="image/*" hidden>
    <input type="file" id="slot-file-input" accept="image/*" hidden>
  </div>

  <!-- SCRIPT INCLUDES -->
  <!-- (before PC7)
  <script src="vendor/jspdf.umd.min.js"></script>
  -->
  <script src="photo_collage.js"></script>
</body>
</html>
