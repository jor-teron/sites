<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MS Word Diff</title>
  <link rel="stylesheet" href="msword_diff.css">
</head>
<body>
  <!-- Slim bar. Drops on the header are ignored. -->
  <header id="appHeader">
    <div class="hdr-left">
      <h1>MS Word Diff</h1>
      <div id="status" class="status" hidden></div>
    </div>
    <div class="hdr-mid">
      <button id="btnCompare" type="button">Compare</button>
      <button id="btnClear" type="button" class="btn-lite">Clear files</button>
    </div>
    <div class="opts">
      <label class="font-opt">Font
        <select id="fontSize"></select>
        Pt
      </label>
      <label class="font-opt">Group words
        <select id="wordMode">
          <option value="on" selected>ON</option>
          <option value="off">OFF</option>
        </select>
      </label>
      <label class="font-opt">Minimap
        <select id="minimapOpt">
          <option value="off" selected>OFF</option>
          <option value="on">ON</option>
        </select>
      </label>
      <label class="font-opt">Counts
        <select id="countsOpt">
          <option value="off" selected>OFF</option>
          <option value="on">ON</option>
        </select>
      </label>
    </div>
  </header>

  <div id="stats" class="stats" hidden></div>

  <!--
    Panes are the drop targets.
    1 file = that side. 2 files = Left then Right (any side). Swap if order is wrong.
  -->
  <section id="result" class="result">
    <input id="fileOld" type="file" accept=".docx,.txt,.text,.md,.markdown,.rst,.org,.adoc,.asciidoc,.csv,.tsv,.ssv,.psv,.log,.out,.err,.json,.jsonl,.ndjson,.xml,.html,.htm,.xhtml,.svg,.js,.mjs,.cjs,.ts,.tsx,.jsx,.css,.scss,.sass,.less,.ini,.conf,.cfg,.config,.env,.properties,.toml,.yaml,.yml,.sh,.bash,.zsh,.fish,.csh,.ksh,.bat,.cmd,.ps1,.psm1,.py,.pyw,.rb,.pl,.pm,.php,.lua,.r,.sql,.go,.rs,.c,.h,.cpp,.cc,.cxx,.hpp,.hh,.cs,.java,.kt,.kts,.swift,.m,.mm,.scala,.groovy,.dart,.vue,.svelte,.makefile,.mk,.cmake,.gradle,.sbt,.diff,.patch,.gitignore,.gitattributes,.gitmodules,.editorconfig,.dockerfile,.containerfile,.service,.timer,.socket,.desktop,.tex,.bib,.sty,.srt,.vtt,.ass,.vcf,.ics,.m3u,.m3u8,text/plain,text/csv,application/json,application/xml,application/x-sh,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    <input id="fileNew" type="file" accept=".docx,.txt,.text,.md,.markdown,.rst,.org,.adoc,.asciidoc,.csv,.tsv,.ssv,.psv,.log,.out,.err,.json,.jsonl,.ndjson,.xml,.html,.htm,.xhtml,.svg,.js,.mjs,.cjs,.ts,.tsx,.jsx,.css,.scss,.sass,.less,.ini,.conf,.cfg,.config,.env,.properties,.toml,.yaml,.yml,.sh,.bash,.zsh,.fish,.csh,.ksh,.bat,.cmd,.ps1,.psm1,.py,.pyw,.rb,.pl,.pm,.php,.lua,.r,.sql,.go,.rs,.c,.h,.cpp,.cc,.cxx,.hpp,.hh,.cs,.java,.kt,.kts,.swift,.m,.mm,.scala,.groovy,.dart,.vue,.svelte,.makefile,.mk,.cmake,.gradle,.sbt,.diff,.patch,.gitignore,.gitattributes,.gitmodules,.editorconfig,.dockerfile,.containerfile,.service,.timer,.socket,.desktop,.tex,.bib,.sty,.srt,.vtt,.ass,.vcf,.ics,.m3u,.m3u8,text/plain,text/csv,application/json,application/xml,application/x-sh,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    <div class="pane-heads">
      <div class="gutter-space"></div>
      <div id="headOld" class="fname" title="Click to choose or drop here">Drop a file</div>
      <button id="btnSwap" type="button" class="btn-lite">Swap</button>
      <div id="headNew" class="fname" title="Click to choose or drop here">Drop a file</div>
    </div>
    <div class="diff-board" id="diffBoard">
      <div id="changeBar" class="change-bar" title="Click a mark to jump to that change"></div>
      <div id="diffScroll" class="diff-scroll">
        <p class="hint">Drop one or two files (.docx or plaintext) on the left or right pane.</p>
      </div>
    </div>
  </section>

  <script src="../vendor/jszip.min.js"></script>
  <script src="../vendor/diff_match_patch.js"></script>
  <script src="MSword_diff.js"></script>
</body>
</html>
